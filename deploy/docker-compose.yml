name: eztest

# EzTest P7 multi-replica deployment shape.
#
# Static validation only on this host: Docker is not installed, so this file is
# checked by `cd frontend && node scripts/validate-compose.mjs` and has never
# been started here. Run it on a host with Docker Engine + Compose v2.
#
# Usage (from the repository root, so the repo-root .env provides secrets):
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#
# Topology:
#   postgres  PostgreSQL 17 (single coordination surface)
#   api       API replica 1; publishes 13333; readiness /api/health/ready
#   api2      API replica 2; internal-only; shares the data volume and PG
#   renderer  Playwright HTML->PDF worker; internal-only, Bearer token
#   executor  Playwright case executor; internal-only, Bearer token
#   web       Next.js web UI; publishes 6868
#
# Both API replicas share the named `data` volume mounted at /data. The API
# image symlinks /app/.data -> /data, so the DB settings `paths.*` keep their
# default ./.data values and resolve onto the shared volume. `runtime.
# snowflake_node_id` stays a DB setting: the P7 instance registry allocates a
# free node id for the second replica automatically.
#
# Required in the environment / repo-root .env for interpolation (see
# ../.env.example): POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
# EZTEST_EXECUTOR_TOKEN. EZTEST_RENDER_TOKEN is optional: when unset the renderer
# starts with the DB seed default report.render_token (`eztest-dev-render-token`),
# so a fresh stack's renderer token matches the settings center without any
# override. If you do set it, also update the DB setting report.render_token to
# the same value (see README "Renderer settings"). The API process itself still
# reads only the four documented EZTEST_* startup variables; the renderer URL and
# token come from DB settings.
#
# Optional read-only code repositories (P4): mount a host tree read-only and
# register the container path (for example /repos/app) as the P2 localPath.
# Uncomment and adjust on both API replicas:
#   volumes:
#     - ${EZTEST_CODE_REPO_MOUNT:-./repos}:/repos:ro

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eztest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or ../.env}
      POSTGRES_DB: ${POSTGRES_DB:-eztest}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    image: eztest-api:${EZTEST_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        VERSION: ${EZTEST_VERSION:-dev}
        COMMIT: ${EZTEST_COMMIT:-}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      EZTEST_API_PORT: "13333"
      EZTEST_WEB_PORT: "6868"
      EZTEST_EXECUTOR_PORT: "13336"
      EZTEST_DATABASE_URL: postgres://${POSTGRES_USER:-eztest}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or ../.env}@postgres:5432/${POSTGRES_DB:-eztest}?sslmode=disable
    ports:
      - "13333:13333"
    volumes:
      - data:/data
      # Optional read-only code repository mount (see the header example):
      # - ${EZTEST_CODE_REPO_MOUNT:-./repos}:/repos:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13333/api/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Second API replica: same image/environment/volume, no published port. Only
  # one replica exposes 13333; use a reverse proxy for HTTP load balancing.
  api2:
    image: eztest-api:${EZTEST_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        VERSION: ${EZTEST_VERSION:-dev}
        COMMIT: ${EZTEST_COMMIT:-}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      EZTEST_API_PORT: "13333"
      EZTEST_WEB_PORT: "6868"
      EZTEST_EXECUTOR_PORT: "13336"
      EZTEST_DATABASE_URL: postgres://${POSTGRES_USER:-eztest}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or ../.env}@postgres:5432/${POSTGRES_DB:-eztest}?sslmode=disable
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13333/api/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # PDF renderer (Playwright, HTML->PDF only). Internal-only: one Bearer token
  # shared with the API process. The default below matches the DB seed default of
  # report.render_token; override both together (env + DB setting) if needed.
  renderer:
    image: eztest-renderer:${EZTEST_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.renderer
    restart: unless-stopped
    environment:
      EZTEST_RENDERER_ADDR: 0.0.0.0:13337
      EZTEST_RENDER_TOKEN: ${EZTEST_RENDER_TOKEN:-eztest-dev-render-token}
    shm_size: 1gb
    expose:
      - "13337"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:13337/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Playwright executor (protocol A'). Internal-only: no published ports, one
  # bearer token shared with the API process, /dev/shm sized for Chromium.
  # Push registration is optional: export EZTEST_API_URL=http://api:13333 and
  # extend this environment list to enable it (pull healthz stays enabled).
  executor:
    build:
      context: ../executor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      EZTEST_EXECUTOR_ADDR: 0.0.0.0:13336
      EZTEST_EXECUTOR_TOKEN: ${EZTEST_EXECUTOR_TOKEN:?set EZTEST_EXECUTOR_TOKEN in the environment or ../.env}
      EZTEST_EXECUTOR_MAX_CONTEXTS: ${EZTEST_EXECUTOR_MAX_CONTEXTS:-8}
    shm_size: 1gb
    expose:
      - "13336"
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:13333}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "6868"
      HOSTNAME: 0.0.0.0
    ports:
      - "6868:6868"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6868/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
  # Shared content root for both API replicas: content-addressed objects,
  # attachments, evidence, report HTML/PDF and exports (DB `paths.*` defaults
  # resolve to /app/.data -> /data).
  data:
