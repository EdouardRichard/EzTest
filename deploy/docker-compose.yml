name: eztest

# EzTest P0/P1 single-instance deployment.
#
# Static validation only on this host: Docker is not installed, so this file is
# checked by `cd frontend && node scripts/validate-compose.mjs` and has never
# been started here. Run it on a host with Docker Engine + Compose v2.
#
# Usage (from the deploy/ directory, repo-root .env provides the secrets):
#   docker compose --env-file ../.env up -d --build
#
# Required in the repo-root .env for interpolation (see ../.env.example):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, EZTEST_EXECUTOR_TOKEN
# The api service also reads ../.env through env_file for the EZTEST_* and
# lowercase llm_* variables. `.env` is gitignored and must never be committed.
# The executor is internal-only: it publishes no host port, and only api holds
# the bearer token.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eztest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or ../.env}
      POSTGRES_DB: ${POSTGRES_DB:-eztest}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        VERSION: ${EZTEST_VERSION:-dev}
        COMMIT: ${EZTEST_COMMIT:-}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      EZTEST_ENV: ${EZTEST_ENV:-dev}
      EZTEST_HTTP_ADDR: ":13333"
      EZTEST_WEB_ORIGIN: ${EZTEST_WEB_ORIGIN:-http://localhost:6868}
      EZTEST_DATABASE_URL: postgres://${POSTGRES_USER:-eztest}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or ../.env}@postgres:5432/${POSTGRES_DB:-eztest}?sslmode=disable
      EZTEST_STORAGE_DIR: /data/objects
      EZTEST_VERSION_ATTACHMENT_DIR: /data/version-attachments
      EZTEST_SNOWFLAKE_NODE_ID: ${EZTEST_SNOWFLAKE_NODE_ID:-1}
      EZTEST_OPENAPI_PATH: docs/openapi/api.yaml
      EZTEST_ENABLE_TEST_ENDPOINTS: ${EZTEST_ENABLE_TEST_ENDPOINTS:-false}
      EZTEST_EXECUTOR_URL: ${EZTEST_EXECUTOR_URL:-http://executor:13336}
      EZTEST_EXECUTOR_TOKEN: ${EZTEST_EXECUTOR_TOKEN:-}
    ports:
      - "13333:13333"
    volumes:
      - objects:/data/objects
      - attachments:/data/version-attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13333/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Playwright executor (protocol A'). Internal-only: no published ports, one
  # bearer token shared with the api process, /dev/shm sized for Chromium.
  executor:
    build:
      context: ../executor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      EZTEST_EXECUTOR_ADDR: 0.0.0.0:13336
      EZTEST_EXECUTOR_TOKEN: ${EZTEST_EXECUTOR_TOKEN:?set EZTEST_EXECUTOR_TOKEN in the environment or ../.env}
      EZTEST_EXECUTOR_MAX_CONTEXTS: ${EZTEST_EXECUTOR_MAX_CONTEXTS:-8}
    shm_size: 1gb
    expose:
      - "13336"
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:13333}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "6868"
      HOSTNAME: 0.0.0.0
    ports:
      - "6868:6868"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6868/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
  objects:
  attachments:
