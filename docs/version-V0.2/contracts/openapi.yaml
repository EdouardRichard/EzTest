          format: int64
          minimum: 0
        mime:
          type: string
        filename:
          type: string
        created_at:
          type: string
          format: date-time
      description: 证据元数据；不含 content_ref_id/存储路径/凭据。step_seq/assertion_seq 可空（用例级证据）。字节走鉴权下载端点。
    CaseRunDetail:
      type: object
      required: [case_run, steps, assertions, evidence]
      properties:
        case_run:
          $ref: '#/components/schemas/CaseRunView'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CaseRunStepView'
        assertions:
          type: array
          items:
            $ref: '#/components/schemas/CaseRunAssertionView'
        evidence:
          type: array
          description: 前 50 条证据元数据；更多走 GET /evidence 分页
          items:
            $ref: '#/components/schemas/EvidenceView'
    HumanRequestPayload:
      type: object
      required: [reason, account_role, page_url, challenge_kind]
      properties:
        reason:
          type: string
        version_sut_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        account_role:
          type: string
        page_url:
          type: string
        challenge_kind:
          type: string
        evidence_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
    HumanRequestResponseView:
      type: object
      description: P3 只回显 note 摘要，不回显一次性 code/密码
      properties:
        note:
          type: string
    HumanRequestView:
      type: object
      required: [id, version_id, case_run_id, kind, status, payload, expires_at, response, resolved_by, resolved_at, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        version_id:
          type: string
          pattern: '^[0-9]+$'
        case_run_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        kind:
          type: string
          enum: [login_takeover, conflict, other]
        status:
          type: string
          enum: [open, resolved, cancelled, expired]
        payload:
          $ref: '#/components/schemas/HumanRequestPayload'
        expires_at:
          type: string
          format: date-time
        response:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/HumanRequestResponseView'
        resolved_by:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        resolved_at:
          type: string
          nullable: true
          format: date-time
        created_at:
          type: string
          format: date-time
    ExecutorView:
      type: object
      required: [id, name, endpoint, status, capacity, active_contexts, labels, last_heartbeat, version, last_error]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
        endpoint:
          type: string
        status:
          type: string
          enum: [active, draining, offline]
        capacity:
          type: integer
          minimum: 0
        active_contexts:
          type: integer
          minimum: 0
        labels:
          type: object
          additionalProperties: true
        last_heartbeat:
          type: string
          nullable: true
          format: date-time
        version:
          type: string
        last_error:
          type: string
      description: admin only；不含 token/token_hash。
    CreateIntentRequest:
      type: object
      required: [case_version_id, purpose]
      properties:
        case_version_id:
          type: string
          pattern: '^[0-9]+$'
          description: 必须属于该版本且 current+confirmed
        purpose:
          type: string
          enum: [retest, manual]
    PauseWaveRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [graceful, immediate]
          description: graceful 允许在飞完成；immediate 取消在飞
        reason:
          type: string
          maxLength: 200
    PauseCaseRunRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [immediate]
          description: P3 用例级暂停只支持 immediate（取消在飞并保留已落结果）
    ResolveHumanRequestRequest:
      type: object
      required: [response]
      properties:
        response:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              maxLength: 64
              description: 一次性验证码（只落库/内存，不回显）
            note:
              type: string
              maxLength: 2000
