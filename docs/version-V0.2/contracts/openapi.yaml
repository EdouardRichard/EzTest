    get:
      tags: [Delivery]
      operationId: downloadReportHTML
      summary: 鉴权下载报告 HTML（已发布 revision）
      description: |
        校验版本归属（report.version_id = path versionId）、revision 属于 report、`status='published' AND render_status='done'`；
        按 `html_ref → content_ref.id` 加载并校验 `owner_kind='report_revision' AND owner_id=revision.id AND role='report_html'`，
        读取 `content_object` 字节并校验 sha256/size；不暴露文件路径。
        404：revision 不存在/未发布/内容缺失；409：内容 sha/size 校验失败（`state_conflict` + `report_content_corrupt`）。
      parameters:
        - $ref: '#/components/parameters/VersionID'
        - $ref: '#/components/parameters/ReportID'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: 报告 HTML 字节
          headers:
            ETag:
              description: 内容 sha256（双引号包裹）
              schema:
                type: string
            Cache-Control:
              description: private, no-store
              schema:
                type: string
            X-Content-Type-Options:
              description: nosniff
              schema:
                type: string
            Content-Security-Policy:
              description: "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
