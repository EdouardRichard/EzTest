            Content-Type:
              description: 对象存储的 MIME（服务端 http.DetectContentType 判定）
              schema:
                type: string
            X-Content-SHA256:
              description: 内容 SHA-256（小写 hex）
              schema:
                type: string
            Cache-Control:
              description: 私有长缓存（private, max-age=31536000, immutable）
              schema:
                type: string
          content:
