      type: object
      description: UI 线程消息（P1 只写 user/assistant）；LLM transcript 不通过本 API 暴露
      required: [id, conversation_id, role, parts, refs, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        conversation_id:
          type: string
          pattern: '^[0-9]+$'
        role:
          type: string
          enum: [user, assistant]
        parts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MessagePart'
        refs:
          type: array
          description: '结构化引用；元素形如 {"kind": "requirement", "id": "3001"}'
          items:
            type: object
            required: [kind, id]
            properties:
              kind:
                type: string
              id:
                type: string
                pattern: '^[0-9]+$'
        created_at:
          type: string
          format: date-time
    MessagePart:
      description: |
        消息 part 判别联合，以 `type` 区分：
        `text` / `attachment` / `requirement_card` / `rollback_proposal`。
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type:
              type: string
              enum: [text]
            text:
              type: string
              minLength: 1
              maxLength: 20000
        - type: object
          required: [type, sha256, name, mime, size]
          properties:
            type:
              type: string
              enum: [attachment]
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: P0 `POST /api/content` 返回的内容 SHA-256
            name:
              type: string
            mime:
              type: string
            size:
              type: integer
              minimum: 0
              maximum: 10485760
        - type: object
          required: [type, requirement_id, title, status, revision]
          properties:
            type:
              type: string
              enum: [requirement_card]
            requirement_id:
              type: string
              pattern: '^[0-9]+$'
            title:
              type: string
            status:
              type: string
              enum: [draft, clarified, closed, obsolete]
            revision:
              type: integer
              minimum: 1
        - type: object
          required: [type, requirement_id, reason]
          properties:
            type:
              type: string
              enum: [rollback_proposal]
            requirement_id:
              type: string
              pattern: '^[0-9]+$'
            reason:
              type: string
