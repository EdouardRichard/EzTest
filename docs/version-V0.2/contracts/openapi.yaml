  /api/versions/{id}/conversations/{cid}/messages:
    get:
      tags: [Conversations]
      operationId: listConversationMessages
      summary: 消息列表（id 升序，登录用户）
      description: |
        `after` 是消息 ID 游标（十进制字符串），返回 id 大于 `after` 的消息，按 id 升序；
        省略 `after` 从最早消息开始。默认 100 条，最大 200 条。
        SSE `conversation.message` 包含完整 message 对象，可直接渲染。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/CID'
        - $ref: '#/components/parameters/MessageAfter'
        - $ref: '#/components/parameters/MessageLimit'
      responses:
        '200':
          description: 消息分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ConversationMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [Conversations]
      operationId: postConversationMessage
      summary: 发送用户消息（登录用户）
      description: |
        写入用户消息并 best-effort ensure `chat.turn` / `requirement.curate` 任务（reconciler 兜底）。
        `client_message_id`（≤64）在同一对话内唯一，重复提交幂等返回既有消息。
        `attachment` part 引用 `POST /api/content` 上传返回的 `{sha256,name,mime,size}`；
        附件解析失败不阻塞消息（仍返回 201，失败原因在附件 `extraction_error`）。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/CID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessageRequest'
      responses:
        '201':
          description: 已写入用户消息（幂等重放返回既有消息）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ConversationMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/requirements:
    get:
      tags: [Requirements]
      operationId: listRequirements
      summary: 需求列表（登录用户）
      description: |
        按 id 倒序分页；`status` 省略时返回全部。列表项为当前 revision 摘要，
        含 `targets` 与 `confirmed_at`（未确认为 null）。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/RequirementStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: 需求分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RequirementSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [Requirements]
      operationId: createRequirement
      summary: 手工创建需求 draft（登录用户）
      description: |
        创建 `draft` 需求与 revision=1。`targets` 若提供必须属于该版本绑定
        （version_sut/page/api），否则 400 并带 `details.field`。
        首个需求触发版本 `initial → running`；事件 `requirement.created`、
        `requirement.version_created`。
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequirementRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RequirementDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/requirements/confirmations:
    post:
      tags: [Requirements]
      operationId: batchConfirmRequirements
      summary: 批量确认需求（登录用户）
      description: |
        事务内全量校验；已确认项幂等跳过；存在非法 draft 时整体 400（不做部分成功，P1-D8）。
        返回 `batch_id`、本次确认的 `confirmed` 与跳过的 `skipped`（需求 ID 数组）。
        事件 `requirement.clarified`；首次确认触发版本 `initial → running`。
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchConfirmRequest'
      responses:
        '200':
          description: 批量确认结果
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BatchConfirmResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/requirements/{rid}:
    get:
      tags: [Requirements]
      operationId: getRequirement
      summary: 需求详情（登录用户）
      description: 返回当前版本、历史版本、确认记录、关系与附件。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/RID'
      responses:
        '200':
          description: 需求详情
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RequirementDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [Requirements]
      operationId: updateRequirement
      summary: 编辑需求（生成新 draft revision）
      description: |
        生成新的不可变 revision（revision+1）：`draft → draft`；`clarified` 编辑后
        需求状态回到 `draft`，旧确认记录仍指向旧 revision。请求体字段语义同创建。
        事件 `requirement.version_created`。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/RID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequirementRequest'
      responses:
        '200':
          description: 更新后的需求详情
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RequirementDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/requirements/{rid}/confirmations:
    post:
      tags: [Requirements]
      operationId: confirmRequirement
      summary: 确认单条需求（登录用户）
      description: |
        校验 title/description/acceptance_criteria/priority 与 targets 后冻结当前 revision，
        状态 `draft → clarified`；重复确认幂等返回（`confirmed=false`）。
        事件 `requirement.clarified`；首次确认触发版本 `initial → running`。无请求体。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/RID'
      responses:
        '200':
          description: 确认结果
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ConfirmRequirementResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/requirements/{rid}/rollback:
    post:
      tags: [Requirements]
      operationId: rollbackRequirement
      summary: 用户确认回退需求（登录用户）
      description: |
        复制当前版本字段生成新的 `draft` revision（status=draft），版本递增；
        事件 `requirement.rolled_back`、`requirement.version_created`。
        P2 stale 钩子在 P1 为空实现，事件携带 `affected_case_version_ids: []`（P1-D12）。
        AI 不能替用户回退；`proposal_message_id` 指向 AI 的 `rollback_proposal` 消息。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/RID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
      responses:
        '200':
          description: 回退后的需求详情
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RequirementDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/requirements/{rid}/relations:
    get:
      tags: [Requirements]
      operationId: listRequirementRelations
      summary: 需求关系列表（登录用户）
      description: 无分页；关系也可在需求详情中返回。关系由 AI 提议落库，P1 无独立确认 UI。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/RID'
      responses:
        '200':
          description: 关系列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RequirementRelationView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/team-rooms/{team}:
    get:
      tags: [Clarification]
      operationId: getTeamRoom
      summary: 团队频道只读视图（登录用户）
      description: |
        返回指定团队的最新摘要 `digest`（可为 null）与最近帖子（按 id 倒序）。
        `limit` 1–100，默认 20。P1 只读：不提供发帖/自由聊天 API；频道不触发 Agent。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 团队频道视图
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TeamRoomView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 不透明 token（`ezt_` + base64url），固定 7 天 TTL。
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: 上一页最后一个实体的十进制 ID；省略表示第一页
      schema:
        type: string
        pattern: '^[0-9]+$'
    ID:
      name: id
      in: path
      required: true
      description: 业务实体雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    ModelID:
      name: modelId
      in: path
      required: true
      description: 模型实体 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    SettingKey:
      name: key
      in: path
      required: true
      description: 设置键（如 `execution.global_concurrency`）
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]+$'
    SHA256:
      name: sha256
      in: path
      required: true
      description: 内容 SHA-256（64 位小写 hex）
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    EventChannel:
      name: channel
      in: query
      required: true
      description: 事件频道；只允许 system / version:{id} / user:{id}
      schema:
        type: string
        pattern: '^(system|version:[1-9][0-9]*|user:[1-9][0-9]*)$'
    EventAfter:
      name: after
      in: query
      required: false
      description: 事件游标（频道内 seq）；省略/0 表示取最新一页（快照）或从当前末尾实时（SSE）
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: SSE 断线续传游标；存在时优先于 `after` 查询参数
      schema:
        type: integer
        format: int64
        minimum: 0
    CID:
      name: cid
      in: path
      required: true
      description: 对话（conversation）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    RID:
      name: rid
      in: path
      required: true
      description: 需求（requirement）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    Team:
      name: team
      in: path
      required: true
      description: 团队频道；P1 只读，澄清团队为 `clarification`
      schema:
        type: string
        enum: [clarification, design, execution, delivery, steward]
    ConversationKind:
      name: kind
      in: query
      required: false
      description: 对话类型过滤；P1 只产生 clarification
      schema:
        type: string
        enum: [clarification, design]
    RequirementStatusFilter:
      name: status
      in: query
      required: false
      description: 需求状态过滤
      schema:
        type: string
        enum: [draft, clarified, closed, obsolete]
    Before:
      name: before
      in: query
      required: false
      description: 上一页最后一个实体的十进制 ID（按 id 倒序分页）；省略表示第一页
      schema:
        type: string
        pattern: '^[0-9]+$'
    MessageAfter:
      name: after
      in: query
      required: false
      description: 消息 ID 游标；只返回 id 大于该值的消息（升序）；省略从最早消息开始
      schema:
        type: string
        pattern: '^[0-9]+$'
    MessageLimit:
      name: limit
      in: query
      required: false
      description: 每页消息数（默认 100，最大 200）
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
  responses:
    BadRequest:
      description: 请求参数/请求体校验失败（invalid_argument）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未认证或 token 无效/过期（unauthenticated）
      headers:
        WWW-Authenticate:
          schema:
            type: string
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 权限不足（forbidden）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 实体不存在（not_found）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 唯一约束/状态冲突（conflict / state_conflict / lease_lost）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: 依赖暂时不可用（unavailable / ai_unavailable / context_overflow，retryable=true）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: 服务端错误（internal）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              type: string
              description: invalid_argument / unauthenticated / forbidden / not_found / conflict / state_conflict / lease_lost / ai_unavailable / context_overflow / unsupported_attachment_format / extraction_failed / unavailable / internal
            message:
              type: string
            request_id:
              type: string
              description: 与响应头 X-Request-ID 相同
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
              description: '结构化细节；字段错误通常为 {"field": "..."}；P1 可能带 requirement_id / attachment_id 便于 UI 定位'
    ListEnvelope:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {}
        next_cursor:
          type: string
          nullable: true
          description: 下一页游标（实体 ID 十进制字符串）；has_more=false 时为 null 或空串
        has_more:
          type: boolean
    HealthData:
      type: object
      required: [status, version, db, settings_loaded, executor_url]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        db:
          type: string
          enum: [ok, down]
        settings_loaded:
          type: boolean
        executor_url:
          type: string
    User:
      type: object
      required: [id, username, display_name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: 明文 token（仅登录响应返回一次）
        expires_at:
          type: string
          format: date-time
          description: 固定 7 天 TTL
        user:
          $ref: '#/components/schemas/User'
    Setting:
      type: object
      required: [key, category, type, value, is_secret, restart_required, description, version, updated_at]
      properties:
        key:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [string, number, boolean, json]
        value:
          nullable: true
          description: 非 secret 为 JSON 值；secret 固定为 null
        is_secret:
          type: boolean
        restart_required:
          type: boolean
        description:
          type: string
        version:
          type: integer
        updated_at:
          type: string
          format: date-time
    SettingRevision:
      type: object
      required: [id, key, created_at]
      properties:
        id:
          type: string
        key:
          type: string
        old_value:
          nullable: true
          description: secret 项为 null
        new_value:
          nullable: true
          description: secret 项为 null
        actor_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    LLMConfig:
      type: object
      required: [id, name, provider, protocol, base_url, api_key_set, headers, timeout_seconds, max_retries, is_default, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
          description: P0 默认 openai（字段保留）
        protocol:
          type: string
          enum: [openai, openai_compatible]
        base_url:
          type: string
          format: uri
        api_key_set:
          type: boolean
          description: 是否已配置 API key；明文 key 永不返回
        headers:
          type: object
          additionalProperties:
            type: string
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 600
        max_retries:
          type: integer
          minimum: 0
          maximum: 10
        is_default:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        created_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LLMModel:
      type: object
      required: [id, config_id, model, display_name, context_window, max_output, supports_tools, supports_vision, source, status, created_at, updated_at]
      properties:
        id:
          type: string
        config_id:
          type: string
        model:
          type: string
        display_name:
          type: string
        context_window:
          type: integer
          minimum: 0
        max_output:
          type: integer
          minimum: 0
        supports_tools:
          type: boolean
        supports_vision:
          type: boolean
        source:
          type: string
          enum: [catalog, manual]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RemoteModel:
      type: object
      required: [id]
      properties:
        id:
          type: string
        context_window:
          type: integer
          minimum: 0
        max_output:
          type: integer
          minimum: 0
        supports_tools:
          type: boolean
        supports_vision:
          type: boolean
    LLMTestResult:
      type: object
      required: [ok, latency_ms, models]
      properties:
        ok:
          type: boolean
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        models:
          type: array
          items:
