      tags: [Content]
      operationId: downloadContent
      summary: 下载内容对象（登录用户）
      description: 校验 64 位小写 hex；读取时校验文件 SHA 与 DB 一致。响应不暴露文件系统路径。
      parameters:
        - $ref: '#/components/parameters/SHA256'
      responses:
        '200':
          description: 二进制内容；实际 `Content-Type` 为该对象的存储 MIME（可能不是 application/octet-stream）
          headers:
            Content-Type:
              description: 对象存储的 MIME（服务端 http.DetectContentType 判定）
              schema:
                type: string
            X-Content-SHA256:
              description: 内容 SHA-256（小写 hex）
              schema:
                type: string
            Cache-Control:
              description: 私有长缓存（private, max-age=31536000, immutable）
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
