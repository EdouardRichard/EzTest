        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [Execution]
      operationId: createExecutionIntent
      summary: 手工创建 intent（purpose=retest/manual）
      description: |
        校验 case_version 属于该版本且为 current+confirmed；同 active 键已存在返回 409 `state_conflict`。
        `retest` 建议仅对存在失败结果时调用（否则 400）；`manual` 任意当前 confirmed 用例可用。
        版本为 `completed` 时由服务端清除完成标记回 `running`（P3-D-28）。
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntentRequest'
      responses:
        '201':
          description: 新建的 intent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/IntentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/execution/intents/{intentId}/cancel:
    post:
      tags: [Execution]
      operationId: cancelExecutionIntent
      summary: 取消 intent（幂等）
      description: open 直接取消；claimed/running 取消并把它在波次内的非终态 case_run 置 `superseded`；已终态返回当前值。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IntentID'
      responses:
        '200':
          description: 取消后的 intent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/IntentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/waves:
    get:
      tags: [Execution]
      operationId: listRunWaves
      summary: 波次列表（倒序，登录用户）
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/WaveStatusFilter'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 波次列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RunWaveView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/waves/{waveId}:
    get:
      tags: [Execution]
      operationId: getRunWave
      summary: 波次详情（仅 wave/counts；case_run 走独立分页端点）
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/WaveID'
      responses:
        '200':
          description: 波次
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RunWaveView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/waves/{waveId}/pause:
    post:
      tags: [Execution]
      operationId: pauseRunWave
      summary: 暂停波次（graceful 默认 / immediate）
      description: |
        `graceful` 停止派发 pending、在飞 case_run 允许跑完；`immediate` 取消在飞 case_run 与执行器 context，
        已完成结果保留。`paused` 仍占单活跃波；已暂停返回 200 当前值（不重复事件）。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/WaveID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseWaveRequest'
      responses:
        '200':
          description: 暂停后的波次
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RunWaveView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/waves/{waveId}/resume:
    post:
      tags: [Execution]
      operationId: resumeRunWave
      summary: 恢复波次（存在 open human request 时拒绝）
      description: paused→running；paused case_run→pending（attempts 不变、dispatch_epoch+1）；存在 open human request 返回 409 `state_conflict`（先 resolve）。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/WaveID'
      responses:
        '200':
          description: 恢复后的波次
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RunWaveView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/waves/{waveId}/cancel:
    post:
      tags: [Execution]
      operationId: cancelRunWave
      summary: 取消波次（幂等）
      description: planned/running/paused→cancelled；非终态 case_run→superseded，active intent→cancelled，清理执行器 context，不产生失败分析任务；已终态返回当前值。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/WaveID'
      responses:
        '200':
          description: 取消后的波次
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RunWaveView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/waves/{waveId}/case-runs:
    get:
      tags: [Execution]
      operationId: listWaveCaseRuns
      summary: 波次内用例结果分页（倒序）
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/WaveID'
        - $ref: '#/components/parameters/CaseRunStatusFilter'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 用例结果列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CaseRunView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/case-runs/{caseRunId}:
    get:
      tags: [Execution]
      operationId: getCaseRun
      summary: 用例结果详情（steps + assertions + 前 50 条证据）
      description: 一次返回 case_run、全部步骤、全部断言与证据前 50 条；更多证据走 `GET /evidence` 分页。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/CaseRunID'
      responses:
        '200':
          description: 用例结果详情
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CaseRunDetail'
        '400':
