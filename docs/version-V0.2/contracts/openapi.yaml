openapi: 3.0.3
info:
  title: EzTest 0.2 API 契约（P0 冻结 + P1 冻结 + P2 增量 + P3/P4/P5 冻结）
  version: 0.2.0-p5
  description: |
    EzTest 0.2 P0（平台底座）对外 REST/SSE 契约，来源：
    `docs/superpowers/specs/2026-10-31-eztest-v02-p0-platform-foundation-design.md` §7/§8/§9。

    ## 通用约定

    - 成功 JSON 响应统一为 `{"data": ...}`；列表统一为
      `{"data": [...], "next_cursor": "<id|null>", "has_more": bool}`。
      没有响应体的成功操作返回 204（登出、改密、重置密码、各 DELETE）。
    - 错误统一为
      `{"error": {"code": "...", "message": "...", "request_id": "...", "retryable": false, "details": {}}}`；
      HTTP 状态码使用 400/401/403/404/409/413/500/503。`X-Request-ID` 在响应头回显。
    - 所有业务实体 ID 在 JSON/URL 中都是十进制字符串（Go 内部 int64）。例外：
      `Event.seq` 与 `snapshot_cursor` 是**频道内事件游标**（整数），不是业务实体 ID；
      `content_object.sha256` 是 64 位小写 hex 内容主键；设置键 `system_setting.key` 是自然键。
    - 时间一律 RFC3339 UTC；未知请求字段默认忽略；写请求使用
      `Content-Type: application/json`（上传除外）。
    - 鉴权：`Authorization: Bearer <token>`。公开端点只有 `/healthz`、`/api/health`、
      `/api/auth/login`。Token 为不透明随机串，固定 7 天 TTL，不刷新。
    - 权限：`admin` 组要求 `role=admin`；资源读为登录用户、写为 admin；**代码仓读/写均为登录用户**；
      版本读/写均为登录用户；`/api/events` 与 `/api/stream` 为登录用户。

    ## 幂等

    **P0 不实现通用 `Idempotency-Key` 请求头，也不保证任意写请求的重复提交幂等。**
    后续阶段（波次/确认/导出）按设计单独接入幂等语义；调用方不得假设本阶段的写请求具有
    幂等重放能力。数据库唯一约束带来的重复键错误映射为 409 `conflict`。

    ## 列表分页

    `limit` 默认 20、上限 100；`cursor` 是上一页最后一个实体的十进制 ID。
    `has_more=false` 时 `next_cursor` 为 `null`（实现也可能返回空串）。
    事件快照使用 `after`/`snapshot_cursor` 游标，见 `/api/events`。

    ## 事件流

    `GET /api/events` 返回频道快照（最新一页或 `after` 之后的事件）；
    `GET /api/stream` 返回 SSE。SSE 帧为 `id: <seq>`、`event: <type>`、`data: <Event JSON>`，
    每 20 秒一行心跳注释；游标过旧时发送合成 `event: stream.reset`（无 id、不持久化）。
    事件通道仅允许 `system`、`version:{id}`、`user:{id}`；P0 只发布 `system` 与 `version:{id}`。
    P0 SSE Hub 为单进程内实现，多副本实时 fan-out 属 P7，不在此契约承诺内。

    ## 冻结

    `x-frozen: P0` —— 本文件在 P0 阶段末冻结；后续阶段只能增量修改，破坏性变更需更新本目录
    与决策记录并同步调用方/测试/迁移/handoff。

    ## P1 增量（frozen，2026-10-31）

    来源：`docs/superpowers/specs/2026-10-31-eztest-v02-p1-runtime-clarification-design.md`
    §3/§8/§9/§11/§12。P0 段落保留为历史；P1 增量保持冻结，当前文件级标记为 `x-frozen: P2`。
    P1 端点全部要求 Bearer 登录（单团队信任模型，无 admin 限制）；ID 仍为十进制字符串，
    时间 RFC3339 UTC，列表沿用 `{data,next_cursor,has_more}` 信封。

    ### P1 端点
    - `GET/POST /api/versions/{id}/conversations`：对话列表/新建（仅 `clarification`）。
    - `GET /api/versions/{id}/conversations/{cid}`：对话详情（含 summary，不含消息）。
    - `GET/POST /api/versions/{id}/conversations/{cid}/messages`：消息列表（id 升序）/发送用户消息。
    - `GET/POST /api/versions/{id}/requirements`：需求列表/手工创建 draft。
    - `GET/PATCH /api/versions/{id}/requirements/{rid}`：需求详情/编辑（生成新不可变 revision）。
    - `POST /api/versions/{id}/requirements/{rid}/confirmations`：单条确认（幂等）。
    - `POST /api/versions/{id}/requirements/confirmations`：批量确认（返回 `batch_id`）。
    - `POST /api/versions/{id}/requirements/{rid}/rollback`：用户确认回退，生成新 draft。
    - `GET /api/versions/{id}/requirements/{rid}/relations`：需求关系列表。
    - `GET /api/versions/{id}/team-rooms/{team}`：澄清团队频道只读（digest + 最近帖子）。
    - `GET /api/versions/{id}` 增量返回 `requirement_counts`、`conversation_count`、
      `pending_design_count`。
    - P1 不新增设计/执行/交付 API，不暴露任务板 API（P1-D3），不提供团队频道发帖 API。

    ### P1 事件（详见 `contracts/events.md`）
    `version.started`、`version.status_changed`、`conversation.created`、`conversation.message`、
    `conversation.summary_updated`、`agent.run.started`、`agent.activity`、`agent.run.finished`、
    `agent.run.failed`、`context.compacted`、`requirement.created`、`requirement.version_created`、
    `requirement.clarified`、`requirement.rolled_back`、`requirement.relation_created`、
    `requirement.attachment_ingested`、`requirement.attachment_failed`、`work_item.created`、
    `work_item.claimed`、`work_item.failed`、`work_item.dead`、`team_room.post`、
    `team_room.digest_updated`。事件只追加，不修改 P0 事件语义。

    ### P1 决策
    - AI 只能产 draft、关系提议与回退提议；确认/回退必须由用户 API 触发（P1-D9）。
    - 版本 `initial → running` 由首条对话消息/首个需求/首次确认触发；P1 不写 `completed`。
    - 需求编辑/回退总是新增不可变 revision；批量确认事务内全量校验，已确认项幂等跳过（P1-D7/D8）。
    - 聊天不做 token 级流式，使用 `agent.activity` + 完整消息事件（P1-D11）。
    - 附件支持 md/txt/docx/pptx/pdf；旧 `.doc/.ppt` 失败为 `unsupported_attachment_format`；
      解析失败不阻塞消息（消息 POST 仍 201）。
    - 稳定错误码新增 `state_conflict`、`lease_lost`、`ai_unavailable`、`context_overflow`、
      `unsupported_attachment_format`、`extraction_failed`。
    - 不新增通用 `Idempotency-Key`（P1-D16）；P1 单实例 Hub/worker，多副本 fan-out 属 P7。
    ### P2 增量（frozen，2026-10-31）

    来源：`docs/superpowers/specs/2026-10-31-eztest-v02-p2-case-design-design.md` §7/§8/§12。
    新增 design graph/overview/case detail/confirmation、版本级 case 导出创建/列表/元数据/鉴权下载。
    最新 design 对话始终为当前轮，不新增关闭 API；确认只允许 user/server；导出覆盖整个版本并支持
    Markdown/Mermaid/OPML/CSV，导出字节写入 P0 内容账本。
    ### P3 增量（draft，2026-11-01）

    来源：`docs/superpowers/specs/2026-11-01-eztest-v02-p3-execution-design.md` §9/§10/§11/§14。
    P0/P1/P2 paths/schemas 保持不变；P3 新增 22 个 path（执行概览/intents/waves/case-runs/evidence/
    human-requests/admin executors）、Execution/Evidence/HumanRequests 三个 tag 与对应视图。
    执行是「确认即入队」的意图驱动自动波次，无「开始执行」端点；ID 仍为十进制字符串，时间 RFC3339 UTC，
    列表沿用 `{data,next_cursor,has_more}`，分页参数为 `before` + `limit`（默认 20，上限 100）。
    P3 新增错误码 `evidence_too_large`（证据超 5 MiB，409/413 视体积）与 `executor_unavailable`
    （执行器不可达/未注册，503）；human request 任意登录用户可 resolve，executor 管理仅 admin。
    实时走既有 `GET /api/events` + `GET /api/stream?channel=version:{id}`，事件类型见 `contracts/events.md` §12。
    ### P4 增量（frozen，2026-11-01）

    来源：`docs/superpowers/specs/2026-11-01-eztest-v02-p4-delivery-chain-design.md` §4/§6/§7/§8/§14。
    P0/P1/P2/P3 paths/schemas 语义不变；P4 新增 14 个 operation：版本内问题 6（列表/详情/确认/驳回/重开/合并）、
    报告 5（列表/详情/revision/HTML 下载/重生成）、探索链路 1、版本重开 1、需求重开 1；新增 `Delivery`/`Chain` 两个 tag。
    报告 HTML 下载返回 `text/html`，`ETag` 为内容 sha256，`Cache-Control: private, no-store`、
    `X-Content-Type-Options: nosniff`，CSP 见响应头；HTML 字节以 P0 内容账本为权威，不暴露内部路径。
    业务冲突统一 `state_conflict`，`details.reason` 使用稳定子码（`issue_not_open`/`issue_not_reopenable`/
    `merge_target_invalid`/`merge_cycle`/`report_not_current`/`report_content_corrupt`/`close_predicate_failed`）。
    Version/Requirement 视图仅新增可选字段（`closed_at`/`close_reason`/`closure`）；事件类型见 `contracts/events.md` §13。
    ### P5 增量（frozen，2026-11-01）

    来源：`docs/superpowers/specs/2026-11-01-eztest-v02-p5-codeintel-visual-design.md` §4/§14。
    P0–P4 paths/schemas 语义不变；P5 新增 38 个 operation（代码索引/树/文件/diff/事实/搜索/commit、
    版本变更/分析/影响、锚点、事实复核、页面/API 提议、视觉配置/基线/比对/概览、全局视觉指标），
    新增 `Code`/`Visual`/`Quality` 三个 tag。代码正文只经 `code.read`/`GET .../file` 鉴权读取；
    事件/响应不返回代码正文、图片字节、凭据或文件系统路径；视觉 actual/diff 字节以内容账本为权威。
    业务冲突统一 `state_conflict`，`details.reason` 使用稳定子码（`index_in_progress`/`analysis_in_progress`/
    `anchor_duplicate`/`repo_not_bound`/`baseline_commit_missing`/`repo_ambiguous`/`config_invalid`/
    `baseline_evidence_invalid`）。`VersionSUT`（`Binding`）新增可选 `code_baseline_commit`；
    `CaseRunSummaryView` 新增视觉四态计数（`visual_skipped` 保留兼容）；`EvidenceView.kind` 扩为
    10 值（`visual_actual`/`visual_diff`）。事件类型见 `contracts/events.md` §14。
x-frozen: P5
servers:
  - url: http://localhost:13333
    description: 本地开发默认 API（端口来自 EZTEST_API_PORT，默认 13333）
security:
  - bearerAuth: []
tags:
  - name: Health
    description: 公开存活/就绪探针
  - name: Auth
    description: 登录、登出、当前用户、自助改密
  - name: AdminUsers
    description: 管理员用户管理
  - name: AdminSettings
    description: 系统设置中心
  - name: AdminLLM
    description: LLM 配置与模型目录（P0 只做配置/目录/连通性，不含 chat 网关）
  - name: AdminAudit
    description: 审计日志查询
  - name: Events
    description: 事件快照与 SSE
  - name: Content
    description: 内容对象上传/下载
  - name: Resources
    description: SUT/环境/页面/API/目标库/测试账号/代码仓
  - name: Versions
    description: 版本与多 SUT 绑定
  - name: Conversations
    description: 澄清对话、消息与摘要（P1）
  - name: Requirements
    description: 需求版本、确认、回退与关系（P1）
  - name: Clarification
    description: 澄清团队频道只读摘要/帖子（P1）
  - name: Design
    description: 用例设计图、用例详情与三粒度确认（P2）
  - name: Exports
    description: 用例导出与鉴权下载（P2）
  - name: Execution
    description: 执行意图、波次、用例结果与执行器管理（P3）
  - name: Evidence
    description: 证据元数据与鉴权下载（P3，不可变）
  - name: HumanRequests
    description: 登录接管/人机请求（P3）
  - name: Delivery
    description: 版本内问题与报告（P4；报告 HTML 以内容账本为权威）
  - name: Chain
    description: 版本探索链路只读读模型（P4；预算/截断/两档回放）
  - name: Code
    description: 代码索引/树/文件/diff/事实/分析/影响/锚点/复核/页面 API 提议（P5）
  - name: Visual
    description: 视觉断言配置、基线审批、比对与版本视觉概览（P5）
  - name: Quality
    description: 质量指标只读聚合（P5 最小质量页；完整质量中心 P6）

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 存活探针（公开）
      security: []
      responses:
        '200':
          description: 进程存活；固定 `{"status":"ok"}`（不套 data 信封）
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /api/health:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 就绪探针（公开）
      description: DB ping、版本、settings_loaded、executor_url。DB 不可用时返回 503 且 `data.status=degraded`。
      security: []
      responses:
        '200':
          description: 就绪
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
        '503':
          description: DB 不可用（degraded）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 用户名/密码登录（公开）
      description: |
        成功返回明文 token 与过期时间；DB 只存 token 的 SHA-256。错误密码/禁用用户返回 401。
        默认管理员由启动种子创建：`admin` / `admin123`（仅开发/测试受控环境）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 撤销当前 token
      responses:
        '204':
          description: 已登出，无响应体
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: 当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: 自助改密（旧密码 + 新密码）
      description: 新密码 8–128 字符；成功后旧 token 仍有效（P0 不强制重登），审计 `auth.password_changed`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 修改成功，无响应体
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/users:
    get:
      tags: [AdminUsers]
      operationId: listUsers
      summary: 用户列表（admin）
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 用户分页（按 id 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [AdminUsers]
      operationId: createUser
      summary: 创建普通用户（admin）
      description: 只能创建 `role=user`；用户名 `^[a-zA-Z0-9_.-]{3,64}$` 创建后不可改；密码 8–128。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/users/{id}:
    patch:
      tags: [AdminUsers]
      operationId: updateUser
      summary: 更新显示名/状态（admin）
      description: 不允许提升为 admin，不允许禁用唯一 admin。
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/users/{id}/reset-password:
    post:
      tags: [AdminUsers]
      operationId: resetUserPassword
      summary: 重置用户密码（admin）
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: 已重置，无响应体
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/settings:
    get:
      tags: [AdminSettings]
      operationId: listSettings
      summary: 全部设置（admin，secret 掩码）
      description: 返回完整目录（P0 为 44 个键），secret 项的 `value` 固定为 `null`。
      responses:
        '200':
          description: 设置数组（不分页）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Setting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/settings/revisions:
    get:
      tags: [AdminSettings]
      operationId: listSettingRevisions
      summary: 设置变更历史（admin）
      parameters:
        - name: key
          in: query
          required: true
          description: 设置键
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
