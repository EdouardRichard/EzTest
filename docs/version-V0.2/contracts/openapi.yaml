      required: [total, pending, running, paused, passed, failed, blocked, inconclusive, skipped, interrupted, superseded, evidence, by_version_sut]
      properties:
        total:
          type: integer
          minimum: 0
          description: 按 case_run 去重计数（不是各 SUT 求和）
        pending:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        paused:
          type: integer
          minimum: 0
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        blocked:
          type: integer
          minimum: 0
        inconclusive:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        interrupted:
          type: integer
          minimum: 0
        superseded:
          type: integer
          minimum: 0
        evidence:
          type: integer
          minimum: 0
        by_version_sut:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/WaveSUTCounts'
          description: 键为 version_sut 十进制字符串；跨系统用例在每个 SUT 下各计一次
    CaseRunCounts:
      type: object
      required: [total, pending, running, paused, passed, failed, blocked, inconclusive, skipped, interrupted, superseded]
      properties:
        total:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        paused:
          type: integer
          minimum: 0
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        blocked:
          type: integer
          minimum: 0
        inconclusive:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        interrupted:
          type: integer
          minimum: 0
        superseded:
          type: integer
          minimum: 0
    ExecutionQuotas:
      type: object
      required: [global, per_sut, cross_system]
      properties:
        global:
          type: integer
          minimum: 1
          description: execution.global_concurrency（running case_run 数，默认 3）
        per_sut:
          type: integer
          minimum: 1
          description: execution.per_sut_concurrency（每 version_sut 的 running case_run 数，默认 2）
        cross_system:
          type: integer
          minimum: 1
          description: execution.cross_system_concurrency（全局跨系统 running case_run 数，默认 1）
