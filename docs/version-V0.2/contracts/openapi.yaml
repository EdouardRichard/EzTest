      operationId: updateRequirement
      summary: 编辑需求（生成新 draft revision）
      description: |
        生成新的不可变 revision（revision+1）：`draft → draft`；`clarified` 编辑后
        需求状态回到 `draft`，旧确认记录仍指向旧 revision。请求体字段语义同创建。
        事件 `requirement.version_created`。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/RID'
