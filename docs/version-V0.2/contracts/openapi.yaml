    # -----------------------------------------------------------------------
    # P3 execution schemas (draft, 2026-11-01)
    # -----------------------------------------------------------------------
    WaveSUTCounts:
      type: object
      required: [total, passed, failed, blocked, inconclusive]
      properties:
        total:
          type: integer
          minimum: 0
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        blocked:
          type: integer
          minimum: 0
        inconclusive:
          type: integer
          minimum: 0
    WaveCounts:
      type: object
      required: [total, pending, running, paused, passed, failed, blocked, inconclusive, skipped, interrupted, superseded, evidence, by_version_sut]
      properties:
        total:
          type: integer
          minimum: 0
          description: 按 case_run 去重计数（不是各 SUT 求和）
        pending:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        paused:
          type: integer
          minimum: 0
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        blocked:
          type: integer
          minimum: 0
        inconclusive:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        interrupted:
          type: integer
          minimum: 0
        superseded:
          type: integer
          minimum: 0
        evidence:
          type: integer
          minimum: 0
        by_version_sut:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/WaveSUTCounts'
          description: 键为 version_sut 十进制字符串；跨系统用例在每个 SUT 下各计一次
    CaseRunCounts:
      type: object
      required: [total, pending, running, paused, passed, failed, blocked, inconclusive, skipped, interrupted, superseded]
      properties:
        total:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        paused:
          type: integer
          minimum: 0
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        blocked:
          type: integer
          minimum: 0
        inconclusive:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        interrupted:
          type: integer
          minimum: 0
        superseded:
          type: integer
          minimum: 0
    ExecutionQuotas:
      type: object
      required: [global, per_sut, cross_system]
      properties:
        global:
          type: integer
          minimum: 1
          description: execution.global_concurrency（running case_run 数，默认 3）
        per_sut:
          type: integer
          minimum: 1
          description: execution.per_sut_concurrency（每 version_sut 的 running case_run 数，默认 2）
        cross_system:
          type: integer
          minimum: 1
          description: execution.cross_system_concurrency（全局跨系统 running case_run 数，默认 1）
    ExecutorStatusView:
      type: object
      required: [status, endpoint, capacity, active_contexts, version]
      properties:
        id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: 已注册执行器实例 ID；尚未注册时为 null（不建行，P3-D-01）
        status:
          type: string
          enum: [active, draining, offline]
        endpoint:
          type: string
          description: 来自 execution.executor_url
        capacity:
          type: integer
          minimum: 0
          description: 执行器 maxContexts
        active_contexts:
          type: integer
          minimum: 0
          description: 执行器 healthz contexts
        last_heartbeat:
          type: string
          nullable: true
          format: date-time
        version:
          type: string
          description: 执行器 healthz version
    ExecutionOverview:
      type: object
      required: [version_id, active_wave, counts, case_run_counts, open_human_requests, executor, quotas, human_request_timeout_seconds]
      properties:
        version_id:
          type: string
          pattern: '^[0-9]+$'
        active_wave:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RunWaveView'
          description: 当前单活跃波（planned/running/paused）；无活跃波时为 null
        counts:
          $ref: '#/components/schemas/WaveCounts'
        case_run_counts:
          $ref: '#/components/schemas/CaseRunCounts'
        open_human_requests:
          type: integer
          minimum: 0
        executor:
          $ref: '#/components/schemas/ExecutorStatusView'
        quotas:
          $ref: '#/components/schemas/ExecutionQuotas'
        human_request_timeout_seconds:
          type: integer
          minimum: 60
    RunWaveView:
      type: object
      required: [id, version_id, status, trigger, counts, started_at, finished_at, paused_at, pause_mode, pause_reason, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        version_id:
          type: string
          pattern: '^[0-9]+$'
        status:
          type: string
          enum: [planned, running, paused, done, failed, cancelled]
        trigger:
          type: string
          enum: [auto, manual, retest]
        counts:
          $ref: '#/components/schemas/WaveCounts'
        started_at:
          type: string
          nullable: true
          format: date-time
        finished_at:
          type: string
          nullable: true
          format: date-time
        paused_at:
          type: string
          nullable: true
          format: date-time
        pause_mode:
          type: string
          enum: ['', graceful, immediate]
        pause_reason:
          type: string
        created_at:
          type: string
          format: date-time
    IntentView:
      type: object
      required: [id, version_id, case_version_id, case_id, case_title, version_sut_ids, purpose, status, attempt_no, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        version_id:
          type: string
          pattern: '^[0-9]+$'
        case_version_id:
          type: string
          pattern: '^[0-9]+$'
        case_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: 逻辑用例 ID（由 case_version 反查；历史版本可能为空）
        case_title:
          type: string
        version_sut_ids:
          type: array
          items:
            type: string
            pattern: '^[0-9]+$'
        purpose:
          type: string
          enum: [initial, retest, manual]
        status:
          type: string
          enum: [open, claimed, running, done, failed, cancelled, superseded]
        attempt_no:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    CaseRunSummaryView:
      type: object
      required: [verdict_reason, assertion_total, assertion_failed, step_total, step_failed, evidence_count, visual_skipped]
      properties:
        verdict_reason:
          type: string
          description: 终态判定原因，如 incomplete/human_timeout/human_cancelled
        assertion_total:
          type: integer
          minimum: 0
        assertion_failed:
          type: integer
          minimum: 0
        step_total:
          type: integer
          minimum: 0
        step_failed:
          type: integer
          minimum: 0
        evidence_count:
          type: integer
          minimum: 0
        visual_skipped:
          type: integer
          minimum: 0
          description: P5 起为 0（或仅“未配置视觉”时计数）；不再把 visual 断言记 skipped 假通过（P3-D-39/P5 实现）
        visual_passed:
          type: integer
          minimum: 0
          description: 视觉断言 passed 数（P5 增量）
        visual_failed:
          type: integer
          minimum: 0
          description: 视觉断言 failed 数（P5 增量）
        visual_inconclusive:
          type: integer
          minimum: 0
          description: 视觉断言 inconclusive 数（P5 增量；含环境不一致/无基线）
        human_request_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
    CaseRunView:
      type: object
      required: [id, wave_id, intent_id, case_id, case_version_id, title, status, failure_class, attempts, summary, started_at, finished_at, version_sut_ids, evidence_count]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        wave_id:
          type: string
          pattern: '^[0-9]+$'
        intent_id:
          type: string
          pattern: '^[0-9]+$'
        case_id:
          type: string
          pattern: '^[0-9]+$'
        case_version_id:
          type: string
          pattern: '^[0-9]+$'
        title:
          type: string
        status:
          type: string
          enum: [pending, running, paused, passed, failed, blocked, inconclusive, skipped, interrupted, superseded]
        failure_class:
          type: string
          enum: ['', application, environment, session, model, automation, timeout, executor_lost, blocked, unknown]
        attempts:
          type: integer
          minimum: 0
        summary:
          $ref: '#/components/schemas/CaseRunSummaryView'
        started_at:
          type: string
          nullable: true
          format: date-time
        finished_at:
          type: string
          nullable: true
          format: date-time
        version_sut_ids:
          type: array
          items:
            type: string
            pattern: '^[0-9]+$'
        evidence_count:
          type: integer
          minimum: 0
    CaseRunStepView:
      type: object
      required: [seq, target_version_sut_id, status, observed, error, started_at, finished_at]
      properties:
        seq:
          type: integer
          minimum: 1
        target_version_sut_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        status:
          type: string
          enum: [pending, running, passed, failed, blocked, skipped]
        observed:
          type: object
          additionalProperties: true
        error:
          type: string
        started_at:
          type: string
          nullable: true
          format: date-time
        finished_at:
          type: string
          nullable: true
          format: date-time
    CaseRunAssertionView:
      type: object
      required: [step_seq, assertion_seq, kind, verdict, expected, actual, reason, target_version_sut_id]
      properties:
        step_seq:
          type: integer
          minimum: 1
        assertion_seq:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [ui, api, db, text, visual]
        verdict:
          type: string
          enum: [passed, failed, inconclusive, skipped]
        expected:
          type: string
        actual:
          type: string
        reason:
          type: string
        target_version_sut_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
    EvidenceView:
      type: object
      required: [id, case_run_id, version_sut_id, kind, sha256, size_bytes, mime, filename, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        case_run_id:
          type: string
          pattern: '^[0-9]+$'
        version_sut_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        step_seq:
          type: integer
          nullable: true
          minimum: 1
        assertion_seq:
          type: integer
          nullable: true
          minimum: 1
        kind:
          type: string
          enum: [screenshot, snapshot, console, network, http, db, download, text, visual_actual, visual_diff]
          description: P5 起 10 值；`visual_actual`/`visual_diff` 为视觉比对证据（P5 增量）
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        mime:
          type: string
        filename:
          type: string
        created_at:
          type: string
          format: date-time
      description: 证据元数据；不含 content_ref_id/存储路径/凭据。step_seq/assertion_seq 可空（用例级证据）。字节走鉴权下载端点。
    CaseRunDetail:
      type: object
      required: [case_run, steps, assertions, evidence]
      properties:
        case_run:
          $ref: '#/components/schemas/CaseRunView'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CaseRunStepView'
        assertions:
          type: array
          items:
            $ref: '#/components/schemas/CaseRunAssertionView'
        evidence:
          type: array
          description: 前 50 条证据元数据；更多走 GET /evidence 分页
          items:
            $ref: '#/components/schemas/EvidenceView'
    HumanRequestPayload:
      type: object
      required: [reason, account_role, page_url, challenge_kind]
      properties:
        reason:
          type: string
        version_sut_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        account_role:
          type: string
        page_url:
          type: string
        challenge_kind:
          type: string
        evidence_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
    HumanRequestResponseView:
      type: object
      description: P3 只回显 note 摘要，不回显一次性 code/密码
      properties:
        note:
          type: string
    HumanRequestView:
      type: object
      required: [id, version_id, case_run_id, kind, status, payload, expires_at, response, resolved_by, resolved_at, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        version_id:
          type: string
          pattern: '^[0-9]+$'
        case_run_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        kind:
          type: string
          enum: [login_takeover, conflict, other]
        status:
          type: string
          enum: [open, resolved, cancelled, expired]
        payload:
          $ref: '#/components/schemas/HumanRequestPayload'
        expires_at:
          type: string
          format: date-time
        response:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/HumanRequestResponseView'
        resolved_by:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        resolved_at:
          type: string
          nullable: true
          format: date-time
        created_at:
          type: string
          format: date-time
    ExecutorView:
      type: object
      required: [id, name, endpoint, status, capacity, active_contexts, labels, last_heartbeat, version, last_error]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
        endpoint:
          type: string
        status:
          type: string
          enum: [active, draining, offline]
        capacity:
          type: integer
          minimum: 0
        active_contexts:
          type: integer
          minimum: 0
        labels:
          type: object
          additionalProperties: true
