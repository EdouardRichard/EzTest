      description: 对话详情（不含消息；消息走 /messages）
      allOf:
        - $ref: '#/components/schemas/ConversationSummary'
        - type: object
          required: [summary, updated_at]
          properties:
            summary:
              type: string
              nullable: true
              description: 最新 conversation_summary.summary；未生成时为 null
            updated_at:
              type: string
              format: date-time
