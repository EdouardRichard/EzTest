      operationId: downloadEvidence
      summary: 鉴权下载证据字节
      description: |
        校验 `case_run → wave → version` 归属；读取 P0 内容账本字节并重算 sha256/大小，与 evidence 行不一致
        返回 409 `state_conflict`（拒绝下载）。`Content-Disposition` 使用清洗后的 filename；不暴露存储路径。
