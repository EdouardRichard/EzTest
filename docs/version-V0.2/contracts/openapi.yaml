      type: object
      description: UI 线程消息（P1 只写 user/assistant）；LLM transcript 不通过本 API 暴露
      required: [id, conversation_id, role, parts, refs, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        conversation_id:
          type: string
          pattern: '^[0-9]+$'
        role:
          type: string
          enum: [user, assistant]
        parts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MessagePart'
        refs:
          type: array
          description: '结构化引用；元素形如 {"kind": "requirement", "id": "3001"}'
          items:
            type: object
            required: [kind, id]
            properties:
              kind:
                type: string
              id:
                type: string
                pattern: '^[0-9]+$'
        created_at:
          type: string
          format: date-time
    MessagePart:
      description: |
        消息 part 判别联合，以 `type` 区分：
        `text` / `attachment` / `requirement_card` / `rollback_proposal`。
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type:
              type: string
              enum: [text]
            text:
              type: string
              minLength: 1
              maxLength: 20000
        - type: object
          required: [type, sha256, name, mime, size]
          properties:
            type:
              type: string
              enum: [attachment]
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: P0 `POST /api/content` 返回的内容 SHA-256
            name:
              type: string
            mime:
              type: string
            size:
              type: integer
              minimum: 0
              maximum: 10485760
        - type: object
          required: [type, requirement_id, title, status, revision]
          properties:
            type:
              type: string
              enum: [requirement_card]
            requirement_id:
              type: string
              pattern: '^[0-9]+$'
            title:
              type: string
            status:
              type: string
              enum: [draft, clarified, closed, obsolete]
            revision:
              type: integer
              minimum: 1
        - type: object
          required: [type, requirement_id, reason]
          properties:
            type:
              type: string
              enum: [rollback_proposal]
            requirement_id:
              type: string
              pattern: '^[0-9]+$'
            reason:
              type: string
    CreateConversationRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [clarification]
          description: P1 只支持 clarification
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: 省略时默认 `需求澄清 YYYY-MM-DD HH:mm`
    PostMessageRequest:
      type: object
      required: [parts]
      properties:
        client_message_id:
          type: string
          maxLength: 64
          description: 幂等键；同一对话内唯一
        parts:
          type: array
          minItems: 1
          description: 至少一个非空 part；`attachment` part 最多 10 个
          items:
            $ref: '#/components/schemas/MessagePart'
    AttachmentView:
      type: object
      description: 附件运行态（解析文本作为内容引用保存，不复制进需求版本）
      required: [id, name, mime, size, extraction_status, extraction_error, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
        mime:
          type: string
        size:
          type: integer
          minimum: 0
          maximum: 10485760
        extraction_status:
          type: string
          enum: [pending, processing, done, failed, skipped]
        extraction_error:
          type: object
          nullable: true
          required: [code]
          description: 解析失败时返回稳定错误码；不泄露路径/服务器信息
          properties:
            code:
              type: string
              enum: [unsupported_attachment_format, extraction_failed]
            message:
              type: string
        created_at:
          type: string
          format: date-time
    RequirementCounts:
      type: object
      description: 版本下需求按状态计数（P1 增量）
      required: [total, draft, clarified, closed, obsolete]
      properties:
        total:
          type: integer
          minimum: 0
        draft:
          type: integer
          minimum: 0
        clarified:
          type: integer
          minimum: 0
        closed:
          type: integer
          minimum: 0
        obsolete:
          type: integer
          minimum: 0
    RequirementTargets:
      type: object
      description: 需求目标引用的十进制 ID；空数组表示未指定
      required: [version_suts, pages, apis]
      properties:
        version_suts:
          type: array
          items:
            type: string
            pattern: '^[0-9]+$'
        pages:
          type: array
          items:
            type: string
            pattern: '^[0-9]+$'
        apis:
          type: array
          items:
            type: string
            pattern: '^[0-9]+$'
    RequirementSummary:
      type: object
      description: 需求列表项（当前 revision 摘要）
      required: [id, current_version_id, revision, title, status, priority, targets, updated_at, confirmed_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        current_version_id:
          type: string
          pattern: '^[0-9]+$'
          description: 当前 requirement_version ID
        revision:
          type: integer
          minimum: 1
        title:
          type: string
        status:
          type: string
          enum: [draft, clarified, closed, obsolete]
        priority:
          type: string
          enum: [P0, P1, P2, P3]
        targets:
          $ref: '#/components/schemas/RequirementTargets'
        updated_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: 当前 revision 的确认时间；未确认为 null
    RequirementVersionView:
      type: object
      description: 不可变需求版本快照
      required: [id, requirement_id, revision, title, description, acceptance_criteria, priority, constraints, target_version_suts, target_pages, target_apis, content_hash, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        requirement_id:
          type: string
          pattern: '^[0-9]+$'
        revision:
          type: integer
          minimum: 1
        title:
          type: string
        description:
          type: string
        acceptance_criteria:
          type: string
        priority:
          type: string
          enum: [P0, P1, P2, P3]
        constraints:
          type: object
          additionalProperties: true
          description: 业务规则等；推荐子键 business_rules/preconditions/exceptions/data_constraints/dependencies
        target_version_suts:
          type: array
          items:
            type: string
            pattern: '^[0-9]+$'
        target_pages:
          type: array
          items:
            type: string
            pattern: '^[0-9]+$'
        target_apis:
          type: array
          items:
            type: string
            pattern: '^[0-9]+$'
        content_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 规范化 JSON 的 SHA-256 hex
        created_at:
          type: string
          format: date-time
    RequirementConfirmationView:
      type: object
      description: 需求版本确认记录
      required: [id, requirement_version_id, scope, batch_id, actor_id, confirmed_at, affected_requirement_ids]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        requirement_version_id:
          type: string
          pattern: '^[0-9]+$'
        scope:
          type: string
          enum: [requirement, batch]
        batch_id:
          type: string
          nullable: true
        actor_id:
          type: string
          pattern: '^[0-9]+$'
        confirmed_at:
          type: string
          format: date-time
        affected_requirement_ids:
          type: array
          items:
            type: string
            pattern: '^[0-9]+$'
    RequirementRelationView:
      type: object
      description: 需求关系（同版本、非自环、唯一）
      required: [id, from_requirement_id, to_requirement_id, kind, description, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        from_requirement_id:
          type: string
          pattern: '^[0-9]+$'
        to_requirement_id:
          type: string
          pattern: '^[0-9]+$'
        kind:
          type: string
          enum: [depends_on, conflicts_with, overlaps, shares_scope]
        description:
          type: string
        created_at:
          type: string
          format: date-time
    RequirementDetail:
      description: 需求详情（摘要字段 + 当前/历史版本 + 确认/关系/附件）
      allOf:
        - $ref: '#/components/schemas/RequirementSummary'
        - type: object
          required: [current_version, history, confirmations, relations, attachments]
          properties:
            current_version:
              $ref: '#/components/schemas/RequirementVersionView'
            history:
              type: array
              description: 历史版本（revision 倒序，不含当前版本）
              items:
                $ref: '#/components/schemas/RequirementVersionView'
            confirmations:
              type: array
              items:
                $ref: '#/components/schemas/RequirementConfirmationView'
            relations:
              type: array
              items:
                $ref: '#/components/schemas/RequirementRelationView'
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/AttachmentView'
    CreateRequirementRequest:
      type: object
      required: [title, description, acceptance_criteria, priority]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 20000
        acceptance_criteria:
          type: string
          minLength: 1
          maxLength: 20000
        priority:
          type: string
          enum: [P0, P1, P2, P3]
          default: P2
        constraints:
          type: object
          additionalProperties: true
          description: 业务规则等；推荐子键 business_rules/preconditions/exceptions/data_constraints/dependencies
        targets:
          $ref: '#/components/schemas/RequirementTargets'
    UpdateRequirementRequest:
      type: object
      required: [title, description, acceptance_criteria, priority]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 20000
        acceptance_criteria:
          type: string
          minLength: 1
          maxLength: 20000
        priority:
          type: string
          enum: [P0, P1, P2, P3]
        constraints:
          type: object
          additionalProperties: true
        targets:
          $ref: '#/components/schemas/RequirementTargets'
        reason:
          type: string
          maxLength: 2000
          description: 变更原因（审计/事件）
    ConfirmRequirementResult:
      type: object
      required: [confirmed, requirement]
      properties:
        confirmed:
          type: boolean
          description: true=本次新确认；false=此前已确认，幂等返回
        requirement:
          $ref: '#/components/schemas/RequirementDetail'
    BatchConfirmRequest:
      type: object
      required: [requirement_ids]
      properties:
        requirement_ids:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^[0-9]+$'
    BatchConfirmResult:
      type: object
      required: [batch_id, confirmed, skipped]
      properties:
        batch_id:
          type: string
        confirmed:
          type: array
          description: 本次新确认的需求 ID
          items:
            type: string
            pattern: '^[0-9]+$'
        skipped:
          type: array
          description: 已确认并幂等跳过的需求 ID
          items:
            type: string
            pattern: '^[0-9]+$'
    RollbackRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 2000
        proposal_message_id:
          type: string
          pattern: '^[0-9]+$'
          description: AI `rollback_proposal` 消息 ID；省略表示用户主动回退
    TeamRoomPost:
      type: object
      description: 团队频道帖子（全量审计；不全文回放）
      required: [id, kind, content, refs, agent_run_id, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        kind:
          type: string
          enum: [finding, decision, blocker, handoff, status]
        content:
          type: string
        refs:
          type: array
          description: '结构化引用；元素形如 {"kind": "requirement", "id": "3001"}'
          items:
            type: object
            required: [kind, id]
            properties:
              kind:
                type: string
              id:
                type: string
                pattern: '^[0-9]+$'
        agent_run_id:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        created_at:
          type: string
          format: date-time
    TeamRoomView:
      type: object
      description: 团队频道只读视图（最新 digest + 最近帖子）
      required: [team, digest, posts]
      properties:
        team:
          type: string
          enum: [clarification, design, execution, delivery, steward]
        digest:
          type: object
          nullable: true
          description: 最新摘要；尚未生成时为 null
          required: [summary, pinned_post_ids, token_estimate, version, updated_at]
          properties:
            summary:
              type: string
            pinned_post_ids:
              type: array
              items:
                type: string
                pattern: '^[0-9]+$'
            token_estimate:
              type: integer
              minimum: 0
            version:
              type: integer
              minimum: 1
            updated_at:
              type: string
              format: date-time
        posts:
          type: array
          items:
            $ref: '#/components/schemas/TeamRoomPost'
