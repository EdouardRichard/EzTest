      tags: [Conversations]
      operationId: createConversation
      summary: 新建澄清对话（登录用户）
      description: |
        仅支持 `kind=clarification`。`title` 省略时默认 `需求澄清 YYYY-MM-DD HH:mm`。
        创建后 best-effort ensure opening `chat.turn` 任务；仅创建空对话不会把版本投影为 `running`。
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
