  /api/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: 事件快照（登录用户）
      description: |
        - `after` 省略/0：取该频道**最新** `limit` 条，按 seq 正序返回；
        - `after>0`：取 seq > after 的事件，按 seq 正序返回；
        - `snapshot_cursor` 为请求时刻该频道最新 seq；`has_more` 表示还有更多。
        `limit` 默认 50、上限 200。未知 channel 或非法游标返回 400。
      parameters:
        - $ref: '#/components/parameters/EventChannel'
        - $ref: '#/components/parameters/EventAfter'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: 事件快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSnapshotEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/stream:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: 事件 SSE 流（登录用户）
      description: |
        `Last-Event-ID` 头优先于 `after` 查询参数。
        有游标：先订阅进程内 Hub，再回放 DB 中游标之后的事件，最后接实时；
        无游标：从当前 last_seq 之后只订阅实时（响应头 `X-Snapshot-Cursor` 给出当前末尾）。
        帧：`id: <seq>`、`event: <type>`、`data: <Event JSON>`；每 20s 心跳注释。
        游标过旧（`after > last_seq` 或 `after < min(seq)-1`）发送合成
        `event: stream.reset`（无 id、不持久化、不进入普通事件回调）；P0 不冻结该控制帧的 data 字段，
        客户端收到后必须重新拉取快照。
        401 返回 JSON 错误而不是 SSE。
      parameters:
        - $ref: '#/components/parameters/EventChannel'
        - $ref: '#/components/parameters/EventAfter'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          description: SSE 流（长连接）
          headers:
            X-Snapshot-Cursor:
              description: 连接建立时该频道最新 seq
              schema:
                type: integer
                format: int64
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE 文本流。示例：
                  `id: 42\nevent: version.created\ndata: {"seq":42,...}\n\n`
                  心跳为注释行（如 `: heartbeat`）；`stream.reset` 帧不带 id。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/content:
    post:
      tags: [Content]
      operationId: uploadContent
      summary: 上传内容对象（登录用户，multipart，≤10 MiB）
      description: |
        multipart 字段名 `file`。服务端计算 SHA-256、以 `http.DetectContentType` 判定 MIME，
        写入 `{paths.data_root}/objects/{sha[0:2]}/{sha[2:4]}/{sha}`；重复内容去重。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 已上传（重复上传返回同一内容对象）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ContentObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: 超过 10 MiB 上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/Internal'
  /api/content/{sha256}:
    get:
      tags: [Content]
      operationId: downloadContent
      summary: 下载内容对象（登录用户）
      description: 校验 64 位小写 hex；读取时校验文件 SHA 与 DB 一致。响应不暴露文件系统路径。
      parameters:
        - $ref: '#/components/parameters/SHA256'
      responses:
        '200':
          description: 二进制内容；实际 `Content-Type` 为该对象的存储 MIME（可能不是 application/octet-stream）
          headers:
            Content-Type:
              description: 对象存储的 MIME（服务端 http.DetectContentType 判定）
              schema:
                type: string
            X-Content-SHA256:
              description: 内容 SHA-256（小写 hex）
              schema:
                type: string
            Cache-Control:
              description: 私有长缓存（private, max-age=31536000, immutable）
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
