      description: |
        按 id 倒序分页；`kind` 省略时返回该版本全部对话（P1 只有 `clarification`）。
        列表项含 `message_count` 与 `last_message_at`（无消息时 `last_message_at=null`）。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/ConversationKind'
