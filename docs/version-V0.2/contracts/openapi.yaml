openapi: 3.0.3
info:
  title: EzTest 0.2 P0 Platform Foundation API
  version: 0.2.0-p0
  description: |
    EzTest 0.2 P0（平台底座）对外 REST/SSE 契约，来源：
    `docs/superpowers/specs/2026-10-31-eztest-v02-p0-platform-foundation-design.md` §7/§8/§9。

    ## 通用约定

    - 成功 JSON 响应统一为 `{"data": ...}`；列表统一为
      `{"data": [...], "next_cursor": "<id|null>", "has_more": bool}`。
      没有响应体的成功操作返回 204（登出、改密、重置密码、各 DELETE）。
    - 错误统一为
      `{"error": {"code": "...", "message": "...", "request_id": "...", "retryable": false, "details": {}}}`；
      HTTP 状态码使用 400/401/403/404/409/413/500/503。`X-Request-ID` 在响应头回显。
    - 所有业务实体 ID 在 JSON/URL 中都是十进制字符串（Go 内部 int64）。例外：
      `Event.seq` 与 `snapshot_cursor` 是**频道内事件游标**（整数），不是业务实体 ID；
      `content_object.sha256` 是 64 位小写 hex 内容主键；设置键 `system_setting.key` 是自然键。
    - 时间一律 RFC3339 UTC；未知请求字段默认忽略；写请求使用
      `Content-Type: application/json`（上传除外）。
    - 鉴权：`Authorization: Bearer <token>`。公开端点只有 `/healthz`、`/api/health`、
      `/api/auth/login`。Token 为不透明随机串，固定 7 天 TTL，不刷新。
    - 权限：`admin` 组要求 `role=admin`；资源读为登录用户、写为 admin；**代码仓读/写均为登录用户**；
      版本读/写均为登录用户；`/api/events` 与 `/api/stream` 为登录用户。

    ## 幂等

    **P0 不实现通用 `Idempotency-Key` 请求头，也不保证任意写请求的重复提交幂等。**
    后续阶段（波次/确认/导出）按设计单独接入幂等语义；调用方不得假设本阶段的写请求具有
    幂等重放能力。数据库唯一约束带来的重复键错误映射为 409 `conflict`。

    ## 列表分页

    `limit` 默认 20、上限 100；`cursor` 是上一页最后一个实体的十进制 ID。
    `has_more=false` 时 `next_cursor` 为 `null`（实现也可能返回空串）。
    事件快照使用 `after`/`snapshot_cursor` 游标，见 `/api/events`。

    ## 事件流

    `GET /api/events` 返回频道快照（最新一页或 `after` 之后的事件）；
    `GET /api/stream` 返回 SSE。SSE 帧为 `id: <seq>`、`event: <type>`、`data: <Event JSON>`，
    每 20 秒一行心跳注释；游标过旧时发送合成 `event: stream.reset`（无 id、不持久化）。
    事件通道仅允许 `system`、`version:{id}`、`user:{id}`；P0 只发布 `system` 与 `version:{id}`。
    P0 SSE Hub 为单进程内实现，多副本实时 fan-out 属 P7，不在此契约承诺内。

    ## 冻结

    `x-frozen: P0` —— 本文件在 P0 阶段末冻结；后续阶段只能增量修改，破坏性变更需更新本目录
    与决策记录并同步调用方/测试/迁移/handoff。
x-frozen: P0
servers:
  - url: http://localhost:13333
    description: 本地开发默认 API（端口来自 EZTEST_API_PORT，默认 13333）
security:
  - bearerAuth: []
tags:
  - name: Health
    description: 公开存活/就绪探针
  - name: Auth
    description: 登录、登出、当前用户、自助改密
  - name: AdminUsers
    description: 管理员用户管理
  - name: AdminSettings
    description: 系统设置中心
  - name: AdminLLM
    description: LLM 配置与模型目录（P0 只做配置/目录/连通性，不含 chat 网关）
  - name: AdminAudit
    description: 审计日志查询
  - name: Events
    description: 事件快照与 SSE
  - name: Content
    description: 内容对象上传/下载
  - name: Resources
    description: SUT/环境/页面/API/目标库/测试账号/代码仓
  - name: Versions
    description: 版本与多 SUT 绑定

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 存活探针（公开）
      security: []
      responses:
        '200':
          description: 进程存活；固定 `{"status":"ok"}`（不套 data 信封）
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /api/health:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 就绪探针（公开）
      description: DB ping、版本、settings_loaded、executor_url。DB 不可用时返回 503 且 `data.status=degraded`。
      security: []
      responses:
        '200':
          description: 就绪
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
        '503':
          description: DB 不可用（degraded）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 用户名/密码登录（公开）
      description: |
        成功返回明文 token 与过期时间；DB 只存 token 的 SHA-256。错误密码/禁用用户返回 401。
        默认管理员由启动种子创建：`admin` / `admin123`（仅开发/测试受控环境）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 撤销当前 token
      responses:
        '204':
          description: 已登出，无响应体
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: 当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: 自助改密（旧密码 + 新密码）
      description: 新密码 8–128 字符；成功后旧 token 仍有效（P0 不强制重登），审计 `auth.password_changed`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 修改成功，无响应体
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/users:
    get:
      tags: [AdminUsers]
      operationId: listUsers
      summary: 用户列表（admin）
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 用户分页（按 id 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [AdminUsers]
      operationId: createUser
      summary: 创建普通用户（admin）
      description: 只能创建 `role=user`；用户名 `^[a-zA-Z0-9_.-]{3,64}$` 创建后不可改；密码 8–128。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/users/{id}:
    patch:
      tags: [AdminUsers]
      operationId: updateUser
      summary: 更新显示名/状态（admin）
      description: 不允许提升为 admin，不允许禁用唯一 admin。
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/users/{id}/reset-password:
    post:
      tags: [AdminUsers]
      operationId: resetUserPassword
      summary: 重置用户密码（admin）
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: 已重置，无响应体
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/settings:
    get:
      tags: [AdminSettings]
      operationId: listSettings
      summary: 全部设置（admin，secret 掩码）
      description: 返回完整目录（P0 为 44 个键），secret 项的 `value` 固定为 `null`。
      responses:
        '200':
          description: 设置数组（不分页）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Setting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/settings/revisions:
    get:
      tags: [AdminSettings]
      operationId: listSettingRevisions
      summary: 设置变更历史（admin）
      parameters:
        - name: key
          in: query
          required: true
          description: 设置键
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: revision 分页（按 id 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SettingRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/settings/{key}:
    get:
      tags: [AdminSettings]
      operationId: getSetting
      summary: 读取单项设置（admin）
      parameters:
        - $ref: '#/components/parameters/SettingKey'
      responses:
        '200':
          description: 设置项
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Setting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [AdminSettings]
      operationId: updateSetting
      summary: 更新单项设置（admin）
      description: |
        校验 key 存在与类型/区间 → 写 revision → 更新 setting（version+1）→ 失效缓存 →
        发 `settings.updated` 事件 → 审计。更新后立即热加载。
        secret 项：`value` 省略或 `null` 表示不修改，`""` 表示清空；GET/revision 中 secret 值置 `null`。
        `restart_required=true` 只做 UI 提示，不阻断更新。
      parameters:
        - $ref: '#/components/parameters/SettingKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingRequest'
      responses:
        '200':
          description: 更新后的设置项
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Setting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/llm/configs:
    get:
      tags: [AdminLLM]
      operationId: listLLMConfigs
      summary: LLM 配置列表（admin）
      responses:
        '200':
          description: 配置数组（不分页）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LLMConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [AdminLLM]
      operationId: createLLMConfig
      summary: 创建 LLM 配置（admin）
      description: api_key 明文入库、响应只返回 api_key_set；默认配置唯一。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLLMConfigRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LLMConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/llm/configs/{id}:
    get:
      tags: [AdminLLM]
      operationId: getLLMConfig
      summary: LLM 配置详情（admin）
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 配置详情
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LLMConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [AdminLLM]
      operationId: updateLLMConfig
      summary: 更新 LLM 配置（admin）
      description: 省略字段保持不变；`api_key=""` 清空 key。默认配置唯一（互斥切换）。
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLLMConfigRequest'
      responses:
        '200':
          description: 更新后的配置
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LLMConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [AdminLLM]
      operationId: deleteLLMConfig
      summary: 删除 LLM 配置（admin）
      description: 级联删除其模型目录项。
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: 已删除，无响应体
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/llm/configs/{id}/test:
    post:
      tags: [AdminLLM]
      operationId: testLLMConfig
      summary: LLM 连通性测试（admin）
      description: 使用已存配置请求上游（models 或小 chat）；不泄露 key。上游不可达返回 503。
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 测试结果
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LLMTestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/llm/configs/{id}/refresh-models:
    post:
      tags: [AdminLLM]
      operationId: refreshLLMModels
      summary: 拉取并覆盖模型目录（admin）
      description: 调用上游 `GET {base_url}/models`，按 `(config_id, model)` upsert；失败 503 且不写库。
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 该配置的最新模型目录
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LLMModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/llm/configs/{id}/models:
    post:
      tags: [AdminLLM]
      operationId: addLLMModel
      summary: 手工新增模型（admin）
      description: source=manual；同一配置下 model 唯一。
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLLMModelRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LLMModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/llm/configs/{id}/models/{modelId}:
    delete:
      tags: [AdminLLM]
      operationId: deleteLLMModel
      summary: 删除模型（admin）
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/ModelID'
      responses:
        '204':
          description: 已删除，无响应体
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/llm/models:
    get:
      tags: [AdminLLM]
      operationId: listLLMModels
      summary: 全部模型（admin）
      responses:
        '200':
          description: 模型数组（不分页）
          content:
