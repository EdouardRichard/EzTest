      description: |
        1–20 个 binding；`sut_id` 不重复；环境/页面/API 必须属于同一 SUT+环境；页面/API ID 去重且保留排序；
        库/账号属于该 SUT+环境；仓库必须存在。校验失败 400 并返回 `details.field`。
        创建即 `initial`，事件 `version.created` 同时发到 `system` 与 `version:{id}`。
