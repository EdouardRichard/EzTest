components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 不透明 token（`ezt_` + base64url），固定 7 天 TTL。
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: 上一页最后一个实体的十进制 ID；省略表示第一页
      schema:
        type: string
        pattern: '^[0-9]+$'
    ID:
      name: id
      in: path
      required: true
      description: 业务实体雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    ModelID:
      name: modelId
      in: path
      required: true
      description: 模型实体 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    SettingKey:
      name: key
      in: path
      required: true
      description: 设置键（如 `execution.global_concurrency`）
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]+$'
    SHA256:
      name: sha256
      in: path
      required: true
      description: 内容 SHA-256（64 位小写 hex）
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    EventChannel:
      name: channel
      in: query
      required: true
      description: 事件频道；只允许 system / version:{id} / user:{id}
      schema:
        type: string
        pattern: '^(system|version:[1-9][0-9]*|user:[1-9][0-9]*)$'
    EventAfter:
      name: after
      in: query
      required: false
      description: 事件游标（频道内 seq）；省略/0 表示取最新一页（快照）或从当前末尾实时（SSE）
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: SSE 断线续传游标；存在时优先于 `after` 查询参数
      schema:
        type: integer
        format: int64
        minimum: 0
  responses:
    BadRequest:
      description: 请求参数/请求体校验失败（invalid_argument）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未认证或 token 无效/过期（unauthenticated）
      headers:
        WWW-Authenticate:
          schema:
            type: string
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 权限不足（forbidden）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 实体不存在（not_found）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 唯一约束/状态冲突（conflict / state_conflict）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: 依赖暂时不可用（unavailable，retryable=true）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: 服务端错误（internal）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              type: string
              description: invalid_argument / unauthenticated / forbidden / not_found / conflict / state_conflict / unavailable / internal
            message:
              type: string
            request_id:
              type: string
              description: 与响应头 X-Request-ID 相同
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
              description: '结构化细节；字段错误通常为 {"field": "..."}'
    ListEnvelope:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {}
        next_cursor:
          type: string
          nullable: true
          description: 下一页游标（实体 ID 十进制字符串）；has_more=false 时为 null 或空串
        has_more:
          type: boolean
    HealthData:
      type: object
      required: [status, version, db, settings_loaded, executor_url]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        db:
          type: string
          enum: [ok, down]
        settings_loaded:
          type: boolean
        executor_url:
          type: string
    User:
      type: object
      required: [id, username, display_name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: 明文 token（仅登录响应返回一次）
        expires_at:
          type: string
          format: date-time
          description: 固定 7 天 TTL
        user:
          $ref: '#/components/schemas/User'
    Setting:
      type: object
      required: [key, category, type, value, is_secret, restart_required, description, version, updated_at]
      properties:
        key:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [string, number, boolean, json]
        value:
          nullable: true
          description: 非 secret 为 JSON 值；secret 固定为 null
        is_secret:
          type: boolean
        restart_required:
          type: boolean
        description:
          type: string
        version:
          type: integer
        updated_at:
          type: string
          format: date-time
    SettingRevision:
      type: object
      required: [id, key, created_at]
      properties:
        id:
          type: string
        key:
          type: string
        old_value:
          nullable: true
          description: secret 项为 null
        new_value:
          nullable: true
          description: secret 项为 null
        actor_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    LLMConfig:
      type: object
      required: [id, name, provider, protocol, base_url, api_key_set, headers, timeout_seconds, max_retries, is_default, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
          description: P0 默认 openai（字段保留）
        protocol:
          type: string
          enum: [openai, openai_compatible]
        base_url:
          type: string
          format: uri
        api_key_set:
          type: boolean
          description: 是否已配置 API key；明文 key 永不返回
        headers:
          type: object
          additionalProperties:
            type: string
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 600
        max_retries:
          type: integer
          minimum: 0
          maximum: 10
        is_default:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        created_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LLMModel:
      type: object
      required: [id, config_id, model, display_name, context_window, max_output, supports_tools, supports_vision, source, status, created_at, updated_at]
      properties:
        id:
