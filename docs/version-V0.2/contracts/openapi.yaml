      tags: [Content]
      operationId: downloadContent
      summary: 下载内容对象（登录用户）
      description: 校验 64 位小写 hex；读取时校验文件 SHA 与 DB 一致。响应不暴露文件系统路径。
      parameters:
        - $ref: '#/components/parameters/SHA256'
      responses:
        '200':
