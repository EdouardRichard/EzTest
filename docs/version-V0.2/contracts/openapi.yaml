        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/case-runs/{caseRunId}/pause:
    post:
      tags: [Execution]
      operationId: pauseCaseRun
      summary: 用例级暂停（immediate）
      description: pending→paused（不派发）；running→立即取消并 paused（保留已完成结果）；已暂停返回 200 当前值。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/CaseRunID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseCaseRunRequest'
      responses:
        '200':
          description: 暂停后的用例结果
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CaseRunView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/case-runs/{caseRunId}/resume:
    post:
      tags: [Execution]
      operationId: resumeCaseRun
      summary: 用例级恢复
      description: paused→pending（attempts 不变、dispatch_epoch+1），由调度器重新派发；存在 open human request 返回 409。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/CaseRunID'
      responses:
        '200':
          description: 恢复后的用例结果
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CaseRunView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/evidence:
    get:
      tags: [Evidence]
      operationId: listEvidence
      summary: 证据列表（按 case_run/version_sut/kind 过滤，倒序）
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/EvidenceCaseRunFilter'
        - $ref: '#/components/parameters/EvidenceVersionSUTFilter'
        - $ref: '#/components/parameters/EvidenceKindFilter'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 证据列表（元数据，不含字节/路径）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EvidenceView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/evidence/{evidenceId}:
    get:
      tags: [Evidence]
      operationId: getEvidence
      summary: 证据元数据
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/EvidenceID'
      responses:
        '200':
          description: 证据元数据
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EvidenceView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/evidence/{evidenceId}/content:
    get:
      tags: [Evidence]
      operationId: downloadEvidence
      summary: 鉴权下载证据字节
      description: |
        校验 `case_run → wave → version` 归属；读取 P0 内容账本字节并重算 sha256/大小，与 evidence 行不一致
        返回 409 `state_conflict`（拒绝下载）。`Content-Disposition` 使用清洗后的 filename；不暴露存储路径。
        证据不可变，无更新/删除端点；超过 `execution.evidence_max_bytes`（5 MiB）的采集在写入侧返回
        `evidence_too_large`，不会出现在本端点。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/EvidenceID'
      responses:
        '200':
          description: 证据字节
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 证据字节与 sha256/size 不一致（state_conflict，拒绝下载）
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/human-requests:
    get:
      tags: [HumanRequests]
      operationId: listHumanRequests
      summary: 人机请求列表（status 过滤，倒序）
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/HumanRequestStatusFilter'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 人机请求列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/HumanRequestView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/human-requests/{humanRequestId}/resolve:
    post:
      tags: [HumanRequests]
      operationId: resolveHumanRequest
      summary: 完成人机请求（任意登录用户）
      description: |
        只允许 `open`；写 response/resolved_by/at 并触发恢复：case_run→pending（attempts 不变、dispatch_epoch+1）、
        wave→running（仅当 pause_reason=waiting_human 且无其他 open human request）。
        P3 响应不回显 `code`；非 open 返回 409 `state_conflict`。
      parameters:
        - $ref: '#/components/parameters/HumanRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveHumanRequestRequest'
      responses:
        '200':
          description: resolve 后的人机请求
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HumanRequestView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/human-requests/{humanRequestId}/cancel:
    post:
      tags: [HumanRequests]
      operationId: cancelHumanRequest
      summary: 取消人机请求（放弃该用例）
      description: open→cancelled，对应 case_run 置 failed(session)、reason=human_cancelled；已 cancelled 幂等 200，resolved/expired 返回 409。
      parameters:
        - $ref: '#/components/parameters/HumanRequestID'
      responses:
        '200':
          description: 取消后的人机请求
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HumanRequestView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/admin/executors:
    get:
      tags: [Execution]
      operationId: listExecutors
      summary: 执行器实例列表（admin）
      description: P3 只有一个 endpoint；返回注册/心跳投影，不含 token/token_hash。执行器不可达时 `executor_unavailable`（503）只影响派发，不影响本列表。
      responses:
        '200':
          description: 执行器列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExecutorView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /api/admin/executors/{executorId}/drain:
    post:
      tags: [Execution]
      operationId: drainExecutor
      summary: 摘流执行器（admin；不影响执行器进程）
      description: active→draining，停止新派发，在飞 case_run 继续；已 draining 幂等 200。
      parameters:
        - $ref: '#/components/parameters/ExecutorID'
      responses:
        '200':
          description: 摘流后的执行器
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ExecutorView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/admin/executors/{executorId}/activate:
    post:
      tags: [Execution]
      operationId: activateExecutor
      summary: 恢复执行器（admin；draining/offline→active）
      parameters:
        - $ref: '#/components/parameters/ExecutorID'
      responses:
        '200':
          description: 恢复后的执行器
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ExecutorView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 不透明 token（`ezt_` + base64url），固定 7 天 TTL。
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: 上一页最后一个实体的十进制 ID；省略表示第一页
      schema:
        type: string
        pattern: '^[0-9]+$'
    ID:
      name: id
      in: path
      required: true
      description: 业务实体雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    ModelID:
      name: modelId
      in: path
      required: true
      description: 模型实体 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    SettingKey:
      name: key
      in: path
      required: true
      description: 设置键（如 `execution.global_concurrency`）
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]+$'
    SHA256:
      name: sha256
      in: path
      required: true
      description: 内容 SHA-256（64 位小写 hex）
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    EventChannel:
      name: channel
      in: query
      required: true
      description: 事件频道；只允许 system / version:{id} / user:{id}
      schema:
        type: string
        pattern: '^(system|version:[1-9][0-9]*|user:[1-9][0-9]*)$'
    EventAfter:
      name: after
      in: query
      required: false
      description: 事件游标（频道内 seq）；省略/0 表示取最新一页（快照）或从当前末尾实时（SSE）
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: SSE 断线续传游标；存在时优先于 `after` 查询参数
      schema:
        type: integer
        format: int64
        minimum: 0
    CID:
      name: cid
      in: path
      required: true
      description: 对话（conversation）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    RID:
      name: rid
      in: path
      required: true
      description: 需求（requirement）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    Team:
      name: team
      in: path
      required: true
      description: 团队频道；P1 只读，澄清团队为 `clarification`
      schema:
        type: string
        enum: [clarification, design, execution, delivery, steward]
    ConversationKind:
      name: kind
      in: query
      required: false
      description: 对话类型过滤；P1 只产生 clarification
      schema:
        type: string
        enum: [clarification, design]
    RequirementStatusFilter:
      name: status
      in: query
      required: false
      description: 需求状态过滤
      schema:
        type: string
        enum: [draft, clarified, closed, obsolete]
    Before:
      name: before
      in: query
      required: false
      description: 上一页最后一个实体的十进制 ID（按 id 倒序分页）；省略表示第一页
      schema:
        type: string
        pattern: '^[0-9]+$'
    MessageAfter:
      name: after
      in: query
      required: false
      description: 消息 ID 游标；只返回 id 大于该值的消息（升序）；省略从最早消息开始
      schema:
        type: string
        pattern: '^[0-9]+$'
    MessageLimit:
      name: limit
      in: query
      required: false
      description: 每页消息数（默认 100，最大 200）
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    IntentID:
      name: intentId
      in: path
      required: true
      description: 执行意图（execution_intent）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    WaveID:
      name: waveId
      in: path
      required: true
      description: 波次（run_wave）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    CaseRunID:
      name: caseRunId
      in: path
      required: true
      description: 用例结果（case_run）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    EvidenceID:
      name: evidenceId
      in: path
      required: true
      description: 证据（evidence）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    HumanRequestID:
      name: humanRequestId
      in: path
      required: true
      description: 人机请求（human_request）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    ExecutorID:
      name: executorId
      in: path
      required: true
      description: 执行器实例（executor_instance）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    IntentStatusFilter:
      name: status
      in: query
      required: false
      description: intent 状态过滤
      schema:
        type: string
        enum: [open, claimed, running, done, failed, cancelled, superseded]
    WaveStatusFilter:
      name: status
      in: query
      required: false
      description: 波次状态过滤
      schema:
        type: string
        enum: [planned, running, paused, done, failed, cancelled]
    CaseRunStatusFilter:
      name: status
      in: query
      required: false
      description: case_run 状态过滤（四态 + 过程态）
      schema:
        type: string
        enum: [pending, running, paused, passed, failed, blocked, inconclusive, skipped, interrupted, superseded]
    EvidenceCaseRunFilter:
      name: case_run_id
      in: query
      required: false
      description: 按 case_run 过滤证据（十进制字符串）
      schema:
        type: string
        pattern: '^[0-9]+$'
    EvidenceVersionSUTFilter:
      name: version_sut_id
      in: query
      required: false
      description: 按 version_sut 过滤证据（十进制字符串）
      schema:
        type: string
        pattern: '^[0-9]+$'
    EvidenceKindFilter:
      name: kind
      in: query
      required: false
      description: 证据类型过滤
      schema:
        type: string
        enum: [screenshot, snapshot, console, network, http, db, download, text]
    HumanRequestStatusFilter:
      name: status
      in: query
      required: false
      description: 人机请求状态过滤
      schema:
        type: string
        enum: [open, resolved, cancelled, expired]
  responses:
    BadRequest:
      description: 请求参数/请求体校验失败（invalid_argument）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未认证或 token 无效/过期（unauthenticated）
      headers:
        WWW-Authenticate:
          schema:
            type: string
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 权限不足（forbidden）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 实体不存在（not_found）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 唯一约束/状态冲突（conflict / state_conflict / lease_lost）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: 依赖暂时不可用（unavailable / ai_unavailable / context_overflow / executor_unavailable，retryable=true）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: 服务端错误（internal）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              type: string
              description: invalid_argument / unauthenticated / forbidden / not_found / conflict / state_conflict / lease_lost / ai_unavailable / context_overflow / unsupported_attachment_format / extraction_failed / evidence_too_large / executor_unavailable / unavailable / internal
            message:
              type: string
            request_id:
              type: string
              description: 与响应头 X-Request-ID 相同
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
              description: '结构化细节；字段错误通常为 {"field": "..."}；P1 可能带 requirement_id / attachment_id 便于 UI 定位'
    ListEnvelope:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {}
        next_cursor:
          type: string
          nullable: true
          description: 下一页游标（实体 ID 十进制字符串）；has_more=false 时为 null 或空串
        has_more:
          type: boolean
    HealthData:
      type: object
      required: [status, version, db, settings_loaded, executor_url]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        db:
          type: string
          enum: [ok, down]
        settings_loaded:
          type: boolean
        executor_url:
          type: string
    User:
      type: object
      required: [id, username, display_name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: 明文 token（仅登录响应返回一次）
        expires_at:
          type: string
          format: date-time
          description: 固定 7 天 TTL
        user:
          $ref: '#/components/schemas/User'
    Setting:
      type: object
      required: [key, category, type, value, is_secret, restart_required, description, version, updated_at]
      properties:
        key:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [string, number, boolean, json]
        value:
          nullable: true
          description: 非 secret 为 JSON 值；secret 固定为 null
        is_secret:
          type: boolean
        restart_required:
          type: boolean
        description:
          type: string
        version:
          type: integer
        updated_at:
          type: string
          format: date-time
    SettingRevision:
      type: object
      required: [id, key, created_at]
      properties:
        id:
          type: string
        key:
          type: string
        old_value:
          nullable: true
          description: secret 项为 null
        new_value:
          nullable: true
          description: secret 项为 null
        actor_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    LLMConfig:
      type: object
      required: [id, name, provider, protocol, base_url, api_key_set, headers, timeout_seconds, max_retries, is_default, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
          description: P0 默认 openai（字段保留）
        protocol:
          type: string
          enum: [openai, openai_compatible]
        base_url:
          type: string
          format: uri
        api_key_set:
          type: boolean
          description: 是否已配置 API key；明文 key 永不返回
        headers:
          type: object
          additionalProperties:
            type: string
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 600
        max_retries:
          type: integer
          minimum: 0
          maximum: 10
        is_default:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        created_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LLMModel:
      type: object
      required: [id, config_id, model, display_name, context_window, max_output, supports_tools, supports_vision, source, status, created_at, updated_at]
      properties:
        id:
          type: string
        config_id:
          type: string
        model:
          type: string
        display_name:
          type: string
        context_window:
          type: integer
          minimum: 0
        max_output:
          type: integer
          minimum: 0
        supports_tools:
          type: boolean
        supports_vision:
          type: boolean
        source:
          type: string
          enum: [catalog, manual]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RemoteModel:
      type: object
      required: [id]
      properties:
        id:
          type: string
        context_window:
          type: integer
          minimum: 0
        max_output:
          type: integer
          minimum: 0
        supports_tools:
          type: boolean
        supports_vision:
          type: boolean
    LLMTestResult:
      type: object
      required: [ok, latency_ms, models]
      properties:
        ok:
          type: boolean
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        models:
          type: array
          items:
            $ref: '#/components/schemas/RemoteModel'
        error:
          type: string
          description: 失败摘要（不包含 key）；成功时省略
    AuditLogEntry:
      type: object
      required: [id, action, target_kind, target_id, request_id, ip, user_agent, metadata, created_at]
      properties:
        id:
          type: string
        actor_id:
          type: string
        action:
          type: string
        target_kind:
          type: string
        target_id:
          type: string
        request_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    Event:
      type: object
      required: [seq, channel, type, scope, payload, created_at]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: 频道内事件顺序号（不是业务实体 ID）；SSE id 即该值
        channel:
          type: string
          description: system / version:{id} / user:{id}
        type:
          type: string
          description: 事件类型，见 contracts/events.md
        scope:
          type: object
          additionalProperties: true
          description: 作用域 ID（字符串），如 {"version_id":"1001"}
        payload:
          type: object
          additionalProperties: true
          description: 事件负载；永不含密码/token/API key
        actor_id:
          type: string
          nullable: true
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
    EventSnapshotEnvelope:
      type: object
      required: [data, snapshot_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        snapshot_cursor:
          type: integer
          format: int64
          minimum: 0
          description: 请求时刻该频道最新 seq（不是业务实体 ID）
        has_more:
          type: boolean
    ContentObject:
      type: object
      required: [sha256, size, mime, url]
      properties:
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        size:
          type: integer
          format: int64
          minimum: 0
        mime:
          type: string
        url:
          type: string
          description: 下载路径，如 /api/content/{sha256}
    SUT:
      type: object
      required: [id, name, intro, environments, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        intro:
          type: string
        environments:
          type: array
          items:
            $ref: '#/components/schemas/Environment'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Environment:
      type: object
      required: [id, sut_id, name, base_url, is_default, status, pages, apis, databases, accounts, created_at, updated_at]
      properties:
        id:
          type: string
        sut_id:
          type: string
        name:
          type: string
        base_url:
          type: string
          format: uri
        is_default:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
        apis:
          type: array
          items:
            $ref: '#/components/schemas/SutApi'
        databases:
          type: array
          items:
            $ref: '#/components/schemas/TargetDatabase'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/TestAccount'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Page:
      type: object
      required: [id, sut_id, environment_id, name, url, route_template, page_type, auth_role, module, status, source, created_at, updated_at]
      properties:
        id:
          type: string
        sut_id:
          type: string
        environment_id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        route_template:
          type: string
        page_type:
          type: string
        auth_role:
          type: string
        module:
          type: string
        status:
          type: string
          enum: [approved, proposed, rejected]
        source:
          type: string
          enum: [admin, ai, import]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SutApi:
      type: object
      required: [id, sut_id, environment_id, method, path_template, name, auth_role, source, status, schema_ref, created_at, updated_at]
      properties:
        id:
          type: string
        sut_id:
          type: string
        environment_id:
          type: string
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        path_template:
          type: string
        name:
          type: string
        auth_role:
          type: string
        source:
          type: string
          enum: [code, openapi, ai, manual, import]
        status:
          type: string
          enum: [approved, proposed, rejected]
        schema_ref:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TargetDatabase:
      type: object
      required: [id, sut_id, environment_id, name, dsn, username, password_set, read_only, status, created_at, updated_at]
      properties:
        id:
          type: string
        sut_id:
          type: string
        environment_id:
          type: string
        name:
          type: string
        dsn:
          type: string
        username:
          type: string
        password_set:
          type: boolean
          description: 密码永不返回，只返回是否已设置
        read_only:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TestAccount:
      type: object
      required: [id, sut_id, environment_id, username, roles, notes, password_set, status, created_at, updated_at]
      properties:
        id:
          type: string
        sut_id:
          type: string
        environment_id:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        notes:
          type: string
        password_set:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CodeRepository:
      type: object
      required: [id, name, path, branch, include, exclude, created_by, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        branch:
          type: string
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        created_by:
          type: string
          description: 创建者用户 ID（与 created_at 同源；P0 CodeRepositoryView 的字段）
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Catalog:
      type: object
      required: [suts, repositories]
      properties:
        suts:
          type: array
          items:
            $ref: '#/components/schemas/SUT'
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/CodeRepository'
    VersionSummary:
      type: object
      required: [id, title, status, sut_count, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [initial, running, completed]
        sut_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Version:
      type: object
      required: [id, title, status, auto_design_new_requirements, bindings, created_by, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [initial, running, completed]
        auto_design_new_requirements:
          type: boolean
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/Binding'
        requirement_counts:
          $ref: '#/components/schemas/RequirementCounts'
        conversation_count:
          type: integer
          minimum: 0
          description: 版本下对话总数（P1 增量）
        pending_design_count:
          type: integer
          minimum: 0
          description: 已澄清且未进入 active design_scope 的需求数（P2 替换 P1 占位）
        case_counts:
          $ref: '#/components/schemas/CaseCounts'
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Binding:
      type: object
      required: [id, sut, environment, pages, apis, databases, accounts]
      properties:
        id:
          type: string
        sut:
          $ref: '#/components/schemas/SUT'
        environment:
          $ref: '#/components/schemas/Environment'
        repository:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CodeRepository'
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
        apis:
          type: array
          items:
            $ref: '#/components/schemas/SutApi'
        databases:
          type: array
          items:
            $ref: '#/components/schemas/TargetDatabase'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/TestAccount'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 128
    CreateUserRequest:
      type: object
      required: [username, display_name, password]
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9_.-]{3,64}$'
        display_name:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
    UpdateUserRequest:
      type: object
      properties:
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled]
    ResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          description: 管理端重置密码；与实现一致（POST /api/admin/users/{id}/reset-password）
    UpdateSettingRequest:
      type: object
      required: [value]
      properties:
        value:
          description: 新值；P0 目录没有 secret 键，null 被 400 拒绝；空串表示清空字符串
    CreateLLMConfigRequest:
      type: object
      required: [name, base_url]
      properties:
        name:
          type: string
          maxLength: 100
        provider:
          type: string
          default: openai
        protocol:
          type: string
          enum: [openai, openai_compatible]
          default: openai
        base_url:
          type: string
          format: uri
        api_key:
          type: string
          description: 写入值；永不回显
        headers:
          type: object
          additionalProperties:
            type: string
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 600
          default: 60
        max_retries:
          type: integer
          minimum: 0
          maximum: 10
          default: 2
        is_default:
          type: boolean
          default: false
        status:
          type: string
          enum: [active, disabled]
          default: active
    UpdateLLMConfigRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        provider:
          type: string
        protocol:
          type: string
          enum: [openai, openai_compatible]
        base_url:
          type: string
          format: uri
