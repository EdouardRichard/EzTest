        '200':
          description: The updated question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationQuestionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
