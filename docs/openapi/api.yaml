    Access:
      type: object
      description: |
        An account's login configuration for one system. The stored credential
        is write-only: it is never returned, only `credentialSet` reports
        whether one is stored.
      required:
        - id
        - accountId
        - systemId
        - authType
        - credentialSet
        - usernameOverride
        - loginUrl
        - enabled
        - concurrencyLimit
        - sessionTtlSeconds
        - permissionNote
      properties:
        id:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        systemId:
          type: integer
          format: int64
        authType:
          type: string
          enum: [password, sso, token, apikey, basic, manual]
        credentialSet:
          type: boolean
          description: True when a credential is stored. The value itself is never returned.
        usernameOverride:
          type: string
        loginUrl:
          type: string
        enabled:
          type: boolean
        concurrencyLimit:
          type: integer
          minimum: 1
          maximum: 100
        sessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          nullable: true
          description: Overrides the system default when present.
        permissionNote:
          type: string
    AccessEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Access'
    AccessList:
      type: object
      description: Unpaginated access list; the array is always present.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Access'
    Snapshot:
      type: object
      description: An immutable record of one login_check or manual confirmation.
      required:
        - id
        - sessionId
        - kind
        - items
        - summary
        - permissionHash
        - degraded
        - capturedAt
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        kind:
          type: string
          enum: [login]
        items:
          type: object
          additionalProperties: true
        summary:
          type: object
          additionalProperties: true
        permissionHash:
          type: string
        degraded:
          type: boolean
        capturedAt:
          type: string
          format: date-time
    Lease:
      type: object
      description: |
        The active application-level lease of a session. Leases have no route
        of their own; the active one is embedded in a session detail.
      required: [id, holder, acquiredAt, expiresAt]
      properties:
        id:
          type: integer
          format: int64
        holder:
          type: string
        acquiredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Takeover:
      type: object
      required:
        - id
        - sessionId
        - accountId
        - systemId
        - environmentId
        - reason
        - status
        - instructions
        - requestedBy
        - requestedAt
        - expiresAt
        - completedAt
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
          nullable: true
        accountId:
          type: integer
          format: int64
        systemId:
          type: integer
          format: int64
        environmentId:
          type: integer
          format: int64
        reason:
          type: string
          enum: [mfa, captcha, approval, login_unknown, other]
        status:
          type: string
          enum: [waiting, completed, cancelled, expired]
        instructions:
          type: object
          additionalProperties: true
        requestedBy:
          type: integer
          format: int64
          nullable: true
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    TakeoverEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Takeover'
    TakeoverList:
      type: object
      required: [data, next_cursor, has_more]
