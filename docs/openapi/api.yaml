  /api/versions/{id}/case-runs/{caseRunId}/replay:
    post:
      tags: [Execution]
      operationId: replayCaseRun
      summary: 命令日志重放校验（v0.2.4-C/T20，EV-006；重放≠复测）
      description: |
        对一个**终态** case_run 触发服务端命令日志重放：同环境指纹 + workspace 快照下按序重执行
        录制的命令，逐命令比对 exit/stdio 摘要/outcome，断言由服务端重新校验（P2 判定层不变）。
        重放是**校验**而非复测（retest）：不产生新的 issue 候选，不改变源 run 的终态；重放结果写入
        一个 superseded 的重放 anchor run 并发布 `case_run.replayed` 事件。录像级重放延期 0.3+。
        指纹含证据版本（宪法四.6）。typed 409：`replay_not_terminal`（源非终态）、
        `replay_no_command_log`（无命令证据）、`replay_unsupported_command_log`（多会话/不可重放日志）、
        `replay_corrupt_command_log`（日志损坏）、`replay_fingerprint_changed`（指纹变化，拒绝重放）。
        未配置重放面时 503。
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/CaseRunID'
      responses:
        '200':
          description: 服务端校验的重放结果
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ReplayResultView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

