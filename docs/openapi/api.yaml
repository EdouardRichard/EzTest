      operationId: search
      summary: 跨实体搜索（版本/需求/用例/问题/报告）
      description: |
        `q` trim 后必填 1–100；`types` 省略=5 类，未知值 400；`limit` 为每类型上限，总上限 100。
        每类 1 条只读查询（总 ≤5 SQL），按 `updated_at DESC, id DESC`。任一 Provider 失败该组为空 +
        `degraded=true`；全失败 200 空 groups + degraded=true（不 5xx）。不返回知识/证据正文/凭据/
        prompt/transcript。`url` 由服务端按 0.2 8 Tab 生成深链。
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchTypes'
