  /api/versions/{id}/clarification/messages:
    get:
      tags: [versions]
      summary: Read the clarification conversation
      description: |
        The persisted P1 `agent_messages` projection, oldest first, with
        `role=system` messages filtered out. `before_id` is a P1 message ID
        (integer), not a P3 snowflake string. `next_cursor` is a decimal string
