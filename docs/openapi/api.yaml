    post:
      tags: [Design]
      operationId: overrideDesignJudgment
      summary: 人工决断：override 裁判升级用例（仅 admin）
      description: |
        v0.2.4-E（spec SC-E5，T16）。对裁判审查升级的用例做人工决断：仅当 ①当前版本的最新
        裁判事实为 fail 且打回预算耗尽（condition=`fail_exhausted`）或 ②当前版本存在
        judge_exhausted 升级事实（condition=`judge_exhausted`）时可调用；否则 409
        `state_conflict`。写 append-only `design_judgment_override` 审计行（绑当前
        case_version_id + content_hash；judgment_id 在条件①时指向被 override 的事实，
        条件②可空），**不修改裁判事实**。新修订产生后旧 override 因版本/内容不匹配失效；
        override 须晚于最新裁判事实才解锁确认。override 后确认仍走 Confirm（人工触发）。
        body `{reason}` 必填（trim 后 1..2000 字符）。非 admin 403。
      parameters:
        - $ref: '#/components/parameters/ID'
