      summary: run 活动事实台账（admin-only，v0.2.4-D）
      description: |
        返回该 run 的 `agent_activity` 事实行（工具调用与压缩边界，`(run_id, seq)` 幂等），
        按 seq 升序、**无分页**。**仅 admin**（普通登录用户 403 `forbidden`，未登录 401；
        id 非正整数 400）。事实独立于事件：事件丢失不影响台账完整性；`agent.activity` 事件的
        `activity_seq` + `run_id` 可定位到这里的具体行。未知 run 返回空数组（不是 404）。
        读取服务未装配时 503 `unavailable`。与 transcript 是两条独立路径（R-D6）：
        本端点不读 `agent_message`，不经过 `run:{id}` 频道。
      parameters:
