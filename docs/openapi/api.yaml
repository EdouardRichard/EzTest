  /api/versions/{id}/discovery/observations:
    get:
      tags: [Execution]
      operationId: listDiscoveryObservations
      summary: 执行期探索观测列表（API-36）
      description: |
        R-EX-5 / DB-29。只读返回该版本在执行过程中采集到的页面/API 观测
        （归一化后的 `resource_template`，不含 query 值/header/cookie/body）。
        `kind` 仅允许 `page|api`，`decision` 仅允许
        `new|proposed|approved|rejected|out_of_scope`；`wave_id` 为可选规范十进制
        ID（仅数字、无符号、无前导零），且必须属于该版本，否则 404。
        `limit` 默认 50；显式数值越界会 clamp 到 1..200（非数字 400）。
        排序为 `first_seen_at` 降序、`id` 降序；`count` 是本页返回条数。
        所有 ID 字段为十进制字符串；可空的来源列（wave/case_run/environment/
        resource/fact）返回 `null` 而不是伪造 id。`source_kind`、
        `created_at`、`updated_at` 一并返回；fingerprint 仅存 DB，不对外暴露。
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: kind
          in: query
          required: false
          description: 观测类型；缺省表示全部
          schema:
            type: string
            enum: [page, api]
        - name: decision
          in: query
          required: false
          description: 五类决策过滤；缺省表示全部
          schema:
            type: string
            enum: [new, proposed, approved, rejected, out_of_scope]
        - name: wave_id
          in: query
          required: false
          description: 波次雪花 ID 的规范十进制字符串（无符号、无前导零），必须属于该版本
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
        - name: limit
          in: query
          required: false
          description: 页大小；默认 50，数值越界 clamp 到 1..200，非数字 400
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: 观测列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items, count]
                    properties:
                      count:
                        type: integer
                        description: 本页返回条数
                      items:
                        type: array
                        items:
                          type: object
                          required:
