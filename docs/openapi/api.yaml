servers:
  - url: http://localhost:13333
    description: 本地开发默认 API（端口来自 EZTEST_API_PORT，默认 13333）
security:
  - bearerAuth: []
tags:
  - name: Health
    description: 公开存活/就绪探针
  - name: Auth
    description: 登录、登出、当前用户、自助改密
  - name: AdminUsers
    description: 管理员用户管理
  - name: AdminSettings
    description: 系统设置中心
  - name: AdminLLM
    description: LLM 配置与模型目录（P0 只做配置/目录/连通性，不含 chat 网关）
  - name: AdminAudit
    description: 审计日志查询
  - name: Events
    description: 事件快照与 SSE
  - name: Content
    description: 内容对象上传/下载
  - name: Resources
    description: SUT/环境/页面/API/目标库/测试账号/代码仓
  - name: Versions
    description: 版本与多 SUT 绑定
  - name: Conversations
    description: 澄清对话、消息与摘要（P1）
  - name: Requirements
    description: 需求版本、确认、回退与关系（P1）
  - name: Clarification
    description: 澄清团队频道只读摘要/帖子（P1）
  - name: Design
    description: 用例设计图、用例详情与三粒度确认（P2）
  - name: Exports
    description: 用例导出与鉴权下载（P2）
  - name: Execution
    description: 执行意图、波次、用例结果与执行器管理（P3）
  - name: Evidence
    description: 证据元数据与鉴权下载（P3，不可变）
  - name: HumanRequests
    description: 登录接管/人机请求（P3）
  - name: Delivery
    description: 版本内问题与报告（P4；报告 HTML 以内容账本为权威）
  - name: Chain
    description: 版本探索链路只读读模型（P4；预算/截断/两档回放）
  - name: Code
    description: 代码索引/树/文件/diff/事实/分析/影响/锚点/复核/页面 API 提议（P5）
  - name: Quality
    description: 质量指标只读聚合与评测（P6 运营指标/评测 run）
  - name: Search
    description: 跨实体搜索（P6；登录只读、5 类分组、降级）
  - name: Workspace
    description: 全局待办快照（P6；登录只读、6 kind、权限过滤）
  - name: AgentCenter
    description: Agent 目录/运行观察/质量投影与 profile、提示词配置（P6；读登录、写 admin）
  - name: Knowledge
    description: 跨版本知识列表/详情/审核/历史（P7；读与草案写登录，审核 admin）
  - name: Admin
    description: 管理员运维：GC run 与 API 实例注册表（P7）
  - name: Internal
    description: 执行器内部注册/心跳（P7；非用户 API，Bearer execution.executor_token）
  - name: LLM
    description: 公开模型目录（0.2.1；仅启用配置/模型，含 capabilities 与默认模型）
  - name: Jobs
    description: 作业进度/取消/重试（0.2.1；job 是 work_item 的用户投影，jobId = work_item.id）

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 存活探针（公开）
      security: []
      responses:
        '200':
          description: 进程存活；固定 `{"status":"ok"}`（不套 data 信封）
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /api/health:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 就绪探针（公开）
      description: DB ping、版本、settings_loaded、executor_url。DB 不可用时返回 503 且 `data.status=degraded`。
      security: []
      responses:
        '200':
          description: 就绪
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
        '503':
          description: DB 不可用（degraded）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 用户名/密码登录（公开）
      description: |
        成功返回明文 token 与过期时间；DB 只存 token 的 SHA-256。错误密码/禁用用户返回 401。
        默认管理员由启动种子创建：`admin` / `[REDACTED]`（仅开发/测试受控环境）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 撤销当前 token
      responses:
        '204':
          description: 已登出，无响应体
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: 当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: 自助改密（旧密码 + 新密码）
      description: 新密码 8–128 字符；成功后旧 token 仍有效（P0 不强制重登），审计 `auth.password_changed`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 修改成功，无响应体
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/users:
    get:
      tags: [AdminUsers]
      operationId: listUsers
      summary: 用户列表（admin）
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 用户分页（按 id 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [AdminUsers]
      operationId: createUser
      summary: 创建普通用户（admin）
      description: 只能创建 `role=user`；用户名 `^[a-zA-Z0-9_.-]{3,64}$` 创建后不可改；密码 8–128。
      requestBody:
        required: true
