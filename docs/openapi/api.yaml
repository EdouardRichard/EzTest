      description: |
        DB ping + 共享存储写探针 + 本实例非 draining；全部通过 200，否则 503。
        响应固定 `{"data":{status,database,storage,draining,instance_id,inflight_requests,inflight_work}}`；
        `database`/`storage` 失败值为 `down`，`status` 为 `degraded`。
      security: []
      responses:
        '200':
          description: 就绪
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ReadinessView'
        '503':
          description: 未就绪（degraded）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ReadinessView'

  /api/versions/{versionId}/reports/{reportId}/revisions/{revision}/pdf:
    get:
      tags: [Delivery]
      operationId: downloadReportPDF
      summary: 鉴权下载报告 PDF（独立 renderer 生成）
      description: |
        校验版本归属、revision 属于 report、`status='published' AND render_status='done'`；
        `pdf_status='done'` 且 `pdf_ref` 非空后按内容账本
        （`owner_kind='report_revision'`、`role='report_pdf'`）读取并校验 sha256/size/`%PDF-`
        魔数；返回 PDF 字节与 ETag（sha256）。404：revision 不存在/未发布/disabled/PDF 缺失；
        409：`pdf_not_ready`（pending/running）或 `pdf_failed`（failed）；内容校验失败
        409 `state_conflict`（`details.reason=report_content_corrupt`）。
      parameters:
        - $ref: '#/components/parameters/VersionID'
        - $ref: '#/components/parameters/ReportID'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: 报告 PDF 字节
          headers:
            ETag:
              description: PDF 字节 sha256（双引号包裹）
              schema:
                type: string
            Cache-Control:
              description: private, no-store
              schema:
                type: string
            X-Content-Type-Options:
              description: nosniff
              schema:
                type: string
            Content-Disposition:
              description: inline; filename=report-<report_id>-r<revision>.pdf
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

