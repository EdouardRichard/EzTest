        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [versions]
      summary: Record a manual decision
      description: |
        A human-authored decision is stored as `accepted` with `source=user`
