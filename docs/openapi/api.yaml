    ## v0.22 W2-2 增量（human request decisions，additive）

    R-W2-1 / API-43（来源：`docs/superpowers/specs/2026-11-05-eztest-v0.22-design.md` §4.29/§6）：
    - `POST /api/versions/{id}/human-requests`（登录用户 `authenticated`，与既有 execution
      写路由一致；Host 工具内部同路径）创建
      `approval|blocked_recovery|conflict` 版本级请求，body `{kind,reason,conversation_id?,message_id?}`；
