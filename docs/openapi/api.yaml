  /api/versions/{id}/requirements/dedupe:
    post:
      tags: [Requirements]
      operationId: dedupeRequirements
      summary: 去重 draft 需求（登录用户）
      description: |
        只扫描该版本的 `draft` 需求：规范化标题相同，或规范化描述与验收文本都相同的草案
        视为重复，每组保留最小 ID、其余置为 `obsolete`（不新增 revision，已确认需求不受影响）。
        单次最多扫描 200 条草案（`maxDedupeRequirements`）。响应始终返回两个数组：
        `kept_ids` 是本次扫描后仍保留的全部 draft（包括未参与重复分组的唯一条目），
        `obsolete_ids` 只包含本次被置为 `obsolete` 的重复草案；`obsolete_ids` 为空表示
        没有需求被退休（成功的 no-op），此时 `kept_ids` 仍可能非空。未知版本 404。
        事件 `requirement.deduped`（仅 `obsolete_ids` 非空时发布）；审计 action
        `requirement.deduped`。无请求体。
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 去重结果（kept_ids 为所有仍保留的 draft；obsolete_ids 为空表示没有需求被退休）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RequirementDedupeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/requirements/merge:
    post:
      tags: [Requirements]
      operationId: mergeRequirements
      summary: 合并 draft 重复需求（登录用户）
      description: |
        把同一版本的 draft 源需求合并进 draft 目标：目标吸收源需求的
        description/acceptance_criteria 与 targets（按文本去重、取最高优先级），内容实际变化时
        生成新的 draft revision，源需求置为 `obsolete` 并写入 `overlaps` 关系。目标或任一源
        已确认（clarified/closed）返回 409 `state_conflict`；空 source 列表、自合并（source 含目标）
        返回 400 `invalid_argument`（`details.field="source_requirement_ids"`），非法 ID 由 HTTP
        边界返回 400（`details.field` 为 `target_requirement_id` 或 `source_requirement_ids[i]`），
        原始 source 列表超过 200 个时按既有服务字段 `requirement_ids` 返回 400。重复的 source ID
        会去重；单次最多 200 个。事件 `requirement.merged`、`requirement.obsoleted`（每个源）及按需的
        `requirement.version_created`；审计 action `requirement.merged`。
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementMergeRequest'
      responses:
        '200':
          description: 合并后的目标需求详情与被合并的源需求 ID
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RequirementMergeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

