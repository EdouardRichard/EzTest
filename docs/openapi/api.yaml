    get:
      tags: [Conversations]
      operationId: listMessageParts
      summary: 消息 parts 历史（登录用户）
      description: |
        按 `seq` 升序返回一条 UI 线程消息的流式 parts（text/thinking/tool_call/job_card/...）。
        `{mid}` 是 `conversation_message.id`（即 `GET .../messages` 返回的 `ConversationMessage.id`），
        不是 LLM transcript 的 `agent_message.id`；服务端用 `conversation_message.conversation_id = {cid}`
        （并校验版本归属）过滤，查不到或不匹配返回 404。
        parts 来自 `conversation_message_part`（version 上下文），按 `seq` 升序返回；历史消息分页/懒加载：
        `GET .../messages` 仍返回完整消息快照，SSE `conversation.message` 语义不变。
        前端按 `seq` 去重、按 `call_id` 配对工具调用。
