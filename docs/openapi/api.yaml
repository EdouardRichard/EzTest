    DesignCaseCard:
      type: object
      description: v0.2.4-B/T9：用例卡片自然语言契约；目标资源 ID 已移除，改用 sut_description + covered_acs。v0.2.4-E/T16 增 required review_state。
      required: [case_id, current_version_id, revision, title, priority, status, sut_description, covered_acs, step_count, assertion_count, execution_verdict, review_state, created_at]
      properties:
        case_id:
          type: string
          pattern: '^[0-9]+$'
        current_version_id:
          type: string
          pattern: '^[0-9]+$'
        revision:
          type: integer
          minimum: 1
        title:
          type: string
        priority:
          type: string
          enum: [P0, P1, P2, P3]
        status:
          type: string
          enum: [draft, confirmed, stale]
        sut_description:
          type: string
          description: 被测系统自然语言描述
        covered_acs:
          type: array
          description: 覆盖的需求 AC id 集
          items:
            type: string
            pattern: '^AC-[1-9][0-9]*$'
        step_count:
          type: integer
          minimum: 0
        assertion_count:
          type: integer
          minimum: 0
        execution_verdict:
          type: string
          enum: [passed, failed, blocked, inconclusive]
          description: |
            最新执行结果：取该用例**当前**版本最近一次终态 case_run 的 status；未执行或仅有
            进程态（pending/running/paused/skipped/interrupted/superseded）时为 `inconclusive`。
            始终返回；不参与 graph_hash，因此同一图 hash 的判定更新不会重算布局。
        review_state:
          type: string
          enum: [pending, pass, reworking, escalated_fail, judge_unavailable, '']
          description: |
            v0.2.4-E/T16（additive，required）：当前用例版本的裁判审查状态投影（单一权威
            design/domain/judgment.go DeriveReviewState；派生优先级 judge_unavailable >
            escalated_fail > reworking > pass > pending）。**空串 `""` 为降级态**：裁判门
            未接线或事实读失败时服务端发 ""（不伪造状态），客户端须容忍并按"审查状态未知"
            渲染。叠加的审查维度，不改变生命周期 status；任何 review_state 下均无自动确认。
        created_at:
          type: string
          format: date-time
