                             status_code, mime, source_kind, occurrences, decision, wave_id,
                             case_run_id, sut_id, environment_id, resource_id, fact_id,
                             first_seen_at, last_seen_at, created_at, updated_at]
                          properties:
                            observation_id:
                              type: string
                              pattern: '^[0-9]+$'
                            kind:
                              type: string
                              enum: [page, api]
                            method:
                              type: string
                            host:
                              type: string
                            resource_template:
                              type: string
                            status_code:
                              type: integer
                              nullable: true
                            mime:
                              type: string
                            source_kind:
                              type: string
                              enum: [execution, p9]
                            occurrences:
                              type: integer
                            decision:
                              type: string
                              enum: [new, proposed, approved, rejected, out_of_scope]
                            wave_id:
                              type: string
                              pattern: '^[0-9]+$'
                              nullable: true
                            case_run_id:
                              type: string
                              pattern: '^[0-9]+$'
                              nullable: true
                            sut_id:
                              type: string
                              pattern: '^[0-9]+$'
                            environment_id:
                              type: string
                              pattern: '^[0-9]+$'
                              nullable: true
                            resource_id:
                              type: string
                              pattern: '^[0-9]+$'
                              nullable: true
                            fact_id:
                              type: string
                              pattern: '^[0-9]+$'
                              nullable: true
