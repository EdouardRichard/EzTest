            has_more:
              type: boolean
    PublishTestEventsRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        summary:
          type: string
          maxLength: 500
        detail:
          type: object
          additionalProperties: true
          description: Optional JSON object up to 64 KiB; defaults to `{}`.
    PublishTestEventsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [seqs]
          properties:
            seqs:
              type: array
