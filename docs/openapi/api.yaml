        (409 `duplicate_attachment`). Returns 201 with metadata only.
      operationId: uploadRequirementAttachment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/RequirementPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
