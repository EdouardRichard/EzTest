        expected:
          type: string
        source:
          $ref: '#/components/schemas/CaseContentSource'
    CaseSourceView:
      type: object
      description: |
        One requirement/app-model/run/manual justification of a case (spec
        §7.3). `refId` is null only for `manual` sources.
      required: [id, refKind, refId, refKey, source, confidence]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        refKind:
          $ref: '#/components/schemas/CaseRefKind'
        refId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: Referenced object id as a decimal string; null only for `manual`.
        refKey:
          type: string
        source:
          $ref: '#/components/schemas/CaseSourceKind'
        confidence:
          $ref: '#/components/schemas/Confidence'
    CodeAnchorView:
      type: object
      description: |
        One code anchor attached to a case (`subject_kind=case`, D37). `id` is a
        decimal string; `startLine`/`endLine`/`commitSha` are always present and
        null when the anchor has no line range or commit pin.
      required: [id, filePath, startLine, endLine, confidence, commitSha]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        filePath:
          type: string
          maxLength: 4096
        startLine:
          type: integer
          minimum: 1
          nullable: true
        endLine:
          type: integer
          minimum: 1
          nullable: true
        confidence:
          $ref: '#/components/schemas/Confidence'
        commitSha:
          type: string
          pattern: '^[a-f0-9]{40}$'
          nullable: true
    CaseNodeView:
      type: object
      description: |
        One node of the graph response (spec §7.3). Scenarios never carry
        steps/assertions/sources; cases carry at least one step and one
        assertion before review. `anchors` is always an array (empty when the
        read omitted `include=anchors`).
      required:
        - id
        - parentId
        - kind
        - title
        - description
        - priority
        - preconditions
        - testData
        - source
        - status
        - sortOrder
        - revision
        - steps
        - assertions
        - sources
        - anchors
        - openBlockerCount
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        parentId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: Parent node id, or null for a root node.
        kind:
          $ref: '#/components/schemas/CaseNodeKind'
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        priority:
          $ref: '#/components/schemas/CasePriority'
        preconditions:
          type: string
        testData:
          description: |
            Free-form JSON test-data document (object, array, scalar or null).
            The server stores it verbatim and never interprets it. Always
            present; null when unset.
          nullable: true
        source:
          $ref: '#/components/schemas/CaseSourceKind'
        status:
          $ref: '#/components/schemas/CaseNodeStatus'
        sortOrder:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 1
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CaseStepView'
        assertions:
          type: array
          items:
            $ref: '#/components/schemas/CaseAssertionView'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CaseSourceView'
        anchors:
          type: array
          description: Always present; empty when `include=anchors` was omitted.
          items:
            $ref: '#/components/schemas/CodeAnchorView'
        openBlockerCount:
          type: integer
          minimum: 0
    CoverageCell:
      type: object
      description: One requirement row of the coverage matrix.
      required: [requirementId, caseIds]
      properties:
        requirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
        caseIds:
          type: array
          items:
            type: string
            pattern: '^[0-9]{1,19}$'
    CoverageView:
      type: object
      description: Requirement ↔ case coverage projection (spec §6.2/§7.3).
      required: [requirementIds, uncoveredRequirementIds, staleRequirementIds, matrix]
      properties:
        requirementIds:
          type: array
          description: All clarified requirements considered for coverage.
          items:
            type: string
            pattern: '^[0-9]{1,19}$'
        uncoveredRequirementIds:
          type: array
          description: Clarified requirements that no case covers.
          items:
            type: string
            pattern: '^[0-9]{1,19}$'
        staleRequirementIds:
          type: array
          description: Requirements reopened after their cases were written (read-only hint in P5).
          items:
            type: string
            pattern: '^[0-9]{1,19}$'
        matrix:
          type: array
          items:
            $ref: '#/components/schemas/CoverageCell'
    BaselineView:
      type: object
      description: The immutable frozen baseline of a version (spec §6.4).
      required: [id, graphHash, caseCount, nodeCount, frozenAt, codeBaselineCommit]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        graphHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: sha256 of the canonical graph document.
        caseCount:
          type: integer
          minimum: 0
        nodeCount:
          type: integer
          minimum: 0
        frozenAt:
          type: string
          format: date-time
        codeBaselineCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
          nullable: true
          description: The version's code baseline commit at freeze time, when one was bound.
    RunSummaryView:
      type: object
      description: |
        The latest run of one kind, summarised inside the graph response. Only
        `id`/`status` are guaranteed; `kind`, `finishedAt` and the counts may be
        absent (null when the run has not finished).
      required: [id, status]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        kind:
          $ref: '#/components/schemas/RunKind'
        status:
          $ref: '#/components/schemas/RunStatus'
        finishedAt:
          type: string
          format: date-time
          nullable: true
        findingCount:
          type: integer
          minimum: 0
          description: Present for a review run summary.
        blockerCount:
          type: integer
          minimum: 0
          description: Present for a review run summary.
    ImpactCaseView:
      type: object
      description: |
        One read-only "possibly affected" hint derived from the latest P4 code
        analysis and mapped through requirement/app-model sources. P5 never
        mutates node status from it.
      required: [caseNodeId, reason, confidence, source]
      properties:
        caseNodeId:
          type: string
          pattern: '^[0-9]{1,19}$'
        reason:
          type: string
        confidence:
          $ref: '#/components/schemas/Confidence'
        source:
          type: string
          description: Origin of the hint (for example `relation`).
    MindmapGraph:
      type: object
      description: |
        The complete `GET /mindmap` response (spec §7.3). `editable` is
        server-owned (`versionStatus` is `designing`/`reviewing` and no baseline
        is frozen). `anchors` and `impactCases` are always arrays; `findings` is
        present only when `include=findings`.
      required:
        - versionId
        - versionStatus
        - editable
        - nodes
        - coverage
        - baseline
        - latestRuns
        - impactCases
      properties:
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionStatus:
          $ref: '#/components/schemas/VersionStatus'
        editable:
          type: boolean
          description: True while the version is `designing`/`reviewing` and no baseline is frozen.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/CaseNodeView'
        coverage:
          $ref: '#/components/schemas/CoverageView'
        baseline:
          description: The frozen baseline, or null before approval.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BaselineView'
        latestRuns:
          type: object
          description: |
            Latest run summary keyed by run kind. A kind key is omitted when no
            run of that kind exists.
          additionalProperties: false
          properties:
            design:
              $ref: '#/components/schemas/RunSummaryView'
            review:
              $ref: '#/components/schemas/RunSummaryView'
            data_plan:
              $ref: '#/components/schemas/RunSummaryView'
            explore:
              $ref: '#/components/schemas/RunSummaryView'
        impactCases:
          type: array
          description: Always present; empty when `include=impact` was omitted or no hint exists.
          items:
            $ref: '#/components/schemas/ImpactCaseView'
        findings:
          type: array
          description: |
            Present only when `include=findings`; `GET /findings` is the
            authoritative flat list.
          items:
            $ref: '#/components/schemas/CaseReviewFindingView'
    CaseRunError:
      type: object
      description: One non-fatal run error; never carries LLM, mindmap or export bodies.
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    CaseRunView:
      type: object
      description: |
        A run detail/listing row (spec §7.2 endpoints 17-19). LLM input/output
        and proposal bodies are never returned. `agentSessionId`/`agentRunId`
        are P1 IDs and stay numbers; `reason` carries a stable failure reason
        such as `agent_failed`, `agent_timeout`, `agent_start_timeout`,
        `worker_restart`, `ai_unavailable`, `invalid_case_proposal`,
        `environment_unreachable` or `baseline_frozen` (empty when the run did
        not fail).
      required:
        - id
        - versionId
        - kind
        - status
        - reason
        - stats
        - errors
        - agentSessionId
        - agentRunId
        - model
        - promptVersion
        - createdBy
        - createdAt
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        kind:
          $ref: '#/components/schemas/RunKind'
        status:
          $ref: '#/components/schemas/RunStatus'
        reason:
          type: string
        stats:
          type: object
          nullable: true
          additionalProperties: true
          description: Non-sensitive run statistics (for example materialized counts).
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CaseRunError'
        agentSessionId:
          type: integer
          format: int64
          nullable: true
          description: P1 Agent session ID (a number), null before the session is created.
        agentRunId:
          type: integer
          format: int64
          nullable: true
          description: P1 Agent run ID (a number), null before the run is created.
        model:
          type: string
        promptVersion:
          type: string
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
    CaseReviewView:
      type: object
      description: One review round of a version's case mindmap (spec §6.3).
      required:
        - id
        - versionId
        - runId
        - status
        - comment
        - reviewerId
        - decidedBy
        - decidedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        runId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: The review run that produced the findings; null for a human-only review.
        status:
          $ref: '#/components/schemas/ReviewStatus'
        comment:
          type: string
        reviewerId:
          type: integer
          format: int64
        decidedBy:
          type: integer
          format: int64
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CaseReviewFindingView:
      type: object
      description: |
        One review finding; `nodeId` is null for version-level findings. A
        finding is not a P7 issue ticket.
      required:
        - id
        - reviewId
        - nodeId
        - category
        - severity
        - detail
        - status
        - source
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        reviewId:
          type: string
          pattern: '^[0-9]{1,19}$'
        nodeId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        category:
          $ref: '#/components/schemas/FindingCategory'
        severity:
          $ref: '#/components/schemas/FindingSeverity'
        detail:
          type: string
          minLength: 1
          maxLength: 2000
        status:
          $ref: '#/components/schemas/FindingStatus'
        source:
          $ref: '#/components/schemas/FindingSource'
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CaseFindingView:
      description: |
        Alias of `CaseReviewFindingView` for consumers that use the shorter
        frontend DTO name; both name the same shape.
      allOf:
        - $ref: '#/components/schemas/CaseReviewFindingView'
    CaseExportView:
      type: object
      description: |
        One server-generated export file (D30/D38); the file itself is fetched
        from `/exports/{exportId}/download` and internal paths are never exposed.
      required: [id, versionId, format, nodeCount, sizeBytes, baselineId, createdAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        format:
          $ref: '#/components/schemas/ExportFormat'
        nodeCount:
          type: integer
          minimum: 0
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        baselineId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: The frozen baseline this file was generated from; null for a draft export.
        createdAt:
          type: string
          format: date-time
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hex sha256 of the file contents, when the server exposes it.
        fileName:
          type: string
          description: Suggested download filename, when the server exposes it.
    CreateNodeRequest:
      type: object
      additionalProperties: false
      required: [kind, title]
      properties:
        kind:
          $ref: '#/components/schemas/CaseNodeKind'
        parentId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: Parent node id; omitted or null creates a root node.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        priority:
          $ref: '#/components/schemas/CasePriority'
        preconditions:
          type: string
        testData:
          description: Free-form JSON test-data document; the server stores it verbatim.
          nullable: true
        requirementIds:
          type: array
          description: Requirements this case covers; all must belong to the version and be `clarified`.
          items:
            type: string
            pattern: '^[0-9]{1,19}$'
        source:
          description: Defaults to `user_input` for manual creation.
          allOf:
            - $ref: '#/components/schemas/CaseSourceKind'
    UpdateNodeRequest:
      type: object
      additionalProperties: false
      description: |
        Partial node update; omitted fields keep their stored value. `revision`
        is the mandatory optimistic-concurrency token.
      required: [revision]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        priority:
          $ref: '#/components/schemas/CasePriority'
        preconditions:
          type: string
        testData:
          description: Free-form JSON test-data document; null clears it.
          nullable: true
        requirementIds:
          type: array
          description: Replaces the requirement-source set; must not leave the case uncovered.
          items:
            type: string
            pattern: '^[0-9]{1,19}$'
        revision:
          type: integer
          minimum: 1
    CreateStepRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 2000
        expected:
          type: string
          maxLength: 2000
        data:
          type: string
        afterSeq:
          type: integer
          minimum: 0
          maximum: 30
          description: Insert after this sequence; omit to append at the end.
    UpdateStepRequest:
      type: object
      additionalProperties: false
      description: Partial step update guarded by the owning case node revision.
      required: [nodeRevision]
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 2000
        expected:
          type: string
          maxLength: 2000
        data:
          type: string
        nodeRevision:
          type: integer
          minimum: 1
    CreateAssertionRequest:
      type: object
      additionalProperties: false
      required: [kind, expression]
      properties:
        stepId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: Attach to this step of the same case; null or omitted applies to the whole case.
        kind:
          $ref: '#/components/schemas/AssertionKind'
        target:
          type: string
        expression:
          type: string
          minLength: 1
        expected:
          type: string
    UpdateAssertionRequest:
      type: object
      additionalProperties: false
      description: Partial assertion update guarded by the owning case node revision.
      required: [nodeRevision]
      properties:
        kind:
          $ref: '#/components/schemas/AssertionKind'
        target:
          type: string
        expression:
          type: string
          minLength: 1
        expected:
          type: string
        nodeRevision:
          type: integer
          minimum: 1
    AddSourceRequest:
      type: object
      additionalProperties: false
      required: [refKind]
      properties:
        refKind:
          $ref: '#/components/schemas/CaseRefKind'
        refId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: Referenced object id; required except for `manual` sources.
        refKey:
          type: string
    AddAnchorRequest:
      type: object
      additionalProperties: false
      required: [filePath]
      properties:
        filePath:
          type: string
          minLength: 1
          maxLength: 4096
          description: Version-relative file path that must exist at the code baseline commit.
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
        confidence:
          $ref: '#/components/schemas/Confidence'
    StartRunRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/RunKind'
        mode:
          type: string
          description: |
            `design` mode: `append` (default) adds scenarios/cases, `replace`
            removes every draft node first and requires `confirmReplace=true`.
          enum: [append, replace]
        confirmReplace:
          type: boolean
          description: Explicit confirmation for `mode=replace`.
        nodeIds:
          type: array
          description: Target nodes for a `data_plan` run (at most 60).
          maxItems: 60
          items:
            type: string
            pattern: '^[0-9]{1,19}$'
        systemId:
          type: integer
          format: int64
          minimum: 1
          description: P2 system id for an `explore` run (a number).
        environmentId:
          type: integer
          format: int64
          minimum: 1
          description: P2 environment id for an `explore` run (a number).
        sessionId:
          type: integer
          format: int64
          minimum: 1
          description: Optional P2 session id whose cookies authenticate the read-only exploration.
        startPaths:
          type: array
          description: Optional extra exploration seeds (at most 10, still subject to the allowed-hosts whitelist).
          maxItems: 10
          items:
            type: string
        headCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
          description: Optional 40-hex code head override for code-aware runs.
    ReviewRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/ReviewDecision'
        comment:
          type: string
          description: Human comment; required (non-empty) when `decision=reject`.
        acknowledgeFindings:
          type: boolean
          description: Required to approve while open `blocker` findings exist.
    UpdateFindingRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          description: Human disposition of the finding (reopening is not supported).
          enum: [fixed, dismissed]
    ExportRequest:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format:
          $ref: '#/components/schemas/ExportFormat'
    ReorderRequest:
      type: object
      additionalProperties: false
      required: [nodeIds]
      properties:
        parentId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: Parent whose children are reordered; omitted or null is the version root.
        nodeIds:
          type: array
          description: |
            Every child of the parent exactly once, in the new order. A missing,
            duplicated or foreign id is 409 `invalid_case_tree`.
          items:
            type: string
            pattern: '^[0-9]{1,19}$'
    ReorderStepsRequest:
      type: object
      additionalProperties: false
      required: [stepIds, nodeRevision]
      properties:
        stepIds:
          type: array
          description: Every step of the case exactly once, in the new order.
          items:
            type: string
            pattern: '^[0-9]{1,19}$'
        nodeRevision:
          type: integer
          minimum: 1
          description: Current case node revision (optimistic concurrency, spec §6.5).
    StartRunResult:
      type: object
      description: The accepted `POST /runs` result (202).
      required: [runId]
      properties:
        runId:
          type: string
          pattern: '^[0-9]{1,19}$'
    StartRunResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StartRunResult'
    SubmitReviewResult:
      type: object
      description: The `POST /submit-review` result (200).
      required: [version]
      properties:
        version:
          $ref: '#/components/schemas/Version'
    SubmitReviewResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SubmitReviewResult'
    ReviewResult:
      type: object
      description: |
        The `POST /review` result (200). `baseline` is present on approval and
        null on rejection.
      required: [version, review]
      properties:
        version:
          $ref: '#/components/schemas/Version'
        baseline:
          description: The frozen baseline created by an approval, or null.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BaselineView'
        review:
          $ref: '#/components/schemas/CaseReviewView'
    ReviewResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ReviewResult'
    MindmapEnvelope:
      type: object
      description: The normal data envelope of `GET /mindmap` (one MindmapGraph).
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MindmapGraph'
    MindmapListEnvelope:
      type: object
      description: |
        Cursor page shared by the mindmap list endpoints (spec §7.1). `data`
        holds the rows of the endpoint's type: `CaseRunView` for `/runs`,
        `CaseReviewView` for `/reviews` and `CaseExportView` for `/exports`.
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          description: One page of rows of the endpoint's row type.
          items:
            anyOf:
              - $ref: '#/components/schemas/CaseRunView'
              - $ref: '#/components/schemas/CaseReviewView'
              - $ref: '#/components/schemas/CaseExportView'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    MindmapFindingListEnvelope:
      type: object
      description: |
        The flat, unpaginated `{"data": [CaseReviewFindingView]}` list returned
        by `GET /findings` (spec §7.3).
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CaseReviewFindingView'
    CaseNodeEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CaseNodeView'
    CaseStepEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CaseStepView'
    CaseAssertionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CaseAssertionView'
    CaseSourceEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CaseSourceView'
    MindmapAnchorEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CodeAnchorView'
    CaseRunEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CaseRunView'
    CaseReviewEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CaseReviewView'
    CaseReviewFindingEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CaseReviewFindingView'
    CaseExportEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CaseExportView'
    MindmapErrorReason:
      type: string
      description: |
        Closed set of P5 mindmap `error.details.reason` values (spec §7.4). HTTP
        mapping: `*_not_found` is 404; `forbidden` is 403; `export_corrupted` is
        500; `invalid_case_tree`, `no_cases`, `graph_too_large`,
        `unconfirmed_requirements` and `requirement_not_clarified` are 409 (the
        domain layer may still classify them as invalid); the remaining values
        are 409 conflicts or 422 validation errors. `duplicate_key` and
        `invalid_case_proposal` are shared with the platform/P4 error reasons,
        and `invalid_case_proposal`, `environment_unreachable` and
        `ai_unavailable` also appear on a failed run's `reason`.
      enum:
        - version_state_conflict
        - baseline_frozen
        - case_revision_conflict
        - invalid_case_tree
        - no_cases
        - unconfirmed_requirements
        - requirement_not_found
        - requirement_not_clarified
        - node_not_found
        - step_not_found
        - assertion_not_found
        - source_not_found
        - anchor_not_found
        - review_not_found
        - baseline_not_found
        - finding_not_found
        - run_in_progress
        - run_not_found
        - run_state_conflict
        - invalid_run_kind
        - invalid_case_proposal
        - blocker_findings_open
        - exploration_requires_environment
        - environment_not_allowed
        - environment_unreachable
        - code_repo_unavailable
        - ai_unavailable
        - export_format_unsupported
        - export_not_found
        - export_conflict
        - export_corrupted
        - duplicate_case_source
        - duplicate_key
        - graph_too_large
        - forbidden
    BatchStatus:
      type: string
      description: |
        P6 batch status (`run_batch.status`). `planned` exists only between the
        create transaction and the scheduler's first dispatch. A paused batch
        keeps `running`, so it still owns the version's single active-batch
        slot (spec §5.1, §5.4).
      enum: [planned, running, done, failed, cancelled]
    PauseMode:
      type: string
      description: |
        Pause mode of a batch and of its version mirror. `graceful` stops
        dispatching and parks a running case after its current step (the case
        run goes back to `pending` and keeps its completed step results);
        `immediate` cancels the in-flight Agent run and executor action and
        marks the case run `interrupted` with `cleanup_required=true`.
        `graceful` is the default on the DDL and on an omitted pause body.
      enum: [graceful, immediate]
    CaseRunStatus:
      type: string
      description: |
        Case-run status. `passed`/`failed`/`blocked`/`inconclusive` are the
        four verdicts of spec §5.8; `skipped` covers cancelled or never
        dispatched cases and `interrupted` an immediate pause / crash.
      enum: [pending, running, passed, failed, blocked, inconclusive, skipped, interrupted]
    FailureClass:
      type: string
      description: |
        Failure class of a non-passed case run (spec §5.8). It is only written
        for `failed`, `blocked` and `inconclusive` runs; `application` comes
        from evidenced assertion failures, `environment`/`session` from
        reachability/login problems and `model`/`case` from Agent, budget or
        case-structure problems. Flaky detection is derived, never stored.
      enum: [application, environment, session, model, case]
    StepStatus:
      type: string
      description: |
        Step-result status. `interrupted` marks the in-flight step of an
        immediate pause or a crash; it is never reported as `failed`.
      enum: [pending, running, passed, failed, interrupted]
    AssertionVerdict:
      type: string
      description: |
        Assertion-level verdict (distinct from the case-level four-state
        verdict). `not_run` covers unattempted assertions, `db` assertions
        (unsupported in P6) and passed/failed claims without evidence.
      enum: [passed, failed, not_run]
    EvidenceKind:
      type: string
      description: |
        Evidence artifact kind (the `evidence.kind` allow-list). Screenshots,
        downloads and HTTP exchanges are captured automatically; console and
        network logs are captured when the Agent requests evidence.
      enum: [screenshot, http_exchange, console_log, network_log, download]
    AuthFlowKind:
      type: string
      description: Login recipe kind. P6 supports only the minimal `form` recipe.
      enum: [form]
    BatchCounts:
      type: object
      description: |
        Per-status counters of one batch (spec §6.3). `total` is the batch case
        count and the other six sum to at most `total`; the counts are derived
        from the batch's case runs.
      required: [total, passed, failed, blocked, inconclusive, skipped, interrupted]
      properties:
        total:
          type: integer
          minimum: 0
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        blocked:
          type: integer
          minimum: 0
        inconclusive:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        interrupted:
          type: integer
          minimum: 0
    Batch:
      type: object
      description: |
        `BatchDTO` (spec §6.3): one execution batch of a version. Every ID is a
        decimal string, including `created_by` and the baseline identity. The
        DTO never embeds its case runs; read them from the case-run endpoints.
        `paused` is independent of `status` (a paused batch keeps `running`),
        and `pause_mode` is always `graceful` or `immediate`.
      required:
        - id
        - version_id
        - batch_no
        - status
        - paused
        - pause_mode
        - pause_reason
        - baseline_hash
        - code_baseline_commit
        - head_commit
        - counts
        - created_by
        - started_at
        - finished_at
        - failure_reason
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          example: '1844674407370955161'
          description: Batch ID as a decimal string; never convert it to a number.
        version_id:
          type: string
          pattern: '^[0-9]{1,19}$'
        batch_no:
          type: integer
          minimum: 1
          description: Per-version sequential batch number starting at 1.
        status:
          $ref: '#/components/schemas/BatchStatus'
        paused:
          type: boolean
          description: True while pause is in effect; the batch keeps `running`.
        pause_mode:
          $ref: '#/components/schemas/PauseMode'
        pause_reason:
          type: string
          description: |
            Free-form pause reason. Restart recovery writes `restart`; user
            pauses leave it empty or write the actor's reason.
        baseline_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: sha256 of the frozen case baseline the batch pins.
        code_baseline_commit:
          type: string
          pattern: '^[a-f0-9]{40}$'
          nullable: true
          description: P5 code baseline commit at batch creation, when bound.
        head_commit:
          type: string
          pattern: '^[a-f0-9]{40}$'
          nullable: true
          description: Code head commit observed while executing, when bound.
        counts:
          $ref: '#/components/schemas/BatchCounts'
        created_by:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: Creating user ID serialized as a decimal string.
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        failure_reason:
          type: string
          description: |
            Batch-level failure reason (empty unless the batch itself failed,
            for example because recovery could not resume it).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BatchEnvelope:
      type: object
      description: One batch under the normal data envelope.
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Batch'
    BatchList:
      type: object
      description: One cursor page of batches, newest first.
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Batch'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CreateBatchRequest:
      type: object
      description: |
        Body of `POST /api/versions/{id}/batches`. An omitted or empty
        `caseIds` selects every case of the frozen baseline; when present,
        every ID must belong to that baseline (`invalid_case_ids` otherwise).
      properties:
        caseIds:
          type: array
          description: Case node IDs (decimal strings) to execute, order-insensitive.
          items:
            type: string
            pattern: '^[0-9]{1,19}$'
          maxItems: 500
    PauseBatchRequest:
      type: object
      description: |
        Body of `POST .../pause`. An omitted mode defaults to `graceful`; any
        other value is 422 `invalid_pause_mode`.
      properties:
        mode:
          $ref: '#/components/schemas/PauseMode'
    StepResult:
      type: object
      description: |
        One recorded case step (spec §6.3). `seq` is the step sequence of the
        frozen case snapshot; `status` never becomes `passed` without recorded
        evidence, and an immediate pause records the interrupted sequence in
        the case-run checkpoint instead of faking a result.
      required: [id, seq, action, expected, actual, status, evidence_ids]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: Step-result ID as a decimal string.
        seq:
          type: integer
          minimum: 1
        action:
          type: string
        expected:
          type: string
        actual:
          type: string
        status:
          $ref: '#/components/schemas/StepStatus'
        evidence_ids:
          type: array
          description: |
            Evidence IDs (decimal strings) captured for this step; always an
            array, empty when the step has no evidence.
          items:
            type: string
            pattern: '^[0-9]{1,19}$'
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    AssertionResult:
      type: object
      description: |
        One recorded assertion outcome (spec §6.3). `id` is the decimal-string
        identifier of the recorded assertion result. `verdict` is the
        assertion-level `passed`/`failed`/`not_run`, and a `passed`/`failed`
        verdict always carries at least one evidence ID. A `db` assertion is
        always `not_run` and makes the case
        `inconclusive(case, unsupported_assertion_kind)`.
      required: [id, kind, target, expected, actual, verdict, evidence_ids]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: Recorded assertion-result ID as a decimal string.
        kind:
          $ref: '#/components/schemas/AssertionKind'
        target:
          type: string
        expected:
          type: string
        actual:
          type: string
        verdict:
          $ref: '#/components/schemas/AssertionVerdict'
        evidence_ids:
          type: array
          description: |
            Evidence IDs (decimal strings) supporting the verdict; always an
            array, empty when the assertion was not run.
          items:
            type: string
            pattern: '^[0-9]{1,19}$'
        step_seq:
          type: integer
          minimum: 1
          description: |
            Step sequence the assertion belongs to; omitted when the frozen
            snapshot does not place it on a step.
        failure_reason:
          type: string
          description: Stable failure reason of a `failed` verdict; omitted when empty.
    EvidenceMeta:
      type: object
      description: |
        Metadata of one immutable evidence artifact (spec §6.3, §5.7). The
        filesystem path is never part of the DTO. `metadata` is capture-specific
        JSON (viewport, request/response envelope, console range, download
        filename, ...) with sensitive headers and fields already masked; the
        bytes themselves are streamed by `GET .../evidence/{evidenceId}`.
      required: [id, batch_id, kind, mime, size_bytes, sha256, metadata, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: Evidence ID as a decimal string.
        batch_id:
          type: string
          pattern: '^[0-9]{1,19}$'
        case_run_id:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        step_result_id:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        kind:
          $ref: '#/components/schemas/EvidenceKind'
        mime:
          type: string
          description: Normalized media type recorded at capture time.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: sha256 of the stored bytes, re-verified on every read.
        metadata:
          type: object
          additionalProperties: true
          description: Redacted capture metadata; never contains credentials or paths.
        created_at:
          type: string
          format: date-time
    EvidenceMetaEnvelope:
      type: object
      description: One evidence artifact's metadata under the normal data envelope.
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/EvidenceMeta'
    EvidenceView:
      type: object
      description: |
        Evidence summary embedded in a case run and in the report's per-case
        counts. It is the metadata projection without the batch membership,
        capture metadata or creation time; use
        `GET .../evidence/{evidenceId}/meta` for the full `EvidenceMeta`.
      required: [id, kind, mime, size_bytes, sha256]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: Evidence ID as a decimal string.
        kind:
          $ref: '#/components/schemas/EvidenceKind'
        mime:
          type: string
          description: Normalized media type recorded at capture time.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    PendingTakeover:
      type: object
      description: |
        The waiting human takeover of a `blocked(session)` case run (spec §5.9),
        present only while a takeover is waiting. Complete it through the
        existing P2 endpoint `POST /api/resources/takeovers/{id}/complete`
        (administrator); the worker then requeues the case run as a new attempt
        automatically.
      required: [id, reason, instructions, expires_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: |
            P2 takeover ID as a decimal string; pass it to
            `POST /api/resources/takeovers/{id}/complete`.
        reason:
          type: string
          description: |
            Why a human is needed: `mfa`, `captcha` or `approval` are produced
            by automatic login (the P2 enum also allows `login_unknown` and
            `other`).
          enum: [mfa, captcha, approval, login_unknown, other]
        instructions:
          type: object
          additionalProperties: true
          description: Redacted operator instructions; never contains a credential.
        expires_at:
          type: string
          description: |
            Takeover expiry as an RFC 3339 timestamp; the empty string when the
            waiting takeover has no expiry.
    CaseRun:
      type: object
      description: |
        `CaseRunDTO` (spec §6.3): one attempt at executing a case inside a
        batch. The detail projection fills `steps`, `assertions`, `evidence`,
        `session`, `pending_takeover` and the resume `checkpoint`; list rows
        carry empty `steps`/`assertions`/`evidence` arrays, an empty
        `completed_seqs` and `pending_takeover: null`. `case_node_id` is the P5
        mindmap case node and `agent_session_id`/`agent_run_id` are P1 IDs, all
        as decimal strings.
      required:
        - id
        - batch_id
        - case_node_id
        - case_revision
        - attempt
        - status
        - failure_class
        - failure_reason
        - summary
        - duration_ms
        - title
        - session
        - checkpoint
        - steps
        - assertions
        - evidence
        - pending_takeover
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          example: '1844674407370955301'
        batch_id:
          type: string
          pattern: '^[0-9]{1,19}$'
        case_node_id:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: P5 mindmap case node ID (decimal string).
        case_revision:
          type: integer
          minimum: 1
          description: Mindmap revision the frozen snapshot was taken from.
        attempt:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/CaseRunStatus'
        failure_class:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FailureClass'
        failure_reason:
          type: string
          description: |
            Stable reason of the failure or block (for example `no_session`,
            `takeover_required`, `evidence_missing` or a tool error code).
        summary:
          type: string
          maxLength: 500
          description: Short human-readable outcome summary.
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        title:
          type: string
          description: Case title from the frozen snapshot.
        session:
          type: object
          nullable: true
          description: Credential-free session the attempt executed under.
          required: [id, account, state]
          properties:
            id:
              type: string
              pattern: '^[0-9]{1,19}$'
            account:
              type: string
            state:
              type: string
              description: P2 session state, for example `valid` or `invalid`.
        checkpoint:
          type: object
          description: |
            Resume checkpoint of the attempt (spec §5.4). List rows carry an
            empty `completed_seqs` because they omit the recorded steps.
          required: [completed_seqs, cleanup_required, interrupted_step_seq]
          properties:
            completed_seqs:
              type: array
              description: Step sequences already recorded; resume starts after these.
              items:
                type: integer
                minimum: 1
            cleanup_required:
              type: boolean
              description: True when resume must cleanup/seed before continuing.
            interrupted_step_seq:
              type: integer
              minimum: 1
              nullable: true
              description: Sequence interrupted by an immediate pause, when any.
        steps:
          type: array
          description: |
            Recorded steps in sequence order; always an array, empty on list
            rows and before the first step is recorded.
          items:
            $ref: '#/components/schemas/StepResult'
        assertions:
          type: array
          description: |
            Recorded assertion outcomes in recording order; always an array,
            empty on list rows.
          items:
            $ref: '#/components/schemas/AssertionResult'
        evidence:
          type: array
          description: |
            Evidence summaries in capture order; always an array, empty on list
            rows.
          items:
            $ref: '#/components/schemas/EvidenceView'
        pending_takeover:
          nullable: true
          description: |
            The waiting takeover, or null when none. Populated by the detail
            endpoint only.
          allOf:
            - $ref: '#/components/schemas/PendingTakeover'
        agent_session_id:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: P1 Agent session ID (decimal string) of the attempt.
        agent_run_id:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: P1 Agent run ID (decimal string) of the attempt.
        retry_of_case_run_id:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: Previous attempt this row retries, when it is a rerun/requeue.
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    CaseRunList:
      type: object
      description: |
        One cursor page of case runs, newest first. Rows carry empty
        `steps`/`assertions`/`evidence` arrays, an empty checkpoint
        `completed_seqs` and `pending_takeover: null`.
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CaseRun'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CaseRunDetailEnvelope:
      type: object
      description: One case run with its full detail.
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CaseRun'
    BatchReport:
      type: object
      description: |
        `ReportDTO` (spec §6.3), the Batch 1 report derived at read time. It
        contains no issue, revision or stale fields. `flaky_case_ids` is a
        derived view (a case that failed in an earlier attempt and passed in a
        later one) and is never stored on a case run. Case rows are ordered by
        case node then attempt, so the JSON and the Markdown export are
        reproducible.
      required: [batch, summary, cases, environment, generated_at]
      properties:
        batch:
          type: object
          required: [id, batch_no, status, baseline_hash, code_baseline_commit]
          properties:
            id:
              type: string
              pattern: '^[0-9]{1,19}$'
            batch_no:
              type: integer
              minimum: 1
            status:
              $ref: '#/components/schemas/BatchStatus'
            baseline_hash:
              type: string
              pattern: '^[0-9a-f]{64}$'
            code_baseline_commit:
              type: string
              pattern: '^[a-f0-9]{40}$'
              nullable: true
              description: |
                P5 code baseline commit; null when the report's version has no
                bound code baseline.
        summary:
          type: object
          required:
            - case_count
            - by_status
            - by_failure_class
            - flaky_case_ids
            - duration_ms
            - evidence_count
          properties:
            case_count:
              type: integer
              minimum: 0
            by_status:
              type: object
              description: Case counts keyed by case-run status; absent keys mean zero.
              additionalProperties:
                type: integer
                minimum: 0
            by_failure_class:
              type: object
              description: Case counts keyed by failure class; absent keys mean zero.
              additionalProperties:
                type: integer
                minimum: 0
            flaky_case_ids:
              type: array
              description: Case node IDs (decimal strings) of derived flaky cases.
              items:
                type: string
                pattern: '^[0-9]{1,19}$'
            duration_ms:
              type: integer
              format: int64
              minimum: 0
            evidence_count:
              type: integer
              minimum: 0
        cases:
          type: array
          items:
            type: object
            required:
              - case_run_id
              - case_node_id
              - title
              - status
              - failure_class
              - steps
              - assertions
              - evidence
              - duration_ms
            properties:
              case_run_id:
                type: string
                pattern: '^[0-9]{1,19}$'
              case_node_id:
                type: string
                pattern: '^[0-9]{1,19}$'
              title:
                type: string
              status:
                $ref: '#/components/schemas/CaseRunStatus'
              failure_class:
                type: string
                nullable: true
                description: Null when the case has no failure class.
              steps:
                type: integer
                minimum: 0
              assertions:
                type: integer
                minimum: 0
              evidence:
                type: integer
                minimum: 0
              duration_ms:
                type: integer
                format: int64
                minimum: 0
        environment:
          type: object
          description: Environment header; the three keys are always present.
          required: [system, environment, base_url]
          properties:
            system:
              type: string
            environment:
              type: string
            base_url:
              type: string
        generated_at:
          type: string
          format: date-time
    BatchReportEnvelope:
      type: object
      description: The Batch 1 report under the normal data envelope.
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/BatchReport'
    ExecutionSession:
      type: object
      description: |
        One execution Agent session of the version channel: the P1 session
        projection filtered by `channel=version:{id}`. `status` is `running`
        while the session has an active run, otherwise the last run's status, or
        `idle` when it has no run yet. The execution Agent profile key is fixed
        (`execution-agent`). Prompts, model output and credentials are never part
        of this DTO.
      required: [id, channel, title, status, running, profile_key, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: P1 Agent session ID as a decimal string.
        channel:
          type: string
          maxLength: 64
          description: Always `version:{id}` (the channel is fixed server-side).
        title:
          type: string
          maxLength: 120
        status:
          type: string
          description: |
            `running` while a run is active, otherwise the last run's status or
            `idle` before the first run.
        running:
          type: boolean
        profile_key:
          type: string
          description: Agent profile key; always `execution-agent` in P6.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ExecutionSessionList:
      type: object
      description: One cursor page of the version's execution Agent sessions.
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionSession'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    FormSuccessRule:
      type: object
      description: |
        Success predicate of a form login recipe. Exactly one of
        `url_contains` / `selector` must be set (422 `auth_flow_invalid`
        otherwise).
      properties:
        url_contains:
          type: string
          description: URL fragment the browser must land on after submit.
        selector:
          type: string
          description: Element that must appear after submit.
    FormFailureSelectors:
      type: object
      description: |
        Optional selectors that turn a failed automatic login into a human
        takeover instead of a credential failure. Each selector is independent.
      properties:
        mfa_selector:
          type: string
          description: Present when the login asks for a second factor.
        captcha_selector:
          type: string
          description: Present when the login shows a captcha.
        invalid_selector:
          type: string
          description: Present when the login rejects the credential.
    FormDefinition:
      type: object
      description: |
        Minimal `kind=form` login recipe (spec §3.4). It stores URLs and
        selectors only: the username/password values come from the P2 access
        credential and are filled with `secret=true`, so they never enter the
        recipe, an event, a log or an evidence artifact. `timeout_ms` is
        5000-60000.
      required:
        - login_url
        - username_selector
        - password_selector
        - submit_selector
        - success
        - failure
        - timeout_ms
      properties:
        login_url:
          type: string
          description: Absolute http(s) URL of the login page.
        username_selector:
          type: string
          minLength: 1
        password_selector:
          type: string
          minLength: 1
        submit_selector:
          type: string
          minLength: 1
        success:
          $ref: '#/components/schemas/FormSuccessRule'
        failure:
          $ref: '#/components/schemas/FormFailureSelectors'
        timeout_ms:
          type: integer
          minimum: 5000
          maximum: 60000
    AuthFlow:
      type: object
      description: |
        One login recipe (`auth_flow`) of a system. IDs are decimal strings.
        Recipes are administrator-only on every route; the definition is
        returned as stored and never contains a credential or storage state.
      required:
        - id
        - system_id
        - name
        - kind
        - definition
        - enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        system_id:
          type: string
          pattern: '^[0-9]{1,19}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Unique within the system.
        kind:
          $ref: '#/components/schemas/AuthFlowKind'
        definition:
          $ref: '#/components/schemas/FormDefinition'
        enabled:
          type: boolean
          description: Only enabled recipes are eligible for automatic login.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthFlowEnvelope:
      type: object
      description: One login recipe under the normal data envelope.
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AuthFlow'
    AuthFlowList:
      type: object
      description: One cursor page of login recipes, ordered by ID ascending.
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuthFlow'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CreateAuthFlowRequest:
      type: object
      description: Body of `POST /api/resources/auth-flows`.
      required: [system_id, name, definition]
      properties:
        system_id:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: P2 system ID (decimal string) that owns the recipe.
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/AuthFlowKind'
        definition:
          $ref: '#/components/schemas/FormDefinition'
        enabled:
          type: boolean
          default: true
    UpdateAuthFlowRequest:
      type: object
      description: |
        Body of `PATCH /api/resources/auth-flows/{id}`. Every field is
        optional; omitted fields are unchanged, and the ID and owning system
        are immutable.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/AuthFlowKind'
        definition:
          $ref: '#/components/schemas/FormDefinition'
        enabled:
          type: boolean
    ExecutionErrorReason:
      type: string
      description: |
        Closed set of the P6 `error.details.reason` / case-run failure reason
        identifiers (spec §6.4 plus the request-level `invalid_pause_mode`).
        HTTP mapping: `version_not_executable`, `environment_required`,
        `baseline_required`, `baseline_changed`, `batch_active`, `no_cases`,
        `batch_finished`, `already_paused`, `not_paused` and
        `case_run_terminal` are 409 conflicts (`error.code=conflict`);
        `too_many_cases`, `invalid_case_ids`, `invalid_pause_mode` and
        `export_failed` are 422 validation errors
        (`error.code=invalid_argument`); `executor_unavailable` and
        `session_unavailable` are retryable 503s
        (`error.code=unavailable`); `auth_flow_invalid` is a 422 on the
        login-recipe/access endpoints. The remaining values are case-outcome
        reasons carried by a case run's `failure_reason` (and in the event
        detail), not by an HTTP error: `evidence_missing`,
        `unsupported_assertion_kind` and `takeover_required`.
        `executor_unavailable` and `session_unavailable` are also used as case
        failure reasons when the executor or the login session becomes
        unavailable mid-run.
      enum:
        - version_not_executable
        - baseline_required
        - baseline_changed
        - batch_active
        - no_cases
        - too_many_cases
        - invalid_case_ids
        - environment_required
        - batch_finished
        - already_paused
        - not_paused
        - case_run_terminal
        - evidence_missing
        - executor_unavailable
        - session_unavailable
        - unsupported_assertion_kind
        - export_failed
        - auth_flow_invalid
        - takeover_required
        - invalid_pause_mode
