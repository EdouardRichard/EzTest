        decisions: {type: array, items: {$ref: '#/components/schemas/HandoffDecision'}}
        open: {type: array, items: {$ref: '#/components/schemas/HandoffOpen'}}
        plan: {$ref: '#/components/schemas/HandoffPlan'}
        resources: {$ref: '#/components/schemas/HandoffResources'}

