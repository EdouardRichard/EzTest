    WaiveCloseView:
      type: object
      description: |
        豁免关闭响应（v0.2.4-G SC-G11）：waived-closed 版本投影 + 同步发布的 unverified 报告 revision。
        status 恒 completed、closure_kind 恒 waived、unverified 恒 true。
      required: [version_id, status, closure_kind, unverified, close_reason, report_id, report_revision]
      properties:
        version_id:
          type: string
          pattern: '^[0-9]+$'
        status:
          type: string
          enum: [initial, running, completed]
          description: |
            今日恒为 completed——豁免关闭走唯一终态入口（CloseWaived），不回写 initial/running。
            本 enum 是 version.Statuses() 的权威副本：W1 枚举门
            （backend/internal/version/domain/enum_authority_test.go）要求它与该权威精确相等，
            故不得收窄为 [completed]；确需收窄为 status 子集时，须先为该守卫增加 status 子集豁免。
