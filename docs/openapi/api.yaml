        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/RequirementPathId'
      responses:
        '200':
          description: All attachment metadata of the requirement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementAttachmentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [versions]
      summary: Upload an attachment to a draft requirement
      description: |
        Multipart upload with the single field `file`. Allowed MIME types are
        `text/plain`, `text/markdown`, `application/json`, `application/yaml`,
        `text/yaml`, `image/png` and `image/jpeg` (the extension must match);
        each file is at most 10 MiB, at most 10 files are allowed per
        requirement and 50 per version. Upload and delete require a `draft`
