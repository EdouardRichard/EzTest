          description: 一次最多 200 条（P1 常量）
          items:
            type: string
            pattern: '^[0-9]+$'
    BatchConfirmResult:
      type: object
      required: [batch_id, confirmed, skipped]
      properties:
        batch_id:
          type: string
        confirmed:
          type: array
          description: 本次新确认的需求 ID
          items:
            type: string
            pattern: '^[0-9]+$'
        skipped:
          type: array
          description: 已确认并幂等跳过的需求 ID
          items:
            type: string
            pattern: '^[0-9]+$'
    RequirementDedupeResult:
      type: object
      description: draft 去重结果；kept_ids 为所有仍保留的 draft（含未分组的唯一条目），obsolete_ids 只含本次退休的重复草案
      required: [kept_ids, obsolete_ids]
      properties:
        kept_ids:
          type: array
          description: 本次扫描后仍保留的全部 draft 需求 ID（含未参与重复分组的唯一条目；十进制字符串）
          items:
            type: string
            pattern: '^[0-9]+$'
        obsolete_ids:
          type: array
          description: 本次被置为 obsolete 的重复草案需求 ID；为空表示没有需求被退休（十进制字符串）
          items:
            type: string
            pattern: '^[0-9]+$'
    RequirementMergeRequest:
      type: object
      required: [target_requirement_id, source_requirement_ids]
      properties:
        target_requirement_id:
          type: string
          pattern: '^[0-9]+$'
          description: 保留的 draft 目标需求 ID
        source_requirement_ids:
          type: array
          minItems: 1
          maxItems: 200
          description: 被合并的 draft 源需求 ID；重复 ID 去重，包含目标 ID 或超过 200 个返回 400
          items:
            type: string
            pattern: '^[0-9]+$'
    RequirementMergeResult:
      type: object
      description: 合并后的目标需求与已退休的源需求
      required: [requirement, merged_ids]
      properties:
        requirement:
          $ref: '#/components/schemas/RequirementDetail'
        merged_ids:
          type: array
          description: 被合并并置为 obsolete 的源需求 ID（十进制字符串）
          items:
            type: string
            pattern: '^[0-9]+$'
