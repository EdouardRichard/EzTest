      description: |
        Creates a session from a Playwright storage-state document or a token
        header map and runs the environment login_check. The response session is
        valid or needs_manual and includes latestSnapshot. storageState and the
        token headers are write-only; they never appear in a response.
      operationId: importSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceAccessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportSessionRequest'
            example:
              environmentId: 12
              kind: storage_state
              storageState:
                cookies: []
                origins: []
              note: manual import
      responses:
        '201':
          description: The created session with its latest snapshot.
          content:
