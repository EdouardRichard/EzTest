          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/enter-design:
    post:
      tags: [versions]
      summary: Move a clarifying version into design
      description: |
        `clarifying → designing`. When unclarified requirements or version-level
        open questions exist, the first call without
        `acknowledgeUnclarified=true` returns 409 `unclarified_requirements`
