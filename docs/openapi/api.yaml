      summary: 发现侧覆盖矩阵（API-39）
      description: |
        R-EX-5 / W1。按 page/api 聚合该版本的执行期观测：`observed` 为按
        `resource_template` 去重后的观测条数（重复观测行不重复计数），
        `proposed/approved/rejected/out_of_scope` 为对应决策的行计数，
        `uncovered` 为 decision=proposed 的资源身份（去重、升序、最多 200
        条）：API 为 `"METHOD template"`（同一 path 的 GET/POST 是两项，符合
