              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [pages, apis]
                    properties:
                      pages:
                        type: object
                        required: [observed, proposed, approved, rejected, out_of_scope, uncovered]
                        additionalProperties: false
                        properties:
