      description: Decision accepted by `POST /review`.
      enum: [approve, reject]
    ReviewStatus:
      type: string
      description: Review-round status.
      enum: [draft, approved, rejected]
    FindingCategory:
      type: string
      description: Review-finding category.
      enum: [coverage, assertion, executability, duplicate, code_uncovered, other]
    FindingSeverity:
      type: string
      description: Review-finding severity; only `blocker` gates an approval.
      enum: [blocker, major, minor, info]
    FindingStatus:
      type: string
      description: Review-finding status.
      enum: [open, fixed, dismissed]
    FindingSource:
      type: string
      description: Review-finding origin.
      enum: [ai, human]
    ExportFormat:
      type: string
      description: |
        Server-generated export formats (D38). PNG is rendered client-side from
        the SVG canvas and is not a server export format.
      enum: [markdown, mermaid, opml]
    CaseStepView:
      type: object
      description: |
        One ordered action of a case (spec §7.3). `seq` starts at 1 and stays
        contiguous; a case has 1-30 steps.
      required: [id, seq, action, expected, data, source]
      properties:
        id:
