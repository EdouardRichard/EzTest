      幂等重放**——重复回滚原样返回已存替代修订（pre-E 遗留 confirmed 替代修订，或已被人工确认的
      post-E 替代修订；代码事实 discovery_revision.go 幂等预检/锁内重放路径）。
    - **`case.revision.auto_confirmed` 语义变更（已发布事件，名不副实，通知期登记）**：
      R-E2r 后该事件**仅由 Rollback 路径发出**，且宣告的是 **draft 替代修订的创建**，不是自动确认
      （payload.trigger=rollback、rollback_of 非零、confidence 恒 "high" 为遗留字段、actor=操作者
      十进制 ID）。**本次不改名**（改名=删除已发布契约，须独立裁定；其唯一生产者随 API-41 于 0.3
      退役，事件随之退役）；消费者必须按"rollback 替代 draft 已创建"处理，不得再据此渲染
      "已自动确认"。语义变更+退役计划见发布说明 E 章节（宪法六.6 通知期）。
      **payload 追加 `status`（additive，最终修复波）**：值为发布时该替代修订的权威生命周期状态，
      与 `CaseRevisionRollbackView.status` 同源。**现行取值恒为 `draft`**——事件只在新建替代修订时
      发出，两条幂等重放路径（锁外预检 / 锁内并发重放）原样返回已存替代修订且**不发事件**
      （代码事实 discovery_revision.go:343-347 / 444-450）。该字段是防御性硬化：只读 payload 的
      消费者不必再从名不副实的事件名推断状态，也不会把 draft 误读为已确认。
      完整 payload：`{version_id, case_id, case_version_id, status, trigger,
      source_observation_id, resource_id, rollback_of, confidence, actor}`。
