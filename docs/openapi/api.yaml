          type: string
          enum: [human, service]
        notes:
          type: string
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their stored value. The key is immutable.
      properties:
        label:
          type: string
        username:
          type: string
        kind:
          type: string
          enum: [human, service]
        notes:
          type: string
        status:
          type: string
          enum: [active, disabled]
    CreateAccessRequest:
      type: object
      required: [systemId, authType, concurrencyLimit]
      additionalProperties: false
      properties:
        systemId:
          type: integer
          format: int64
          minimum: 1
        authType:
          type: string
          enum: [password, sso, token, apikey, basic, manual]
        credential:
          type: string
          writeOnly: true
          description: Write-only; never returned.
        usernameOverride:
          type: string
        loginUrl:
          type: string
        enabled:
          type: boolean
          default: true
        concurrencyLimit:
          type: integer
          minimum: 1
          maximum: 100
        sessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          nullable: true
        permissionNote:
          type: string
    UpdateAccessRequest:
      type: object
      additionalProperties: false
      description: |
        Partial update. credential follows the write-only rule: omitted keeps
        the stored value, "" clears it and a non-empty value replaces it. An
        explicit "sessionTtlSeconds": null clears the TTL override. systemId is
        accepted for form compatibility and ignored.
      properties:
        authType:
          type: string
          enum: [password, sso, token, apikey, basic, manual]
        credential:
          type: string
          writeOnly: true
        usernameOverride:
          type: string
        loginUrl:
          type: string
        permissionNote:
          type: string
        enabled:
          type: boolean
        concurrencyLimit:
          type: integer
          minimum: 1
          maximum: 100
        systemId:
          type: integer
          format: int64
        sessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          nullable: true
    ImportSessionRequest:
      type: object
      required: [environmentId]
      additionalProperties: false
      properties:
        environmentId:
          type: integer
          format: int64
          minimum: 1
          description: Must belong to the access's system.
        kind:
          type: string
          enum: [storage_state, token]
          description: Omitted infers token when headers are present, storage_state otherwise.
        storageState:
          type: object
          additionalProperties: true
          writeOnly: true
          description: Playwright storageState document (cookies and origins). Write-only; never returned.
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Token headers such as Authorization. Write-only; never returned.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Explicit expiry; omitted computes min(now+TTL, earliest cookie expiry).
        note:
          type: string
    ConfirmSessionRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    RequestTakeoverRequest:
