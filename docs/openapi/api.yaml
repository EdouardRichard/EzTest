        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Exact status filter.
          schema:
            type: string
            enum: [active, disabled]
        - name: kind
          in: query
          required: false
          description: Exact system kind filter.
          schema:
            type: string
            enum: [web, api]
      responses:
        '200':
          description: One page of systems.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ResourceInvalid'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [resources]
      summary: Create a system (admin only)
      description: The company is fixed to the seeded default one; requests never carry a companyId.
