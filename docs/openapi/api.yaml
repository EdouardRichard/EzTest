  /api/jobs/{id}/cancel:
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: 取消作业（登录用户；canonical 路由）
      description: |
        取消 open/claimed/running 的作业（`waiting_human` 与终态不可取消，返回 409 `state_conflict`）。
        服务端清 lease/关闭活动 attempt，并把行存为 `failed` + `last_error="cancelled by user"` +
        `attempts=GREATEST(attempts,max_attempts)` 耗尽标记（无 schema 变更的终态表示）；API/事件投影为 `state=cancelled`，
        `attempts` 返回取消前的真实值。成功动作写一条 `job.canceled` 审计并发布 `job.canceled`，
        随后恰好一次 `job.finished{status:"cancelled"}`。取消不幂等：再次 cancel 返回 409。
        作业归属按自身 version 校验；不自动切模型（D24）。legacy（P0–P8）`kind=''` 的旧 work_item
        不进入 0.2.1 作业控制，按 not_found 处理（避免与旧 attempt 编号冲突）。
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 取消后的作业
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/JobView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
