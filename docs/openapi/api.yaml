        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/requirements/{rid}/attachments:
    get:
      tags: [versions]
      summary: List the attachments of a requirement
      description: Metadata only; `storagePath` is never returned and the files stay behind the authenticated download endpoint.
      operationId: listRequirementAttachments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/RequirementPathId'
      responses:
        '200':
          description: All attachment metadata of the requirement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementAttachmentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [versions]
      summary: Upload an attachment to a draft requirement
      description: |
        Multipart upload with the single field `file`. Allowed MIME types are
        `text/plain`, `text/markdown`, `application/json`, `application/yaml`,
        `text/yaml`, `image/png` and `image/jpeg` (the extension must match);
        each file is at most 10 MiB, at most 10 files are allowed per
        requirement and 50 per version. Upload and delete require a `draft`
        requirement. The same `sha256` may appear only once per requirement
        (409 `duplicate_attachment`). Returns 201 with metadata only.
      operationId: uploadRequirementAttachment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/RequirementPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: The stored attachment metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementAttachmentEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/requirements/{rid}/attachments/{aid}/content:
    get:
      tags: [versions]
      summary: Download an attachment
      description: |
        Streams the stored bytes with the MIME type persisted at upload time,
        an inline RFC 5987 `Content-Disposition` filename and
        `X-Content-Type-Options: nosniff`. Available to any authenticated user.
      operationId: downloadRequirementAttachment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/RequirementPathId'
        - $ref: '#/components/parameters/AttachmentPathId'
      responses:
        '200':
          description: The raw attachment content.
          headers:
            Content-Disposition:
              description: Inline with a UTF-8 `filename*` parameter.
              schema:
                type: string
            X-Content-Type-Options:
              description: Always `nosniff`.
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/requirements/{rid}/attachments/{aid}:
    delete:
      tags: [versions]
      summary: Delete an attachment
      description: Deletes the metadata first and then removes the file best-effort; only `draft` requirements allow it.
      operationId: deleteRequirementAttachment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/RequirementPathId'
        - $ref: '#/components/parameters/AttachmentPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The attachment was deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/relations:
    get:
      tags: [versions]
      summary: List all requirement relations of a version
      description: |
        Every relation of the version, ordered by `id`. The endpoint has no
        pagination and returns at most 500 relations.
      operationId: listRequirementRelations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
      responses:
        '200':
          description: All relations of the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementRelationList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [versions]
      summary: Create a requirement relation
      description: |
        Both endpoints must be requirements of this version and must differ.
        `depends_on` is directed; the other three types are normalized as
        undirected for duplicate detection. A duplicate returns 409
        `duplicate_relation`; a cross-version endpoint returns 422
        `relation_requirement_mismatch`. Returns 201.
      operationId: createRequirementRelation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRelationRequest'
      responses:
        '201':
          description: The created relation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementRelationEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/relations/{relId}:
    patch:
      tags: [versions]
      summary: Edit a requirement relation
      description: Changes `relationType` and/or `description`; relations have no revision field.
      operationId: updateRequirementRelation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/RelationPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRelationRequest'
      responses:
        '200':
          description: The updated relation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementRelationEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [versions]
      summary: Delete a requirement relation
      operationId: deleteRequirementRelation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/RelationPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The relation was deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/clarification:
    get:
      tags: [versions]
      summary: Read the clarification overview of a version
      description: |
        The active clarification session, if any, plus per-status question and
        decision counters and the agent-maintained `contextSummary`.
      operationId: getVersionClarification
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
      responses:
        '200':
          description: The clarification overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationOverviewEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/clarification/sessions:
    post:
      tags: [versions]
      summary: Start a clarification session
      description: |
        Creates a P1 Agent session with profile `clarification-dialog` on
        `channel=version:{id}` and an `active` P3 session row. Requires the
        version to be `clarifying` or `designing` and a version without an
        active session (409 `clarification_session_active`). Returns 201. An
        unavailable AI runtime is 503 `ai_unavailable`.
      operationId: startClarificationSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The started session (`{id, status, agentSessionId, startedAt}`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationSessionStartedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '503':
          $ref: '#/components/responses/VersionUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/clarification/sessions/{sid}/complete:
    post:
      tags: [versions]
      summary: Complete the active clarification session
      description: |
        `active → completed`. The version channel must have no running Agent
        run; otherwise 409 `agent_busy`. A non-active session returns 409
        `clarification_session_not_active`.
      operationId: completeClarificationSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ClarificationSessionPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The completed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/clarification/messages:
    get:
      tags: [versions]
      summary: Read the clarification conversation
      description: |
        The persisted P1 `agent_messages` projection, oldest first, with
        `role=system` messages filtered out. `before_id` is a P1 message ID
        (integer), not a P3 snowflake string. `next_cursor` is a decimal string
        encoding the oldest P1 message ID of the page; to fetch older messages,
        parse it as an integer and pass that value as `before_id`.
      operationId: listClarificationMessages
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/BeforeId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of clarification messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationMessagePage'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [versions]
      summary: Send a clarification message
      description: |
        Sends a 1-5000 character text message through the active session's P1
        Agent run and returns 202 with the started run. Requires an active
        session (`clarification_session_not_active`) and an idle version channel
        (`agent_busy`). An unavailable AI runtime returns 503 `ai_unavailable`
        with `retryable: true`; the user keeps the draft in the UI.
      operationId: sendClarificationMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendClarificationMessageRequest'
      responses:
        '202':
          description: The started Agent run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendClarificationMessageResultEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '503':
          $ref: '#/components/responses/VersionUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/clarification/analyze:
    post:
      tags: [versions]
      summary: Run a one-shot requirement analysis
      description: |
        Starts a `requirement-analysis` Agent run on the version channel and
        returns 202. The version must have an active clarification session
        (409 `clarification_session_required`) and no running Agent
        (409 `agent_busy`). The run itself publishes events through the normal
        channel; there is no P3 session row for the one-shot run.
      operationId: analyzeVersionRequirements
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The started Agent run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationRunResultEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '503':
          $ref: '#/components/responses/VersionUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/clarification/recon:
    post:
      tags: [versions]
      summary: Run a one-shot context reconnaissance
      description: |
        Starts a `context-recon` Agent run that injects the bound text
        attachments (at most 64 KiB per file and 200 KiB per run) and at most
        two images (2 MiB each) as `image_ref` parts. Requires an active session
        and an idle version channel; returns 202. Data URLs are generated only
        in memory for the LLM call and never persisted or logged.
      operationId: reconVersionContext
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The started Agent run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationRunResultEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '503':
          $ref: '#/components/responses/VersionUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/clarification/questions:
    get:
      tags: [versions]
      summary: List clarification questions
      description: |
        One cursor page ordered by `id` ascending. Filters: `status` and
        `requirementId` (a P3 decimal string; omit for version-level and
        requirement-level questions together).
      operationId: listClarificationQuestions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/QuestionStatusFilter'
        - $ref: '#/components/parameters/QuestionRequirementFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationQuestionPage'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [versions]
      summary: Add a clarification question
      description: |
        Creates an `open` question with `source=user`. `requirementId` is a P3
        string and must belong to this version; omit it for a version-level
        question. The question text is at most 2000 characters. Returns 201.
      operationId: createClarificationQuestion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClarificationQuestionRequest'
      responses:
        '201':
          description: The created question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationQuestionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/clarification/questions/{qid}:
    patch:
      tags: [versions]
      summary: Answer, dismiss, reopen or edit a question
      description: |
        State transitions: `open → answered` (a non-empty `answer` is required),
        `open → dismissed`, and `answered|dismissed → open` (which clears the
        answer fields). Reopening or answering the wrong state returns 409
        `clarification_question_state_conflict`. The text may also be corrected
        without a state change; AI callers may only touch open questions.
      operationId: updateClarificationQuestion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/QuestionPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClarificationQuestionRequest'
      responses:
        '200':
          description: The updated question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationQuestionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/decisions:
    get:
      tags: [versions]
      summary: List clarification decisions
      description: One cursor page ordered by `id` ascending, optionally filtered by `status`.
      operationId: listDecisions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/DecisionStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of decisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationDecisionPage'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [versions]
      summary: Record a manual decision
      description: |
        A human-authored decision is stored as `accepted` with `source=user`
        (201). `requirementId`/`questionId` are P3 strings and must belong to
        this version. Accepting a decision linked to an open question answers
        that question in the same transaction.
      operationId: createDecision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDecisionRequest'
      responses:
        '201':
          description: The recorded decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationDecisionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/decisions/{did}:
    patch:
      tags: [versions]
      summary: Accept or reject a proposed decision
      description: |
        Only a `proposed` decision can transition (to `accepted` or `rejected`
        with an optional rejection `rationale`); accepted/rejected are terminal
        and a second change returns 409 `decision_state_conflict`. Accepting a
        decision linked to an open question answers that question in the same
        transaction.
      operationId: updateDecision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/DecisionPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDecisionRequest'
      responses:
        '200':
          description: The decided record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationDecisionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/events:
    get:
      tags: [versions]
      summary: Snapshot the newest events of a version channel
      description: |
        Returns the newest persisted events before `before_seq` plus the
        channel's current `snapshot_cursor`. Unlike the P0 snapshot, the P3
        response is flat: `{"data":[...], "snapshot_cursor", "has_more"}`.
        Events are the same V1 envelope used by `/api/stream[/events]`, with
        `channel=version:{id}` and a decimal-string `version_id`.
      operationId: getVersionEventSnapshot
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BeforeSeq'
      responses:
        '200':
          description: The version event snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionEventSnapshot'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/stream:
    get:
      tags: [versions, stream]
      summary: Stream version events as Server-Sent Events
      description: |
        Opens the SSE stream for the fixed `channel=version:{id}`. The version
        must exist (404 `not_found`); a client-supplied `?channel=` is ignored so
        the channel cannot be overridden. `Last-Event-ID` (reset automatically
        by browsers on reconnect) takes precedence over `?since`; omit both for
        live-only. Frames use `id: <seq>`, `event: <type>` and
        `data: <event envelope>`; the server sends a `: ping` comment every 20
        seconds. When the cursor is too old the server emits a synthetic
        `stream.reset` frame (no id) and the client must fetch a fresh
        `/events` snapshot. Duplicate seqs are never delivered.
      operationId: streamVersionEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          description: |
            An endless `text/event-stream`. The `X-Snapshot-Cursor` response
            header announces the version channel's current seq at connect time.
          headers:
            X-Snapshot-Cursor:
              description: The version channel's latest seq when the stream opened.
              schema:
                type: integer
                format: int64
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 42
                event: clarification.question_updated
                data: {"seq":42,"channel":"version:1844674407370955161","type":"clarification.question_updated","version_id":"1844674407370955161","batch_id":null,"case_id":null,"step_id":null,"agent_role":null,"session_id":"1844674407370955162","ts":"2026-10-27T08:00:00Z","summary":"clarification question updated","detail":{"questionId":"1844674407370955163","status":"open"},"refs":{"evidence":[],"case":[],"requirement":[],"code":[]}}

                : ping
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/changes:
    get:
      tags: [code]
      summary: Read a version-scoped change preview
      description: |
        Every authenticated user. Resolves the version's repository and baseline
        commit, computes the live diff to `head` (default: the repository fixed
        branch tip) and returns the shared `ChangeList` inside the normal
        `{"data":...}` envelope. The read never writes a change set: when no
        persisted change set exists for the pair, `changeSetId` is null.
      operationId: getVersionCodeChanges
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - name: head
          in: query
          required: false
          description: Head 40-hex commit; omitted/empty resolves the fixed branch tip.
          schema:
            type: string
      responses:
        '200':
          description: The version change preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/analyses:
    post:
      tags: [code]
      summary: Trigger or reuse a version impact analysis
      description: |
        Every authenticated user. The request body is required and must be a
        JSON object; `{headCommit?, force?}` are both optional, so `{}` is a
        valid trigger (fixed-branch tip, `force=false`) while a missing/empty
        body is 400 `invalid_argument` (`invalid_json`). A new run returns 202
        with `reused=false`; an identical completed run (same
        version/base/head/model/prompt, without `force`) returns 200
        `reused=true` and the existing id. `force=true` creates
        `analysisVersion+1` and never overwrites the old analysis. A reusable
        done analysis wins over the active-run rule; otherwise a queued/running
        analysis for the same version is 409 `analysis_in_progress`, and a full
        worker queue is 429 `analysis_queue_full` (retryable). The analysis
        itself is asynchronous; poll `/analyses/{analysisId}` or
        `/analyses/latest`.
      operationId: startVersionCodeAnalysis
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAnalysisRequest'
            example:
              headCommit: '89abcdef0123456789abcdef0123456789abcdef'
              force: false
      responses:
        '202':
          description: A new analysis run was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAnalysisResultEnvelope'
              example:
                data:
                  id: '1844674407370955162'
                  status: queued
                  analysisVersion: 1
                  reused: false
        '200':
          description: An identical analysis was reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAnalysisResultEnvelope'
              example:
                data:
                  id: '1844674407370955162'
                  status: done
                  analysisVersion: 1
                  reused: true
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CodeConflict'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '429':
          $ref: '#/components/responses/CodeQueueFull'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/analyses/latest:
    get:
      tags: [code]
      summary: Read the latest impact analysis of a version
      description: |
        Every authenticated user. Returns the newest analysis with its
        candidates, unmapped changes, fact-version snapshot and stats. 404
        `analysis_not_found` before the first analysis.
      operationId: getLatestVersionCodeAnalysis
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
      responses:
        '200':
          description: The latest analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/analyses/{analysisId}:
    get:
      tags: [code]
      summary: Read one impact analysis of a version
      description: |
        Every authenticated user. An analysis of another version is 404
        `analysis_not_found`. The response includes `changeSummary`, stats,
        `factVersions`, candidates, unmapped changes and non-fatal errors.
      operationId: getVersionCodeAnalysis
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - $ref: '#/components/parameters/CodeAnalysisId'
      responses:
        '200':
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisEnvelope'
              example:
                data:
                  id: '1844674407370955162'
                  versionId: '1844674407370955161'
                  repoId: 3
                  baseCommit: '0123456789abcdef0123456789abcdef01234567'
                  headCommit: '89abcdef0123456789abcdef0123456789abcdef'
                  status: done
                  degraded: false
                  analysisVersion: 1
                  model: example-model
                  promptVersion: p4.1
                  changeSetId: '1844674407370955163'
                  changeSummary: Example change summary.
                  stats:
                    changedFiles: 2
                    analyzedFiles: 2
                    cacheHits: 0
                    facts: 4
                    edges: 1
                    contracts: 1
                    evidenceChecks: 6
                    evidenceFailures: 0
                    unmapped: 1
                    invalidFacts: 0
                    duplicateFacts: 0
                    unmatchedContracts: 0
                    truncated: false
                    unmappedTruncated: false
                    skipped: 0
                  factVersions:
                    - factKey: 'api:POST /api/example'
                      version: 1
                  candidates:
                    - id: '1844674407370955164'
                      subjectKind: requirement
                      subjectId: '1844674407370955165'
                      reason: changed file src/example.ts
                      confidence: high
                      source: direct
                      evidence:
                        - file: src/example.ts
                      selected: true
                  unmapped:
                    - path: docs/example.md
                      status: M
                      reason: no_fact_or_anchor
                      suggestion: Confirm the impact manually.
                  errors: []
                  createdBy: 1
                  createdAt: '2026-10-28T01:00:00Z'
                  startedAt: '2026-10-28T01:00:01Z'
                  finishedAt: '2026-10-28T01:00:20Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/analyses/{analysisId}/candidates/{candidateId}:
    patch:
      tags: [code]
      summary: Adjust one impact candidate's manual selection
      description: |
        Every authenticated user. Body `{selected: bool}`. Only a completed
        analysis can be adjusted; a queued/running analysis is 409
        `analysis_not_done`. The response is the updated candidate. The change
        is persisted but does not alter the analysis status.
      operationId: patchVersionCodeAnalysisCandidate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - $ref: '#/components/parameters/CodeAnalysisId'
        - $ref: '#/components/parameters/CodeCandidateId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCandidateRequest'
            example:
              selected: true
      responses:
        '200':
          description: The updated candidate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '409':
          $ref: '#/components/responses/CodeConflict'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/anchors:
    get:
      tags: [code]
      summary: List the code anchors of a version
      description: |
        Every authenticated user. Optional `subjectKind`/`subjectId` exact
        filters. The response is the normal `{"data":[...]}` envelope (no
        pagination); anchor ids and subject ids are decimal strings. An unknown
        version returns 200 with an empty list, not 404.
      operationId: listVersionCodeAnchors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - name: subjectKind
          in: query
          required: false
          description: Exact subject kind filter.
          schema:
            $ref: '#/components/schemas/AnchorSubjectKind'
        - name: subjectId
          in: query
          required: false
          description: Exact decimal-string subject id filter.
          schema:
            type: string
            pattern: '^[0-9]{1,19}$'
      responses:
        '200':
          description: The anchors of the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [code]
      summary: Create a code anchor
      description: |
        Every authenticated user. Accepts `requirement`, `app_model`, `version`
        and (P5, D37) `case` subjects; only `issue` is 422
        `unsupported_subject_kind`. The requirement must belong to the version
        and an app-model subject requires the version's system binding; a
        `case` subject is accepted here for completeness, while case anchors are
        normally created through the mindmap endpoints, which validate that the
        case belongs to the version. The file must exist at the fixed branch
        tip. A duplicate subject/file/line-range anchor is 409
        `anchor_duplicate`. Returns 201 with the created anchor.
      operationId: createVersionCodeAnchor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnchorRequest'
            example:
              subjectKind: requirement
              subjectId: '1844674407370955165'
              filePath: src/example.ts
              startLine: 10
              endLine: 12
      responses:
        '201':
          description: The created anchor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CodeConflict'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/anchors/{anchorId}:
    delete:
      tags: [code]
      summary: Delete a code anchor
      description: |
        Every authenticated user. The anchor must belong to the version; an
        unknown/other-version anchor is 404 `anchor_not_found`. Returns 204.
      operationId: deleteVersionCodeAnchor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - $ref: '#/components/parameters/CodeAnchorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The anchor was deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/mindmap:
    get:
      tags: [mindmap]
      summary: Read the case-mindmap graph of a version
      description: |
        Every authenticated user. Returns the whole graph snapshot: scenario and
        case nodes (each with steps, assertions, sources and anchors), the
        requirement coverage projection, the frozen baseline (null before
        approval), the latest run per kind and the read-only P4 impact hints.
        `include` is a comma-separated subset of `anchors,findings,impact`
        (default: all sections). Omitting a section never removes its key:
        `anchors` and `impactCases` are always arrays (empty when omitted),
        while `findings` is present only when `include=findings`. `editable` is
        server-owned (`versionStatus` is `designing`/`reviewing` and no baseline
        is frozen) and must never be inferred by the client. The P5 hard cap is
        300 nodes (a bigger graph is 409 `graph_too_large`); the
        `X-Graph-Truncated` header is `false` only when every node was
        returned.
      operationId: getVersionMindmap
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapInclude'
      responses:
        '200':
          description: The graph snapshot.
          headers:
            X-Graph-Truncated:
              description: '`false` only when every node was returned; the P5 hard cap is 300 nodes.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MindmapEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/nodes:
    post:
      tags: [mindmap]
      summary: Create a scenario or case node
      description: |
        Every authenticated user. Adds one node to the graph and returns 201
        with it. A `scenario` may nest at most two levels below the version root;
        a `case` is a leaf and can never have children. A case must end with at
        least one step, one assertion and one requirement source before
        `submit-review`, but creation does not require them yet. `parentId`
        omitted or null creates a root node. `requirementIds` must all belong to
        this version and be `clarified` (409 `unconfirmed_requirements`). Manual
        nodes default to `source=user_input`. The server appends the node to the
        end of its parent's child order. Writes are allowed only while the
        version is `designing`/`reviewing` and no baseline is frozen (409
        `version_state_conflict` / 409 `baseline_frozen`).
      operationId: createMindmapNode
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
            example:
              kind: case
              parentId: '1844674407370955201'
              title: Place an order
              priority: P1
              requirementIds: ['1844674407370955165']
      responses:
        '201':
          description: The created node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseNodeEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/nodes/{nodeId}:
    patch:
      tags: [mindmap]
      summary: Update one node (optimistic concurrency)
      description: |
        Every authenticated user. Patches the node content; omitted fields keep
        their stored value and `testData: null` clears the test-data document.
        `revision` is mandatory and must match the stored node revision
        (409 `case_revision_conflict` with the current revision when stale). A
        successful update increments `revision` by one. `requirementIds`, when
        present, replaces the requirement-source set and must not leave the case
        with zero requirement sources (409 `invalid_case_tree`). Frozen graphs
        reject every update with 409 `baseline_frozen`.
      operationId: updateMindmapNode
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapNodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeRequest'
            example:
              title: Place an order as a guest
              priority: P0
              revision: 3
      responses:
        '200':
          description: The updated node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseNodeEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
    delete:
      tags: [mindmap]
      summary: Delete one node and its subtree
      description: |
        Every authenticated user. Deletes the node, its whole scenario subtree,
        its steps, assertions, sources and (best-effort) case anchors. `revision`
        is mandatory and must match the stored node revision (409
        `case_revision_conflict`). Frozen graphs reject the delete with 409
        `baseline_frozen`. Returns 204 with no body.
      operationId: deleteMindmapNode
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapNodeId'
        - $ref: '#/components/parameters/MindmapRevision'
      responses:
        '204':
          description: The node and its subtree were deleted.
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/order:
    put:
      tags: [mindmap]
      summary: Reorder all children of one parent
      description: |
        Every authenticated user. Replaces the child order below `parentId`
        (omitted or null: version root) in one transaction. `nodeIds` must list
        every child of that parent exactly once; a missing, duplicated or
        foreign child id is 409 `invalid_case_tree` with no write. This endpoint
        has no revision token: the last complete write wins (spec §6.5). Frozen
        graphs reject the reorder with 409 `baseline_frozen`. Returns 204.
      operationId: reorderMindmapNodes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
            example:
              parentId: '1844674407370955201'
              nodeIds: ['1844674407370955202', '1844674407370955203']
      responses:
        '204':
          description: The child order was replaced.
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/nodes/{nodeId}/steps:
    post:
      tags: [mindmap]
      summary: Add one step to a case
      description: |
        Every authenticated user. Appends a step to a `case` node (scenarios
        cannot own steps) and returns 201 with it. `afterSeq` inserts after that
        sequence; omitted appends at the end. The server keeps `seq` contiguous
        from 1 and refuses a 31st step with 409 `invalid_case_tree`. The step is
        authored as `source=user_input`; a case needs at least one step before
        `submit-review`.
      operationId: createMindmapStep
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapNodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStepRequest'
            example:
              action: Open the product page
              expected: The price and stock are shown
              afterSeq: 1
      responses:
        '201':
          description: The created step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseStepEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/steps/{stepId}:
    patch:
      tags: [mindmap]
      summary: Update one step (guarded by the node revision)
      description: |
        Every authenticated user. Patches the step; omitted fields keep their
        stored value. `nodeRevision` is mandatory and must match the owning case
        node revision (409 `case_revision_conflict`); a successful change
        increments the node revision by one. The step must belong to a case of
        this version (404 `step_not_found` otherwise).
      operationId: updateMindmapStep
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapStepId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStepRequest'
            example:
              expected: The confirmation dialog appears
              nodeRevision: 4
      responses:
        '200':
          description: The updated step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseStepEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
    delete:
      tags: [mindmap]
      summary: Delete one step and its assertions
      description: |
        Every authenticated user. Deletes the step, its assertions and
        renumbers the remaining steps contiguously. `nodeRevision` is mandatory
        and must match the owning case node revision (409
        `case_revision_conflict`). Returns 204.
      operationId: deleteMindmapStep
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapStepId'
        - $ref: '#/components/parameters/MindmapNodeRevision'
      responses:
        '204':
          description: The step and its assertions were deleted.
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/nodes/{nodeId}/steps/order:
    put:
      tags: [mindmap]
      summary: Reorder all steps of one case
      description: |
        Every authenticated user. Replaces the step order of the case in one
        transaction. `stepIds` must list every step of the case exactly once
        (409 `invalid_case_tree` otherwise) and the server renumbers `seq` from
        1. The owning node revision is incremented. Returns 204.
      operationId: reorderMindmapSteps
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapNodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderStepsRequest'
            example:
              stepIds: ['1844674407370955211', '1844674407370955212']
      responses:
        '204':
          description: The step order was replaced.
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/nodes/{nodeId}/assertions:
    post:
      tags: [mindmap]
      summary: Add one assertion to a case
      description: |
        Every authenticated user. Adds an assertion to a `case` node and returns
        201 with it. `stepId` omitted or null attaches the assertion to the
        whole case; otherwise the step must belong to the same case (409
        `invalid_case_tree`). A case needs at least one assertion before
        `submit-review`. The assertion is authored as `source=user_input`.
      operationId: createMindmapAssertion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapNodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssertionRequest'
            example:
              stepId: '1844674407370955211'
              kind: ui
              target: /order/confirm
              expression: The order number is not empty
              expected: An order number is generated
      responses:
        '201':
          description: The created assertion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAssertionEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/assertions/{assertionId}:
    patch:
      tags: [mindmap]
      summary: Update one assertion (guarded by the node revision)
      description: |
        Every authenticated user. Patches the assertion; omitted fields keep
        their stored value. `nodeRevision` is mandatory and must match the owning
        case node revision (409 `case_revision_conflict`); a successful change
        increments the node revision by one. The assertion must belong to a case
        of this version (404 `assertion_not_found` otherwise).
      operationId: updateMindmapAssertion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapAssertionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssertionRequest'
            example:
              expression: The order number matches the expected pattern
              nodeRevision: 5
      responses:
        '200':
          description: The updated assertion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAssertionEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
    delete:
      tags: [mindmap]
      summary: Delete one assertion
      description: |
        Every authenticated user. Deletes the assertion. `nodeRevision` is
        mandatory and must match the owning case node revision (409
        `case_revision_conflict`). The last remaining assertion of a case cannot
        be deleted (409 `invalid_case_tree`). Returns 204.
      operationId: deleteMindmapAssertion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapAssertionId'
        - $ref: '#/components/parameters/MindmapNodeRevision'
      responses:
        '204':
          description: The assertion was deleted.
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/nodes/{nodeId}/sources:
    post:
      tags: [mindmap]
      summary: Add one source to a case
      description: |
        Every authenticated user. Adds a `requirement`, `app_model`, `ai_run` or
        `manual` source to a `case` node (scenarios never carry sources) and
        returns 201. A `requirement` source must reference a requirement of this
        version with status `clarified` (404 `requirement_not_found` / 409
        `requirement_not_clarified`); `refId` is required except for `manual`
        sources. A duplicate `(refKind, refId, refKey)` is 409
        `duplicate_case_source`.
      operationId: createMindmapSource
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapNodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSourceRequest'
            example:
              refKind: requirement
              refId: '1844674407370955165'
      responses:
        '201':
          description: The created source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSourceEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/sources/{sourceId}:
    delete:
      tags: [mindmap]
      summary: Delete one case source
      description: |
        Every authenticated user. Deletes the source. Removing the last
        requirement source of a case would leave it uncovered and is 409
        `invalid_case_tree` (spec §6.2). Returns 204.
      operationId: deleteMindmapSource
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapSourceId'
      responses:
        '204':
          description: The source was deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/nodes/{nodeId}/anchors:
    post:
      tags: [mindmap]
      summary: Attach a code anchor to a case
      description: |
        Every authenticated user. Creates a codeintel anchor with
        `subject_kind=case` through the mindmap context (the case ownership is
        validated here; D37) and returns 201. The file must exist at the
        version's fixed code baseline commit; an unavailable code repository or
        baseline is 422 `code_repo_unavailable`. A duplicate
        subject/file/line-range anchor is a 409 conflict.
      operationId: createMindmapAnchor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapNodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAnchorRequest'
            example:
              filePath: src/order/submit.ts
              startLine: 120
              endLine: 140
              confidence: high
      responses:
        '201':
          description: The created anchor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MindmapAnchorEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/anchors/{anchorId}:
    delete:
      tags: [mindmap]
      summary: Delete a case code anchor
      description: |
        Deletes the anchor when the caller is an administrator or the anchor
        creator (403 `forbidden` otherwise). The anchor must be a `case` anchor
        of this version (404 `anchor_not_found`). Frozen graphs reject the
        delete with 409 `baseline_frozen`. Returns 204.
      operationId: deleteMindmapAnchor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapAnchorId'
      responses:
        '204':
          description: The anchor was deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MindmapForbidden'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/runs:
    post:
      tags: [mindmap]
      summary: Start one mindmap Agent run
      description: |
        Every authenticated user, except `kind=explore`, which is
        administrator-only (403 `forbidden`). Creates a `case_design_run` and
        returns 202 with its decimal-string id; the run itself is asynchronous
        (poll `GET /runs/{runId}` and subscribe to the `version:{id}` SSE
        channel). Only one queued/running run per `(version, kind)` is allowed:
        a concurrent start is 409 `run_in_progress`. Runs are allowed only while
        the version is `designing`/`reviewing` (409 `version_state_conflict`);
        `explore` additionally needs the version's system and environment
        bindings (409 `exploration_requires_environment`). `design` accepts
        `mode=append` (default) or `mode=replace`, and `replace` must carry
        `confirmReplace=true` (422 otherwise). `data_plan` takes the target
        `nodeIds` (at most 60). `explore` accepts `systemId`/`environmentId`,
        an optional `sessionId` and at most 10 `startPaths`. If the Agent
        runtime cannot start, the run is failed with reason `ai_unavailable`
        and the call is 409 `ai_unavailable`; a missing LLM configuration still
        creates the run (response 202) and fails it asynchronously per spec
        §8.5. Failure reasons are carried in the run's `errors`/`reason`, never
        as LLM or mindmap bodies.
      operationId: startMindmapRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
            example:
              kind: design
              mode: append
      responses:
        '202':
          description: The run was accepted and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartRunResultEnvelope'
              example:
                data:
                  runId: '1844674407370955301'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MindmapForbidden'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
    get:
      tags: [mindmap]
      summary: List the mindmap runs of a version
      description: |
        Every authenticated user. Returns one cursor page of run summaries
        (newest first), optionally filtered by `kind` and `status`. Run details
        never include LLM input/output or mindmap bodies.
      operationId: listMindmapRuns
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapRunKindFilter'
        - $ref: '#/components/parameters/MindmapRunStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MindmapListEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/runs/{runId}:
    get:
      tags: [mindmap]
      summary: Read one mindmap run
      description: |
        Every authenticated user. Returns `status`, `reason`, `stats`, `errors`
        and the P1 session/run ids; a run of another version is 404
        `run_not_found`. LLM input/output and proposal bodies are never
        returned.
      operationId: getMindmapRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapRunId'
      responses:
        '200':
          description: The run detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseRunEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/submit-review:
    post:
      tags: [mindmap]
      summary: Submit the current graph for review
      description: |
        Every authenticated user. Moves the version `designing → reviewing`
        (idempotent: a version already `reviewing` is returned unchanged with no
        duplicate event) and returns 200 with the updated version. The graph
        must contain at least one case (`no_cases`) and satisfy every tree rule
        (`invalid_case_tree`): a case has at least one step, one assertion and
        one clarified requirement source, step sequences are contiguous and a
        case is a leaf. A version outside `designing` is 409
        `version_state_conflict`. The request body is ignored (`{}` is
        accepted).
      operationId: submitMindmapReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The version in status `reviewing`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitReviewResultEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/review:
    post:
      tags: [mindmap]
      summary: Approve or reject the reviewed graph
      description: |
        Every authenticated user. `decision=approve` freezes the graph: the
        server writes the baseline (`case_baseline`), moves every node
        `draft → reviewed` and the version `reviewing → executing`; any open
        `severity=blocker` finding requires `acknowledgeFindings=true` (409
        `blocker_findings_open` with the finding ids, and the findings keep
        their status). A second approval is 409 `baseline_frozen` (the baseline
        is reviewed once, D5). `decision=reject` requires a non-empty `comment`,
        writes a rejected review, creates no baseline and returns the version to
        `designing`. Returns 200 with `{version, baseline?, review}`; `baseline`
        is present on approval and null otherwise.
      operationId: decideMindmapReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
            example:
              decision: approve
              acknowledgeFindings: true
      responses:
        '200':
          description: The decided review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResultEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/reviews:
    get:
      tags: [mindmap]
      summary: List the review history of a version
      description: |
        Every authenticated user. Returns one cursor page of review rounds,
        newest first.
      operationId: listMindmapReviews
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MindmapListEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/findings:
    get:
      tags: [mindmap]
      summary: List the review findings of a version
      description: |
        Every authenticated user. Returns `{"data": [CaseReviewFindingView]}` —
        one flat, unpaginated array ordered by severity and id, optionally
        filtered by `status`, `severity` and `nodeId`. This endpoint is the
        authoritative finding list; `GET /mindmap` only embeds findings when
        `include=findings`.
      operationId: listMindmapFindings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapFindingStatusFilter'
        - $ref: '#/components/parameters/MindmapFindingSeverityFilter'
        - $ref: '#/components/parameters/MindmapFindingNodeFilter'
      responses:
        '200':
          description: The findings of the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MindmapFindingListEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/findings/{findingId}:
    patch:
      tags: [mindmap]
      summary: Mark one review finding fixed or dismissed
      description: |
        Every authenticated user. Human disposition of one finding:
        `status=fixed` or `status=dismissed` (reopening is not supported).
        Returns 200 with the updated finding; an unknown or other-version
        finding is 404 `finding_not_found`.
      operationId: updateMindmapFinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapFindingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFindingRequest'
            example:
              status: dismissed
      responses:
        '200':
          description: The updated finding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseReviewFindingEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/export:
    post:
      tags: [mindmap]
      summary: Generate or reuse a mindmap export file
      description: |
        Every authenticated user. Generates one server-side export file
        (`markdown`, `mermaid` or `opml`) from the current graph or frozen
        baseline, stores it under the export root and returns 201 with its
        metadata (id, format, nodeCount, sizeBytes, baselineId, createdAt,
        sha256). When `(version, format, baseline)` already has a file the
        existing metadata is returned with 200 instead of writing a new file.
        Export is allowed while the version is `designing`, `reviewing` or
        `executing`; a frozen version binds the baseline, an unfrozen one
        stores `baselineId=null` and does not participate in reuse. A
        concurrent unique collision is 409 `export_conflict`; PNG is rendered
        client-side and is not a server export format (422
        `export_format_unsupported`).
      operationId: createMindmapExport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
            example:
              format: markdown
      responses:
        '201':
          description: A new export file was generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseExportEnvelope'
        '200':
          description: An existing export for the same baseline and format was reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseExportEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '409':
          $ref: '#/components/responses/MindmapConflict'
        '422':
          $ref: '#/components/responses/MindmapUnprocessable'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/exports:
    get:
      tags: [mindmap]
      summary: List the export history of a version
      description: |
        Every authenticated user. Returns one cursor page of export metadata,
        newest first, optionally filtered by `format`. Internal file paths are
        never returned.
      operationId: listMindmapExports
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapExportFormatFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of exports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MindmapListEnvelope'
        '400':
          $ref: '#/components/responses/MindmapBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{versionId}/mindmap/exports/{exportId}/download:
    get:
      tags: [mindmap]
      summary: Download one generated export file
      description: |
        Every authenticated user. Streams the stored file as an
        `application/octet-stream` attachment with a RFC 5987
        `Content-Disposition` filename and `X-Content-Type-Options: nosniff`.
        The server re-reads the file by metadata only and verifies its sha256: a
        mismatch is 500 `export_corrupted` and internal paths are never exposed.
        An unknown or other-version export is 404 `export_not_found`.
      operationId: downloadMindmapExport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MindmapVersionId'
        - $ref: '#/components/parameters/MindmapExportId'
      responses:
        '200':
          description: The raw export file.
          headers:
            Content-Disposition:
              description: Attachment with a UTF-8 `filename*` parameter.
              schema:
                type: string
            X-Content-Type-Options:
              description: Always `nosniff`.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MindmapNotFound'
        '500':
          $ref: '#/components/responses/MindmapServerError'
  /api/versions/{id}/batches:
    get:
      tags: [execution]
      summary: List the execution batches of a version
      description: |
        Every authenticated user. One cursor page of batches newest first,
        optionally narrowed by exact `status`. A paused batch keeps
        `status=running`, so `GET /batches?status=running&limit=1` is how a
        client finds the version's single active batch (it is deliberately not
        embedded in the version DTO). Rows never include case runs.
      operationId: listExecutionBatches
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/BatchStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
    post:
      tags: [execution]
      summary: Create an execution batch
      description: |
        Every authenticated user. Freezes the current case baseline into one
        immutable snapshot per case and queues the batch; the response is 201
        with the created batch (the scheduler then starts it and publishes
        `batch.created`/`batch.started`/`run.started`). An omitted `caseIds`
        selects every case of the baseline.

        The pre-flight gate is evaluated in order: version visible (404),
        `status=executing` (409 `version_not_executable`), system and
        environment bound (409 `environment_required`), a case baseline exists
        (409 `baseline_required`), no active `planned`/`running` batch (409
        `batch_active`), the selection is non-empty (409 `no_cases`) and within
        `EZTEST_EXEC_MAX_CASES_PER_BATCH` (422 `too_many_cases`), the frozen
        baseline hash still matches (409 `baseline_changed`), `caseIds` all
        belong to the baseline (422 `invalid_case_ids`), and the executor is
        healthy (503 `executor_unavailable`).
      operationId: createExecutionBatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
            example:
              caseIds: ['1844674407370955401', '1844674407370955402']
      responses:
        '201':
          description: The created batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ExecutionConflict'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '503':
          $ref: '#/components/responses/ExecutionUnavailable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /api/versions/{id}/batches/{batchId}:
    get:
      tags: [execution]
      summary: Read one execution batch
      description: |
        Every authenticated user. A batch of another version is 404
        `not_found`. The row carries the pause state, the case counts and the
        stable failure reason; case runs are read from
        `GET /batches/{batchId}/case-runs`.
      operationId: getExecutionBatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ExecutionBatchId'
      responses:
        '200':
          description: The batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /api/versions/{id}/batches/{batchId}/pause:
    post:
      tags: [execution]
      summary: Pause an execution batch
      description: |
        Every authenticated user. Pauses the batch and mirrors
        `paused`/`pause_mode` onto the version; the batch keeps `status=running`
        so it still owns the version's active slot. An omitted body or mode
        defaults to `graceful`.

        `graceful` stops dispatching and parks each running case after its
        current step: the case run returns to `pending`, the completed
        `step_result` rows are kept, and leases/contexts are released.
        `immediate` cancels the Agent run and the executor action, records
        `interrupted_step_seq`, sets the case run to `interrupted` with
        `cleanup_required=true`, and releases leases. Both publish
        `run.paused`/`batch.paused`; a finished batch is 409 `batch_finished`
        and a second pause is 409 `already_paused`.
      operationId: pauseExecutionBatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ExecutionBatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseBatchRequest'
      responses:
        '200':
          description: The paused batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ExecutionConflict'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /api/versions/{id}/batches/{batchId}/resume:
    post:
      tags: [execution]
      summary: Resume a paused execution batch
      description: |
        Every authenticated user. Only a paused batch can resume (409
        `not_paused`); a finished batch is 409 `batch_finished`. Resume clears
        `paused` on the batch and the version, continues `pending` runs from
        their last completed step, requeues `interrupted` runs as the same
        attempt after cleanup/seed, and publishes `batch.resumed`/`run.resumed`.
        The request body is ignored; send no body.
      operationId: resumeExecutionBatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ExecutionBatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The resumed batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ExecutionConflict'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /api/versions/{id}/batches/{batchId}/cancel:
    post:
      tags: [execution]
      summary: Cancel an execution batch
      description: |
        Every authenticated user. `pending` case runs become `skipped`,
        running ones become `interrupted` (immediate interruption plus
        `cleanup_required`), leases and contexts are released and the batch
        ends as `cancelled` with a `batch.finished` event. The version stays
        `executing` and a new batch may be created. A finished batch is 409
        `batch_finished`. The request body is ignored; send no body.
      operationId: cancelExecutionBatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ExecutionBatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The cancelled batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ExecutionConflict'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /api/versions/{id}/batches/{batchId}/case-runs:
    get:
      tags: [execution]
      summary: List the case runs of a batch
      description: |
        Every authenticated user. One cursor page of case runs newest first,
        optionally narrowed by exact `status`. List rows use the `CaseRun`
        shape without the detail-only arrays (`steps`, `assertions`,
        `evidence`, `pending_takeover`); read one row with the detail endpoint.
      operationId: listExecutionCaseRuns
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ExecutionBatchId'
        - $ref: '#/components/parameters/CaseRunStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of case runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseRunList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /api/versions/{id}/batches/{batchId}/case-runs/{caseRunId}:
    get:
      tags: [execution]
      summary: Read one case run with its detail
      description: |
        Every authenticated user. Returns the recorded steps, assertion
        verdicts, evidence metadata, the resume checkpoint
        (`completed_seqs`, `cleanup_required`, `interrupted_step_seq`) and, only
        while a human takeover is waiting, `pending_takeover`. Evidence bodies
        are never embedded; fetch them from
        `GET /api/versions/{id}/evidence/{evidenceId}`.
      operationId: getExecutionCaseRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ExecutionBatchId'
        - $ref: '#/components/parameters/ExecutionCaseRunId'
      responses:
        '200':
          description: The case-run detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseRunDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /api/versions/{id}/batches/{batchId}/case-runs/{caseRunId}/rerun:
    post:
      tags: [execution]
      summary: Start the next attempt of a terminal case run
      description: |
        Every authenticated user. Creates the next `attempt` of a terminal case
        run with the same immutable snapshot, revision and hash, links it via
        `retry_of_case_run_id`, and answers 201 with the new (pending) case run.
        A non-terminal case run is 409 `case_run_terminal`. P6 never retries
        application failures automatically; a rerun is always manual and counts
        as a new attempt for the flaky derivation. The request body is ignored;
        send no body.
      operationId: rerunExecutionCaseRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ExecutionBatchId'
        - $ref: '#/components/parameters/ExecutionCaseRunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The new pending attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseRunDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ExecutionConflict'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /api/versions/{id}/batches/{batchId}/report:
    get:
      tags: [execution]
      summary: Read the Batch 1 report of a batch
      description: |
        Every authenticated user; also readable while the batch is paused or
        running (the report is derived at read time). The JSON carries the batch
        identity, the status/failure-class counters, the derived `flaky_case_ids`
        (a case that failed earlier and passed in a later attempt, never stored
        on a case run), the per-case rows and the environment header. Rows are
        ordered by case node then attempt so the JSON and the Markdown export
        are reproducible.
      operationId: getExecutionBatchReport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ExecutionBatchId'
      responses:
        '200':
          description: The batch report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchReportEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /api/versions/{id}/batches/{batchId}/report/export:
    get:
      tags: [execution]
      summary: Export the Batch 1 report as Markdown
      description: |
        Every authenticated user. Streams the deterministic Markdown rendering
        of the same report the JSON endpoint returns, with the SHA-256 of the
        streamed bytes in `X-Content-SHA256`. The response is an attachment
        whose RFC 5987 filename identifies the batch; `format=markdown` is the
        only P6 export format (an unsupported value is 422 `export_failed`).
        Rendering never contains issue or revision fields and never contains
        credentials, prompts or evidence bytes.
      operationId: exportExecutionBatchReport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ExecutionBatchId'
        - $ref: '#/components/parameters/BatchReportFormat'
      responses:
        '200':
          description: The Markdown report bytes.
          headers:
            Content-Disposition:
              description: |
                Attachment with the batch's filename
                (`execution-report-{batchId}.md`) and a UTF-8 `filename*`
                parameter.
              schema:
                type: string
            X-Content-SHA256:
              description: Lowercase hex SHA-256 of the returned Markdown bytes.
              schema:
                type: string
                pattern: '^[a-f0-9]{64}$'
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            text/markdown:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /api/versions/{id}/evidence/{evidenceId}:
    get:
      tags: [execution]
      summary: Read one evidence artifact
      description: |
        Every authenticated user. Streams the stored bytes with the MIME type
        recorded at capture time and the SHA-256 of those bytes in
        `X-Content-SHA256`; the stored document is re-verified (ownership through
        the batch, size and sha256) before the first byte is written. A missing
        or foreign evidence ID is the same 404 `not_found`, and a tampered or
        unreadable artifact is 500 `evidence_corrupt`. The filesystem path is
        never exposed, in a header or in an error.
      operationId: getExecutionEvidence
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ExecutionEvidenceId'
      responses:
        '200':
          description: The raw evidence bytes.
          headers:
            Content-Type:
              description: |
                The MIME type recorded at capture time;
                `application/octet-stream` when the row records none.
              schema:
                type: string
            X-Content-SHA256:
              description: Lowercase hex SHA-256 of the returned bytes.
              schema:
                type: string
                pattern: '^[a-f0-9]{64}$'
            Content-Length:
              description: Exact byte length of the artifact.
              schema:
                type: integer
                format: int64
            Cache-Control:
              description: |
                `private, max-age=31536000, immutable` (evidence bytes never
                change).
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /api/versions/{id}/evidence/{evidenceId}/meta:
    get:
      tags: [execution]
      summary: Read the metadata of one evidence artifact
      description: |
        Every authenticated user. Returns the identity, kind, MIME type, size,
        SHA-256, capture metadata and creation time of the artifact without the
        bytes and without the filesystem path. Evidence is immutable: there is
        no update or delete endpoint in P6.
      operationId: getExecutionEvidenceMeta
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ExecutionEvidenceId'
      responses:
        '200':
          description: The evidence metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceMetaEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /api/versions/{id}/execution/sessions:
    get:
      tags: [execution]
      summary: List the execution Agent sessions of a version
      description: |
        Every authenticated user. One cursor page of the P1 Agent sessions
        whose activity channel is this version's `version:{id}` channel: the
        execution Agent sessions behind the batches and case runs. The channel
        is fixed server-side; a supplied `channel` that differs from
        `version:{id}` yields an empty page. Rows never carry prompts, model
        output or credentials.
      operationId: listExecutionSessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/ExecutionChannelFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of execution sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionSessionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ExecutionUnprocessable'
        '500':
          $ref: '#/components/responses/ExecutionServerError'
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: Always 200 while the process can serve requests; never touches the database.
      operationId: liveness
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /api/health:
    get:
      tags: [health]
      summary: Readiness probe
      description: |
        Pings the database with a 2 second timeout. `llm_configured` is true
        only when a default LLM configuration exists and its key can be
        decrypted. Database failure returns 503 with `status: unavailable` and
        `db: down`.
      operationId: readiness
      security: []
      responses:
        '200':
          description: The service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          description: The database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /api/openapi.yaml:
    get:
      tags: [health]
      summary: The public OpenAPI document
      description: Serves the hand-maintained YAML document; a missing file is 404.
      operationId: getOpenAPIDocument
      security: []
      responses:
        '200':
          description: The OpenAPI 3.0 document.
          content:
            application/yaml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Opaque session token returned once by `POST /api/auth/login`. Send it as
        `Authorization: Bearer <token>`. The server stores only its SHA-256 hash;
        logout and password resets revoke it.
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Optional client request ID matching `^[A-Za-z0-9_-]{8,128}$`. Invalid
        values are replaced with a UUID; the response always echoes the chosen
        value in `X-Request-ID` and in every error envelope.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,128}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Opts an authenticated write into 24 hour idempotent replay. Same key
        and body replay the stored response with `Idempotent-Replayed: true`;
        same key and a different body is 409 `idempotency_conflict`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,128}$'
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1-100. Defaults to 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque id cursor from the previous page; do not parse it.
      schema:
        type: string
    BeforeSeq:
      name: before_seq
      in: query
      required: false
      description: Return events with a sequence lower than this cursor. Omit (or 0) for the latest events.
      schema:
        type: integer
        format: int64
        minimum: 0
    Channel:
      name: channel
      in: query
      required: true
      description: |
        Channel name, 1-64 characters. P0 uses `system`; each P1 Agent session
        uses `agent:{session_id}`. Channels starting with `agent:` are
        administrator-only (403 `forbidden` for regular users).
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Since:
      name: since
      in: query
      required: false
      description: Replay events after this seq when `Last-Event-ID` is absent. Omit for live-only.
      schema:
        type: integer
        format: int64
        minimum: 0
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: Reconnect cursor. Takes precedence over `?since`.
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      description: User ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    LLMConfigId:
      name: id
      in: path
      required: true
      description: LLM configuration ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    SHA256:
      name: sha256
      in: path
      required: true
      description: Lowercase hex SHA-256 object id.
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    AgentProfileId:
      name: id
      in: path
      required: true
      description: Agent profile ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    AgentProfileFilter:
      name: profile_id
      in: query
      required: false
      description: Optional exact Agent profile filter for the session list.
      schema:
        type: integer
        format: int64
        minimum: 1
    AgentSessionId:
      name: id
      in: path
      required: true
      description: Agent session ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    AgentMessageId:
      name: message_id
      in: path
      required: true
      description: Message ID; it must belong to the session in the path.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceSystemId:
      name: id
      in: path
      required: true
      description: System ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceEnvironmentId:
      name: id
      in: path
      required: true
      description: Environment ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceAppModelId:
      name: id
      in: path
      required: true
      description: App model node ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceAccountId:
      name: id
      in: path
      required: true
      description: Account ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceAccessId:
      name: id
      in: path
      required: true
      description: Access ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceSessionId:
      name: id
      in: path
      required: true
      description: Session ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceTakeoverId:
      name: id
      in: path
      required: true
      description: Manual takeover ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceCodeRepoId:
      name: id
      in: path
      required: true
      description: Code repository ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    VersionPathId:
      name: id
      in: path
      required: true
      description: |
        Version ID: a 64-bit snowflake serialized as a decimal string. Never
        parse it into a JavaScript number.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    RequirementPathId:
      name: rid
      in: path
      required: true
      description: Requirement ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    RelationPathId:
      name: relId
      in: path
      required: true
      description: Requirement relation ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    AttachmentPathId:
      name: aid
      in: path
      required: true
      description: Attachment ID (snowflake decimal string) belonging to the requirement.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    ClarificationSessionPathId:
      name: sid
      in: path
      required: true
      description: Clarification session ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    QuestionPathId:
      name: qid
      in: path
      required: true
      description: Clarification question ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    DecisionPathId:
      name: did
      in: path
      required: true
      description: Decision ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    VersionStatusFilter:
      name: status
      in: query
      required: false
      description: Optional exact version status filter.
      schema:
        $ref: '#/components/schemas/VersionStatus'
    RequirementStatusFilter:
      name: status
      in: query
      required: false
      description: Optional exact requirement status filter.
      schema:
        $ref: '#/components/schemas/RequirementStatus'
    QuestionStatusFilter:
      name: status
      in: query
      required: false
      description: Optional exact question status filter.
      schema:
        $ref: '#/components/schemas/ClarificationQuestionStatus'
    DecisionStatusFilter:
      name: status
      in: query
      required: false
      description: Optional exact decision status filter.
      schema:
        $ref: '#/components/schemas/ClarificationDecisionStatus'
    QuestionRequirementFilter:
      name: requirementId
      in: query
      required: false
      description: Optional requirement ID filter (P3 snowflake decimal string).
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    BeforeId:
      name: before_id
      in: query
      required: false
      description: |
        Return clarification messages with an ID lower than this P1 message ID
        (an integer). Pass the integer value encoded by the previous page's
        `ClarificationMessagePage.next_cursor` decimal string.
      schema:
        type: integer
        format: int64
        minimum: 1
    CodeRepoId:
      name: repoId
      in: path
      required: true
      description: P2 code repository id (a number, unlike codeintel-owned ids).
      schema:
        type: integer
        format: int64
        minimum: 1
    CodeVersionId:
      name: versionId
      in: path
      required: true
      description: P3 version id serialized as a decimal string.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    CodeIndexRunId:
      name: runId
      in: path
      required: true
      description: Codeintel index-run id serialized as a decimal string.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    CodeAnalysisId:
      name: analysisId
      in: path
      required: true
      description: Codeintel analysis id serialized as a decimal string.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    CodeCandidateId:
      name: candidateId
      in: path
      required: true
      description: Codeintel impact-candidate id serialized as a decimal string.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    CodeAnchorId:
      name: anchorId
      in: path
      required: true
      description: Codeintel anchor id serialized as a decimal string.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    CodeCommitSha:
      name: sha
      in: path
      required: true
      description: Lowercase 40-hex commit SHA-1.
      schema:
        type: string
        pattern: '^[a-f0-9]{40}$'
    MindmapVersionId:
      name: versionId
      in: path
      required: true
      description: P3 version ID serialized as a decimal string (never a JavaScript number).
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    MindmapNodeId:
      name: nodeId
      in: path
      required: true
      description: Mindmap node ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    MindmapStepId:
      name: stepId
      in: path
      required: true
      description: Case-step ID (snowflake decimal string) belonging to a case of the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    MindmapAssertionId:
      name: assertionId
      in: path
      required: true
      description: Case-assertion ID (snowflake decimal string) belonging to a case of the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    MindmapSourceId:
      name: sourceId
      in: path
      required: true
      description: Case-source ID (snowflake decimal string) belonging to a case of the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    MindmapAnchorId:
      name: anchorId
      in: path
      required: true
      description: Codeintel anchor ID (decimal string) of a `case` anchor of the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    MindmapRunId:
      name: runId
      in: path
      required: true
      description: Mindmap run ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    MindmapFindingId:
      name: findingId
      in: path
      required: true
      description: Review-finding ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    MindmapExportId:
      name: exportId
      in: path
      required: true
      description: Export ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    MindmapInclude:
      name: include
      in: query
      required: false
      description: |
        Comma-separated optional graph sections (`anchors,findings,impact`).
        Omit for every section. Omitting `anchors`/`impact` still returns those
        keys as empty arrays; `findings` is only present when it is included.
      schema:
        type: string
        example: anchors,findings,impact
    MindmapRevision:
      name: revision
      in: query
      required: true
      description: |
        The node revision the client last read (optimistic-concurrency token).
        A stale value is 409 `case_revision_conflict` with the current revision.
      schema:
        type: integer
        minimum: 1
    MindmapNodeRevision:
      name: nodeRevision
      in: query
      required: true
      description: |
        The revision of the case node that owns the step/assertion being
        changed (optimistic-concurrency token). A stale value is 409
        `case_revision_conflict`.
      schema:
        type: integer
        minimum: 1
    MindmapRunKindFilter:
      name: kind
      in: query
      required: false
      description: Optional exact run kind filter.
      schema:
        $ref: '#/components/schemas/RunKind'
    MindmapRunStatusFilter:
      name: status
      in: query
      required: false
      description: Optional exact run status filter.
      schema:
        $ref: '#/components/schemas/RunStatus'
    MindmapFindingStatusFilter:
      name: status
      in: query
      required: false
      description: Optional exact finding status filter.
      schema:
        $ref: '#/components/schemas/FindingStatus'
    MindmapFindingSeverityFilter:
      name: severity
      in: query
      required: false
      description: Optional exact finding severity filter.
      schema:
        $ref: '#/components/schemas/FindingSeverity'
    MindmapFindingNodeFilter:
      name: nodeId
      in: query
      required: false
      description: Optional exact node ID filter (snowflake decimal string).
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    MindmapExportFormatFilter:
      name: format
      in: query
      required: false
      description: Optional exact export format filter.
      schema:
        $ref: '#/components/schemas/ExportFormat'
    ExecutionBatchId:
      name: batchId
      in: path
      required: true
      description: |
        P6 batch ID: a 64-bit snowflake serialized as a decimal string. Never
        parse it into a JavaScript number.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    ExecutionCaseRunId:
      name: caseRunId
      in: path
      required: true
      description: |
        Case-run ID: a 64-bit snowflake serialized as a decimal string. It must
        belong to the batch in the path.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    ExecutionEvidenceId:
      name: evidenceId
      in: path
      required: true
      description: |
        Evidence ID: a 64-bit snowflake serialized as a decimal string. It must
        belong to the version in the path.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    BatchStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Optional exact batch status filter. A paused batch still reports
        `running`.
      schema:
        $ref: '#/components/schemas/BatchStatus'
    CaseRunStatusFilter:
      name: status
      in: query
      required: false
      description: Optional exact case-run status filter.
      schema:
        $ref: '#/components/schemas/CaseRunStatus'
    BatchReportFormat:
      name: format
      in: query
      required: false
      description: |
        Export format. `markdown` is the only P6 format; an unsupported value
        is 422 `export_failed`.
      schema:
        type: string
        enum: [markdown]
        default: markdown
    ExecutionChannelFilter:
      name: channel
      in: query
      required: false
      description: |
        Optional channel assertion. The endpoint always reads this version's
        `version:{id}` channel; a different value yields an empty page.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    AuthFlowId:
      name: id
      in: path
      required: true
      description: |
        Login recipe (`auth_flow`) ID as a decimal string, never a JavaScript
        number.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    AuthFlowSystemFilter:
      name: system_id
      in: query
      required: false
      description: |
        Optional P2 system ID (decimal string) narrowing the page to one
        system's recipes.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
  responses:
    InvalidArgument:
      description: Invalid input (`invalid_argument` or `idempotency_conflict` for a reused key with a different body).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Missing, malformed, expired or revoked bearer token (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not an administrator (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentChannelForbidden:
      description: |
        Authenticated but not an administrator (`forbidden`). Channels starting
        with `agent:` are administrator-only; the P0 `system` channel remains
        available to every authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The requested resource is absent (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: |
        State conflict such as a duplicate username, a protected administrator
        (`conflict`), an Agent session that already has a running run
        (`details.reason=run_active`) or a disabled Agent profile
        (`details.reason=profile_disabled`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: The upload exceeds 10 MiB (`invalid_argument`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: |
        A semantically invalid field (`invalid_argument`). `details.field`
        names the rejected Agent profile, session or message field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Login lockout or upstream LLM rate limiting (`rate_limited` / `llm_rate_limited`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: Unexpected server failure (`internal` or `storage_corrupted`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadGateway:
      description: Upstream LLM authentication, 5xx or invalid response (`llm_auth_failed`, `llm_upstream_error`, `llm_invalid_response`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: |
        Service temporarily unavailable. Agent requests use `unavailable` with
        `details.reason` set to `llm_not_configured` (no usable default LLM
        configuration), `tools_require_chat_completions` (the default
        configuration uses the `responses` protocol) or `capacity` (all global
        run slots are busy; `retryable: true`). The readiness probe also
        returns 503 when the database is down.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayTimeout:
      description: The upstream LLM call exceeded the configured timeout (`llm_timeout`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResourceInvalid:
      description: |
        A semantically invalid resource request (`invalid_argument`).
        `details.field` names the rejected field and `details.reason` is one of
        `invalid_key`, `invalid_kind`, `invalid_status`, `invalid_base_url`,
        `invalid_login_check`, `invalid_allowed_hosts`, `invalid_json`,
        `body_too_large`, `invalid_limit`, `invalid_cursor`, `invalid_id`,
        `invalid_storage_state`, `storage_state_expired`, `invalid_branch`,
        `invalid_glob`, `path_not_found`, `path_not_git_repo`,
        `branch_not_found` or `auth_flow_invalid` (a P6 login-recipe ID that is
        missing, disabled, not `form`, or of another system).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResourceConflict:
      description: |
        A resource conflict (`conflict`) with `details.reason` one of
        `duplicate_key` (a unique key is already in use), `has_dependencies`
        (the object still has dependents), `session_state_conflict` (the
        session state does not allow the action) or `takeover_not_waiting`
        (the takeover is not waiting).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    VersionConflict:
      description: |
        A P3 state or optimistic-lock conflict (`conflict`). `details.reason` is
        one of `version_state_conflict` (the version status does not allow the
        action), `requirement_state_conflict` (the requirement is not editable),
        `open_questions_remaining` (confirming a requirement with open
        questions), `unclarified_requirements` (entering design without
        `acknowledgeUnclarified`; details add `unclarifiedRequirementIds` and
        `openQuestionCount`), `duplicate_relation`, `duplicate_attachment`
        (same requirement and sha256), `revision_conflict`,
        `clarification_session_active`, `clarification_session_not_active`,
        `clarification_session_required` (analyze/recon without an active
        session), `clarification_question_state_conflict`,
        `decision_state_conflict` or `agent_busy` (a run is already active on
        the version channel). `details.field` is set when a request field is at
        fault and `details.message` is always human-readable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    VersionInvalid:
      description: |
        A semantically invalid P3 request (`invalid_argument`, HTTP 422).
        `details.reason` is one of `requirements_required` (start clarification
        without requirements), `relation_requirement_mismatch` (relation
        endpoints from different versions), `attachment_too_large`,
        `attachment_limit_exceeded`, `unsupported_attachment_type`,
        `invalid_attachment_content`, `system_not_found`, `system_disabled`,
        `environment_not_found`, `environment_system_mismatch`,
        `code_repository_not_found`, `code_repository_disabled`,
        `branch_not_found`, `path_not_found`, `path_not_git_repo` or
        `resource_unavailable` (a bound P2 resource was deleted). Field-level
        validation may instead use reasons such as `invalid_name`, `invalid_title`,
        `invalid_priority`, `invalid_status`, `invalid_message`, `invalid_answer`,
        `invalid_relation_type`, `invalid_commit` or `invalid_context_summary`
        (the latter carries `field=summary` and is emitted by the
        `context.summary_update` tool for a summary over 20 KiB), always with
        `details.field` and `details.message`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    VersionUnavailable:
      description: |
        An AI-dependent endpoint could not start (`unavailable`, HTTP 503)
        because the Agent/LLM runtime is not configured or unavailable.
        `details.reason` is `ai_unavailable` and `retryable` is true; manual
        version, requirement, question, decision, relation and confirmation
        endpoints keep working.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CodeInvalid:
      description: |
        A semantically invalid P4 code request (`invalid_argument`, HTTP 422).
        `details.reason` is one of `code_repository_not_bound`,
        `code_repository_not_found`, `code_repository_disabled`,
        `baseline_commit_missing`, `invalid_head`, `commit_not_found`,
        `path_not_found`, `path_not_file`, `path_escape`,
        `path_not_git_repo`, `not_changed`,
        `unsupported_content`, `unsupported_subject_kind`,
        `subject_not_in_version`, `app_model_not_found`, `invalid_id`, plus the
        transport-level `invalid_request`, `invalid_limit`, `invalid_cursor`,
        `invalid_line`, `invalid_line_range`, `invalid_json` and
        `body_too_large` (HTTP 400/422).
        `details.field` names the rejected field. Messages never echo code
        content or repository-internal paths.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CodeConflict:
      description: |
        A P4 state conflict (`conflict`, HTTP 409). `details.reason` is one of
        `index_in_progress` (the repository already has a queued/running index),
        `analysis_in_progress` (the version already has a queued/running
        analysis and no identical completed run was reusable),
        `analysis_not_done` (adjusting a candidate before the
        analysis completed) or `anchor_duplicate` (same subject/file/line range).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CodeNotFound:
      description: |
        A P4 object is absent (`not_found`, HTTP 404). `details.reason` is one of
        `index_run_not_found`, `analysis_not_found`, `candidate_not_found` or
        `anchor_not_found`. Version-scoped analysis reads report
        `analysis_not_found` even when the version is unknown or has no analysis;
        the anchors list answers 200 with `[]` for an unknown version. A missing
        P3 version or P2 repository on a trigger, change-preview or
        anchor-create route is a plain `not_found` (no codeintel reason).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CodeQueueFull:
      description: |
        The bounded codeintel worker queue (T0 index or impact analysis) is
        full (`rate_limited`, HTTP 429).
        `details.reason=analysis_queue_full` and `retryable` is true.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CodeGitUnavailable:
      description: |
        The Git repository is temporarily unreadable or a Git command timed out
        (`unavailable`, HTTP 503). `details.reason=git_unavailable` and
        `retryable` is true; no Git output, internal path or code content is
        echoed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MindmapBadRequest:
      description: |
        The JSON body or query is not valid (`invalid_argument`, HTTP 400).
        `details.reason` is one of `invalid_json`, `body_too_large`,
        `invalid_limit`, `invalid_cursor` or `invalid_id`; `details.field`
        names the rejected field when applicable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MindmapForbidden:
      description: |
        Authenticated but not allowed (`forbidden`, HTTP 403 with
        `details.reason=forbidden`). Starting an `explore` run requires the
        administrator role, and deleting a case code anchor requires an
        administrator or the anchor creator. Every other mindmap read/write is
        available to every authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MindmapNotFound:
      description: |
        A mindmap object is absent (`not_found`, HTTP 404). `details.reason` is
        one of `node_not_found`, `step_not_found`, `assertion_not_found`,
        `source_not_found`, `anchor_not_found`, `review_not_found`,
        `baseline_not_found`, `finding_not_found`, `run_not_found`,
        `export_not_found` or `requirement_not_found`; an unknown P3 version on
        a mindmap route uses the plain `not_found` reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MindmapConflict:
      description: |
        A P5 state, revision or uniqueness conflict (`conflict`, HTTP 409).
        `details.reason` is one of `version_state_conflict` (the version status
        does not allow the action), `baseline_frozen` (the graph was already
        approved and is read-only), `case_revision_conflict` (stale `revision`;
        `details.revision` carries the current value), `invalid_case_tree` (a
        tree/sequence/coverage rule is broken), `no_cases` (submit-review on an
        empty graph), `unconfirmed_requirements` (a source or generated case
        references a requirement that is not `clarified`),
        `requirement_not_clarified`, `run_in_progress` (same-kind single-flight
        slot taken), `run_state_conflict`, `blocker_findings_open` (approval
        without `acknowledgeFindings`; `details.findingIds` lists the blockers),
        `exploration_requires_environment`, `ai_unavailable`, `export_conflict`
        (concurrent frozen export), `duplicate_case_source`, `duplicate_key` or
        `graph_too_large` (over the 300-node cap).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MindmapUnprocessable:
      description: |
        A semantically invalid mindmap request (`invalid_argument`, HTTP 422).
        `details.reason` is one of `invalid_run_kind`,
        `environment_not_allowed`, `code_repo_unavailable`,
        `export_format_unsupported` or a field-level reason such as
        `invalid_id`/`invalid_json`, always with `details.field` and
        `details.message`. Async run failures (for example
        `invalid_case_proposal`, `environment_unreachable` or
        `ai_unavailable`) are reported on the run's `reason`/`errors` instead of
        as a request error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MindmapServerError:
      description: |
        Unexpected server failure (`internal`, HTTP 500) or a stored export file
        whose bytes no longer match its sha256 (`export_corrupted`, HTTP 500); a
        corrupted export must be regenerated before it can be downloaded again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ExecutionConflict:
      description: |
        A P6 state conflict (`error.code=conflict`, HTTP 409) whose
        `details.reason` is the stable identifier: `version_not_executable` (the
        version status is not `executing`), `environment_required` (no
        system/environment binding), `baseline_required` (the version has no
        frozen case baseline), `baseline_changed` (the baseline hash or a frozen
        case hash changed), `batch_active` (the version already has a
        planned/running batch), `no_cases` (the baseline/selection contains no
        case), `batch_finished` (a control action on a terminal batch),
        `already_paused` (pause on a paused batch), `not_paused` (resume on a
        batch that is not paused) or `case_run_terminal` (rerun of a
        non-terminal case run). `details.field` is set when a request field is
        at fault and `details.message` is always human-readable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ExecutionUnprocessable:
      description: |
        A syntactically or semantically invalid P6 request
        (`error.code=invalid_argument`, HTTP 422). `details.reason` is one of
        `too_many_cases` (over `EZTEST_EXEC_MAX_CASES_PER_BATCH`),
        `invalid_case_ids` (an ID is not in the batch's case baseline),
        `invalid_pause_mode` (mode is neither `graceful` nor `immediate`),
        `export_failed` (the report cannot be rendered in the requested
        format), the decoding reasons `invalid_json`, `body_too_large`,
        `invalid_limit`, `invalid_cursor`, `invalid_id` and `invalid_status`, or
        `auth_flow_invalid` on the login-recipe and access endpoints, always
        with `details.field` and `details.message` when a field is at fault.
        Case-outcome reasons (`evidence_missing`, `session_unavailable`,
        `unsupported_assertion_kind`, `takeover_required`) are carried by a
        case run's `failure_reason`, not by this response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ExecutionUnavailable:
      description: |
        The execution dependency is temporarily unavailable
        (`error.code=unavailable`, HTTP 503). `details.reason` is
        `executor_unavailable` (the Node/Playwright executor health probe fails
        or it rejects the context) or `session_unavailable` (no usable login
        session for the requested execution), and `retryable` is true.
        Create-batch is rejected before any row is written; a case run that
        loses its executor or session mid-flight is instead classified
        `inconclusive`/`blocked` on the case run.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ExecutionServerError:
      description: |
        Unexpected server failure (`internal`, HTTP 500). A stored evidence
        artifact whose bytes no longer match its recorded sha256/size is
        reported as `internal` with `details.reason=evidence_corrupt`, and a
        Markdown export that cannot be rendered as `internal` with
        `details.reason=export_failed`. Filesystem paths are never echoed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuthFlowInvalid:
      description: |
        An invalid login recipe request (`invalid_argument`, HTTP 422).
        `details.reason=auth_flow_invalid` covers an empty name, an unknown
        `kind`, an absolute-URL/selector/success-rule/timeout violation in the
        definition, or an invalid `login_flow_id` binding; `invalid_limit`,
        `invalid_cursor` and `invalid_id` cover page/path decoding. `details.field`
        names the rejected field and `details.message` is human-readable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              type: string
              enum:
                - invalid_argument
                - unauthenticated
                - forbidden
                - not_found
                - conflict
                - idempotency_conflict
                - rate_limited
                - internal
                - unavailable
                - storage_corrupted
                - llm_not_configured
                - llm_auth_failed
                - llm_rate_limited
                - llm_bad_request
                - llm_upstream_error
                - llm_timeout
                - llm_invalid_response
            message:
              type: string
            request_id:
              type: string
              description: Echoes `X-Request-ID`; always present when the request reached the middleware chain.
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
              description: |
                Non-sensitive structured details; `{}` when absent. LLM errors
                may include `upstream_status`. Agent errors may include
                `reason` (`run_active`, `profile_disabled`,
                `llm_not_configured`, `tools_require_chat_completions`,
                `capacity`) or `field` (the rejected request field). P3 version
                errors carry `reason` from the tables documented by
                VersionConflict, VersionInvalid and VersionUnavailable, plus
                `field`/`message` when applicable. P4 code errors carry `reason`
                from CodeErrorReason, plus `field`/`message` when applicable.
                P5 mindmap errors carry `reason` from MindmapErrorReason. P6
                execution errors carry `reason` from ExecutionErrorReason, plus
                `field`/`message` when applicable.
    User:
      type: object
      required: [id, username, role, status]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          pattern: '^[a-zA-Z0-9_.-]{3,64}$'
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CreateUserRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9_.-]{3,64}$'
        password:
          type: string
          minLength: 10
          maxLength: 128
    UpdateUserRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [active, disabled]
    ResetPasswordRequest:
      type: object
      required: [new_password]
      additionalProperties: false
      properties:
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, expires_at, user]
          properties:
            token:
              type: string
              description: Raw opaque bearer token; returned exactly once.
            expires_at:
              type: string
              format: date-time
            user:
              $ref: '#/components/schemas/User'
    ModelInfo:
      type: object
      required: [id]
      properties:
        id:
          type: string
        context_window:
          type: integer
          format: int64
          nullable: true
        max_output_tokens:
          type: integer
          format: int64
          nullable: true
        input_modalities:
          type: array
          items:
            type: string
          description: Missing upstream fields are omitted rather than guessed.
    LLMConfig:
      type: object
      required:
        - id
        - name
        - protocol
        - base_url
        - model
        - has_api_key
        - key_version
        - header_names
        - retry_count
        - retry_interval_ms
        - timeout_ms
        - stream_enabled
        - multimodal_enabled
        - is_default
        - model_catalog
        - catalog_fetched_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        protocol:
          type: string
          enum: [chat_completions, responses]
        base_url:
          type: string
          format: uri
        model:
          type: string
        has_api_key:
          type: boolean
        key_version:
          type: integer
        header_names:
          type: array
          items:
            type: string
          description: Sorted custom header names. Header values are never returned.
        retry_count:
          type: integer
          minimum: 0
          maximum: 5
        retry_interval_ms:
          type: integer
          minimum: 100
          maximum: 30000
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
        stream_enabled:
          type: boolean
        multimodal_enabled:
          type: boolean
        is_default:
          type: boolean
        model_catalog:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
        catalog_fetched_at:
          type: string
          format: date-time
          nullable: true
    LLMConfigEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/LLMConfig'
    LLMConfigList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LLMConfig'
    CreateLLMConfigRequest:
      type: object
      required: [name, protocol, base_url, model]
      properties:
        name:
          type: string
          minLength: 1
        protocol:
          type: string
          enum: [chat_completions, responses]
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
          description: Optional upstream credential; encrypted at rest and never returned.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Optional custom headers; names must not be empty and must not override Authorization or Content-Type.
        retry_count:
          type: integer
          minimum: 0
          maximum: 5
          default: 2
        retry_interval_ms:
          type: integer
          minimum: 100
          maximum: 30000
          default: 500
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
          default: 60000
        stream_enabled:
          type: boolean
          default: true
        multimodal_enabled:
          type: boolean
          default: true
        is_default:
          type: boolean
          default: false
    UpdateLLMConfigRequest:
      type: object
      description: Every field is optional; omitted `api_key` and `headers` keep their stored value.
      properties:
        name:
          type: string
          minLength: 1
        protocol:
          type: string
          enum: [chat_completions, responses]
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        retry_count:
          type: integer
          minimum: 0
          maximum: 5
        retry_interval_ms:
          type: integer
          minimum: 100
          maximum: 30000
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
        stream_enabled:
          type: boolean
        multimodal_enabled:
          type: boolean
        is_default:
          type: boolean
    LLMTestRequest:
      type: object
      properties:
        stream:
          type: boolean
          default: false
          description: Requires `stream_enabled=true`; returns normalized SSE frames.
        prompt:
          type: string
          description: Defaults to a short description prompt when empty.
        image:
          type: boolean
          default: false
          description: Requires `multimodal_enabled=true`; attaches the built-in 1x1 PNG.
    Usage:
      type: object
      description: |
        Token accounting. `reasoning_tokens` is additive in P1: upstream
        providers that do not report it return 0.
      required: [prompt_tokens, completion_tokens, reasoning_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        reasoning_tokens:
          type: integer
          description: Reasoning/thinking tokens reported by the upstream; 0 when absent.
        total_tokens:
          type: integer
    LLMTestResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [text, usage, latency_ms]
          properties:
            text:
              type: string
            usage:
              $ref: '#/components/schemas/Usage'
            latency_ms:
              type: integer
              format: int64
    EventRefs:
      type: object
      required: [evidence, case, requirement, code]
      properties:
        evidence:
          type: array
          items:
            type: string
        case:
          type: array
          items:
            type: string
        requirement:
          type: array
          items:
            type: string
        code:
          type: array
          items:
            type: string
    Event:
      type: object
      required:
        - seq
        - channel
        - type
        - version_id
        - batch_id
        - case_id
        - step_id
        - agent_role
        - session_id
        - ts
        - summary
        - detail
        - refs
      properties:
        seq:
          type: integer
          format: int64
          description: Channel-local monotonic sequence assigned by the store.
        channel:
          type: string
          maxLength: 64
          description: |
            `system` for the P0 platform stream. Each P1 Agent session publishes
            on `agent:{session_id}`; those channels require an administrator.
            P3 version events publish on `version:{id}` and are readable by any
            authenticated user through the version endpoints.
        type:
          type: string
          maxLength: 100
          description: |
            `system.test` for the P0 test publisher; `agent.activity` for every
            P1 Agent activity (frozen V1 contract, see AgentActivityDetail); on
            `version:{id}` channels the P3 catalog documented by VersionEventType
            (including `clarification.context_updated`) and `agent.activity`.
        version_id:
          type: string
          nullable: true
          description: |
            Decimal-string version ID for P3 events and `agent.activity` on a
            version channel; null otherwise.
        batch_id:
          type: string
          nullable: true
        case_id:
          type: string
          nullable: true
        step_id:
          type: string
          nullable: true
        agent_role:
          type: string
          nullable: true
          description: Agent profile key for `agent.activity` events; null otherwise.
        session_id:
          type: string
          nullable: true
          description: Decimal-string session ID for events that reference a P1 Agent session.
        ts:
          type: string
          format: date-time
        summary:
          type: string
          maxLength: 500
        detail:
          type: object
          additionalProperties: true
          description: |
            Up to 64 KiB of valid JSON; `{}` when absent. For `agent.activity`
            this is the frozen V1 detail object described by
            AgentActivityDetail.
        refs:
          $ref: '#/components/schemas/EventRefs'
    EventSnapshot:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, snapshot_cursor, has_more]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Event'
            snapshot_cursor:
              type: integer
              format: int64
              description: The channel's current seq; use it as the SSE `since`/`Last-Event-ID` base.
            has_more:
              type: boolean
    PublishTestEventsRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        summary:
          type: string
          maxLength: 500
        detail:
          type: object
          additionalProperties: true
          description: Optional JSON object up to 64 KiB; defaults to `{}`.
    PublishTestEventsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [seqs]
          properties:
            seqs:
              type: array
              items:
                type: integer
                format: int64
    Object:
      type: object
      required: [sha256, size, content_type]
      properties:
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        size:
          type: integer
          format: int64
        content_type:
          type: string
    ObjectEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Object'
    AuditEntry:
      type: object
      required:
        - id
        - actor_user_id
        - action
        - target_type
        - target_id
        - request_id
        - ip
        - user_agent
        - metadata
        - created_at
      properties:
        id:
          type: integer
          format: int64
        actor_user_id:
          type: integer
          format: int64
          nullable: true
        action:
          type: string
          example: auth.login_succeeded
        target_type:
          type: string
        target_id:
          type: string
        request_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type: string
        has_more:
          type: boolean
    AgentProfile:
      type: object
      description: |
        One Agent configuration. `model` empty means the default LLM
        configuration's model; `max_turns` 0 means unlimited. `key` and
        `builtin` are read-only.
      required:
        - id
        - key
        - name
        - description
        - builtin
        - enabled
        - system_prompt
        - model
        - allowed_tools
        - max_turns
        - run_seconds
        - hard_timeout_seconds
        - thinking
        - reasoning_effort
        - max_output_tokens
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
          pattern: '^[a-z][a-z0-9_-]*$'
          description: Immutable profile key; the builtin profile uses `runtime-diagnostic`.
        name:
          type: string
        description:
          type: string
        builtin:
          type: boolean
          description: Immutable flag for the seeded profile.
        enabled:
          type: boolean
        system_prompt:
          type: string
          minLength: 1
          maxLength: 32768
        model:
          type: string
          description: Model override; empty uses the default LLM configuration's model.
        allowed_tools:
          type: array
          uniqueItems: true
          items:
            type: string
          description: |
            Tool names this profile may call. On PATCH the list must be a subset
            of the tools currently registered by `GET /api/agents/tools`;
            otherwise the request is 422. That subset check is not re-applied to
            a stored profile, so the seeded `runtime-diagnostic` profile may list
            tools that are currently unregistered (for example `file.list` and
            `file.read` when `EZTEST_AGENT_FILE_ROOT` is empty) and those calls
            are rejected at run time.
        max_turns:
          type: integer
          minimum: 0
          maximum: 100
          description: 0 means unlimited.
        run_seconds:
          type: integer
          minimum: 30
          maximum: 3600
        hard_timeout_seconds:
          type: integer
          minimum: 5
          maximum: 300
        thinking:
          type: string
          enum: [auto, enabled, disabled]
        reasoning_effort:
          type: string
          enum: ["", none, low, high, max]
          description: Must be empty or `none` when `thinking=disabled`.
        max_output_tokens:
          type: integer
          minimum: 1024
          maximum: 131072
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentProfileEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentProfile'
    AgentProfileList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentProfile'
    AgentProfilePatch:
      type: object
      description: |
        Partial update. Omitted fields keep their stored value. `key` and
        `builtin` are not present here, so sending them is rejected as an
        unknown field.
      additionalProperties: false
      properties:
        system_prompt:
          type: string
          minLength: 1
          maxLength: 32768
        model:
          type: string
        allowed_tools:
          type: array
          uniqueItems: true
          items:
            type: string
        max_turns:
          type: integer
          minimum: 0
          maximum: 100
        run_seconds:
          type: integer
          minimum: 30
          maximum: 3600
        hard_timeout_seconds:
          type: integer
          minimum: 5
          maximum: 300
        thinking:
          type: string
          enum: [auto, enabled, disabled]
        reasoning_effort:
          type: string
          enum: ["", none, low, high, max]
        max_output_tokens:
          type: integer
          minimum: 1024
          maximum: 131072
        enabled:
          type: boolean
    AgentTool:
      type: object
      required: [name, description, schema]
      properties:
        name:
          type: string
          example: file.read
        description:
          type: string
        schema:
          type: object
          additionalProperties: true
          description: JSON Schema object for the tool's arguments.
    AgentToolList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentTool'
    AgentRun:
      type: object
      description: |
        One run with accumulated usage. `terminal_reason`, `abort_code`,
        `error_code`, `last_tool_name` and `ended_at` are null while they do not
        apply.
      required:
        - id
        - session_id
        - status
        - terminal_reason
        - turns
        - input_tokens
        - output_tokens
        - reasoning_tokens
        - abort_code
        - error_code
        - last_tool_name
        - last_tool_pending
        - started_at
        - ended_at
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [running, done, failed, aborted, interrupted]
        terminal_reason:
          type: string
          nullable: true
          enum:
            - completed
            - max_turns
            - timeout
            - model_error
            - context_overflow
            - aborted_streaming
            - aborted_tools
            - aborted
            - shutdown
            - run_hard_timeout
            - interrupted
        turns:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        reasoning_tokens:
          type: integer
          format: int64
        abort_code:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        last_tool_name:
          type: string
          nullable: true
        last_tool_pending:
          type: boolean
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
    AgentSession:
      type: object
      required:
        - id
        - profile_id
        - profile_key
        - title
        - created_by
        - running
        - active_run
        - last_run
        - created_at
        - updated_at
        - last_activity_at
      properties:
        id:
          type: integer
          format: int64
        profile_id:
          type: integer
          format: int64
        profile_key:
          type: string
        title:
          type: string
          maxLength: 120
        created_by:
          type: integer
          format: int64
          nullable: true
        running:
          type: boolean
        active_run:
          description: The running run, or null when the session is idle.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AgentRun'
        last_run:
          description: The newest terminal run, or null before the first run finishes.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AgentRun'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
    AgentSessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentSession'
    AgentSessionList:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, has_more, next_cursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AgentSession'
            has_more:
              type: boolean
            next_cursor:
              type: string
              nullable: true
              description: Opaque cursor of the last returned id; null on the last page.
    SendMessageRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
          description: |
            User message. Leading and trailing whitespace is trimmed; an empty
            or whitespace-only value is 422. The message is persisted in full;
            activity events carry at most a 4096-character preview.
    AgentSendMessageResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [run_id, status]
          properties:
            run_id:
              type: integer
              format: int64
            status:
              type: string
              enum: [accepted]
    AgentStopResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [stopping, idle]
              description: '`stopping` when a live run was cancelled; `idle` when none was active.'
    AgentMessageDetail:
      type: object
      description: |
        The complete stored message. Activity events carry only previews; this
        endpoint is the authoritative source for text, reasoning, tool calls,
        tool results and usage.
      required:
        - id
        - session_id
        - run_id
        - role
        - content
        - reasoning
        - tool_calls
        - tool_call_id
        - tool_name
        - usage
        - created_at
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        run_id:
          type: integer
          format: int64
          nullable: true
        role:
          type: string
          enum: [user, assistant, tool]
        content:
          type: array
          description: Always a list. Text parts carry `text`; image parts carry `image_url`.
          items:
            type: object
            required: [type]
            additionalProperties: false
            properties:
              type:
                type: string
                enum: [text, image_url]
              text:
                type: string
              image_url:
                type: string
        reasoning:
          type: string
        tool_calls:
          type: array
          nullable: true
          items:
            type: object
            required: [id, name, arguments]
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
              arguments:
                type: string
                description: Raw JSON arguments as returned by the model.
        tool_call_id:
          type: string
          nullable: true
        tool_name:
          type: string
          nullable: true
        usage:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Usage'
        created_at:
          type: string
          format: date-time
    AgentMessageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentMessageDetail'
    AgentActivityUsage:
      type: object
      description: Accumulated run usage inside a `run_finished` activity.
      required: [prompt, completion, reasoning, total]
      properties:
        prompt:
          type: integer
          format: int64
        completion:
          type: integer
          format: int64
        reasoning:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    AgentActivityDetail:
      type: object
      description: |
        Frozen V1 `detail` object of an `agent.activity` event (design spec
        §9.2). Every object carries `kind` and `run_id`; the remaining fields
        depend on the kind:

        | kind | emitted when | kind-specific fields |
        |---|---|---|
        | `run_started` | a run begins | `profile_key, model, thinking, reasoning_effort, max_output_tokens, max_turns, run_seconds` |
        | `user_message` | the user message is stored | `message_id, text, truncated` |
        | `thinking` | a continuous reasoning segment | `message_id, part, final, text, truncated` |
        | `text` | a continuous answer segment | `message_id, part, final, text, truncated` |
        | `tool_use` | before a tool call | `call_id, tool, args, args_truncated` |
        | `tool_result` | after a tool returns | `call_id, tool, status, duration_ms, result, result_truncated, error_code, message_id` |
        | `usage` | each model turn reports usage | `turn, prompt_tokens, completion_tokens, reasoning_tokens, total_tokens` |
        | `decision` | budget, truncation or denial | `decision, reason` plus optional counts |
        | `run_finished` | terminal run state | `status, terminal_reason, turns, duration_ms, usage`, optional `abort_code, error_code, last_tool_name, last_tool_pending` |

        Activity events are published in run order on `agent:{session_id}` with
        `agent_role` set to the profile key. Thinking/text chunks flush every
        1500 ms or 1024 characters (`final=false`) and close with a
        `final=true` chunk; join chunks by `(message_id, part)` and fetch the
        authoritative text from the message-detail endpoint.
      required: [kind, run_id]
      properties:
        kind:
          type: string
          enum:
            - run_started
            - user_message
            - thinking
            - text
            - tool_use
            - tool_result
            - usage
            - decision
            - run_finished
        run_id:
          type: integer
          format: int64
        profile_key:
          type: string
        model:
          type: string
        thinking:
          type: string
        reasoning_effort:
          type: string
        max_output_tokens:
          type: integer
        max_turns:
          type: integer
        run_seconds:
          type: integer
        message_id:
          type: integer
          format: int64
        text:
          type: string
          description: Preview or chunk, at most 4096 characters (`user_message` also truncates to fit).
        truncated:
          type: boolean
        part:
          type: integer
          minimum: 0
        final:
          type: boolean
        call_id:
          type: string
        tool:
          type: string
        args:
          type: string
          description: Preview of the tool arguments, at most 2048 bytes.
        args_truncated:
          type: boolean
        status:
          type: string
          description: Tool status (`ok`, `error`, `timeout`, `cancelled`, `denied`) or terminal run status for `run_finished`.
        duration_ms:
          type: integer
          format: int64
        result:
          type: string
          description: Preview of the tool result, at most 2048 bytes.
        result_truncated:
          type: boolean
        error_code:
          type: string
        turn:
          type: integer
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        reasoning_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        decision:
          type: string
          enum: [context_truncated, budget_stop, tool_denied]
        reason:
          type: string
        turns:
          type: integer
        usage:
          $ref: '#/components/schemas/AgentActivityUsage'
        abort_code:
          type: string
        terminal_reason:
          type: string
          enum:
            - completed
            - max_turns
            - timeout
            - model_error
            - context_overflow
            - aborted_streaming
            - aborted_tools
            - aborted
            - shutdown
            - run_hard_timeout
            - interrupted
        last_tool_name:
          type: string
        last_tool_pending:
          type: boolean
        dropped:
          type: integer
        elapsed_ms:
          type: integer
          format: int64
      additionalProperties: true
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    HealthEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, version, commit, db, llm_configured]
          properties:
            status:
              type: string
              enum: [ok, unavailable]
            version:
              type: string
            commit:
              type: string
            db:
              type: string
              enum: [ok, down]
            llm_configured:
              type: boolean
    # --- P2 resource context ---------------------------------------------
    System:
      type: object
      description: |
        A target application under test. Every P2 resource belongs to the
        seeded default company. `key` is immutable after creation and matches
        `^[a-z0-9][a-z0-9_-]{1,63}$`.
      required:
        - id
        - key
        - name
        - kind
        - baseUrl
        - defaultSessionTtlSeconds
        - notes
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        name:
          type: string
        kind:
          type: string
          enum: [web, api]
        baseUrl:
          type: string
          format: uri
        defaultSessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          description: Default session lifetime; an Access TTL overrides it.
        notes:
          type: string
        status:
          type: string
          enum: [active, disabled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SystemEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/System'
    SystemList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/System'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    LoginCheck:
      type: object
      description: The optional read-only login verification of an environment (spec 6.3).
      required: [url, expectStatus, bodyContains]
      properties:
        url:
          type: string
          maxLength: 2048
          description: Absolute or environment-relative URL; empty disables the check.
        expectStatus:
          type: array
          maxItems: 10
          items:
            type: integer
            minimum: 100
            maximum: 599
        bodyContains:
          type: string
          maxLength: 512
    Environment:
      type: object
      required:
        - id
        - systemId
        - key
        - name
        - baseUrl
        - kind
        - isProd
        - allowedHosts
        - loginCheck
        - allowAutoLogin
        - requireApproval
      properties:
        id:
          type: integer
          format: int64
        systemId:
          type: integer
          format: int64
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        name:
          type: string
        baseUrl:
          type: string
          format: uri
        kind:
          type: string
          enum: [dev, staging, prod, other]
        isProd:
          type: boolean
        allowedHosts:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 253
        loginCheck:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LoginCheck'
        allowAutoLogin:
          type: boolean
        requireApproval:
          type: boolean
    EnvironmentEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Environment'
    EnvironmentList:
      type: object
      description: Unpaginated environment list; the array is always present.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Environment'
    AppModelNode:
      type: object
      description: One element of a system's application model. `key` and `kind` are immutable.
      required:
        - id
        - systemId
        - parentId
        - kind
        - key
        - name
        - path
        - method
        - source
        - meta
      properties:
        id:
          type: integer
          format: int64
        systemId:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
          nullable: true
        kind:
          type: string
          enum: [page, route, api, component]
        key:
          type: string
        name:
          type: string
        path:
          type: string
        method:
          type: string
          description: Required for api nodes; empty otherwise.
        source:
          type: string
          description: P5 application exploration (D36) writes `explored`.
          enum: [manual, import, explored]
        meta:
          type: object
          additionalProperties: true
    AppModelEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AppModelNode'
    AppModelList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AppModelNode'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    AppModelImportResult:
      type: object
      required: [created, updated]
      properties:
        created:
          type: integer
        updated:
          type: integer
    AppModelImportResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AppModelImportResult'
    Account:
      type: object
      description: A login account under the seeded default company; `key` is immutable.
      required: [id, key, label, username, kind, status, notes]
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        label:
          type: string
        username:
          type: string
        kind:
          type: string
          enum: [human, service]
        status:
          type: string
          enum: [active, disabled]
        notes:
          type: string
    AccountEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Account'
    AccountList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    Access:
      type: object
      description: |
        An account's login configuration for one system. The stored credential
        is write-only: it is never returned, only `credentialSet` reports
        whether one is stored.
      required:
        - id
        - accountId
        - systemId
        - authType
        - credentialSet
        - usernameOverride
        - loginUrl
        - enabled
        - concurrencyLimit
        - sessionTtlSeconds
        - permissionNote
      properties:
        id:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        systemId:
          type: integer
          format: int64
        authType:
          type: string
          enum: [password, sso, token, apikey, basic, manual]
        credentialSet:
          type: boolean
          description: True when a credential is stored. The value itself is never returned.
        usernameOverride:
          type: string
        loginUrl:
          type: string
        enabled:
          type: boolean
        concurrencyLimit:
          type: integer
          minimum: 1
          maximum: 100
        sessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          nullable: true
          description: Overrides the system default when present.
        permissionNote:
          type: string
        login_flow_id:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: |
            P6 login recipe (`auth_flow`) ID as a decimal string, or null when
            automatic login is not configured for this access. Recipe
            management is administrator-only; this reference is readable with
            the rest of the access. Assigning an unknown, disabled or
            non-`form` recipe is 422 `auth_flow_invalid`.
    AccessEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Access'
    AccessList:
      type: object
      description: Unpaginated access list; the array is always present.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Access'
    Snapshot:
      type: object
      description: An immutable record of one login_check or manual confirmation.
      required:
        - id
        - sessionId
        - kind
        - items
        - summary
        - permissionHash
        - degraded
        - capturedAt
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        kind:
          type: string
          enum: [login]
        items:
          type: object
          additionalProperties: true
        summary:
          type: object
          additionalProperties: true
        permissionHash:
          type: string
        degraded:
          type: boolean
        capturedAt:
          type: string
          format: date-time
    Lease:
      type: object
      description: |
        The active application-level lease of a session. Leases have no route
        of their own; the active one is embedded in a session detail.
      required: [id, holder, acquiredAt, expiresAt]
      properties:
        id:
          type: integer
          format: int64
        holder:
          type: string
        acquiredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Takeover:
      type: object
      required:
        - id
        - sessionId
        - accountId
        - systemId
        - environmentId
        - reason
        - status
        - instructions
        - requestedBy
        - requestedAt
        - expiresAt
        - completedAt
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
          nullable: true
        accountId:
          type: integer
          format: int64
        systemId:
          type: integer
          format: int64
        environmentId:
          type: integer
          format: int64
        reason:
          type: string
          enum: [mfa, captcha, approval, login_unknown, other]
        status:
          type: string
          enum: [waiting, completed, cancelled, expired]
        instructions:
          type: object
          additionalProperties: true
        requestedBy:
          type: integer
          format: int64
          nullable: true
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    TakeoverEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Takeover'
    TakeoverList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Takeover'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    TakeoverAction:
      type: object
      description: The takeover plus the session it belongs to after the action.
      required: [takeover, session]
      properties:
        takeover:
          $ref: '#/components/schemas/Takeover'
        session:
          $ref: '#/components/schemas/Session'
    TakeoverActionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TakeoverAction'
    Session:
      type: object
      description: |
        One imported login state. The stored storage_state document is never
        returned: the schema exposes only `storageStateHash` and the shape
        counts (`cookieCount`, `originCount`). `latestSnapshot`, `activeLease`
        and `latestTakeover` are detail-only relations omitted from list
        responses. `expiring` is derived and never stored.
      required:
        - id
        - accountId
        - systemId
        - environmentId
        - accessId
        - state
        - acquisition
        - storageStateKind
        - cookieCount
        - originCount
        - storageStateHash
        - expiresAt
        - lastValidatedAt
        - lastUsedAt
        - failureReason
        - invalidatedReason
        - expiring
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        systemId:
          type: integer
          format: int64
        environmentId:
          type: integer
          format: int64
        accessId:
          type: integer
          format: int64
        state:
          type: string
          enum: [pending, acquiring, needs_manual, valid, refreshing, expired, invalid, revoked, failed]
        acquisition:
          type: string
          enum: [auto, manual, imported]
        storageStateKind:
          type: string
          enum: ["", storage_state, token]
        cookieCount:
          type: integer
        originCount:
          type: integer
        storageStateHash:
          type: string
          description: SHA-256 of the canonical stored document; the document itself is never returned.
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastValidatedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        failureReason:
          type: string
        invalidatedReason:
          type: string
        expiring:
          type: boolean
          description: True when a valid session is close to expiry.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        latestSnapshot:
          $ref: '#/components/schemas/Snapshot'
        activeLease:
          $ref: '#/components/schemas/Lease'
        latestTakeover:
          $ref: '#/components/schemas/Takeover'
    SessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Session'
    SessionList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    SnapshotList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CodeRepo:
      type: object
      description: |
        A local Git checkout used by later phases for indexing. P2 only
        validates and stores it; `lastIndexedAt` stays null until a later phase
        indexes the checkout. `key` is immutable.
      required:
        - id
        - key
        - name
        - localPath
        - fixedBranch
        - includeGlobs
        - excludeGlobs
        - status
        - lastCommit
        - lastValidatedAt
        - lastValidationError
        - lastIndexedAt
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        name:
          type: string
        localPath:
          type: string
        fixedBranch:
          type: string
          maxLength: 255
        includeGlobs:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 256
        excludeGlobs:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 256
        status:
          type: string
          enum: [active, disabled]
        lastCommit:
          type: string
        lastValidatedAt:
          type: string
          format: date-time
          nullable: true
        lastValidationError:
          type: string
        lastIndexedAt:
          type: string
          format: date-time
          nullable: true
    CodeRepoEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CodeRepo'
    CodeRepoList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CodeRepo'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CodeErrorReason:
      type: string
      description: |
        Closed set of P4 `error.details.reason` values (spec §7.1 plus the
        transport-level request errors and the plain `not_found` reason of a
        missing P3 version on a code route). The HTTP status is determined by the
        error code: 400/422 `invalid_argument`, 404 `not_found`, 409 `conflict`,
        429 `rate_limited`, 503 `unavailable`.
      enum:
        - code_repository_not_bound
        - code_repository_not_found
        - code_repository_disabled
        - baseline_commit_missing
        - invalid_head
        - commit_not_found
        - git_unavailable
        - path_not_found
        - path_not_file
        - path_escape
        - path_not_git_repo
        - not_changed
        - unsupported_content
        - index_in_progress
        - index_run_not_found
        - analysis_in_progress
        - analysis_queue_full
        - analysis_not_found
        - analysis_not_done
        - candidate_not_found
        - anchor_not_found
        - anchor_duplicate
        - unsupported_subject_kind
        - subject_not_in_version
        - app_model_not_found
        - not_found
        - invalid_id
        - invalid_request
        - invalid_limit
        - invalid_cursor
        - invalid_line
        - invalid_line_range
        - invalid_json
        - body_too_large
    IndexRunStats:
      type: object
      required: [files, truncated]
      properties:
        files:
          type: integer
          minimum: 0
        truncated:
          type: boolean
    IndexRun:
      type: object
      description: |
        One T0 repository index run. `runId` is a decimal string; `repoId` and
        `createdBy` are numbers. `stats` is null until the run produced a stats
        document; `errors` is always an array.
      required:
        - runId
        - repoId
        - commit
        - source
        - status
        - stats
        - errors
        - startedAt
        - finishedAt
        - createdBy
      properties:
        runId:
          type: string
          pattern: '^[0-9]{1,19}$'
        repoId:
          type: integer
          format: int64
          minimum: 1
        commit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        source:
          type: string
          description: The index-run source; P4 always writes `t0` (T0 Git facts).
          example: t0
        status:
          type: string
          enum: [queued, running, done, failed]
        stats:
          type: object
          nullable: true
          description: Null until the run produced a stats document.
          allOf:
            - $ref: '#/components/schemas/IndexRunStats'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisError'
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
    IndexRunEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/IndexRun'
    IndexRunAccepted:
      type: object
      required: [runId, status, commit]
      properties:
        runId:
          type: string
          pattern: '^[0-9]{1,19}$'
        status:
          type: string
          enum: [queued, running, done, failed]
        commit:
          type: string
          pattern: '^[a-f0-9]{40}$'
    IndexRunAcceptedEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/IndexRunAccepted'
    RepoSummary:
      type: object
      description: |
        A P2 code repository plus its latest index-run projection. `index` is
        null before the first run; `lastCommit` projects the newest indexed
        commit. `repoId` stays a number.
      required:
        - id
        - key
        - name
        - status
        - fixedBranch
        - lastCommit
        - lastIndexedAt
        - index
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        fixedBranch:
          type: string
        lastCommit:
          type: string
          description: Newest indexed commit, or empty before the first index.
        lastIndexedAt:
          type: string
          format: date-time
          nullable: true
        index:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/IndexRun'
    RepoSummaryList:
      type: object
      description: The unbounded repository summary list (no generic page envelope).
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RepoSummary'
    ChangeSetStats:
      type: object
      required: [files, additions, deletions, truncated]
      properties:
        files:
          type: integer
          minimum: 0
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        truncated:
          type: boolean
    ChangedFile:
      type: object
      required: [path, oldPath, status, additions, deletions, binary, headBlobHash]
      properties:
        path:
          type: string
          maxLength: 4096
        oldPath:
          type: string
          maxLength: 4096
          nullable: true
        status:
          type: string
          description: |
            File-level Git status: `A`, `M`, `D`, `T`, or `R<score>`/`C<score>`
            for a rename/copy (for example `R100` or `C075`).
          pattern: '^(A|M|D|T|R[0-9]{1,3}|C[0-9]{1,3})$'
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        binary:
          type: boolean
        headBlobHash:
          type: string
          description: Head-side blob identity (`git-sha1:<40hex>` or `sha256:<64hex>`).
    ChangeList:
      type: object
      description: |
        The shared change-list projection of `/api/code/repos/{repoId}/diff` and
        `/api/versions/{versionId}/code/changes`. It is carried inside the normal
        `{"data":...}` envelope; its own `nextCursor`/`hasMore` paginate the file
        array. `changeSetId` is null for a read-only preview.
      required:
        - changeSetId
        - baseCommit
        - headCommit
        - stats
        - files
        - nextCursor
        - hasMore
      properties:
        changeSetId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        baseCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        headCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        stats:
          $ref: '#/components/schemas/ChangeSetStats'
        files:
          type: array
          maxItems: 2000
          description: One page for `/diff` (limit 1-100); the whole stored change set (up to 2000) for the version preview.
          items:
            $ref: '#/components/schemas/ChangedFile'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
    ChangeListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ChangeList'
    TreeEntry:
      type: object
      required: [path, type, size, gitObjectId, mode, unsupported]
      properties:
        path:
          type: string
          maxLength: 4096
        type:
          type: string
          description: Git object type; `commit` entries are submodules.
          enum: [blob, tree, commit]
        size:
          type: integer
          format: int64
          minimum: 0
        gitObjectId:
          type: string
          pattern: '^[a-f0-9]{40}$'
        mode:
          type: string
          description: Git tree mode (for example `100644` or `040000`).
        unsupported:
          type: boolean
          description: True for symlink/submodule entries that P4 does not follow.
    TreePage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TreeEntry'
        next_cursor:
          type: string
          description: Opaque path cursor; empty when `has_more` is false.
        has_more:
          type: boolean
    FileWindow:
      type: object
      required: [commit, path, startLine, endLine, totalLines, truncated, content]
      properties:
        commit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        path:
          type: string
          maxLength: 4096
        startLine:
          type: integer
          minimum: 0
          description: First line (1-based); 0 when the file is empty.
        endLine:
          type: integer
          minimum: 0
          description: Last line (inclusive); 0 when the file is empty.
        totalLines:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        content:
          type: string
          description: The bounded line window only; never an unbounded file dump.
    FileWindowEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FileWindow'
    FileDiff:
      type: object
      required: [baseCommit, headCommit, path, status, binary, truncated, patch]
      properties:
        baseCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        headCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        path:
          type: string
          maxLength: 4096
        status:
          type: string
          description: Git status of the changed file (A/M/D/T or R<score>/C<score>).
          pattern: '^(A|M|D|T|R[0-9]{1,3}|C[0-9]{1,3})$'
        binary:
          type: boolean
        truncated:
          type: boolean
        patch:
          type: string
          description: Unified diff, empty for binary/deleted/oversized files.
    FileDiffEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FileDiff'
    AnalysisError:
      type: object
      description: One non-fatal run error; never code content or internal paths.
      required: [code, message]
      properties:
        code:
          type: string
        path:
          type: string
          maxLength: 4096
        message:
          type: string
    Evidence:
      type: object
      description: |
        One code evidence range. AI/T1 evidence carries `startLine`/`endLine`
        and the server-computed `excerptHash`; anchor-sourced evidence carries
        only `file`.
      required: [file]
      properties:
        file:
          type: string
          maxLength: 4096
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
        excerptHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
    CodeEntity:
      type: object
      description: |
        One persisted code fact/entity at a commit. `id`/`analysisId` are decimal
        strings; `repoId` is a number. `evidence` is always an array.
      required:
        - id
        - repoId
        - commit
        - kind
        - path
        - name
        - startLine
        - endLine
        - signature
        - blobHash
        - source
        - confidence
        - evidence
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        repoId:
          type: integer
          format: int64
          minimum: 1
        commit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        kind:
          type: string
          description: Entity kind (for example `api`, `route`, `page`, `component`).
        path:
          type: string
          maxLength: 4096
        name:
          type: string
        startLine:
          type: integer
          minimum: 1
          nullable: true
        endLine:
          type: integer
          minimum: 1
          nullable: true
        signature:
          type: string
        blobHash:
          type: string
        source:
          type: string
          enum: [git, ai]
        confidence:
          type: string
          description: Confidence bucket (high/medium/low); T0 file facts are always `high`.
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        factKey:
          type: string
          nullable: true
        factVersion:
          type: integer
          minimum: 1
          nullable: true
        analysisId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FactsPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CodeEntity'
        next_cursor:
          type: string
          description: Opaque cursor; empty when `has_more` is false.
        has_more:
          type: boolean
    Commit:
      type: object
      required: [sha, message, author, committedAt]
      properties:
        sha:
          type: string
          pattern: '^[a-f0-9]{40}$'
        message:
          type: string
        author:
          type: string
        committedAt:
          type: string
          format: date-time
    CommitEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Commit'
    AnalysisStats:
      type: object
      required:
        - changedFiles
        - analyzedFiles
        - cacheHits
        - facts
        - edges
        - contracts
        - evidenceChecks
        - evidenceFailures
        - unmapped
        - invalidFacts
        - duplicateFacts
        - unmatchedContracts
        - truncated
        - unmappedTruncated
        - skipped
      properties:
        changedFiles:
          type: integer
          minimum: 0
        analyzedFiles:
          type: integer
          minimum: 0
        cacheHits:
          type: integer
          minimum: 0
        facts:
          type: integer
          minimum: 0
        edges:
          type: integer
          minimum: 0
        contracts:
          type: integer
          minimum: 0
        evidenceChecks:
          type: integer
          minimum: 0
        evidenceFailures:
          type: integer
          minimum: 0
        unmapped:
          type: integer
          minimum: 0
        invalidFacts:
          type: integer
          minimum: 0
        duplicateFacts:
          type: integer
          minimum: 0
        unmatchedContracts:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        unmappedTruncated:
          type: boolean
          description: >-
            True when the server truncated the unmapped list at 200 entries.
            Always emitted.
        skipped:
          type: integer
          minimum: 0
          description: Changed files skipped by a limit (always emitted).
    FactVersionRef:
      type: object
      required: [factKey, version]
      properties:
        factKey:
          type: string
          maxLength: 512
        version:
          type: integer
          minimum: 1
    Candidate:
      type: object
      description: |
        One impact candidate. `id`/`subjectId` are decimal strings; `subjectKind`
        is `requirement` or `app_model`. The `evidence` items are always an array,
        normalized/deduplicated by the server and capped at 5.
      required:
        - id
        - subjectKind
        - subjectId
        - reason
        - confidence
        - source
        - evidence
        - selected
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        subjectKind:
          type: string
          enum: [requirement, app_model]
        subjectId:
          type: string
          pattern: '^[0-9]{1,19}$'
        reason:
          type: string
          maxLength: 2000
        confidence:
          type: string
          enum: [high, medium, low]
        source:
          type: string
          enum: [direct, contract, relation, ai]
        evidence:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Evidence'
        selected:
          type: boolean
        selectionUpdatedBy:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        selectionUpdatedAt:
          type: string
          format: date-time
          nullable: true
    UnmappedChange:
      type: object
      description: A changed file that produced no requirement/app-model candidate.
      required: [path, status, reason, suggestion]
      properties:
        path:
          type: string
          maxLength: 4096
        status:
          type: string
          description: Status of the changed file (A/M/D/T or R<score>/C<score>).
          pattern: '^(A|M|D|T|R[0-9]{1,3}|C[0-9]{1,3})$'
        reason:
          type: string
          enum:
            - deleted_file
            - unsupported_content
            - no_fact_or_anchor
            - ai_unavailable
            - unmatched_contract
        suggestion:
          type: string
    Analysis:
      type: object
      description: |
        `AnalysisDTO` of spec §7.3. `id`/`versionId`/`changeSetId`/candidate ids
        and subject ids are decimal strings; `repoId`/`createdBy` are numbers.
        `unmapped` is present on latest/detail reads. R8: `stats` is always an
        object (zero counters before completion) and the four aggregate arrays
        are always `[]` rather than null.
      required:
        - id
        - versionId
        - repoId
        - baseCommit
        - headCommit
        - status
        - degraded
        - analysisVersion
        - model
        - promptVersion
        - changeSetId
        - changeSummary
        - stats
        - factVersions
        - candidates
        - unmapped
        - errors
        - createdBy
        - createdAt
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        repoId:
          type: integer
          format: int64
          minimum: 1
        baseCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        headCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        status:
          type: string
          enum: [queued, running, done, failed]
        degraded:
          type: boolean
        analysisVersion:
          type: integer
          minimum: 1
        model:
          type: string
        promptVersion:
          type: string
          maxLength: 32
        changeSetId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        changeSummary:
          type: string
          maxLength: 2000
          description: The change-set summary projected from the run stats/document.
        stats:
          $ref: '#/components/schemas/AnalysisStats'
        factVersions:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FactVersionRef'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        unmapped:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/UnmappedChange'
        errors:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AnalysisError'
        createdBy:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
    AnalysisEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Analysis'
    StartAnalysisRequest:
      type: object
      additionalProperties: false
      properties:
        headCommit:
          type: string
          description: Omit/empty to resolve the repository fixed branch tip; otherwise a 40-hex descendant of the baseline.
        force:
          type: boolean
          default: false
          description: Skip reuse and create `analysisVersion+1`.
    StartAnalysisResult:
      type: object
      required: [id, status, analysisVersion, reused]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        status:
          type: string
          enum: [queued, running, done, failed]
        analysisVersion:
          type: integer
          minimum: 1
        reused:
          type: boolean
    StartAnalysisResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StartAnalysisResult'
    UpdateCandidateRequest:
      type: object
      additionalProperties: false
      required: [selected]
      properties:
        selected:
          type: boolean
    CandidateEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Candidate'
    AnchorSubjectKind:
      type: string
      description: |
        Anchor subject kinds. P4 accepts `version`, `requirement` and
        `app_model`; P5 (D37) adds `case` for case code anchors, whose ownership
        and version membership are validated by the mindmap context. `issue`
        remains reserved for a later phase.
      enum: [version, requirement, app_model, case]
    Anchor:
      type: object
      description: |
        A code anchor. `id`/`versionId`/`subjectId` are decimal strings;
        `createdBy` is a number. `startLine`/`endLine`/`commitSha` are always
        present and null when the anchor has no line range or commit pin.
      required:
        - id
        - versionId
        - subjectKind
        - subjectId
        - filePath
        - startLine
        - endLine
        - commitSha
        - confidence
        - createdByKind
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        subjectKind:
          $ref: '#/components/schemas/AnchorSubjectKind'
        subjectId:
          type: string
          pattern: '^[0-9]{1,19}$'
        filePath:
          type: string
          maxLength: 4096
        startLine:
          type: integer
          minimum: 1
          nullable: true
        endLine:
          type: integer
          minimum: 1
          nullable: true
        commitSha:
          type: string
          pattern: '^[a-f0-9]{40}$'
          nullable: true
        confidence:
          type: string
          description: Anchor confidence bucket (high/medium/low).
        createdByKind:
          type: string
          description: P4 anchors are user-created (`user`); AI anchors are reserved.
        createdBy:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
    AnchorList:
      type: object
