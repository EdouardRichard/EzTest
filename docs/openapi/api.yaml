      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        target_stage:
          type: string
          enum: [clarifying, designing]
          nullable: true
          description: 省略时按当前门退回（需求门→clarifying，用例门→designing）
    WorkItemView:
      type: object
      description: 0.2.1 任务单投影（spec §5.4）；payload 只放引用/摘要，不含提示词或凭据
      required: [id, version_id, kind, goal, state, created_by, attempt, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        version_id:
          type: string
          pattern: '^[0-9]+$'
        kind:
          type: string
          enum: [design.cases, review.cases, execute.batch, analyze.failure, report.version, knowledge.propose]
        goal:
          type: string
          maxLength: 500
        state:
          type: string
          enum: [open, claimed, running, waiting_human, done, failed, cancelled]
        target:
          type: object
        inputs:
          type: object
        expected:
          type: object
        budget:
          type: object
          properties:
            max_tokens:
              type: integer
              minimum: 1
            run_seconds:
              type: integer
              minimum: 1
            max_turns_fuse:
              type: integer
              minimum: 1
        depends_on:
          type: array
          nullable: true
          items:
            type: string
            pattern: '^[0-9]+$'
          description: 依赖的 work_item ID；DB 列 `work_item.depends_on BIGINT[] NULL`，`null` 与 `[]` 都表示无依赖（不把 null 伪造成空数组）
        lease:
          type: object
          nullable: true
          properties:
            owner:
              type: string
            expires_at:
              type: string
              format: date-time
        attempt:
          type: integer
          minimum: 0
        result:
          type: object
        created_by:
          type: string
          enum: [state_machine, planner, assistant, trigger]
        idempotency_key:
          type: string
          maxLength: 200
          nullable: true
          description: 幂等键；未使用幂等键时为 `null`（DB 列可空，NULL 行不参与 `(version_id, kind, idempotency_key)` 唯一冲突）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
