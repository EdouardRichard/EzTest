      description: |
        事务内全量校验；已确认项幂等跳过；存在非法 draft 时整体 400（不做部分成功，P1-D8）。
        返回 `batch_id`、本次确认的 `confirmed` 与跳过的 `skipped`（需求 ID 数组）。
        事件 `requirement.clarified`；首次确认触发版本 `initial → running`。
        v0.2.4-E：每条待确认需求同样过占位词/最小长度确认门禁增量（见单条确认；400 字段错误，
        前向适用，已 clarified 幂等跳过不追溯）。
        v0.2.4-H（H-F10b #20，契约补文档）：整批失败时 `error.code` **沿用首个失败需求的错误码**
        （聚合码，非独立的 batch 专用码；如 `invalid_argument` / `state_conflict`），
        且 `error.details.requirement_id` 携带该失败需求的十进制字符串 ID，供调用方定位是哪一条。
        全批已 clarified 时为幂等重放（全部 `skipped`），**不读确认门禁设置**，与单条确认对称。
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
