          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  # --- P2 resource context (/api/resources) -------------------------------
  # Reads require a bearer token only; every write and action route is
  # administrator-only (403 for a regular user). P2 payload fields are
  # camelCase, unlike the P0/P1 snake_case API. Responses never carry a stored
  # credential or a session storage_state: Access exposes credentialSet and
  # Session exposes only its hash and shape counts.
  /api/resources/systems:
    get:
      tags: [resources]
      summary: List systems
      description: One cursor-paged list ordered by ID ascending.
      operationId: listSystems
      security:
        - bearerAuth: []
