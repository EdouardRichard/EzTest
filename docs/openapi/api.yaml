  /api/versions/{id}/scope-snapshot:
    get:
      tags: [Execution]
      operationId: getVersionScopeSnapshot
      summary: 波次冻结范围快照（当前 wave 生效范围；API-19）
      description: |
        R-EX-4 / DB-19。返回指定 wave 启动时冻结的 `run_wave.scope_snapshot`，
        形状为 `{version_id, frozen_at, environment_fingerprint, code_baseline,
        suts:[{sut_id, environment_id, base_url, page_ids, api_ids, database_ids,
        account_roles, repository_ids, repository_baselines:[{repo_id, commit_sha}]}]}`
        （v0.2.4-B：suts 数组，每条目以 sut_id 标识，无旧绑定行 id；v0.2.4-F/P4：
        per-SUT `base_url`/`repository_baselines` 与顶层 `environment_fingerprint`/
        `code_baseline` 指纹载体为追加字段，wave 级消费方据此冻结快照重建指纹输入，
        同 wave 内目录中途变化不影响在跑 wave 指纹；intent 创建与重放漂移门保持活读）。
        `repository_ids` 是该 binding 的全部 effective 代码仓
        （多仓、去重升序），不是单个基准仓；`repository_baselines` 逐仓配对各自解析的
        40-hex commit（V-0024 强绑定，无 branch 回退）。当前 wave 的快照不会因新 approved
        资源而改变，新资源只在下一 wave 生效。`wave_id` 必填且为规范十进制 ID
        （仅数字、无符号、无前导零；缺失/非法 400）；wave 不存在或不属于该版本
        一律 404（不泄漏跨版本存在性）。F 前 legacy wave（无指纹载体）经 wave 级
        消费方读取时 fail-closed typed error，不活读回退。
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: wave_id
          in: query
          required: true
          description: 波次（run_wave）雪花 ID 的规范十进制字符串（无符号、无前导零）
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
      responses:
        '200':
          description: 冻结范围快照（空快照返回 {} 对象）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [wave_id, status, scope_snapshot, counts]
                    properties:
                      wave_id:
                        type: string
                        pattern: '^[0-9]+$'
                      status:
                        type: string
                        enum: [planned, running, paused, done, failed, cancelled]
                      scope_snapshot:
                        type: object
                        additionalProperties: true
                        description: 冻结的 wave 范围，原样返回；空快照为 {}
                      counts:
                        $ref: '#/components/schemas/WaveCounts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{id}/session-fixtures:
    get:
      tags: [Execution]
      operationId: listSessionFixtures
      summary: 会话夹具库列表（admin；登录态复用，v0.2.4-F/P18/SC-F5）
      description: |
        只读返回该版本保存的会话夹具（登录态）事实，最新追加在前，按 before/limit 分页
        （夹具事实只追加、不删除、无上限，故列表诚实分页 has_more/next_cursor，不静默截断）。
        每条是一个不可变夹具版本，复用键为 (version, sut, environment, role)；同一复用键的
        最新行即当前生效夹具。仅元数据（复用键 + 内容寻址 sha256 引用 + 来源），登录态字节
        不经此 API 返回。执行团队经 fixture.upload/fixture.download 工具保存/复用登录态
        （CLI state-save/state-load）；本端点供管理员事后审计。未接线时 503。
