                $ref: '#/components/schemas/ClarificationQuestionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/clarification/questions/{qid}:
    patch:
      tags: [versions]
      summary: Answer, dismiss, reopen or edit a question
      description: |
        State transitions: `open → answered` (a non-empty `answer` is required),
        `open → dismissed`, and `answered|dismissed → open` (which clears the
        answer fields). Reopening or answering the wrong state returns 409
