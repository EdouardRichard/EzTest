    post:
      tags: [Versions]
      operationId: reopenVersion
      summary: 人工重开版本（completed→running）
      description: |
        仅 `completed→running`；清 `closed_at/close_reason/close_run_id`，并清 waiver
        （`closure_kind` 回 `normal`、`unverified` 回 `false`，v0.2.4-G R-G8）；版本报告置 stale；
        发 `version.reopened`（trigger=manual）与审计；否则 409。
        **waiver 撤销（R-G8a，防洗白）**：最新关闭轮次为 waived（check_result.waived=true）的需求
        `closed→clarified` + 清 `waived` + `reopen_count++`（撤销该豁免关闭，恢复人工判断点，
        须重新确认或重新 waiver）；正常关闭的需求保持 closed；其余 clarified 需求的残留 `waived`
        标记一并原子清除。waiver 不跨 reopen 持久——reconciler 不得凭旧 waiver 立即再闭。
      parameters:
        - $ref: '#/components/parameters/VersionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionReopenRequest'
      responses:
        '200':
          description: 重开后的版本
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
