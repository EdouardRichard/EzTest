        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/code/repos/{repoId}/index-runs/{runId}:
    get:
      tags: [code]
      summary: Read one index run of a repository
      description: A run of another repository is a plain 404 `index_run_not_found`.
      operationId: getCodeRepoIndexRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeRepoId'
        - $ref: '#/components/parameters/CodeIndexRunId'
