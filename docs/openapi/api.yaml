openapi: 3.0.3
info:
  title: EzTest API
  version: 0.3.0
  description: |
    Hand-maintained OpenAPI document for the EzTest API: the P0 foundation, the
    P1 Agent runtime and the P2 resource context.

    Conventions:
    - Successful responses use the `{"data": ...}` envelope. List endpoints add
      `next_cursor` (opaque, omitted when there is no next page or empty string)
      and `has_more`. The SSE snapshot and the P1 Agent session list use their
      own nested shapes (`{"data":{"items":[],"has_more":false,"next_cursor":null}}`).
    - Errors use `{"error": {"code", "message", "request_id", "retryable", "details"}}`
      with the closed set of codes listed in the ErrorEnvelope schema.
    - Every response echoes the request ID in the `X-Request-ID` header (a
      client-supplied `^[A-Za-z0-9_-]{8,128}$` value is reused, otherwise a UUID
      is generated). Clients may send `X-Request-ID` on any request.
    - Authenticated write endpoints accept an optional `Idempotency-Key`
      (`^[A-Za-z0-9_-]{8,128}$`). Replaying the same key and body returns the
      stored response with `Idempotent-Replayed: true`; a different body is 409
      `idempotency_conflict`. JSON responses larger than 1 MiB and SSE responses
      are not cached.
    - Bearer tokens are opaque strings returned once by `POST /api/auth/login`;
      the server stores only their hash. No endpoint ever returns a password,
      API key, ciphertext or custom header value.
    - Times are RFC 3339 UTC. Pagination is `limit` 1-100 (default 20) plus an
      opaque `cursor`.
    - P1 Agent endpoints under `/api/agents` are administrator-only. They reuse
      the bearer, error, request-ID and idempotency conventions above. Agent
      activity events use `type: agent.activity` on the
      `agent:{session_id}` channel; reading or streaming an `agent:` channel
      also requires an administrator (403 `forbidden` otherwise). See
      AgentActivityDetail for the frozen V1 nine-kind detail contract.
    - P2 resource endpoints under `/api/resources` use camelCase payload fields
      (the P2 DTOs), unlike the snake_case P0/P1 payloads. Every authenticated
      user may read; every write and action is administrator-only. Stored
      credentials and session `storageState` documents are write-only: an
      Access exposes only `credentialSet`, and a Session exposes only the
      storage-state hash and shape counts. The company is always the seeded
      default one, so requests never carry a `companyId`.

    This document is served publicly at `GET /api/openapi.yaml`; it is the same
    file under `docs/openapi/api.yaml` in the repository.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:13333
    description: Local development API
tags:
  - name: auth
  - name: users
  - name: llm
  - name: agents
  - name: stream
  - name: storage
  - name: audit
  - name: resources
  - name: code-repos
  - name: health
security: []
paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Authenticate a user and return a bearer token
      description: |
        Public. Five failed attempts for the same client IP and username within a
        minute lock the pair for a minute and return 429 with `Retry-After: 60`.
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: correct-horse-battery
      responses:
        '200':
          description: The raw bearer token (returned exactly once), its expiry and the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current bearer token
      operationId: logout
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '204':
          description: The token was revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
  /api/auth/me:
    get:
      tags: [auth]
      summary: Return the authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/users:
    get:
      tags: [users]
      summary: List users (admin only)
      description: Ordered by ID ascending.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [users]
      summary: Create a regular user (admin only)
      description: P0 only creates `role=user`; the administrator is seeded at startup.
      operationId: createUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: The created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/users/{id}:
    get:
      tags: [users]
      summary: Get one user (admin only)
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The requested user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [users]
      summary: Enable or disable a user (admin only)
      description: |
        A PATCH only changes `status`. Disabling the acting administrator is a
        409 `conflict` because P0 has no recovery path.
      operationId: updateUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/users/{id}/reset-password:
    post:
      tags: [users]
      summary: Reset a user's password and revoke all of their tokens (admin only)
      operationId: resetUserPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: The password was replaced and every token of the user was revoked.
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/llm/configs:
    get:
      tags: [llm]
      summary: List LLM configurations (admin only)
      description: 'Secrets are masked: only `has_api_key`, `key_version` and header names are returned.'
      operationId: listLLMConfigs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Every configuration (no pagination).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMConfigList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [llm]
      summary: Create an LLM configuration (admin only)
      operationId: createLLMConfig
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLLMConfigRequest'
      responses:
        '201':
          description: The created configuration with secrets masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMConfigEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/llm/configs/{id}:
    patch:
      tags: [llm]
      summary: Update an LLM configuration (admin only)
      description: |
        Every field is optional. Omitted `api_key` and `headers` keep their
        stored values; provided values replace them. The full object is
        re-encrypted with the active key version.
      operationId: updateLLMConfig
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/LLMConfigId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLLMConfigRequest'
      responses:
        '200':
          description: The updated configuration with secrets masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMConfigEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [llm]
      summary: Delete an LLM configuration (admin only)
      description: Deleting the default configuration leaves `llm_configured=false` until the environment seed runs again on restart.
      operationId: deleteLLMConfig
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/LLMConfigId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The configuration was deleted.
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/llm/configs/{id}/catalog/refresh:
    post:
      tags: [llm]
      summary: Refresh the upstream model catalog (admin only)
      description: |
        Calls the configuration's `GET {base_url}/v1/models`. On failure the
        previous cache is kept and the mapped `llm_*` error is returned.
      operationId: refreshLLMCatalog
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/LLMConfigId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The configuration with the refreshed `model_catalog` and `catalog_fetched_at`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMConfigEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/admin/llm/configs/{id}/test:
    post:
      tags: [llm]
      summary: Run a connectivity test against an LLM configuration (admin only)
      description: |
        Non-streaming calls return text, usage and latency. `stream=true`
        returns normalized `llm.delta` / `llm.done` / `llm.error` SSE frames.
        Success and failure are audited without the key, prompt or image bytes.
        `stream=true` requires `stream_enabled=true`; `image=true` requires
        `multimodal_enabled=true` and attaches the built-in 1x1 PNG.
      operationId: testLLMConfig
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/LLMConfigId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMTestRequest'
      responses:
        '200':
          description: |
            Non-streaming test result as JSON, or an SSE stream when
            `stream=true`. SSE frames are `llm.delta`, `llm.done` and
            `llm.error`; they are not idempotency-cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMTestResult'
            text/event-stream:
              schema:
                type: string
              example: |
                event: llm.delta
                data: {"delta":"A"}

                event: llm.done
                data: {"usage":{"prompt_tokens":1,"completion_tokens":1,"reasoning_tokens":0,"total_tokens":2},"latency_ms":42}
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/agents/profiles:
    get:
      tags: [agents]
      summary: List agent profiles (admin only)
      description: |
        Ordered by ID ascending. P1 seeds one builtin profile with
        `key=runtime-diagnostic`; administrators may edit its mutable fields.
      operationId: listAgentProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Every agent profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /api/agents/profiles/{id}:
    get:
      tags: [agents]
      summary: Get one agent profile (admin only)
      operationId: getAgentProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AgentProfileId'
      responses:
        '200':
          description: The requested profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [agents]
      summary: Update an agent profile (admin only)
      description: |
        Partial update of the ten mutable fields. `key` and `builtin` are
        immutable; sending them is a 400 because unknown fields are rejected.
        `allowed_tools` is re-validated against the live registry exposed by
        `GET /api/agents/tools`. An invalid value is 422 `invalid_argument`
        with `details.field`. An edit to a profile with a running session only
        affects the next run. The change is audited.
      operationId: updateAgentProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AgentProfileId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProfilePatch'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/Internal'
  /api/agents/tools:
    get:
      tags: [agents]
      summary: List the registered Agent tools (admin only)
      description: |
        Sorted by name. P1 registers `test.echo` and `test.fail`; `file.list`
        and `file.read` are registered only when `EZTEST_AGENT_FILE_ROOT` is
        non-empty, and `http.get` only reaches hosts in
        `EZTEST_AGENT_HTTP_ALLOWLIST`.
      operationId: listAgentTools
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: The tool catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentToolList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /api/agents/sessions:
    get:
      tags: [agents]
      summary: List Agent sessions (admin only)
      description: |
        One cursor-paged list ordered by ID descending, optionally filtered by
        `profile_id`. Unlike the P0 list envelope, the page body is
        `{"data":{"items":[...],"has_more":bool,"next_cursor":"<opaque>"}}`;
        `next_cursor` is null on the last page.
      operationId: listAgentSessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AgentProfileFilter'
      responses:
        '200':
          description: One page of sessions with their running/newest-terminal run projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [agents]
      summary: Create an Agent session (admin only)
      description: |
        The body is optional. `profile_id` omitted or 0 creates the session on
        the builtin `runtime-diagnostic` profile. A missing profile is 404; a
        disabled profile is 409 `conflict` with `details.reason=profile_disabled`.
        `title` is at most 120 characters.
      operationId: createAgentSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                profile_id:
                  type: integer
                  format: int64
                  minimum: 0
                  default: 0
                  description: Zero or omitted means the builtin profile.
                title:
                  type: string
                  maxLength: 120
      responses:
        '201':
          description: The created session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/Internal'
  /api/agents/sessions/{id}:
    get:
      tags: [agents]
      summary: Get one Agent session (admin only)
      description: Returns the session plus its running run (`active_run`) and newest terminal run (`last_run`).
      operationId: getAgentSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AgentSessionId'
      responses:
        '200':
          description: The requested session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [agents]
      summary: Rename an Agent session (admin only)
      description: '`title` is the only mutable session field and is required (0-120 characters).'
      operationId: updateAgentSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AgentSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 120
      responses:
        '200':
          description: The updated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [agents]
      summary: Delete an Agent session (admin only)
      description: |
        Cancels an active run with `user_abort` and waits up to 5 seconds. If
        the run is still active, returns 409 `conflict` with
        `details.reason=run_active` and deletes nothing. Once stopped, the
        session and its messages and runs are deleted.
      operationId: deleteAgentSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AgentSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The session and its data were deleted.
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/agents/sessions/{id}/messages:
    post:
      tags: [agents]
      summary: Send a user message and start a run (admin only)
      description: |
        Persists the user message and starts a run in the background, returning
        202 immediately. Progress streams as `agent.activity` events on the
        `agent:{session_id}` channel. An empty message is 422. One running run
        per session: another send is 409 `conflict` with
        `details.reason=run_active`. 503 `unavailable` carries
        `details.reason`, one of `llm_not_configured`,
        `tools_require_chat_completions` or `capacity` (`capacity` is also
        retryable). A write with the same `Idempotency-Key` and body replays
        the same 202.
      operationId: sendAgentMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AgentSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '202':
          description: The run was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSendMessageResult'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/agents/sessions/{id}/stop:
    post:
      tags: [agents]
      summary: Stop the active run (admin only)
      description: |
        Idempotent abort: returns `stopping` when a live run was cancelled and
        `idle` when the session had no active run. Event and run state carry the
        abort; the terminal activity is `agent.activity` kind `run_finished`.
      operationId: stopAgentSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AgentSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The abort outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStopResult'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/agents/sessions/{id}/messages/{message_id}:
    get:
      tags: [agents]
      summary: Get one full Agent message (admin only)
      description: |
        Lazy-loads the complete content (text parts, reasoning, tool calls,
        tool result and usage) after an activity event carried only a preview.
        The message must belong to the session in the path, otherwise 404.
      operationId: getAgentMessage
