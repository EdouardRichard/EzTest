          description: apply 必须为 true；否则 400 `confirmation_required`
    GCRunListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/GCRunView'
    InstanceView:
      type: object
      description: API 实例注册表（contracts/db-schema.md §16.4；P8 在飞计数见 §17.1）
      required: [id, instance_key, hostname, pid, api_port, node_id, status, version, started_at, heartbeat_at, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        instance_key:
          type: string
          description: hostname:pid 自然键
        hostname:
          type: string
        pid:
          type: integer
          minimum: 1
        api_port:
          type: integer
          minimum: 1
          maximum: 65535
        node_id:
          type: integer
          minimum: 0
          maximum: 1023
        status:
          type: string
          enum: [active, draining, offline, stopped]
        version:
          type: string
        active_requests:
          type: integer
          minimum: 0
          default: 0
          description: P8 本实例当前在飞 HTTP 请求数（每轮 heartbeat 回写；health/SSE 不计）
        active_work:
          type: integer
          minimum: 0
          default: 0
          description: P8 本实例当前在飞 agent/case run 数（每轮 heartbeat 回写；drain 等待归零后停进程）
        last_error:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        heartbeat_at:
          type: string
          format: date-time
        draining_at:
          type: string
          format: date-time
          nullable: true
        stopped_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InstanceListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/InstanceView'
    ReadinessView:
      type: object
      required: [status, database, storage, draining, instance_id]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, down]
        storage:
          type: string
          enum: [ok, down]
        draining:
          type: boolean
        instance_id:
          type: string
          description: 本实例 api_instance ID 的十进制字符串；未注册时为空串
        inflight_requests:
          type: integer
          minimum: 0
          default: 0
          description: P8 本实例当前在飞 HTTP 请求数（与 InstanceView.active_requests 同源）
        inflight_work:
          type: integer
          minimum: 0
          default: 0
          description: P8 本实例当前在飞 agent/case run 数（与 InstanceView.active_work 同源）
    ExecutorInstanceView:
      type: object
      description: 内部 register/heartbeat 的执行器实例视图（无 token hash/labels）
      required: [instance_id, endpoint, name, status, capacity, active_contexts, version]
      properties:
        instance_id:
          type: string
          pattern: '^[0-9]+$'
        endpoint:
          type: string
          format: uri
          maxLength: 500
        name:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [active, draining, offline]
        capacity:
          type: integer
          minimum: 0
        active_contexts:
          type: integer
          minimum: 0
        version:
          type: string
          maxLength: 64
        last_heartbeat:
          type: string
          format: date-time
          nullable: true
    ExecutorRegisterRequest:
      type: object
      required: [endpoint, name, capacity, version]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 500
        name:
          type: string
          minLength: 1
          maxLength: 200
        capacity:
          type: integer
          minimum: 1
          description: 执行器最大并发 context 数
        max_contexts:
          type: integer
          minimum: 1
          description: capacity 的同义别名；同时提供时必须相等
        active_contexts:
          type: integer
          minimum: 0
          default: 0
        version:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          enum: [active, degraded]
    ExecutorHeartbeatRequest:
      type: object
      required: [endpoint, active_contexts]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 500
        active_contexts:
          type: integer
          minimum: 0
        capacity:
          type: integer
          minimum: 0
          description: 可选；0 表示保留原容量
        version:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [active, degraded]
    StageView:
