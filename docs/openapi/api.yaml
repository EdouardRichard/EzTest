          description: Optional rejection rationale (reuses the rationale field).
    VersionEventType:
      type: string
      description: |
        The complete `channel=version:{id}` event catalog (spec §6.11 plus the
        P3 `clarification.context_updated` addition). Types from the earlier
        phases keep their V1 semantics; `agent.activity` keeps its frozen V1
        nine-kind detail contract. `clarification.context_updated` is emitted by
        the `context.summary_update` tool and carries
        `detail.versionId` (decimal string), `detail.tool` and `detail.actorId`.
        P4 adds `code.changed` (published when a change set is ready;
        `detail.analysisId`, `detail.baseCommit`, `detail.headCommit` and
        `detail.stats`) and `code.impact_computed` (published when an analysis
        finishes or degrades; `detail.analysisId`, `detail.analysisVersion`,
        `detail.status`, `detail.degraded` and `detail.counts`). Both put changed
        or evidence paths (up to 20, deduplicated) in `refs.code` and never carry
        facts, diffs or code content. P5 adds the eight `case.*` mindmap event
        types, published on the same channel: `case.created`/`case.updated`/
        `case.deleted` (node id/kind/source summary), `case.reviewed` (review
        id, finding and blocker counts), `case.baseline_frozen` (baseline id,
        node/case counts, graph-hash prefix), `case.run_started`/
        `case.run_finished` (run id, kind, status, reason) and
        `case.export_ready` (export id, format, size). They put node ids (up to
        20) in `refs.case` and never carry mindmap bodies, LLM input/output or
        export content. P6 adds the 16 execution event types, published on the
        same channel: `batch.created`/`batch.started` (batch_no, case count,
        baseline hash, status), `batch.paused`/`batch.resumed` (pause mode and
        reason), `batch.finished` (status and the final counts),
        `run.started`/`run.paused`/`run.resumed`/`run.finished` (case run id,
        attempt, status, failure class/reason),
        `step.started`/`step.finished` (seq, status, evidence count),
        `evidence.created` (evidence id, kind, size, sha256),
        `case.status_changed` (case node id, status) and `human.requested`/
        `gate.pending`/`gate.resolved` (takeover id, session id, reason,
        expiry). Execution events put evidence ids in `refs.evidence` and case
        node ids in `refs.case`, and never carry evidence bytes, prompts,
        credentials, case bodies or filesystem paths.
      enum:
        - version.created
        - version.updated
        - version.status_changed
        - requirement.added
        - requirement.updated
        - requirement.clarified
        - requirement.reopened
        - requirement.deleted
        - requirement.relation_added
        - requirement.relation_updated
        - requirement.relation_removed
        - clarification.session_started
        - clarification.session_completed
        - clarification.question_updated
        - clarification.context_updated
        - decision.proposed
        - decision.decided
        - attachment.added
        - attachment.removed
        - agent.activity
        - code.changed
        - code.impact_computed
        - case.created
        - case.updated
        - case.deleted
        - case.reviewed
        - case.baseline_frozen
        - case.run_started
        - case.run_finished
        - case.export_ready
        - batch.created
        - batch.started
        - batch.paused
        - batch.resumed
        - batch.finished
        - run.started
        - run.paused
        - run.resumed
        - run.finished
        - step.started
        - step.finished
        - evidence.created
        - case.status_changed
        - human.requested
        - gate.pending
        - gate.resolved
    VersionEvent:
      type: object
      description: |
        One persisted event on `channel=version:{id}`. It uses the same V1
        envelope as Event; `version_id` is always the decimal string version ID
        and `refs` reference P3-owned IDs as strings.
      required:
        - seq
        - channel
        - type
        - version_id
        - batch_id
        - case_id
        - step_id
        - agent_role
        - session_id
        - ts
        - summary
        - detail
        - refs
      properties:
        seq:
          type: integer
          format: int64
          description: Channel-local monotonic sequence.
        channel:
          type: string
          maxLength: 64
          description: Always `version:{id}` for this channel.
        type:
          $ref: '#/components/schemas/VersionEventType'
        version_id:
          type: string
          pattern: '^[0-9]{1,19}$'
        batch_id:
          type: string
          nullable: true
        case_id:
          type: string
          nullable: true
        step_id:
          type: string
          nullable: true
        agent_role:
          type: string
          nullable: true
          description: Agent profile key for `agent.activity`; null for domain events.
        session_id:
          type: string
          nullable: true
          description: Decimal-string P1 Agent session ID when the event references one.
        ts:
          type: string
          format: date-time
        summary:
          type: string
          maxLength: 500
        detail:
          type: object
          additionalProperties: true
          description: |
            Up to 64 KiB of valid JSON. P3 domain events include `actorId` and
            `source`, and the referenced P3 ID (`requirementId`, `questionId`,
            `decisionId`, `attachmentId`, ...) as decimal strings.
        refs:
          $ref: '#/components/schemas/EventRefs'
    VersionEventSnapshot:
      type: object
      description: |
        The flat P3 events snapshot (`{"data":[...], "snapshot_cursor",
        "has_more"}`), unlike the nested P0 EventSnapshot.
      required: [data, snapshot_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VersionEvent'
        snapshot_cursor:
          type: integer
          format: int64
          minimum: 0
          description: The version channel's current seq; use it as the SSE `since`/`Last-Event-ID` base.
        has_more:
          type: boolean
    CaseNodeKind:
