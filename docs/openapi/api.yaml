    post:
      tags: [Design]
      operationId: confirmDesignCases
      summary: 用户确认用例（case/scenario/requirement 三粒度）
      description: |
        仅用户/服务端调用；AI 无确认工具。整批事务；已确认幂等 skip；无 draft 返回 409。
        v0.2.4-E 裁判确认门禁（Confirm 唯一终态入口内谓词，按 review_state 分流）：
        `pass`（或 escalated_fail/judge_unavailable 且存在绑当前版本内容、晚于最新裁判事实的
        有效 override）放行；`pending`/`reworking` → 409 `judgment_pending`；
        `escalated_fail`/`judge_unavailable` 无有效 override → 409 `judgment_failed`
        （Details 携带 case_id/case_version_id/review_state/findings/next_action）。
        批量（scenario/requirement）原子整批校验：任一阻塞用例 → 整批 409，
        Details.`blocking_cases[]` 逐条 `{case_id, case_version_id, review_state, code, message}`，
        不部分确认。**裁判 pass 不自动确认——确认永远由人工触发（R-E4r）**。
        裁判门未接线时失败封闭（503），不静默放行。
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseConfirmationRequest'
      responses:
        '200':
          description: 确认结果
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CaseConfirmationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            状态冲突。除既有 `state_conflict`/`incomplete_case_version` 外，v0.2.4-E 新增
            typed code：`judgment_pending`（审查未完成，review_state=pending/reworking）、
            `judgment_failed`（fail 打回耗尽或裁判不可用且无有效 override；Details.findings
            点名裁判发现）。批量阻塞时 Details.blocking_cases[] 逐条点名（code 取选择序首个
            阻塞用例的 code）。错误码单一 Go 权威 design/application/confirmation.go。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Internal'

