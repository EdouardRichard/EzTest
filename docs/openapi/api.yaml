  /api/versions/{id}/case-versions/{caseVersionId}/rollback:
    post:
      tags: [Design]
      operationId: rollbackDiscoveryCaseVersion
      summary: 回滚历史系统自动确认的探索用例 revision（legacy-only，退役计划 0.3）
      description: |
        v0.22 W2-11 R-EX-6/API-41（design 上下文）；**v0.2.4-E R-E2r 形状变更（破坏性）**：
        将 pre-E 历史系统自动确认 revision（`trigger='discovery_delta'`、auto_confirmed_by=system）
        置为 `superseded`，并基于其前一 confirmed revision **新建 draft** 替代 revision
        （`trigger='rollback'`、`rollback_of=<id>`、**新建时 `status='draft'`**）→ 经裁判审查 →
        人工确认。**不再直写 confirmed、不再写系统确认行、不再绕过 Confirm**；替代修订
        不携带系统自动确认 actor。仍发布遗留事件 `case.revision.auto_confirmed`
        （payload.rollback_of 非零、**payload.status 携带权威生命周期状态，现行恒为 `draft`**；
        幂等重放不发事件）——**语义已变更为"rollback 替代 draft 已创建"**，
        不是自动确认（名不副实的已发布契约，语义变更+退役登记见 E 增量节与发布说明 E 章节）。
        body 可选 `reason`（≤2000 字符）。幂等：重复回滚返回已存在的替代 revision；
        原 revision 保留为历史，不删除行。**幂等重放的 status 例外**：重放**原样**返回已存
        替代修订的当前 status——pre-E 遗留替代修订当年直写 confirmed，重放即返回
        `status='confirmed'`；post-E draft 替代修订被人工确认后重放同样返回 confirmed。
        `draft` 仅描述 v0.2.4-E 起**新建**的替代修订（见 CaseRevisionRollbackView.status）。
        **legacy-only**：R-E2r 后不再产生新的系统自动确认
        修订，本端点仅服务历史数据；非系统自动确认（manual/normal/post-E draft）revision
        返回 409 `state_conflict`。**退役计划 0.3**（R-E2r 裁定+发布说明+通知期，宪法六.6）。
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: caseVersionId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]+$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: 替代 revision（新建为 draft；幂等重放原样返回已存替代修订，可为 confirmed）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CaseRevisionRollbackView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

