        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '500': {$ref: '#/components/responses/Internal'}

  /api/versions/{id}/stage/unblock:
    post:
      tags: [Versions]
      operationId: unblockVersionStage
      summary: 解除版本阻塞（登录用户）
      description: 先校验阻塞清除门禁（未清除 409 `stage_gate_failed`），再恢复到 suspended_from。
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200': {$ref: '#/components/responses/StageViewResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '500': {$ref: '#/components/responses/Internal'}

  /api/versions/{id}/stage/pause:
    post:
      tags: [Versions]
      operationId: pauseVersionStage
      summary: 暂停版本并优雅暂停运行中的 wave（登录用户）
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 2000}
      responses:
        '200': {$ref: '#/components/responses/StageViewResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '500': {$ref: '#/components/responses/Internal'}

  /api/versions/{id}/stage/resume:
    post:
      tags: [Versions]
      operationId: resumeVersionStage
      summary: 恢复暂停版本（登录用户）
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200': {$ref: '#/components/responses/StageViewResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '500': {$ref: '#/components/responses/Internal'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 不透明 token（`ezt_` + base64url），固定 7 天 TTL。
    internalBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 内部执行器 Bearer（DB 设置 `execution.executor_token`，非用户 token；只用于 /api/internal/executors/*）。
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: 上一页最后一个实体的十进制 ID；省略表示第一页
      schema:
        type: string
        pattern: '^[0-9]+$'
    ID:
      name: id
      in: path
      required: true
      description: 业务实体雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    ModelID:
      name: modelId
      in: path
      required: true
      description: 模型实体 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    SettingKey:
      name: key
      in: path
      required: true
      description: 设置键（如 `execution.global_concurrency`）
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]+$'
    SHA256:
      name: sha256
      in: path
      required: true
      description: 内容 SHA-256（64 位小写 hex）
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    EventChannel:
      name: channel
      in: query
      required: true
      description: 事件频道；允许 system / version:{id} / user:{id} / run:{id}（run 通道仅 admin，v0.2.4-D；非 admin 403）。模式派生自 eventing/application/service.go channelPattern
      schema:
        type: string
        pattern: '^(?:system|version:[1-9][0-9]*|user:[1-9][0-9]*|run:[1-9][0-9]*)$'
    EventAfter:
      name: after
      in: query
      required: false
      description: 事件游标（频道内 seq）；省略/0 表示取最新一页（快照）或从当前末尾实时（SSE）
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: SSE 断线续传游标；存在时优先于 `after` 查询参数
      schema:
        type: integer
        format: int64
        minimum: 0
    CID:
      name: cid
      in: path
      required: true
      description: 对话（conversation）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    MID:
      name: mid
      in: path
      required: true
      description: 消息（`conversation_message.id`，UI 线程消息，parts 所属消息）雪花 ID 的十进制字符串；不是 `agent_message.id`（LLM transcript 不通过本 API 暴露）。服务端校验其属于路径中的会话/版本，并按 `seq` 升序返回该消息的 parts（0.2.1 parts 查询）
      schema:
        type: string
        pattern: '^[0-9]+$'
    WorkItemID:
      name: workItemId
      in: path
      required: true
      description: work_item 雪花 ID 的十进制字符串（0.2.1）
      schema:
        type: string
        pattern: '^[0-9]+$'
    JobID:
      name: jobId
      in: path
      required: true
      description: 作业 ID；等于 work_item.id 的十进制字符串（0.2.1 用户投影）
      schema:
        type: string
        pattern: '^[0-9]+$'
    RID:
      name: rid
      in: path
      required: true
      description: 需求（requirement）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    Team:
      name: team
      in: path
      required: true
      description: |
        团队频道；P1 只读，澄清团队为 `clarification`。值集 = Go `agent.ParseTeam`
        （agent/domain/team_room.go，6 团队；v0.2.4-G GD-17 已移除 steward 团队）。
        code/ops 为确定性 worker 团队（无团队房间帖子/digest）。
      schema:
        type: string
        enum: [clarification, design, execution, delivery, code, ops]
    ConversationKind:
      name: kind
      in: query
      required: false
      description: 对话类型过滤；P1 只产生 clarification
      schema:
        type: string
        enum: [clarification, design]
    RequirementStatusFilter:
      name: status
      in: query
      required: false
      description: 需求状态过滤
      schema:
        type: string
        enum: [draft, clarified, closed, obsolete]
    Before:
      name: before
      in: query
      required: false
      description: 上一页最后一个实体的十进制 ID（按 id 倒序分页）；省略表示第一页
      schema:
        type: string
        pattern: '^[0-9]+$'
    MessageAfter:
      name: after
      in: query
      required: false
      description: 消息 ID 游标；只返回 id 大于该值的消息（升序）；省略从最早消息开始
      schema:
        type: string
        pattern: '^[0-9]+$'
    MessageLimit:
      name: limit
      in: query
      required: false
      description: 每页消息数（默认 100，最大 200）
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    IntentID:
      name: intentId
      in: path
      required: true
      description: 执行意图（execution_intent）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    WaveID:
      name: waveId
      in: path
      required: true
      description: 波次（run_wave）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    CaseRunID:
      name: caseRunId
      in: path
      required: true
      description: 用例结果（case_run）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    EvidenceID:
      name: evidenceId
      in: path
      required: true
      description: 证据（evidence）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    HumanRequestID:
      name: humanRequestId
      in: path
      required: true
      description: 人机请求（human_request）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    ExecutorID:
      name: executorId
      in: path
      required: true
      description: 执行器实例（executor_instance）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    IntentStatusFilter:
      name: status
      in: query
      required: false
      description: intent 状态过滤
      schema:
        type: string
        enum: [open, claimed, running, done, failed, cancelled, superseded]
    WaveStatusFilter:
      name: status
      in: query
      required: false
      description: 波次状态过滤
      schema:
        type: string
        enum: [planned, running, paused, done, failed, cancelled]
    CaseRunStatusFilter:
      name: status
      in: query
      required: false
      description: case_run 状态过滤（四态 + 过程态）
      schema:
        type: string
        enum: [pending, running, paused, passed, failed, blocked, inconclusive, skipped, interrupted, superseded]
    EvidenceCaseRunFilter:
      name: case_run_id
      in: query
      required: false
      description: 按 case_run 过滤证据（十进制字符串）
      schema:
        type: string
        pattern: '^[0-9]+$'
    EvidenceSUTFilter:
      name: sut_id
      in: query
      required: false
      description: 按 SUT 过滤证据（十进制字符串）
      schema:
        type: string
        pattern: '^[0-9]+$'
    EvidenceKindFilter:
      name: kind
      in: query
      required: false
      description: 证据类型过滤（11 值；v0.2.4-C 录制层新增 command/file/trace）
      schema:
        type: string
        enum: [screenshot, snapshot, console, network, http, db, download, text, command, file, trace]
    HumanRequestStatusFilter:
      name: status
      in: query
      required: false
      description: 人机请求状态过滤
      schema:
        type: string
        enum: [open, resolved, cancelled, expired]
    VersionID:
      name: versionId
      in: path
      required: true
      description: 版本雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    IssueID:
      name: issueId
      in: path
      required: true
      description: 问题（issue）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    ReportID:
      name: reportId
      in: path
      required: true
      description: 报告（report）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    Revision:
      name: revision
      in: path
      required: true
      description: 报告 revision（从 1 开始递增）
      schema:
        type: integer
        minimum: 1
    RequirementID:
      name: requirementId
      in: path
      required: true
      description: 需求（requirement）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    IssueStatusFilter:
      name: status
      in: query
      required: false
      description: 问题状态过滤
      schema:
        type: string
        enum: [open, confirmed, dismissed, merged]
    IssueCategoryFilter:
      name: category
      in: query
      required: false
      description: 问题类别过滤
      schema:
        type: string
        enum: [ui, api, db]
    IssueSeverityFilter:
      name: severity
      in: query
      required: false
      description: 问题严重度过滤
      schema:
        type: string
        enum: [major, minor, trivial]
    IssueSUTFilter:
      name: sut_id
      in: query
      required: false
      description: 按 SUT 过滤问题（十进制字符串）
      schema:
        type: string
        pattern: '^[0-9]+$'
    ReportKindFilter:
      name: kind
      in: query
      required: false
      description: 报告类型过滤
      schema:
        type: string
        enum: [wave, version]
    ChainSUTFilter:
      name: sut_id
      in: query
      required: false
      description: 链路 SUT 过滤（十进制字符串）
      schema:
        type: string
        pattern: '^[0-9]+$'
    ChainPageFilter:
      name: page_id
      in: query
      required: false
      description: 链路页面过滤（十进制字符串）
      schema:
        type: string
        pattern: '^[0-9]+$'
    ChainWaveFilter:
      name: wave_id
      in: query
      required: false
      description: 链路波次过滤（十进制字符串）
      schema:
        type: string
        pattern: '^[0-9]+$'
    ChainStatusFilter:
      name: status
      in: query
      required: false
      description: 链路节点状态过滤（实现按节点 kind 解释；P6 起非法枚举值 400 invalid_argument）
      schema:
        type: string
    ChainResultFilter:
      name: result
      in: query
      required: false
      description: 链路结果过滤（passed/failed/blocked/inconclusive/skipped 等；P6 起非法枚举值 400 invalid_argument）
      schema:
        type: string
    ChainEventFrom:
      name: event_from
      in: query
      required: false
      description: 历史回看起始事件 seq（含边界；近似语义）
      schema:
        type: integer
        format: int64
        minimum: 0
    ChainEventTo:
      name: event_to
      in: query
      required: false
      description: 历史回看结束事件 seq（含边界；近似语义）
      schema:
        type: integer
        format: int64
        minimum: 0
    ChainFocusNode:
      name: focus_node
      in: query
      required: false
      description: 深链目标节点 id（`{kind}:{ref_id}`）；强制保留该节点及其祖先
      schema:
        type: string
        pattern: '^[a-z_]+:[0-9]+$'
    ChainLimit:
      name: limit
      in: query
      required: false
      description: 链路节点上限覆盖（受 chain.max_nodes 限制）
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 300
    RepoID:
      name: repoId
      in: path
      required: true
      description: 代码仓库（resource.code_repository）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    RepoIDQuery:
      name: repoId
      in: query
      required: true
      description: 代码仓库雪花 ID 的十进制字符串（必须属于当前版本绑定仓库）
      schema:
        type: string
        pattern: '^[0-9]+$'
    RepoIDFilter:
      name: repoId
      in: query
      required: false
      description: 代码仓库雪花 ID 过滤（省略=当前版本全部绑定仓库）
      schema:
        type: string
        pattern: '^[0-9]+$'
    CodeIndexRunID:
      name: runId
      in: path
      required: true
      description: 代码索引运行（code_index_run）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    CodeAnalysisID:
      name: analysisId
      in: path
      required: true
      description: 代码分析运行（code_analysis）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    CodeCandidateID:
      name: candidateId
      in: path
      required: true
      description: 影响候选（code_impact_candidate）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    CodeAnchorID:
      name: anchorId
      in: path
      required: true
      description: 代码锚点（code_anchor）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    CodeFactID:
      name: factId
      in: path
      required: true
      description: 代码事实（code_fact）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    CommitSHA:
      name: sha
      in: path
      required: true
      description: 40 位小写 hex commit SHA
      schema:
        type: string
        pattern: '^[0-9a-f]{40}$'
    CodeCommit:
      name: commit
      in: query
      required: false
      description: 40 位小写 hex commit；缺省使用版本基线/分支头
      schema:
        type: string
        pattern: '^[0-9a-f]{40}$'
    CodeCommitRequired:
      name: commit
      in: query
      required: true
      description: 40 位小写 hex commit（必须属于该仓库；不返回其他 commit 内容）
      schema:
        type: string
        pattern: '^[0-9a-f]{40}$'
    CodeHeadOptional:
      name: head
      in: query
      required: false
      description: 变更 head commit（40 位小写 hex；缺省为仓库分支头）
      schema:
        type: string
        pattern: '^[0-9a-f]{40}$'
    ProposalPageID:
      name: pageId
      in: path
      required: true
      description: 页面（sut_page）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    ProposalAPIID:
      name: apiId
      in: path
      required: true
      description: SUT API（sut_api）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    CodeBaseCommit:
      name: base
      in: query
      required: true
      description: 变更 base commit（40 位小写 hex）；通常为版本基线
      schema:
        type: string
        pattern: '^[0-9a-f]{40}$'
    CodeHeadCommit:
      name: head
      in: query
      required: true
      description: 变更 head commit（40 位小写 hex）；通常为分支头
      schema:
        type: string
        pattern: '^[0-9a-f]{40}$'
    CodePath:
      name: path
      in: query
      required: true
      description: 仓库内 slash 归一化相对路径（1..4096）
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    CodePathFilter:
      name: path
      in: query
      required: false
      description: 仓库内 slash 归一化相对路径过滤
      schema:
        type: string
        maxLength: 4096
    CodeCursor:
      name: cursor
      in: query
      required: false
      description: 值游标（上一页最后一个 path/ID）；空表示第一页
      schema:
        type: string
    CodeLimit:
      name: limit
      in: query
      required: false
      description: 代码树每页条数（tree 专用，handler listLimit(r,50,200)）；facts/search 各有专用参数
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CodeFactsLimit:
      name: limit
      in: query
      required: false
      description: 每页事实条数（facts 专用，handler listLimit(r,50,100)）
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CodeSearchLimit:
      name: limit
      in: query
      required: false
      description: 单批搜索结果条数（search 专用，handler listLimit(r,20,50)；超限静默截断到 50）
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    CodeDiffLimit:
      name: limit
      in: query
      required: false
      description: 变更文件每页条数（≤2000）
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 200
    CodeKindFilter:
      name: kind
      in: query
      required: false
      description: 代码实体/事实 kind 过滤
      schema:
        type: string
        enum: [file, module, route, api, client_call, component, page, symbol]
    CodeSearchQuery:
      name: q
      in: query
      required: true
      description: path/name 子串搜索（1..500；不返回代码正文）
      schema:
        type: string
        minLength: 1
        maxLength: 500
    CodeStartLine:
      name: startLine
      in: query
      required: false
      description: 文件窗口起始行（≥1；与 endLine 一起 ≤400 行/64 KiB）
      schema:
        type: integer
        minimum: 1
    CodeEndLine:
      name: endLine
      in: query
      required: false
      description: 文件窗口结束行（≥startLine）
      schema:
        type: integer
        minimum: 1
    CodeSubjectKindFilter:
      name: subjectKind
      in: query
      required: false
      description: 锚点主体类型过滤
      schema:
        type: string
        enum: [version, requirement, requirement_version, case_version, issue]
    CodeSubjectIDFilter:
      name: subjectId
      in: query
      required: false
      description: 锚点主体 ID 过滤（十进制字符串；需与 subjectKind 同时使用）
      schema:
        type: string
        pattern: '^[0-9]+$'
    VersionIDFilter:
      name: versionId
      in: query
      required: false
      description: 版本过滤（十进制字符串；省略=全局聚合）
      schema:
        type: string
        pattern: '^[0-9]+$'
    VersionIDQuery:
      name: version_id
      in: query
      required: false
      description: 版本过滤（十进制字符串；P6 查询参数 snake_case；省略=全局）
      schema:
        type: string
        pattern: '^[0-9]+$'
    SearchQuery:
      name: q
      in: query
      required: true
      description: 搜索词；trim 后 1–100，空/超长 400（details.field=q）
      schema:
        type: string
        minLength: 1
        maxLength: 100
    SearchTypes:
      name: types
      in: query
      required: false
      description: 逗号分隔的类型集合（version,requirement,case,issue,report）；省略=全部 5 类，未知值 400
      schema:
        type: string
    SearchLimit:
      name: limit
      in: query
      required: false
      description: 每类型条数上限（1–20，默认 5；总上限 100）
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
    TodoLimit:
      name: limit
      in: query
      required: false
      description: 待办条数上限（1–200，默认 50；counts 为 limit 前计数）
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    EvalRunLimit:
      name: limit
      in: query
      required: false
      description: 评测 run 条数（1–50，默认 20；无 cursor）
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    EvalRunID:
      name: id
      in: path
      required: true
      description: 评测 run 雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    TextQuery:
      name: q
      in: query
      required: false
      description: 标题模糊过滤（1–100；省略=不过滤）
      schema:
        type: string
        minLength: 1
        maxLength: 100
    ReportStatusFilter:
      name: status
      in: query
      required: false
      description: 报告状态过滤（P6 全局报告）
      schema:
        type: string
        enum: [draft, published, stale]
    AgentProfileKeyFilter:
      name: profile_key
      in: query
      required: false
      description: agent profile key 过滤
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{0,63}$'
    AgentRunStatusFilter:
      name: status
      in: query
      required: false
      description: agent run 状态过滤（非法 400）
      schema:
        type: string
        enum: [running, done, failed, aborted, interrupted]
    ProfileKey:
      name: key
      in: path
      required: true
      description: agent_profile.key（自然键）
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{0,63}$'
    SkillName:
      name: name
      in: path
      required: true
      description: 技能包名（自然键；skills/<name>/SKILL.md 目录名）
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]{0,63}$'
    BeforeVersion:
      name: before_version
      in: query
      required: false
      description: 上一页最后一个 revision version（整数；按 version DESC 分页）
      schema:
        type: integer
        minimum: 1
    SkillUsageRunID:
      name: run_id
      in: query
      required: true
      description: agent run id（正十进制；skill_usage 账本按 run 读取）
      schema:
        type: string
        pattern: '^[0-9]+$'
    ChainQ:
      name: q
      in: query
      required: false
      description: 需求/场景/用例标题模糊过滤（≤100）
      schema:
        type: string
        maxLength: 100
    ChainAbnormalOnly:
      name: abnormal_only
      in: query
      required: false
      description: 仅 failed/blocked/inconclusive/interrupted 节点（默认 false）
      schema:
        type: boolean
        default: false
    ChainIssueStatus:
      name: issue_status
      in: query
      required: false
      description: 问题状态过滤（P6）
      schema:
        type: string
        enum: [open, confirmed, dismissed, merged]
    ChainIssueSeverity:
      name: issue_severity
      in: query
      required: false
      description: 问题严重度过滤（P6）
      schema:
        type: string
        enum: [major, minor, trivial]
    ChainRequirementLimit:
      name: requirement_limit
      in: query
      required: false
      description: 需求根节点上限（1–500；缺省用 settings `chain.max_requirements`）
      schema:
        type: integer
        minimum: 1
        maximum: 500
    KnowledgeID:
      name: knowledgeId
      in: path
      required: true
      description: 知识（knowledge_item）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    GCRunID:
      name: gcRunId
      in: path
      required: true
      description: GC run（gc_run）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    InstanceID:
      name: id
      in: path
      required: true
      description: API 实例（api_instance）雪花 ID 的十进制字符串
      schema:
        type: string
        pattern: '^[0-9]+$'
    KnowledgeScopeFilter:
      name: scope
      in: query
      required: false
      description: 知识范围过滤
      schema:
        type: string
        enum: [global, system]
    KnowledgeStatusFilter:
      name: status
      in: query
      required: false
      description: 知识审核状态过滤
      schema:
        type: string
        enum: [draft, approved, suspect, stale, rejected, revoked]
    KnowledgeSystemKeyFilter:
      name: system_key
      in: query
      required: false
      description: scope=system 的 SUT family 过滤
      schema:
        type: string
    KnowledgeTagFilter:
      name: tag
      in: query
      required: false
      description: 标签过滤（数组包含）
      schema:
        type: string
    KnowledgeQFilter:
      name: q
      in: query
      required: false
      description: 全文检索（title/content/tags；`websearch_to_tsquery('simple', q)`）
      schema:
        type: string
    RunID:
      name: runID
      in: path
      required: true
      description: 需求抽取 run ID（十进制字符串；v0.22 API-7）
      schema:
        type: string
        pattern: '^[0-9]+$'
    AttachmentID:
      name: attachmentId
      in: path
      required: true
      description: 需求附件 ID（十进制字符串；H7 版本作用域校验）
      schema:
        type: string
        pattern: '^[0-9]+$'
    QID:
      name: qid
      in: path
      required: true
      description: 结构化提问批次 ID（human_request.id 的十进制字符串）
      schema:
        type: string
        pattern: '^[0-9]+$'
  responses:
    BadRequest:
      description: 请求参数/请求体校验失败（invalid_argument）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未认证或 token 无效/过期（unauthenticated）
      headers:
        WWW-Authenticate:
          schema:
            type: string
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 权限不足（forbidden）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 每实例请求超限（rate_limited；设置 security.rate_limit_per_minute>0 时生效；health/SSE 跳过）
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Limit:
          description: 当前每实例每分钟限额
          schema:
            type: integer
            minimum: 0
        X-RateLimit-Remaining:
          description: 当前窗口剩余额度
          schema:
            type: integer
            minimum: 0
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 实体不存在（not_found）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 唯一约束/状态冲突（conflict / state_conflict / lease_lost）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: 语义/业务校验失败（invalid_argument；422；`details.reason` 稳定子码）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: 依赖暂时不可用（unavailable / ai_unavailable / context_overflow / executor_unavailable，retryable=true）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: 服务端错误（internal）
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ExtractionRun:
      description: 需求抽取 run 进度/对账投影
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/ExtractionRunView'
    StageViewResponse:
      description: 版本阶段投影
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/StageView'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              type: string
              description: |
                稳定错误码（0.2.1 追加）：invalid_argument / unauthenticated / forbidden / not_found /
                conflict / state_conflict / lease_lost / ai_unavailable / provider_unavailable /
                context_overflow / unsupported_attachment_format / extraction_failed / evidence_too_large /
                executor_unavailable / rate_limited / unavailable / internal /
                invalid_stage_for_gate / no_requirements_to_confirm / no_cases_to_confirm /
                attachment_pending / page_url_exists / invalid_protocol / llm_config_invalid /
                llm_capability_mismatch / llm_protocol_error / llm_auth_failed / invalid_model。
                0.2.1 新增的 LLM 错误码（invalid_protocol / llm_config_invalid /
                llm_capability_mismatch / llm_protocol_error / llm_auth_failed / invalid_model）
                均非重试（retryable=false）；上游瞬时失败仍复用 P1 的 503 ai_unavailable
                （retryable=true）。其中由上游失败分类得到的 `llm_protocol_error` /
                `llm_auth_failed` / `invalid_model` 带 `details.action`（面向用户的下一步建议）；
                `llm_config_invalid` / `llm_capability_mismatch` / `invalid_protocol` 是配置/
                能力/协议枚举错误，只带 `field`/`model`/`missing_capabilities` 等结构化细节，
                **不保证 `details.action`**，UI 应按 code 处理。
                attachment_pending 为 retryable=true 的 409；硬门错误为 409；page_url_exists 为 409
                且 details.field="url"；知识 secret 拒绝复用 400 invalid_argument + details.field="secret"。
                v0.2.4-E 新增 typed 409：`judgment_pending` / `judgment_failed`（用例确认裁判门禁，
                Details 携带 case_id/case_version_id/review_state/findings/next_action；批量阻塞时
                Details.blocking_cases[] 逐条点名）与 `ac_coverage_gap`（designing→case_review 共享
                审查门覆盖缺口，Details.missing_acs 点名缺失 AC；多缺口聚合 Details.blockers[]）。
                单一 Go 权威：design/application/confirmation.go 与 review_gate.go。
            message:
              type: string
            request_id:
              type: string
              description: 与响应头 X-Request-ID 相同
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
              description: '结构化细节；字段错误通常为 {"field": "..."}；P1 可能带 requirement_id / attachment_id 便于 UI 定位'
    ListEnvelope:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items: {}
        next_cursor:
          type: string
          description: 下一页游标（实体 ID 十进制字符串）；httpx.List 始终传非指针 string，has_more=false 时为空串（不是 null）
        has_more:
          type: boolean
    HealthData:
      type: object
      required: [status, version, db, settings_loaded, executor_url]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        db:
          type: string
          enum: [ok, down]
        settings_loaded:
          type: boolean
        executor_url:
          type: string
    User:
      type: object
      required: [id, username, display_name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: 明文 token（仅登录响应返回一次）
        expires_at:
          type: string
          format: date-time
          description: 固定 7 天 TTL
        user:
          $ref: '#/components/schemas/User'
    Setting:
      type: object
      required: [key, category, type, value, is_secret, restart_required, description, version, updated_at]
      properties:
        key:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [string, number, boolean, json]
        value:
          nullable: true
          description: 非 secret 为 JSON 值；secret 固定为 null
        is_secret:
          type: boolean
        restart_required:
          type: boolean
        description:
          type: string
        version:
          type: integer
        updated_at:
          type: string
          format: date-time
    SettingRevision:
      type: object
      required: [id, key, created_at]
      properties:
        id:
          type: string
        key:
          type: string
        old_value:
          nullable: true
          description: secret 项为 null
        new_value:
          nullable: true
          description: secret 项为 null
        actor_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    LLMConfig:
      type: object
      required: [id, name, provider, protocol, base_url, api_key_set, headers, thinking_type, reasoning_effort, models, timeout_seconds, max_retries, is_default, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
          description: P0 默认 openai（字段保留）
        protocol:
          type: string
          enum: [openai, openai_compatible, openai_chat_completions, openai_responses]
          description: |
            canonical 值为 `openai_chat_completions`（POST /chat/completions）与 `openai_responses`
            （POST /responses，独立 wire 适配）；legacy `openai`/`openai_compatible` 保留读取并按
            chat completions 处理（0.2.1 无数据迁移）。不支持 Anthropic。
        base_url:
          type: string
          format: uri
        api_key_set:
          type: boolean
          description: 是否已配置 API key；明文 key 永不返回
        headers:
          type: object
          additionalProperties:
            type: string
        thinking_type:
          type: string
          enum: [auto, enabled, disabled]
          description: 0.2.1 思考模式；缺省/历史行为 auto
        reasoning_effort:
          type: string
          enum: [none, low, medium, high, xhigh, max]
          description: 0.2.1 推理强度；与 thinking_type 独立；缺省 none
        default_model_id:
          type: string
          pattern: '^[0-9]+$'
          description: |
            0.2.1 显式默认模型 ID（`llm_model.id` 十进制字符串）；未配置时字段省略。禁止回退 models[0]；
            active 配置必须能从启用模型中解析出该默认模型，否则返回 400 `llm_config_invalid`。
        models:
          type: array
          items:
            $ref: '#/components/schemas/LLMModel'
          description: 该配置的模型目录（含 0.2.1 capabilities/deprecated）
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 600
        max_retries:
          type: integer
          minimum: 0
          maximum: 10
        is_default:
          type: boolean
        health:
          type: object
          description: 0.2.3 配置完整性提示（默认模型是否可解析、是否支持视觉）；reason 为空表示健康
          required: [default_model_valid, vision_ready, reason]
          properties:
            default_model_valid:
              type: boolean
            vision_ready:
              type: boolean
            reason:
              type: string
              enum: ['', default_model_missing, default_model_disabled, default_model_not_vision]
        status:
          type: string
          enum: [active, disabled]
        created_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LLMModel:
      type: object
      required: [id, config_id, model, display_name, context_window, max_output, supports_tools, supports_vision, source, status, created_at, updated_at]
      properties:
        id:
          type: string
        config_id:
          type: string
        model:
          type: string
        display_name:
          type: string
        context_window:
          type: integer
          minimum: 0
        max_output:
          type: integer
          minimum: 0
        supports_tools:
          type: boolean
        supports_vision:
          type: boolean
        capabilities:
          type: object
          description: 0.2.1 结构化能力集（读取时与 legacy supports_* 列合并）
          required: [supports_tools, supports_vision, supports_reasoning, context_window, supports_prompt_cache]
          properties:
            supports_tools:
              type: boolean
            supports_vision:
              type: boolean
            supports_reasoning:
              type: boolean
            context_window:
              type: integer
              minimum: 0
            supports_prompt_cache:
              type: boolean
        supports_tools_source:
          type: string
          enum: [catalog, manual]
        supports_vision_source:
          type: string
          enum: [catalog, manual]
        supports_reasoning_source:
          type: string
          enum: [catalog, manual]
        supports_prompt_cache_source:
          type: string
          enum: [catalog, manual]
        deprecated:
          type: boolean
          description: 已下线模型保留展示并标 true；不参与默认模型解析/派发（0.2.1 刷新不静默删除）
        source:
          type: string
          enum: [catalog, manual]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RemoteModel:
      type: object
      required: [id]
      properties:
        id:
          type: string
        context_window:
          type: integer
          minimum: 0
        max_output:
          type: integer
          minimum: 0
        supports_tools:
          type: boolean
        supports_vision:
          type: boolean
    LLMTestResult:
      type: object
      required: [ok, latency_ms, models]
      properties:
        ok:
          type: boolean
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        models:
          type: array
          items:
            $ref: '#/components/schemas/RemoteModel'
        error:
          type: string
          description: 失败摘要（不包含 key）；成功时省略
    AuditLogEntry:
      type: object
      required: [id, action, target_kind, target_id, request_id, ip, user_agent, metadata, created_at]
      properties:
        id:
          type: string
        actor_id:
          type: string
        actor_name:
          type: string
          description: 0.2.3 操作者用户名（审计列表 LEFT JOIN app_user；登录/系统事件可能为空）
        action:
          type: string
        target_kind:
          type: string
        target_id:
          type: string
        request_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    Event:
      type: object
      required: [seq, channel, type, scope, payload, created_at]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: 频道内事件顺序号（不是业务实体 ID）；SSE id 即该值
        channel:
          type: string
          description: system / version:{id} / user:{id} / run:{id}（run 通道仅 admin，v0.2.4-D）
        type:
          type: string
          description: 事件类型；历史登记见 contracts/events.md（契约树缺失，V-0025），现行登记见本文件 description 各增量节
        scope:
          type: object
          additionalProperties: true
          description: 作用域 ID（字符串），如 {"version_id":"1001"}
        payload:
          type: object
          additionalProperties: true
          description: 事件负载；永不含密码/token/API key
        actor_id:
          type: string
          nullable: true
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
    EventSnapshotEnvelope:
      type: object
      required: [data, snapshot_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        snapshot_cursor:
          type: integer
          format: int64
          minimum: 0
          description: 请求时刻该频道最新 seq（不是业务实体 ID）
        has_more:
          type: boolean
    ContentObject:
      type: object
      required: [sha256, size, mime, url]
      properties:
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        size:
          type: integer
          format: int64
          minimum: 0
        mime:
          type: string
        url:
          type: string
          description: 下载路径，如 /api/content/{sha256}
    SUT:
      type: object
      description: 系统-under-test（v0.2.4-B 反转后）：隶属一个环境，拥有 base_url 与页面/API/数据库资产树。
      required: [id, environment_id, name, intro, base_url, family, source, status, pages, apis, databases, created_at, updated_at]
      properties:
        id:
          type: string
        environment_id:
          type: string
          description: 所属环境 ID（资源上下文内真实 FK；不可移动）
        name:
          type: string
        intro:
          type: string
        base_url:
          type: string
          format: uri
          description: 系统基础 URL（v0.2.4-B 由环境下移至 SUT）
        family:
          type: string
          nullable: true
          maxLength: 64
          pattern: '^[^\s\p{Lu}\p{Lt}]*$'
