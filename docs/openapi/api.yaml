        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}:
    get:
      tags: [versions]
      summary: Read one version
