        按 id 升序、**无分页**（run 转录由轮次/工具预算天然有界；隐藏默认分页会静默截断管理员
        看到的内容）。**仅 admin**（普通登录用户 403 `forbidden`，未登录 401；id 非正整数 400）。
        实时增量经 `run:{id}` 事件频道的 `agent.transcript.delta`（同样仅 admin）；
