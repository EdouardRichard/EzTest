        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/storage/objects:
    post:
      tags: [storage]
      summary: Upload a content-addressed object (admin only)
      description: |
        The raw request body (at most 10 MiB) is the object; the `Content-Type`
        header is required and recorded as metadata. The response carries the
        SHA-256 id used by the download endpoint. P0 has no public URL, GC or
        retention policy.
      operationId: uploadObject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: The stored object's content-addressed metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/storage/objects/{sha256}:
    get:
      tags: [storage]
      summary: Download an object by SHA-256 (admin only)
      description: |
        Streams the stored bytes after re-verifying the content hash. A hash
        mismatch is `storage_corrupted`; bytes are always served as an
        attachment with `X-Content-Type-Options: nosniff`.
      operationId: downloadObject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/SHA256'
      responses:
        '200':
          description: The raw object bytes with the stored content type.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/admin/audit:
    get:
      tags: [audit]
      summary: List audit entries, newest first (admin only)
      operationId: listAuditEntries
      security:
        - bearerAuth: []
      parameters:
