        未确认用例保持 draft；`case_review → executing` 并入队 `execute.batch`（幂等）。
        助手/后台角色 token 返回 403 `forbidden` 并写审计。版本不处于 `case_review` 时返回 409
        `invalid_stage_for_gate`；没有可确认的 draft 用例时返回 409 `no_cases_to_confirm`。
      parameters:
        - $ref: '#/components/parameters/ID'
