        retry_interval_ms:
          type: integer
          minimum: 100
          maximum: 30000
          default: 500
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
          default: 60000
        stream_enabled:
          type: boolean
          default: true
        multimodal_enabled:
          type: boolean
          default: true
        is_default:
          type: boolean
          default: false
    UpdateLLMConfigRequest:
      type: object
      description: Every field is optional; omitted `api_key` and `headers` keep their stored value.
      properties:
        name:
          type: string
          minLength: 1
        protocol:
          type: string
          enum: [chat_completions, responses]
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        retry_count:
          type: integer
          minimum: 0
          maximum: 5
        retry_interval_ms:
          type: integer
          minimum: 100
          maximum: 30000
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
        stream_enabled:
          type: boolean
        multimodal_enabled:
          type: boolean
        is_default:
          type: boolean
    LLMTestRequest:
      type: object
