        - $ref: '#/components/parameters/ChainFocusNode'
        - $ref: '#/components/parameters/ChainLimit'
        - $ref: '#/components/parameters/ChainQ'
        - $ref: '#/components/parameters/ChainAbnormalOnly'
        - $ref: '#/components/parameters/ChainIssueStatus'
        - $ref: '#/components/parameters/ChainIssueSeverity'
        - $ref: '#/components/parameters/ChainRequirementLimit'
      responses:
