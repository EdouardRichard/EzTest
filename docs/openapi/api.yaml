      description: |
        逐条或批量确认需求；`requirement_ids=[]` 表示确认当前全部 draft 需求（部分确认允许）。
        确认只由用户 API 触发并写 `decision` 审计；助手/后台角色 token 返回 403 `forbidden`。
        版本不处于 `requirement_review` 时返回 409 `invalid_stage_for_gate`；没有可确认的 draft
        需求时返回 409 `no_requirements_to_confirm`（不写 stage/job/event/audit）。
        成功后 `requirement_review → designing` 并入队 `design.cases`（幂等）。
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageConfirmRequirementsRequest'
      responses:
        '200':
          description: 确认后的版本阶段
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StageView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
