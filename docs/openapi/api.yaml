      description: |
        Creates a P1 Agent session with profile `clarification-dialog` on
        `channel=version:{id}` and an `active` P3 session row. Requires the
        version to be `clarifying` or `designing` and a version without an
        active session (409 `clarification_session_active`). Returns 201. An
        unavailable AI runtime is 503 `ai_unavailable`.
