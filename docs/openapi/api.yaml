        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterDesignRequest'
      responses:
        '200':
          description: The version in status `designing` plus the warnings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterDesignEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/requirements:
