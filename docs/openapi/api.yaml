    CaseRevisionRollbackView:
      type: object
      description: |
        v0.22 W2-11 R-EX-6/API-41 rollback replacement revision。**v0.2.4-E R-E2r 破坏性形状变更**：
        **新建**替代修订为 **draft**（经裁判审查后人工确认），不再直写 confirmed；legacy-only，
        退役计划 0.3。幂等重放原样返回已存替代修订的 status（见 status 字段说明）。
      required: [case_id, case_version_id, rolled_back_from, revision, status, trigger]
      properties:
        case_id:
          type: string
          pattern: '^[0-9]+$'
        case_version_id:
          type: string
          pattern: '^[0-9]+$'
        rolled_back_from:
          type: string
          pattern: '^[0-9]+$'
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, confirmed]
          description: |
            **draft = v0.2.4-E 起新建的替代修订**（R-E2r：须经裁判审查+人工确认，新建不再直写
            confirmed）。**confirmed 仅出现在幂等重放**：重复回滚原样返回已存替代修订的当前
            status——pre-E 遗留替代修订（当年直写 confirmed，本端点服务的正是这批历史数据），
            或已被人工确认的 post-E 替代修订（代码事实 discovery_revision.go 幂等预检/锁内
            重放路径 + DiscoveryRevisionView 注释）。旧契约"新建即 confirmed"已废，
            通知期见发布说明 E 章节。
        trigger:
          type: string
          enum: [rollback]
    DesignJudgmentFinding:
