      summary: 执行器启动注册（internal Bearer；非公开）
      description: |
        认证为 `Authorization: Bearer <execution.executor_token>`（DB 设置、常量时间比较），
        不是用户登录 token。upsert `executor_instance`（`token_hash=sha256(token)`、
        `last_heartbeat=now`、`last_error=''`）：已有 `draining` 保持，其余置 `active`；
        重复注册幂等。`capacity` 与别名 `max_contexts` 同时提供时必须相等。
      security:
        - internalBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutorRegisterRequest'
      responses:
        '200':
          description: 注册后的执行器实例
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ExecutorInstanceView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /api/internal/executors/heartbeat:
    post:
      tags: [Internal]
      operationId: heartbeatExecutor
      summary: 执行器周期心跳（internal Bearer；非公开）
      description: |
        认证同 register。endpoint 必须已注册，否则 404 `executor_unknown`（不自动建行）。
        更新 `active_contexts`（必填）、`capacity`/`version`（可选，0/空保留原值）、
        `last_heartbeat`；`status` 仅允许 `active|degraded`，degraded 只记告警；
        `draining` 保持、其余（含 offline）恢复 `active`。
      security:
        - internalBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutorHeartbeatRequest'
      responses:
        '200':
          description: 心跳后的执行器实例
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
