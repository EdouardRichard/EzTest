                              type: string
                              format: date-time
                            last_seen_at:
                              type: string
                              format: date-time
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
