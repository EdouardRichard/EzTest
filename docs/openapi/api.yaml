  /api/versions/{id}/requirements/{rid}/confirmations:
    post:
      tags: [Requirements]
      operationId: confirmRequirement
      summary: 确认单条需求（登录用户）
      description: |
        校验 V1 自然语言契约（title/user_story/结构化 AC/priority/sut_description 等）后冻结
        当前 revision，状态 `draft → clarified`；重复确认幂等返回（`confirmed=false`）。
        事件 `requirement.clarified`；首次确认触发版本 `initial → running`。无请求体。
        v0.2.4-E 确认门禁增量（I-B1，前向适用）：在草案结构校验之上叠加**占位词整值精确匹配**
        （trim+小写归一后整值等于 `validation.placeholder_terms` 词表项才命中；作用于 title、
        user_story.{as_a,i_want,so_that}、每条 AC 的 given/when/then、sut_description）与
        **sut_description 最小长度**（`validation.min_description_chars`，默认 20）——命中返回
        **400** 字段错误（`must not be a placeholder term` / `must be at least N characters`）。
        草案创建保持宽松；已 clarified 需求幂等跳过**不追溯**新规则，编辑重开为 draft 后须满足
        新门槛才能再确认。
      parameters:
        - $ref: '#/components/parameters/ID'
