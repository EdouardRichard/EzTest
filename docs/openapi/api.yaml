          enum: [html, pdf, markdown]
          description: html/pdf 复用既有报告 revision；markdown 为确定性渲染
    ReportView:
      type: object
      required: [id, version_id, kind, status, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        version_id:
          type: string
          pattern: '^[0-9]+$'
        wave_id:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        kind:
          type: string
          enum: [wave, version]
        status:
          type: string
          enum: [draft, published, stale]
        input_fingerprint:
          type: string
          pattern: '^([0-9a-f]{64})?$'
          nullable: true
          description: |
            发布后为 64 hex；draft/空报告可为空串或 null。v0.2.4-G P22 重定义：sha256(canonical
            结论输入)——排除 updated_at/generated_at 等非结论时间戳，含 verdict/failure_class/
            terminal_cause/triage/issue status·severity·category·dedupe/AC hash/AC 覆盖/需求 closure/
            closure_kind·unverified·waived/每 run 实际环境 fp·code_baseline/证据排序 sha256 集合
            digest+count+dropped_count。结论输入变化→指纹变→报告 stale（不覆盖旧 revision）。
        current_revision:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReportRevisionView'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReportRevisionView:
      type: object
      required: [id, report_id, revision, status, as_of, input_fingerprint, template_version, render_status, html_available, pdf_available, pdf_status, pdf_error, pdf_rendered_at, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        report_id:
          type: string
          pattern: '^[0-9]+$'
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, published, stale]
        as_of:
          type: string
          format: date-time
        input_fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
        template_version:
          type: string
          maxLength: 32
          description: |
            该 revision 的模板版本。新 revision 生产默认 `"3"`（v0.2.4-G R-G10b：对人类有用的固定
            报告模板——概览+缺陷五要素卡片+AC 验证覆盖矩阵+非应用缺陷失败说明+追溯链+证据附录，
            字节冻结 golden）；`"1"`/`"2"` 为 legacy。默认由设置键 `report.template_version` 控制
            （允许 "1"/"2"/"3"，默认 "3"）。已发布 revision 的 template_version 不可变（append-only）。
        render_status:
          type: string
          enum: [pending, running, done, failed]
        html_available:
          type: boolean
          description: revision published + render done + html_ref 非空
        pdf_available:
          type: boolean
          description: P7 起可为 true（pdf_status=done 且 pdf_ref 非空）；P4 恒为 false
        pdf_status:
          type: string
          enum: [pending, running, done, failed, disabled]
          description: PDF 渲染状态；disabled 表示 report.render_pdf=false
        pdf_error:
          type: string
          maxLength: 2000
          nullable: true
        pdf_rendered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
