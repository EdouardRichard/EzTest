        status:
          type: string
          enum: [running, completed, failed]
        actor_id:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
          description: 手动触发为 admin 用户 ID；周期 worker 为 null
        actor_kind:
          type: string
          enum: [user, system]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        scanned_objects:
          type: integer
          minimum: 0
        scanned_refs:
          type: integer
          minimum: 0
        deleted_objects:
          type: integer
          minimum: 0
        deleted_refs:
          type: integer
          minimum: 0
        deleted_bytes:
          type: integer
          format: int64
          minimum: 0
        report:
          type: object
          additionalProperties: true
          description: 候选/删除/缺失文件明细（JSONB 对象；不随事件下发）
        error:
          type: string
          nullable: true
    GCTombstoneView:
      type: object
