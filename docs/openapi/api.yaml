        toCaseVersionDetailDTO 仍发出对象（Go selected 为值类型，从不 null）。下列零值**逐字段派生自
        caseVersionDetailDTO 的 json tag 与映射函数**：case_version_id=platformid.Format(0)="0"、
        revision=0、各字符串字段=""、created_at=""（design formatTime 零时间→""）、
        covered_acs/steps/assertions/sources=[]（nonNilStrings/make 0）、test_data={}（len 0→{}）。
        与 DesignCaseVersionDetail 以 oneOf 并列；revision=0 与 revision≥1 互斥，无歧义。
      required: [case_version_id, revision, title, description, sut_description, preconditions, covered_acs, test_data, priority, status, content_hash, created_at, steps, assertions, sources]
      properties:
        case_version_id: {type: string, enum: ["0"]}
        revision: {type: integer, enum: [0]}
        title: {type: string, enum: [""]}
        description: {type: string, enum: [""]}
        sut_description: {type: string, enum: [""]}
        preconditions: {type: string, enum: [""]}
        covered_acs: {type: array, items: {type: string}, maxItems: 0}
        test_data: {type: object, maxProperties: 0}
        priority: {type: string, enum: [""]}
        status: {type: string, enum: [""]}
        content_hash: {type: string, enum: [""]}
        created_at: {type: string, enum: [""]}
        steps: {type: array, items: {$ref: '#/components/schemas/DesignStep'}, maxItems: 0}
        assertions: {type: array, items: {$ref: '#/components/schemas/DesignAssertion'}, maxItems: 0}
        sources: {type: array, items: {$ref: '#/components/schemas/DesignSource'}, maxItems: 0}
    DesignCaseDetail:
      type: object
      required: [case_id, status, current_version_id, requirement_id, requirement_version_id, scenario_id, scenario_name, versions, selected, confirmable, review_state]
      properties:
        case_id:
          type: string
          pattern: '^[0-9]+$'
        status:
          type: string
          enum: [draft, confirmed, stale]
        current_version_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: 当前版本 ID（Go *string）；无用例版本时为 null——这是判别信号：current_version_id 为 null 即表示 selected 处于零值态（DesignCaseVersionDetailEmpty）
        requirement_id:
          type: string
          pattern: '^[0-9]+$'
        requirement_version_id:
          type: string
          pattern: '^[0-9]+$'
        scenario_id:
          type: string
          pattern: '^[0-9]+$'
        scenario_name:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/DesignCaseVersionSummary'
        selected:
          description: |
            选中的用例版本详情。Go `Selected caseVersionDetailDTO` 是**值类型**（dto.go:177），
            toCaseVersionDetailDTO 始终发出对象，**从不为 null**，故本字段必填、不可空。两种状态之一（oneOf）：
            完整版本详情（DesignCaseVersionDetail，revision≥1、64-hex content_hash），或无当前版本时的
            零值态（DesignCaseVersionDetailEmpty，case_version_id="0"、revision=0、空串/空数组）。
            判别信号见 current_version_id：为 null 即零值态。不全局放宽内层约束（Lead fix round 2）。
            处置口径（v0.2.4-H T16-R3）：接受现状「值类型 + 零值 enum oneOf」，不指针化——值类型保证
            非空对象，零值态已由逐字段 enum 与 maxItems:0 精确描述且 deep-check 已门，语义无歧义；
            理由与追溯见 H spec §9。
          oneOf:
            - $ref: '#/components/schemas/DesignCaseVersionDetail'
            - $ref: '#/components/schemas/DesignCaseVersionDetailEmpty'
        confirmable:
          type: boolean
        review_state:
          type: string
          enum: [pending, pass, reworking, escalated_fail, judge_unavailable, '']
          description: |
            v0.2.4-E/T16（additive，required）：**当前**用例版本的裁判审查状态投影（与
            Selected 展示哪个历史修订无关）。枚举与降级空串 "" 语义同 DesignCaseCard.review_state
            （单一权威 design/domain/judgment.go）。
