      required: [id, stepId, kind, target, expression, expected, source]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        stepId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        kind:
          $ref: '#/components/schemas/AssertionKind'
        target:
