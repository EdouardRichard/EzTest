info:
  title: EzTest 0.2.4 API 契约（v0.2.4-B 领域反转破坏性升版；P0–P8 历史冻结 + 0.2.1 发布 + 0.2.4-B 重键）
  version: 0.2.4
  description: |
    EzTest 0.2 P0（平台底座）对外 REST/SSE 契约，来源：
    `docs/superpowers/specs/2026-10-31-eztest-v02-p0-platform-foundation-design.md` §7/§8/§9。

    ## 通用约定

    - 成功 JSON 响应统一为 `{"data": ...}`；列表统一为
      `{"data": [...], "next_cursor": "<id|null>", "has_more": bool}`。
      没有响应体的成功操作返回 204（登出、改密、重置密码、各 DELETE）。
    - 错误统一为
      `{"error": {"code": "...", "message": "...", "request_id": "...", "retryable": false, "details": {}}}`；
      HTTP 状态码使用 400/401/403/404/409/413/429/500/503。`X-Request-ID` 在响应头回显。
      设置 `security.rate_limit_per_minute > 0` 时，非 health/SSE 请求超过每实例限额返回
      429 `rate_limited`，并带 `Retry-After`（秒）；限额为 0（默认）时关闭限流。
    - 所有业务实体 ID 在 JSON/URL 中都是十进制字符串（Go 内部 int64）。例外：
      `Event.seq` 与 `snapshot_cursor` 是**频道内事件游标**（整数），不是业务实体 ID；
      `content_object.sha256` 是 64 位小写 hex 内容主键；设置键 `system_setting.key` 是自然键。
    - 时间一律 RFC3339 UTC；未知请求字段默认忽略；写请求使用
      `Content-Type: application/json`（上传除外）。
    - 鉴权：`Authorization: Bearer <token>`。公开端点只有 `/healthz`、`/api/health`、
      `/api/health/ready`、`/api/auth/login`。Token 为不透明随机串，固定 7 天 TTL，不刷新。
    - 权限：`admin` 组要求 `role=admin`；资源读为登录用户、写为 admin；**代码仓读/写均为登录用户**；
      版本读/写均为登录用户；`/api/events` 与 `/api/stream` 为登录用户。

    ## 幂等

    **P0 不实现通用 `Idempotency-Key` 请求头，也不保证任意写请求的重复提交幂等。**
    后续阶段（波次/确认/导出）按设计单独接入幂等语义；调用方不得假设本阶段的写请求具有
    幂等重放能力。数据库唯一约束带来的重复键错误映射为 409 `conflict`。

    ## 列表分页

    `limit` 默认 20、上限 100；`cursor` 是上一页最后一个实体的十进制 ID。
    `has_more=false` 时 `next_cursor` 为 `null`（实现也可能返回空串）。
    事件快照使用 `after`/`snapshot_cursor` 游标，见 `/api/events`。

    ## 事件流

    `GET /api/events` 返回频道快照（最新一页或 `after` 之后的事件）；
    `GET /api/stream` 返回 SSE。SSE 帧为 `id: <seq>`、`event: <type>`、`data: <Event JSON>`，
    每 20 秒一行心跳注释；游标过旧时发送合成 `event: stream.reset`（无 id、不持久化）。
    事件通道允许 `system`、`version:{id}`、`user:{id}`、`run:{id}`（v0.2.4-D 新增，**仅 admin**，
    见 D 增量节）；P0 只发布 `system` 与 `version:{id}`（历史）。
    P0 SSE Hub 为单进程内实现，多副本实时 fan-out 属 P7，不在此契约承诺内。

    ## 冻结

    `x-frozen: P0` —— 本文件在 P0 阶段末冻结；后续阶段只能增量修改，破坏性变更需更新本目录
    与决策记录并同步调用方/测试/迁移/handoff。

    ## P1 增量（frozen，2026-10-31）

    来源：`docs/superpowers/specs/2026-10-31-eztest-v02-p1-runtime-clarification-design.md`
    §3/§8/§9/§11/§12。P0 段落保留为历史；P1 增量保持冻结，当前文件级标记为 `x-frozen: P8`。
    P1 端点全部要求 Bearer 登录（单团队信任模型，无 admin 限制）；ID 仍为十进制字符串，
    时间 RFC3339 UTC，列表沿用 `{data,next_cursor,has_more}` 信封。

    ### P1 端点
    - `GET/POST /api/versions/{id}/conversations`：对话列表/新建（仅 `clarification`）。
    - `GET /api/versions/{id}/conversations/{cid}`：对话详情（含 summary，不含消息）。
    - `GET/POST /api/versions/{id}/conversations/{cid}/messages`：消息列表（id 升序）/发送用户消息。
    - `GET/POST /api/versions/{id}/requirements`：需求列表/手工创建 draft。
    - `GET/PATCH /api/versions/{id}/requirements/{rid}`：需求详情/编辑（生成新不可变 revision）。
    - `POST /api/versions/{id}/requirements/{rid}/confirmations`：单条确认（幂等）。
    - `POST /api/versions/{id}/requirements/confirmations`：批量确认（返回 `batch_id`）。
    - `POST /api/versions/{id}/requirements/{rid}/rollback`：用户确认回退，生成新 draft。
    - `GET /api/versions/{id}/requirements/{rid}/relations`：需求关系列表。
    - `GET /api/versions/{id}/team-rooms/{team}`：澄清团队频道只读（digest + 最近帖子）。
    - `GET /api/versions/{id}` 增量返回 `requirement_counts`、`conversation_count`、
      `pending_design_count`。
    - P1 不新增设计/执行/交付 API，不暴露任务板 API（P1-D3），不提供团队频道发帖 API。

    ### P1 事件（详见 `contracts/events.md`）
    `version.started`、`version.status_changed`、`conversation.created`、`conversation.message`、
    `conversation.summary_updated`、`agent.run.started`、`agent.activity`、`agent.run.finished`、
    `agent.run.failed`、`context.compacted`、`requirement.created`、`requirement.version_created`、
    `requirement.clarified`、`requirement.rolled_back`、`requirement.relation_created`、
    `requirement.attachment_ingested`、`requirement.attachment_failed`、`work_item.created`、
    `work_item.claimed`、`work_item.failed`、`work_item.dead`、`team_room.post`、
    `team_room.digest_updated`。事件只追加，不修改 P0 事件语义。

    ### P1 决策
    - AI 只能产 draft、关系提议与回退提议；确认/回退必须由用户 API 触发（P1-D9）。
    - 版本 `initial → running` 由首条对话消息/首个需求/首次确认触发；P1 不写 `completed`。
    - 需求编辑/回退总是新增不可变 revision；批量确认事务内全量校验，已确认项幂等跳过（P1-D7/D8）。
    - 聊天不做 token 级流式，使用 `agent.activity` + 完整消息事件（P1-D11）。
      **（历史决策，已被 v0.2.4-D 流式接线取代：Host 对话与 Agent Center 现为片段级流式，见 D 增量节。）**
    - 附件支持 md/txt/docx/pptx/pdf；旧 `.doc/.ppt` 失败为 `unsupported_attachment_format`；
      解析失败不阻塞消息（消息 POST 仍 201）。
    - 稳定错误码新增 `state_conflict`、`lease_lost`、`ai_unavailable`、`context_overflow`、
      `unsupported_attachment_format`、`extraction_failed`。
    - 不新增通用 `Idempotency-Key`（P1-D16）；P1 单实例 Hub/worker，多副本 fan-out 属 P7。
    ### P2 增量（frozen，2026-10-31）

    来源：`docs/superpowers/specs/2026-10-31-eztest-v02-p2-case-design-design.md` §7/§8/§12。
    新增 design graph/overview/case detail/confirmation、版本级 case 导出创建/列表/元数据/鉴权下载。
    最新 design 对话始终为当前轮，不新增关闭 API；确认只允许 user/server；导出覆盖整个版本并支持
    Markdown/Mermaid/OPML/CSV，导出字节写入 P0 内容账本。
    ### P3 增量（frozen，2026-11-01）

    来源：`docs/superpowers/specs/2026-11-01-eztest-v02-p3-execution-design.md` §9/§10/§11/§14。
    P0/P1/P2 paths/schemas 保持不变；P3 新增 22 个 path（执行概览/intents/waves/case-runs/evidence/
    human-requests/admin executors）、Execution/Evidence/HumanRequests 三个 tag 与对应视图。
    执行是「确认即入队」的意图驱动自动波次，无「开始执行」端点；ID 仍为十进制字符串，时间 RFC3339 UTC，
    列表沿用 `{data,next_cursor,has_more}`，分页参数为 `before` + `limit`（默认 20，上限 100）。
    P3 新增错误码 `evidence_too_large`（证据超 5 MiB，409/413 视体积）与 `executor_unavailable`
    （执行器不可达/未注册，503）；human request 任意登录用户可 resolve，executor 管理仅 admin。
    实时走既有 `GET /api/events` + `GET /api/stream?channel=version:{id}`，事件类型见 `contracts/events.md` §12。
    ### P4 增量（frozen，2026-11-01）

    来源：`docs/superpowers/specs/2026-11-01-eztest-v02-p4-delivery-chain-design.md` §4/§6/§7/§8/§14。
    P0/P1/P2/P3 paths/schemas 语义不变；P4 新增 14 个 operation：版本内问题 6（列表/详情/确认/驳回/重开/合并）、
    报告 5（列表/详情/revision/HTML 下载/重生成）、探索链路 1、版本重开 1、需求重开 1；新增 `Delivery`/`Chain` 两个 tag。
    报告 HTML 下载返回 `text/html`，`ETag` 为内容 sha256，`Cache-Control: private, no-store`、
    `X-Content-Type-Options: nosniff`，CSP 见响应头；HTML 字节以 P0 内容账本为权威，不暴露内部路径。
    业务冲突统一 `state_conflict`，`details.reason` 使用稳定子码（`issue_not_open`/`issue_not_reopenable`/
    `merge_target_invalid`/`merge_cycle`/`report_not_current`/`report_content_corrupt`/`close_predicate_failed`）。
    Version/Requirement 视图仅新增可选字段（`closed_at`/`close_reason`/`closure`）；事件类型见 `contracts/events.md` §13。
    ### P5 增量（frozen，2026-11-01）

    来源：P5 codeintel/视觉 设计 spec §4/§14（该历史 spec 文件已不在本仓库）。
    P0–P4 paths/schemas 语义不变；P5 新增 38 个 operation（代码索引/树/文件/diff/事实/搜索/commit、
    版本变更/分析/影响、锚点、事实复核、页面/API 提议、视觉配置/基线/比对/概览、全局视觉指标），
    新增代码/视觉/质量三个 tag。代码正文只经 `code.read`/`GET .../file` 鉴权读取；
    事件/响应不返回代码正文、图片字节、凭据或文件系统路径；视觉 actual/diff 字节以内容账本为权威。
    业务冲突统一 `state_conflict`，`details.reason` 使用稳定子码（`index_in_progress`/`analysis_in_progress`/
    `anchor_duplicate`/`repo_not_bound`/`baseline_commit_missing`/`repo_ambiguous`/`config_invalid`/
    `baseline_evidence_invalid`）。`VersionSUT`（`Binding`）新增可选 `code_baseline_commit`；
    `CaseRunSummaryView` 曾新增视觉四态计数；`EvidenceView.kind` 曾扩为 10 值（两个视觉证据 kind）。
    事件类型见 `contracts/events.md` §14。
    **v0.2.4-B（GD-22，owner 决策 2026-11-14）：上述视觉断言域已整体移除** —— 视觉 tag、
    8 条视觉路由 / 9 个 operation（版本视觉断言/基线/比对/概览 + 全局视觉指标）、
    7 个视觉参数与 18 个视觉 schema、视觉四态计数、两个视觉证据 kind 与断言 `kind` 的视觉取值
    均已删除；像素回归延期至 0.3+。
    完整移除清单见 `docs/v0.2.4/20-v0.2.4-release-notes.md`。本段保留 P5 历史身份，不代表当前契约。
    ### P6 增量（frozen，2026-11-01）

    来源：`docs/superpowers/specs/2026-11-01-eztest-v02-p6-parity-quality-search-agent-center-design.md`
    §4/§14。P0–P5 paths/schemas 语义不变，只加新 path 与可选字段；P6 新增 20 个 operation
    （搜索、待办、质量/评测、全局问题/报告、Agent 中心、profile/提示词配置），新增
    `Search`/`Workspace`/`AgentCenter` 三个 tag；chain v2 在既有 `GET /api/versions/{versionId}/exploration-chain`
    上增加 q/abnormal_only/issue_status/issue_severity/requirement_limit 参数与 counts/meta/degraded_layers/
    truncated_layers/replay 增量。权限：搜索/待办/质量 overview/全局中心/Agent 中心为登录只读；
    评测 run 与 profile/prompt/工具目录为 admin（403 `forbidden`）。P6 不新增事件、任务类型、profile、
    工具或 executor 协议；不新增通用 `Idempotency-Key`（重复 POST eval-run 允许，以 run id 区分）。
    prompt 正文只在 admin profile API 返回；目录/运行/质量投影永不返回 system_prompt/transcript。
    错误信封复用；业务冲突 `state_conflict`，链路全层失败 503 `provider_unavailable`。
    ### P7 增量（frozen，2026-11-01）

    来源：`docs/superpowers/specs/2026-11-01-eztest-v02-p7-p9-design.md` §6/§7/§13。
    P0–P6 paths/schemas 语义不变，只加新 path 与可选字段；P7 新增 **18 个 operation**
    （知识 8、GC 3、实例 3、readiness 1、报告 PDF 1、internal executor 2），新增
    `Knowledge`/`Admin`/`Internal` 三个 tag。`ReportRevisionView.pdf_available` 由 P4 常量
    false 扩宽为 boolean，并新增 `pdf_status`/`pdf_error`/`pdf_rendered_at`；`IssueView` 新增
    `recurrence_count`/`last_recurred_at`/`merged_chain`；SUT 读/写模型新增可选 `family`。
    `GET /api/health/ready` 返回 `{"data": ReadinessView}`（200/503）；报告 PDF 下载的
    404/409 语义见 operation 说明。内部 executor 端点使用 `execution.executor_token` Bearer，
    不是用户登录 token。事件见 `contracts/events.md` §16；P7 不新增通用 `Idempotency-Key`。
    ### P8 增量（frozen，2026-11-02）

    来源：`docs/superpowers/specs/2026-11-02-eztest-v02-p8-hardening-acceptance-design.md` §6。
    P0–P7 paths/operations/schemas 语义不变；P8 **不新增 path/operation/schema**，只追加可选响应字段与错误说明：
    `InstanceView` 新增 `active_requests`/`active_work`（integer，默认 0）；`ReadinessView`
    新增 `inflight_requests`/`inflight_work`（integer，默认 0）；错误码新增 `rate_limited`，
    429 响应说明见通用约定与 `components/responses/TooManyRequests`（`Retry-After`）。
    设置 `security.rate_limit_per_minute`（默认 0=关闭）为每实例每分钟请求上限，总速率=副本数×限额；
    `/healthz`、`/api/health`、`/api/health/ready`、`/api/stream` 与静态资源跳过限流。
    多执行器派发在 API 内部按执行器路由（见 `executor-protocol.md` §12.3），不改变本文件任何 action/path。
    事件/任务/profile 计数不变（118/19/14）；不新增通用 `Idempotency-Key`。
    ### 0.2.1 增量（release: 0.2.1，2026-11-03 契约 + 2026-11-04 发布）

    来源：`docs/version-V0.2.1/spec.md` §5.3/§5.4/§6.3/§7.3/§9.1/§10.2/§12.3/§12.4。
    P0–P8 paths/operations/schemas 语义不变。相对 0.2.1 前序 draft，本次按实现收口了 0.2.1 自身
    未实现的形态：知识检索改为 `KnowledgeItemView` 页（移除 `KnowledgeSearchHit` 的
    score/match_reasons 形态），`JobView` 对齐 job control 实际响应（attempts/max_attempts 必填），
    `GET /api/versions/{id}/jobs/{jobId}` 标为 0.3 预留。除此之外 0.2.1 **只新增
    path/operation/schema 与可选字段**：
    公开模型列表（`GET /api/llm/models`；只返回唯一 active 默认配置下启用且未 `deprecated` 的模型，
    无可用默认配置时返回空数组）、会话模型覆盖（`PATCH /api/versions/{id}/conversations/{cid}`）、
    消息 parts（`GET /api/versions/{id}/conversations/{cid}/messages/{mid}/parts`；`{mid}` 是
    `conversation_message.id`，不是 `agent_message.id`）、
    版本阶段/两硬门/退回（`GET /api/versions/{id}/stage`、`POST .../stage/confirm-requirements`、
    `POST .../stage/confirm-cases`、`POST .../stage/reject`）、work_item/plan/facts 查询
    （`GET /api/versions/{id}/work-items`、`.../work-items/{workItemId}`、`.../plan-items`、`.../facts`）、
    知识结构化检索（`GET /api/knowledge/search`；read/propose/revoke 复用 P7 既有端点）、
    需求草案清理（`POST /api/versions/{id}/requirements/dedupe`、`DELETE /api/versions/{id}/requirements/{rid}`、
    `POST /api/versions/{id}/requirements/merge`）与作业控制
    （`POST /api/jobs/{id}/cancel`、`POST /api/jobs/{id}/retry`）。作业的版本级别名
    （`POST /api/versions/{versionId}/jobs/{jobId}/cancel|retry`）仍挂载，供对话 `job_card` 使用；
    `GET /api/versions/{id}/jobs/{jobId}` 在 0.2.1 **未实现**，作业状态以 `job_card` part、
    `job.progress`/`job.finished` 事件与 `work_item` 查询为准，该路径仅作 0.3 预留并标 `deprecated`。
    另新增 admin-only 上下文包读取（`GET /api/versions/{id}/context-packets/latest`）与
    admin 模型能力编辑（`PATCH /api/admin/llm/configs/{id}/models/{modelId}`）。新增 tag `LLM`/`Jobs`。
    0.2.1 operation 中除 `GET /api/versions/{id}/jobs/{jobId}` 外均已实现；
    `GET /api/versions/{id}/work-items`、`.../work-items/{workItemId}`、`.../plan-items`、
    `.../facts` 为 Task 62 契约先行、Task 37 由 P6 read model 挂载（早前“实现未挂载”的描述已过时）；
    `GET /api/versions/{id}/jobs/{jobId}` 为 0.3 预留并标 `deprecated`；
    `GET /api/versions/{id}/context-packets/latest` 已在 Task 48 装配 reader 后挂载。
    其余 0.2.1 operation 已按实现同步。

    ## v0.22 W0 增量（Task 37，additive）

    来源：`docs/superpowers/specs/2026-11-05-eztest-v0.22-design.md` §4/§6/§11.1。
    P0–0.2.1 的 paths/schemas 语义不变；新增：
    - 计划写入 `PATCH /api/versions/{id}/plan-items/{itemId}`（乐观锁 `revision`）。
    - 结构化提问：`GET /api/versions/{id}/questions`、Host 创建/重开、用户 answer/skip。
    - 交接 `GET /api/versions/{id}/handoff`；事实仲裁 `POST .../facts/{fid}/arbitrate`。
    - 需求抽取 `GET/POST .../requirements/extractions` 与 `/{runID}/pause|resume|retry`。
    - 附件图片 `GET /api/versions/{id}/attachments/{attachmentId}/images` 与 `.../reanalyze`
      （H7：按版本校验附件归属，用户 token 才能读取）。
    - 绑定/多仓/版本账号：`GET/PUT/PATCH .../binding`、`GET/POST /api/suts/{id}/repositories`、
      `GET/POST /api/versions/{id}/accounts`。
    - 阶段写入：`POST .../stage/request|advance|block|unblock|pause|resume`；门禁/迁移冲突统一
      409 `stage_gate_failed` / `invalid_stage_transition`。JSON 解包沿用
      `{data,next_cursor,has_more}`（`next_cursor` 为 `null` 或空串表示没有下一页）。

    v0.22 W0 事件（版本频道 `version:{id}`；`version.stage.changed` 与 legacy
    `version.stage_changed` 并行发布）：
    - `version.stage.changed`：`{version_id, from, to, reason, actor, stage_entered_at}`
    - `plan.item_changed`：`{version_id, plan_item_id, phase, title, status, order, revision}`
    - `fact.recorded` / `fact.conflict` / `fact.arbitrated`：`{version_id, fact_id, kind, key, confidence, source, content_hash, conflict|dropped_ids, keep_id, reason}`
    - `question.created` / `question.answered` / `question.expired` / `question.reopened` /
      `question.skipped`：`{version_id, question_id, conversation_id, message_id, kind, status, expires_at, answers[]}`
      （reopened 另带 `reopened_by`；skipped 的 status 为 `cancelled`）
    - `handoff.updated`：`{version_id, revision, generated_at}`
    - `version.binding.changed`：`{version_id, changed{...}, actor_id}`
    - `extraction.started` / `extraction.progress` / `extraction.segment_failed` / `extraction.done`：
      `{version_id, run_id, attachment_id, status, done_segments, total_segments, ...}`
    - `case_run.blocked`：pending 暂不可派发 `{wave_id, case_run_id, intent_id, reason, action}`；容量终止路径 `{wave_id, case_run_id, intent_id, reason, action, required_contexts, executor_capacity, terminal}`（terminal=true；前端执行 Tab 消费）

    `ConversationMessage` 新增 `kind`（DB-3 message kind；question/answer 卡片据此渲染），
    `PlanItemView` 新增 `revision`；`CreateVersionRequest` 改为环境派生（API-15，旧
    `bindings[]` 载荷 400）。

    `MessagePart` 新增 `thinking`/`tool_call`/`job_card`/`case_card`/`error`/`image` 分支；其中 `image`
    的载荷固定为 `{type,mime,data_ref,width,height}`（`data_ref` 是内容账本 64 位小写 hex，`width`/`height`
    ≥1 且总像素不超过 40,000,000），图片 part 只存在于消息快照（用户消息），不是
    `conversation_message_part` 的流式行。`job_card` 另带可选 `cancelable`（终态必须为 false），
    终态 `failed` 的卡片另带可选 `code`/`reason`（失败原因，分别 ≤64/≤2000；其他状态省略）。
    `Conversation` 增 `model_override`/`effective_model`，`ConversationMessage` 增 `actual_model`。

    LLM 契约：`protocol` 接受 canonical 值 `openai_chat_completions`/`openai_responses` 并保留 legacy
    `openai`/`openai_compatible`；`thinking_type ∈ auto|enabled|disabled`、`reasoning_effort ∈
    none|low|medium|high|xhigh|max`、`default_model_id` 是显式默认模型（禁止取 models[0]）；
    `llm_model.capabilities` 含 `supports_tools/supports_vision/supports_reasoning/context_window/
    supports_prompt_cache`，`deprecated=true` 的模型保留展示但不派发。`PATCH .../models/{modelId}`
    是部分能力补丁（省略字段保持）。

    作业语义：`job_id = work_item.id`。cancel 只接受 `open/claimed/running`（`waiting_human` 及终态返回
    409 `state_conflict`）；用户取消在无 schema 变更的前提下把行存为 `failed` + `last_error="cancelled by user"` +
    attempts 耗尽标记，API/事件投影为 `cancelled`，随后恰好一次 `job.finished{status:"cancelled"}`。
    retry 只接受 `failed` 且 `attempts < max_attempts`、非取消的行；重开后 `attempts` 重置为 0（新的尝试预算）、
    `max_attempts`/inputs/budget/模型不变，不自动切模型（D24）。控制动作写 `job.canceled`/`job.requeued` 审计。

    设计图 `DesignCaseCard` 新增可选 `execution_verdict`（`passed/failed/blocked/inconclusive`；取当前用例版本
    最新 case_run，未执行/仅进程态为 `inconclusive`；不参与图 hash）。派发健康事件 `case_run.blocked`
    表示 pending case_run 因无健康执行器不可派发（见 `events.md` §18）。

    错误码（HTTP 状态）：400 `invalid_protocol`/`llm_config_invalid`/`llm_capability_mismatch`/
    `llm_protocol_error`/`llm_auth_failed`/`invalid_model`（六类 LLM 错误均非重试；其中
    `llm_protocol_error`/`llm_auth_failed`/`invalid_model` 带 `details.action`，而
    `llm_config_invalid`/`llm_capability_mismatch`/`invalid_protocol` 只带结构化细节、不保证
    `details.action`）；
    409 `invalid_stage_for_gate`（当前阶段不接受该硬门）、`no_requirements_to_confirm`/`no_cases_to_confirm`
    （硬门没有可确认项）、`attachment_pending`（附件解析中，`retryable=true`）、`page_url_exists`
    （`details.field="url"`）、作业 `state_conflict`；知识写入 secret 拒绝为 400 `invalid_argument`
    （`details.field="secret"`，不回显凭据）。两硬门 confirm/reject 端点只接受用户 token；助手/后台角色
    token 返回 403 `forbidden` 并写审计。

    nullable 语义：`WorkItemView.depends_on: null` 或 `[]` 都表示无依赖，`WorkItemView.idempotency_key: null`
    表示未使用幂等键，`FactView.confidence: null` 表示未知——不得用 `0`/空数组伪造。`AttachmentView.kind`
    枚举为 `document|image`（pdf/text 是 `document` 子类型），`parse_error` 为可空字符串（对应 DB `TEXT NULL`）。
    命名映射：part 种类在 DB 列/`MessagePartView` 中为 `part_type`、在 `MessagePart` 中为 `type`；
    work_item 状态在 DB 列/事件 payload 中为 `status`、在本文件的 `WorkItemView`/`JobView` 中为 `state`。
    事件见 `contracts/events.md` §18，表见 `contracts/db-schema.md` §18，任务/角色见
    `contracts/task-types.md` §9。列表沿用 `{data,next_cursor,has_more}`；ID 仍为十进制字符串；
    不新增通用 `Idempotency-Key`（`idempotency_key` 是 `work_item` body/DB 字段，不是 HTTP 头）。
