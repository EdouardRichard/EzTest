    ## v0.2.4-D 流式接线（2026-11-18，additive + 行为变更）
    本子项目把 LLM 对话从"整轮结束一次性显示"接线为"逐片段实时可见"（设计 §2.3 Q02=A/Q8=A），
    并把 `agent_activity` 从死表接线为工具/压缩边界的幂等事实记录（Q04=A-lite，V-0019 D 份额）。
    **无删除契约，纯新增 + 行为变更**；行为变更与通知期见共享发布说明 D 章节。契约增量：
    - **事件通道白名单扩展**：新增 `run:{id}`（agent run 转录通道）。`EventChannel` 模式现为
      `^(?:system|version:[1-9][0-9]*|user:[1-9][0-9]*|run:[1-9][0-9]*)$`（派生自
      `eventing/application/service.go` 的 `channelPattern`，唯一生产者 `RunChannel(runID)`）。
      **`run:{id}` 仅 admin**：`GET /api/events?channel=run:{id}` 与 `GET /api/stream?channel=run:{id}`
      对非 admin 一律 403 `forbidden`（服务端校验，先于订阅/快照读取；通道格式校验先于角色门，
      畸形通道对任何人都是 400）。`system`/`version:{id}`/`user:{id}` 的登录用户语义不变。
    - **`conversation.message.delta` 事件**（版本频道 `version:{id}`，新增）：Host 增量回复的
      片段事件，payload = `MessageDelta`（Go 权威 `versionapp.MessageDelta`）。DB 按 seq 存完整快照，
      事件只传增量：append 模式（text/thinking 纯增长）携带 `increment`（恒非空）+ `offset`
      （追加前累计文本的 UTF-16 code unit 数，= JS `String.length`，0 时省略）；replace 模式
      （其余 part 类型、同 seq 类型变化、任何非纯增长改写）携带 `part`（完整 `MessagePart` 快照，
      整段替换）。两模式互斥。scope `{version_id, conversation_id}`。
    - **`conversation.message` 全帧新增 `stream_state`**（`streaming|complete|interrupted`）：
      流式开始发占位全帧（`parts:[]`、`stream_state:streaming`），终态发完整全帧
      （`complete`/`interrupted`）；批式消息归一为 `complete`，既有消费者不受影响。
      `ConversationMessage.parts` 因此允许空数组（占位头）。REST 消息快照 DTO 暂不返回
      `stream_state`（该字段当前仅在 SSE 全帧 payload 中；REST 读到的占位头 parts 为空）。
    - **`agent.transcript.delta` 事件**（`run:{id}` 频道，新增，仅 admin）：payload =
      `TranscriptDelta`（Go 权威 `agentapp.TranscriptDelta`）。append 模式（回复文本纯增长）
      携带 `seq`（1-based parts 下标）+ `part_type` + `offset`/`increment`（UTF-16 口径同上）；
      snapshot 模式（占位行/批式行/工具调用与 usage/非纯增长改写/每次封口）携带 `message`
      （完整 `TranscriptMessage` 行，整行替换）。`stream_state` 恒在；终态即行冻结，不再有后续帧。
      每 run 的帧覆盖全部行（system/user/assistant/tool）。scope `{version_id, agent_run_id}`。
    - **新端点（均 admin-only）**：`GET /api/agent-center/runs/{id}/transcript`
      （`TranscriptMessage[]`，id 升序、无分页）与 `GET /api/agent-center/runs/{id}/activity`
      （`AgentActivityView[]`，seq 升序、无分页）。普通用户 403；Agent Center 元数据读模型
      （catalog/runs/quality）不变、仍不含 transcript。
    - **`agent_message.stream_state`**（DB 列 + `TranscriptMessage.stream_state` wire 字段）：
      流式 assistant 行原地更新，终态（complete/interrupted）后冻结不可变；批式/历史行默认 complete。
      枚举与 `conversation_message.stream_state` 同源（`version/domain/conversation.go`
      `MessageStreamStates()`，agent 域为编译期派生别名）。
    - **`agent.activity` 事件新增可选 `activity_seq`**（additive）：工具调用事件携带其事实行的
      per-run 序号，与 `run_id` 组成 `(run_id, seq)` 事实键，可定位 `agent_activity` 台账行；
      thinking 心跳不带该键（无事实，即时投影）。既有 payload 键不变。
    - **`agent_activity` 事实台账**（`AgentActivityView`）：`type ∈ tool_call|compaction`
      （派生自 `agent/domain/activity.go ActivityTypes()`）；`(run_id, seq)` 幂等。tool_call
      每次调用一行（start/end 同 seq 两次 UPSERT）；compaction 覆盖全部触发与停止/no-op 尝试，
      payload 与 `context.compacted` 事件同源（`CompactionEvent.Payload()`）：`duration_ms` 为
      实测墙钟；被停止的尝试（busy/thrashing/failure）**不携带** `before_tokens`/`after_tokens`
      （从未测量，不伪造边界）并带真实 `error`；no-op 重建 before==after 且 duration 可为 0。
    - **行为变更（非内部重构，详见发布说明 D 章节）**：首 delta 后任何错误不重试（含网络/存储
      瞬时错误；已见内容保留 + error part + interrupted 封口）；多轮 Host 回复保留中间轮叙述
      text part（批式路径曾丢弃）；`appendStreamPart` 超限由静默丢弃改为显式计数 +
      `stream_parts_truncated` error part + 日志；每 delta 一次行锁 UPDATE + 事件发布（写入负载
      增加，性能注记）。error part 的 `code` 为自由有界字符串（≤64），新增取值
      `stream_interrupted`/`stream_parts_truncated` 无需枚举注册。
    - **事件契约登记位置**：事件契约现由生成的 `docs/contracts/events.md` 登记
      （从 Go 发布点/事件类型常量派生，R-H3r；旧 `docs/version-V0.2/contracts/events.md` 已退役）；
      本文件 description 增量节 + components schemas 为 API/事件面登记。D 新事件类型在生成文档登记。
    新增 schema：`MessageDelta`、`TranscriptMessage`、`TranscriptMessagePart`、`TranscriptToolCall`、
    `TranscriptDelta`、`AgentActivityView`（required/properties 由 deep-check 从 Go json tag 派生校验）。

    ## v0.2.4-E 协同质量门与独立裁判（2026-11-19，additive + 缩权 + 行为变更）
    本子项目在 B 的自然语言需求/用例契约上补齐确定性确认门禁、覆盖并集预检、独立 AI 裁判
    （design_judge）与打回/人工决断闭环（设计 v1.3.1 §5.1–5.4；spec SC-E1~E12；所有者裁定
    R-E1~R-E9，其中 **R-E2r 正式废除 discovery 自动确认（缩权）**、R-E4r 裁判=一轮审查后交人工决断）。
    破坏性变更（API-41 形状、自动确认废除）与通知期见共享发布说明 E 章节（宪法六.6）。契约增量：
    - **独立裁判**：新 profile `design_judge` + catalog role `case_judge`（独立 run，上下文不含
      author 消息/finding 帖/交接包摘要，I-B4）；新 work type `design.judge`/`design.rework`
      （0.2.1 type 路径，与 design.requirement/design.critic 同族，不进 kind 路径矩阵）。
      裁判模型由设置键 `design.judge_model` 单一权威指定（空=继承平台默认；admin PATCH 该 profile
      的 Model 被拒并指向此设置键）。
    - **`design.judgment_submit` 工具契约**（裁判唯一写入口；Go 权威
      `agent/application/tools/judgment.go`，schema/解码/校验字段/提示词六表面同源）：
      顶层 `{requirement_id, judgments[1..50]}`（均必填；requirement_id 须匹配注入作用域）；
      `judgments[]`：`case_id`/`case_version_id`（必填，十进制字符串，取自 design.graph_read 的
      当前 draft 用例）、`verdict`（必填，枚举 `pass|fail`）、`findings`（可选 ≤50 项，每项
      `{dimension(1..64，coverage/executability/system), severity(blocker|important|minor),
      message(1..2000), case_ref(可选，本需求用例 ID)}`）、`ac_coverage_matrix`（可选，自由 JSON
      对象，键为 AC id）。**无 `round` 字段**——轮次由服务端从裁判事实派生（round 仅打回递增，
      Host 编辑不消耗打回额度）；未知字段严格拒绝。rubric 一致性服务端校验：pass 不得携带
      blocker/important finding。结果 `{submitted[], count}`，submitted 每项为服务端结算绑定
      `{judgment_id, case_id, case_version_id, content_hash, round, verdict}`（content_hash 由
      服务端读当前版本绑定，模型不供给）。判定只是候选：落 append-only `design_judgment` 事实表
      （UNIQUE(case_id, case_version_id)），**不修改用例、不确认**；确认永远由人工经 Confirm 触发。
    - **`review_state` 审查状态投影**（additive，单一权威 `design/domain/judgment.go`
      `DeriveReviewState`，即时投影不落库）：五态 `pending/pass/reworking/escalated_fail/
      judge_unavailable`，派生优先级 judge_unavailable > escalated_fail > reworking > pass >
      pending；裁判事实/override 绑 case_version_id+content_hash，新修订使旧事实/override 失效
      （视为未判 pending）。`DesignCaseCard` 与 `DesignCaseDetail` 新增 **required** `review_state`；
      **可为空串 `""`（降级态）**：裁判门未接线/事实读失败时服务端发 `""` 而非伪造状态，客户端
      须容忍并按"审查状态未知"渲染。review_state 是叠加的审查维度，用例生命周期状态
      （draft/confirmed/stale/superseded）不变；任何 review_state 下均无自动确认。
    - **新端点（2）**：`POST /api/versions/{id}/design/judgments/{caseId}/override`（**仅 admin**，
      body `{reason}` 1..2000）——人工决断，仅当前版本 fail 且打回耗尽（condition=fail_exhausted）
      或 judge_exhausted 升级事实存在（condition=judge_exhausted）时可调用，否则 409
      `state_conflict`；写 append-only `design_judgment_override`（绑当前版本 content_hash，
      不改裁判事实）；`GET /api/versions/{id}/design/judgments?requirement_id=`（登录用户）——
      裁判报告读面：版本（或单需求）每个当前用例一条 `{case_id, current_version_id, review_state,
