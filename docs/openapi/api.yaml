          type: string
          nullable: true
          description: 版本收尾原因（P4 增量；重开清空）。waived 关闭时为 admin waiver 理由（v0.2.4-G）
        closure_kind:
          type: string
          enum: [normal, waived]
          description: |
            关闭分类（v0.2.4-G SC-G11/GD-06/P23；单一权威 version/domain/closure_kind.go ClosureKinds()）。
            normal=经完整闭环谓词关闭；waived=经 admin waive-close 豁免关闭（同时 unverified=true）。
