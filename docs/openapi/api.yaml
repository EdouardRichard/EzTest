                  author: Example Author
                  committedAt: '2026-10-28T01:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions:
    get:
      tags: [versions]
      summary: List versions
      description: |
        One cursor page ordered by `updatedAt DESC, id DESC`. Every authenticated
        user may read the version domain; P3 defines no 403. Each row carries the
        aggregate `requirementCount`, `clarifiedCount` and `openQuestionCount`.
      operationId: listVersions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
