      含自然语言上下文 user_story/description/preconditions/步骤 action/target_description/sut_description，
      合并 issue 取确定性代表 run 不混拼）→ 非应用缺陷失败说明区（blocked/inconclusive/environment/
      automation 的 EffectiveFailureClass+terminal_cause+人类可读解释）→ 追溯链（需求→AC→用例→case_run→
      步骤→断言→证据）→ 环境核验（EnvironmentVerifiable/UnverifiableReason/PlannedEnvironment/Divergences，
      计划 vs 实际可读分歧，legacy wave per-wave「环境不可核验」标注非整版本阻塞）→ 证据附录（可看证据链接+
      截断前总数）→ AC 验证覆盖矩阵（逐 AC **verified/unverified/failed/uncovered** + g/w/t，非仅链接覆盖；
      内含裁判状态呈现 verdict/findings/review_state/ac_coverage_matrix，消费 E 事实）→ 豁免说明区
      （被豁免需求/未验证 AC 范围+理由+操作者；版本级 waive 或需求级 waiver 均呈现，需求级独立于 closure_kind）。
      **结论诚实**：区分无缺陷/存在未验证受阻用例（零缺陷但有
      blocked/inconclusive/failed 不呈现「一切正常」）；术语内置确定性中文释义。报告内容为**服务端
      确定性 HTML（权威）**，前端 verbatim 渲染（shadow root，无第二 React 真相，R-G12a）；
      report_writer 叙述保留为候选块+确定性守卫（防 AI 改格式）。**这些是 HTML 报告内容投影，
      非 REST JSON DTO 字段**（报告 REST 面 ReportView/ReportRevisionView 形状不变，仅 template_version
      默认与 input_fingerprint 语义更新）。
    - **Issue 结构化字段（P21，SC-G3）**：domain Issue +`failed_expected`/`failed_actual`/`failed_reason`
      （从 assertion_result 取，供五要素卡片服务端确定性取数）；Summary 保留叙述兼容。
      **非 REST IssueView wire 字段**（IssueView 投影形状不变；结构化字段经报告 HTML 卡片呈现）。
      候选派生仍仅 failed(application)；executor capability 不建单。
    - **V-0014 execution status 读点统一 + R-G9 reopen 环次序（行为变更）**：execution status 门禁
      读点改派生 `version.StatusCompleted` 域常量（禁裸字面量）+ 一致性门禁；createIntent
      reopen-and-retry 环改**版本 advisory 锁内去重先于 reopen**——重复 intent→返冲突不 reopen，
      仅真正新 intent 才 reopen+insert（修 completed 版本重复 retest 误 reopen bug）；保留竞态环。
      reopen 经 version 唯一入口 ReopenIfCompleted。
    - **闭环/豁免事件契约（版本频道 version:{id}；登记面=本 description，events.md 缺失 V-0025/H）**：
      `version.waived`（新）payload `{version_id, reason, actor_id, closure_kind, unverified, waived_at}`
      （另发 system 频道）；`requirement.waived`（新）payload `{version_id, requirement_id, reason,
      actor_id, waived_at}`；`version.closed`（既有，payload 增量）追加 `closure_kind`/`unverified`，
      **waived 闭无 current report 时 `report_revision_id="0"`**（T6 Minor #3 诚实披露：waive 闭后
      同步重生成发布 unverified revision，但 version.closed payload 的 report_revision_id 取关闭谓词
      评估时的 report，waived 路径该值为 0；真实 unverified revision 见 WaiveCloseView.report_revision）；
      `version.reopened`/`requirement.reopened`（既有）语义增量=清 waiver（见 reopen 端点 description）。
      `report.stale`（新）见上因果 stale 条。
    - **DB schema（迁移只追加；权威=迁移 + `backend/internal/db/migrate_integration_test.go` 的表/PK/index/CHECK pin，db-schema prose 不重建，R-H3r）**：
      `delivery_0006_v024_g_issue_structured.sql`（Issue failed_expected/failed_actual/failed_reason）、
      `version_0019_v024_g_waiver.sql`（version closure_kind/unverified + requirement waived）、
      `delivery_0007_v024_g_display_fingerprint.sql`（delivery_report.display_fingerprint 追加列，
      内部 display 投影摘要，非公开 API 字段）。
    schema 变更：`Version` +required closure_kind/unverified；`RequirementSummary` +required waived；
    新增 `WaiveCloseRequest`/`WaiveRequirementRequest`/`WaiveCloseView`/`WaiveRequirementView`
    （required/properties 由 deep-check 从 Go json tag 派生校验）；team 枚举更正——`Team` 参数/
    `TeamRoomView.team` = Go ParseTeam 6 团队（移除 steward）；`CatalogProfile.team`/`AgentTeam.team` =
    v0.22 收敛目录分组 conversation/execution（代码事实，移除 steward 过度承诺）；Agent 目录描述
    更正为 11 profile（移除 steward 分组）。

