          format: int64
          minimum: 0
        mime:
          type: string
        relative_path:
          type: string
          description: 相对 paths.data_root 的路径（admin-only；不返回绝对路径）
        reason:
          type: string
          enum: [unreferenced, temp, superseded_export, orphan_file]
        deleted_at:
          type: string
          format: date-time
    GCRunDetailView:
      description: GC run 详情（GCRunView + tombstones）
