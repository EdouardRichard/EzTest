        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '500':
          $ref: '#/components/responses/Internal'
