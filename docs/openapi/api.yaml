    get:
      tags: [code]
      summary: Read one index run of a repository
      description: A run of another repository is a plain 404 `index_run_not_found`.
      operationId: getCodeRepoIndexRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeRepoId'
        - $ref: '#/components/parameters/CodeIndexRunId'
      responses:
        '200':
          description: The index run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexRunEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/code/repos/{repoId}/tree:
    get:
      tags: [code]
      summary: List one cursor page of a commit-pinned file tree (live Git)
      description: |
        Every authenticated user. `commit` defaults to the repository's fixed
        branch tip; an empty `path` means the repository root. Entries are
        `blob|tree|commit` with a Git object id; `commit` entries are submodules
        and carry the `unsupported` marker together with symlinks. The page is
        capped server-side.
      operationId: getCodeRepoTree
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeRepoId'
        - name: commit
          in: query
          required: false
          description: 40-hex commit; omitted/empty resolves the fixed branch tip.
          schema:
            type: string
        - name: path
          in: query
          required: false
          description: Repository-relative directory path; empty means the root.
          schema:
            type: string
            maxLength: 4096
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned as `next_cursor` by the previous page.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of tree entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreePage'
              example:
                data:
                  - path: src/example.ts
                    type: blob
                    size: 128
                    gitObjectId: '0123456789abcdef0123456789abcdef01234567'
                    mode: '100644'
                    unsupported: false
                next_cursor: ''
                has_more: false
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/code/repos/{repoId}/file:
    get:
      tags: [code]
      summary: Read one 1-based line window of a commit-pinned file (audited)
      description: |
        Every authenticated user; each read writes a `code.read` audit entry.
        `startLine`/`endLine` are optional and clamped to the file; a bounded
        window is still 200 with `truncated=true`. Never returns a whole file
        beyond the bounded window.
      operationId: getCodeRepoFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeRepoId'
        - name: commit
          in: query
          required: false
          description: 40-hex commit; omitted/empty resolves the fixed branch tip.
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Repository-relative file path.
          schema:
            type: string
            maxLength: 4096
        - name: startLine
          in: query
          required: false
          description: First line (1-based); omitted means the first line.
          schema:
            type: integer
            minimum: 1
        - name: endLine
          in: query
          required: false
          description: Last line (inclusive); omitted means the end of the file.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The requested line window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWindowEnvelope'
              example:
                data:
                  commit: '0123456789abcdef0123456789abcdef01234567'
                  path: src/example.ts
                  startLine: 1
                  endLine: 3
                  totalLines: 120
                  truncated: true
                  content: '// placeholder line'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/code/repos/{repoId}/diff:
    get:
      tags: [code]
      summary: List one page of a file-level change list (live Git preview)
      description: |
        Every authenticated user. `base` and `head` are required 40-hex commits
        and must describe a valid base/head pair. The read-only preview never
        persists a change set, so `changeSetId` is null. The `ChangeList` is
        returned inside the normal `{"data":...}` envelope, not a generic page
        envelope; its own `nextCursor`/`hasMore` paginate the file list.
      operationId: getCodeRepoDiff
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeRepoId'
        - name: base
          in: query
          required: true
          description: Base 40-hex commit.
          schema:
            type: string
            pattern: '^[a-f0-9]{40}$'
        - name: head
          in: query
          required: true
          description: Head 40-hex commit (a descendant of base).
          schema:
            type: string
            pattern: '^[a-f0-9]{40}$'
        - name: cursor
          in: query
          required: false
          description: Opaque path cursor from `nextCursor`.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The file-level change list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeListEnvelope'
              example:
                data:
                  changeSetId: null
                  baseCommit: '0123456789abcdef0123456789abcdef01234567'
                  headCommit: '89abcdef0123456789abcdef0123456789abcdef'
                  stats:
                    files: 12
                    additions: 340
                    deletions: 80
                    truncated: false
                  files:
                    - path: src/example.ts
                      oldPath: null
                      status: M
                      additions: 40
                      deletions: 2
                      binary: false
                      headBlobHash: 'git-sha1:0123456789abcdef0123456789abcdef01234567'
                  nextCursor: null
                  hasMore: false
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/code/repos/{repoId}/diff/file:
    get:
      tags: [code]
      summary: Read the on-demand unified diff of one changed file
      description: |
        Every authenticated user. `base` is required; `head` defaults to the
        fixed branch tip and the resolved pair is echoed. Binary, deleted and
        oversized files are still 200 with an empty patch and the matching
        `binary`/`truncated` flag. A path outside the change set is 422
        `not_changed`.
      operationId: getCodeRepoFileDiff
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeRepoId'
        - name: base
          in: query
          required: true
          description: Base 40-hex commit.
          schema:
            type: string
            pattern: '^[a-f0-9]{40}$'
        - name: head
          in: query
          required: false
          description: Head 40-hex commit; omitted/empty resolves the fixed branch tip.
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Repository-relative changed file path.
          schema:
            type: string
            maxLength: 4096
      responses:
        '200':
          description: The unified file diff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDiffEnvelope'
              example:
                data:
                  baseCommit: '0123456789abcdef0123456789abcdef01234567'
                  headCommit: '89abcdef0123456789abcdef0123456789abcdef'
                  path: src/example.ts
                  status: M
                  binary: false
                  truncated: false
                  patch: '@@ -1 +1 @@ -// old +// new'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/code/repos/{repoId}/facts:
    get:
      tags: [code]
      summary: List one page of persisted code facts at a commit
      description: |
        Every authenticated user. Returns T0 file facts plus materialized AI
        facts for the commit. `kind` and `path` are exact filters; pagination is
        the shared opaque cursor envelope. Facts carry evidence ranges whose
        excerpt hash is validated server-side against the commit content.
      operationId: listCodeRepoFacts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeRepoId'
        - name: commit
          in: query
          required: false
          description: 40-hex commit; omitted/empty resolves the fixed branch tip.
          schema:
            type: string
        - name: kind
          in: query
          required: false
          description: Exact entity kind filter (for example `api` or `component`).
          schema:
            type: string
        - name: path
          in: query
          required: false
          description: Exact repository-relative path filter.
          schema:
            type: string
            maxLength: 4096
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned as `next_cursor`.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of facts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactsPage'
              example:
                data:
                  - id: '1844674407370955161'
                    repoId: 3
                    commit: '0123456789abcdef0123456789abcdef01234567'
                    kind: api
                    path: src/example.ts
                    name: POST /api/example
                    startLine: 10
                    endLine: 12
                    signature: ''
                    blobHash: 'git-sha1:0123456789abcdef0123456789abcdef01234567'
                    source: ai
                    confidence: high
                    evidence:
                      - file: src/example.ts
                        startLine: 10
                        endLine: 12
                        excerptHash: 'sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
                    factKey: 'api:POST /api/example'
                    factVersion: 1
                    analysisId: '1844674407370955162'
                next_cursor: ''
                has_more: false
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/code/repos/{repoId}/search:
    get:
      tags: [code]
      summary: Search fact paths/names by substring (not full text)
      description: |
        Every authenticated user. Case-insensitive substring match on entity
        path/name only (D24); no full-text index and no code-body search. The
        `q` query is required: an empty or missing value is 400
        `invalid_argument` with `details.reason=invalid_request`. The read is
        audited by the application service.
      operationId: searchCodeRepoFacts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeRepoId'
        - name: commit
          in: query
          required: false
          description: 40-hex commit; omitted/empty resolves the fixed branch tip.
          schema:
            type: string
        - name: q
          in: query
          required: true
          description: |
            Required path/name substring query (D24). An empty or missing `q`
            is 400 `invalid_argument` with `details.reason=invalid_request`.
          schema:
            type: string
            minLength: 1
        - name: kind
          in: query
          required: false
          description: Exact entity kind filter.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned as `next_cursor`.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of matching facts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactsPage'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/code/repos/{repoId}/commits/{sha}:
    get:
      tags: [code]
      summary: Read one commit's metadata
      description: |
        Every authenticated user. `sha` must be 40 lowercase hex; a malformed
        value is 422 `invalid_head` and an unknown commit is 422
        `commit_not_found` (not 404).
      operationId: getCodeRepoCommit
      security:
        - bearerAuth: []
