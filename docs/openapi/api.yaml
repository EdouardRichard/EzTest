        notes:
          type: string
    UpdateSystemRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their stored value. The key is immutable.
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [web, api]
        baseUrl:
          type: string
          format: uri
        notes:
          type: string
        defaultSessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
        status:
          type: string
          enum: [active, disabled]
    CreateEnvironmentRequest:
      type: object
      required: [key, name, baseUrl, kind]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        name:
          type: string
        baseUrl:
          type: string
          format: uri
        kind:
          type: string
          enum: [dev, staging, prod, other]
        isProd:
          type: boolean
          default: false
        allowedHosts:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 253
        loginCheck:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LoginCheck'
        allowAutoLogin:
          type: boolean
          default: false
        requireApproval:
          type: boolean
          default: false
    UpdateEnvironmentRequest:
      type: object
      additionalProperties: false
      description: |
        Partial update; omitted fields keep their stored value. An explicit
        "loginCheck": null clears the stored document.
      properties:
        name:
          type: string
        baseUrl:
          type: string
          format: uri
        kind:
          type: string
          enum: [dev, staging, prod, other]
        isProd:
          type: boolean
        allowedHosts:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 253
        loginCheck:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LoginCheck'
        allowAutoLogin:
          type: boolean
        requireApproval:
          type: boolean
    CreateAppModelRequest:
      type: object
      required: [key, kind, name]
      additionalProperties: false
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [page, route, api, component]
        name:
          type: string
        path:
          type: string
        method:
          type: string
        parentKey:
          type: string
          description: Empty or omitted makes the node a root.
        meta:
          type: object
          additionalProperties: true
    UpdateAppModelRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their stored value. Key and kind are immutable.
      properties:
        name:
          type: string
        path:
          type: string
        method:
          type: string
        parentKey:
          type: string
        meta:
          type: object
          additionalProperties: true
    AppModelImportNode:
      type: object
      required: [key, kind, name]
      additionalProperties: false
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [page, route, api, component]
        name:
          type: string
        path:
          type: string
        method:
          type: string
        parentKey:
          type: string
        meta:
          type: object
          additionalProperties: true
    ImportAppModelsRequest:
      type: object
      required: [nodes]
      additionalProperties: false
      properties:
        nodes:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/AppModelImportNode'
    CreateAccountRequest:
      type: object
      required: [key, label, kind]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        label:
          type: string
        username:
          type: string
        kind:
          type: string
          enum: [human, service]
        notes:
          type: string
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their stored value. The key is immutable.
      properties:
        label:
          type: string
        username:
          type: string
        kind:
          type: string
          enum: [human, service]
        notes:
          type: string
        status:
          type: string
          enum: [active, disabled]
    CreateAccessRequest:
      type: object
      required: [systemId, authType, concurrencyLimit]
      additionalProperties: false
      properties:
        systemId:
          type: integer
          format: int64
          minimum: 1
        authType:
          type: string
          enum: [password, sso, token, apikey, basic, manual]
        credential:
          type: string
          writeOnly: true
          description: Write-only; never returned.
        usernameOverride:
          type: string
        loginUrl:
          type: string
        enabled:
          type: boolean
          default: true
        concurrencyLimit:
          type: integer
          minimum: 1
          maximum: 100
        sessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          nullable: true
        permissionNote:
          type: string
    UpdateAccessRequest:
      type: object
      additionalProperties: false
      description: |
        Partial update. credential follows the write-only rule: omitted keeps
        the stored value, "" clears it and a non-empty value replaces it. An
        explicit "sessionTtlSeconds": null clears the TTL override. systemId is
        accepted for form compatibility and ignored.
      properties:
        authType:
          type: string
          enum: [password, sso, token, apikey, basic, manual]
        credential:
          type: string
          writeOnly: true
        usernameOverride:
          type: string
        loginUrl:
          type: string
        permissionNote:
          type: string
        enabled:
          type: boolean
        concurrencyLimit:
          type: integer
          minimum: 1
          maximum: 100
        systemId:
          type: integer
          format: int64
        sessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          nullable: true
    ImportSessionRequest:
      type: object
      required: [environmentId]
      additionalProperties: false
      properties:
        environmentId:
          type: integer
          format: int64
          minimum: 1
          description: Must belong to the access's system.
        kind:
          type: string
          enum: [storage_state, token]
          description: Omitted infers token when headers are present, storage_state otherwise.
        storageState:
          type: object
          additionalProperties: true
          writeOnly: true
          description: Playwright storageState document (cookies and origins). Write-only; never returned.
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Token headers such as Authorization. Write-only; never returned.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Explicit expiry; omitted computes min(now+TTL, earliest cookie expiry).
        note:
          type: string
    ConfirmSessionRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    RequestTakeoverRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [mfa, captcha, approval, login_unknown, other]
        instructions:
          type: object
          additionalProperties: true
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 31536000
          default: 1800
    CompleteTakeoverRequest:
      type: object
      additionalProperties: false
      description: The same login-state shape as the import request.
      properties:
        kind:
          type: string
          enum: [storage_state, token]
        storageState:
          type: object
          additionalProperties: true
          writeOnly: true
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
    CreateCodeRepoRequest:
      type: object
      required: [key, name, localPath]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        name:
          type: string
        localPath:
          type: string
        fixedBranch:
          type: string
          maxLength: 255
          default: main
        includeGlobs:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 256
        excludeGlobs:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 256
    UpdateCodeRepoRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their stored value. The key is immutable.
      properties:
        name:
          type: string
        localPath:
          type: string
        fixedBranch:
          type: string
          maxLength: 255
        includeGlobs:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 256
        excludeGlobs:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 256
        status:
          type: string
          enum: [active, disabled]
    VersionStatus:
      type: string
      description: |
        Version lifecycle status (spec §6.1). P3 only reaches
        `draft → clarifying → designing` through its actions; later values are
        reserved for later phases and are accepted as filters for forward
        compatibility.
      enum:
        - draft
        - clarifying
        - designing
        - reviewing
        - executing
        - continuing
        - completed
        - archived
    VersionResourceRef:
      type: object
      description: One resolved P2 resource binding; `available` is false after the resource was deleted.
      required: [id, name, available]
      properties:
        id:
          type: integer
          format: int64
          description: P2 resource ID; stays a number unlike P3-owned IDs.
        name:
          type: string
        available:
          type: boolean
    VersionBindings:
      type: object
      description: The resolved bindings of a version; unbound entries are null.
      required: [system, environment, codeRepository]
      properties:
        system:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/VersionResourceRef'
        environment:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/VersionResourceRef'
        codeRepository:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/VersionResourceRef'
    Version:
      type: object
      description: |
        `VersionDTO` (spec §7.2). `id` is a 64-bit snowflake serialized as a
        decimal string; P2 resource IDs and user IDs stay numbers.
      required:
        - id
        - name
        - label
        - description
        - status
        - systemId
        - environmentId
        - codeRepositoryId
        - codeBranch
        - codeBaselineCommit
        - bindings
        - requirementCount
        - clarifiedCount
        - openQuestionCount
        - revision
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
        - paused
        - pause_mode
        - batch_no
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          example: '1844674407370955161'
          description: Snowflake ID as a decimal string; never convert it to a number.
        name:
          type: string
          minLength: 1
          maxLength: 200
        label:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 20000
        status:
          $ref: '#/components/schemas/VersionStatus'
        systemId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        environmentId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        codeRepositoryId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        codeBranch:
          type: string
          maxLength: 200
          nullable: true
        codeBaselineCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
          nullable: true
          description: Snapshot of the bound commit; only a rebind changes it.
        bindings:
          $ref: '#/components/schemas/VersionBindings'
        requirementCount:
          type: integer
          minimum: 0
        clarifiedCount:
          type: integer
          minimum: 0
        openQuestionCount:
          type: integer
          minimum: 0
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Optimistic-lock token; every PATCH/binding write must send it.
        createdBy:
          type: integer
          format: int64
          description: User ID; stays a number.
        updatedBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        paused:
          type: boolean
          description: |
            P6 execution pause flag. It is independent of `status`: a paused
            version keeps `executing` and stays the single active batch owner.
            Written by the batch pause/resume endpoints and by restart
            recovery (paused with mode `immediate`, reason `restart`).
        pause_mode:
          $ref: '#/components/schemas/PauseMode'
        batch_no:
          type: integer
          minimum: 0
          description: |
            Highest P6 batch number allocated for the version; `0` before the
            first batch. The active batch itself is deliberately NOT embedded
            in the version DTO (the version context must not depend on the
            execution context); read it through
            `GET /api/versions/{id}/batches?status=running&limit=1`.
    VersionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Version'
    VersionList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Version'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CreateVersionRequest:
      type: object
      required: [name]
      additionalProperties: false
      description: Creates a `draft` version; bindings are optional. P2 resource IDs are numbers.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        label:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 20000
        systemId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        environmentId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Must belong to `systemId`.
        codeRepositoryId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        codeBranch:
          type: string
          maxLength: 200
          nullable: true
        codeBaselineCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
          nullable: true
    UpdateVersionRequest:
      type: object
      required: [revision]
      additionalProperties: false
      description: |
        Partial metadata update; omitted fields keep their value. `status` is not
        writable and `revision` must match the stored revision.
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        label:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 20000
    PutVersionBindingsRequest:
      type: object
      required: [revision]
      additionalProperties: false
      description: |
        Replaces the whole binding set. An omitted or `null` field clears that
        binding; `environmentId` must belong to `systemId`. Only `draft` and
        `clarifying` versions allow the write.
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        systemId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        environmentId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        codeRepositoryId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        codeBranch:
          type: string
          maxLength: 200
          nullable: true
        codeBaselineCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
          nullable: true
    EnterDesignRequest:
      type: object
      additionalProperties: false
      properties:
        acknowledgeUnclarified:
          type: boolean
          default: false
          description: Required to proceed when unclarified requirements or open questions exist.
    EnterDesignResult:
      type: object
      required: [version, warnings]
      properties:
        version:
          $ref: '#/components/schemas/Version'
        warnings:
          type: array
          items:
            type: string
          description: |
            Human-readable warnings about unclarified work; always a JSON array
            of strings (never a nested object) and empty when none remain.
    EnterDesignEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/EnterDesignResult'
    RequirementStatus:
      type: string
      description: |
        Requirement lifecycle status (spec §6.2). P3 only reaches
        `draft → clarified`; later values are reserved and accepted as filters.
      enum: [draft, clarified, designed, verified, obsolete]
    RequirementPriority:
      type: string
      enum: [must, should, could]
    VersionSource:
      type: string
      description: Whether the record was authored by a human through the API or by the Agent.
      enum: [user, ai]
    Requirement:
      type: object
      description: |
        `RequirementDTO` (spec §7.3). Every P3-owned ID is a decimal string;
        user IDs stay numbers. `GET /api/versions/{id}/requirements/{rid}`
        additionally includes the requirement's `attachments` metadata; list
        items expose only `attachmentCount`.
      required:
        - id
        - versionId
        - title
        - description
        - acceptanceCriteria
        - priority
        - status
        - source
        - lastUpdateSource
        - revision
        - confirmedAt
        - confirmedBy
        - openQuestionCount
        - relationCount
        - attachmentCount
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        acceptanceCriteria:
          type: string
          maxLength: 10000
        priority:
          $ref: '#/components/schemas/RequirementPriority'
        status:
          $ref: '#/components/schemas/RequirementStatus'
        source:
          $ref: '#/components/schemas/VersionSource'
        lastUpdateSource:
          $ref: '#/components/schemas/VersionSource'
        revision:
          type: integer
          format: int64
          minimum: 1
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        confirmedBy:
          type: integer
          format: int64
          nullable: true
          description: User ID; stays a number.
        openQuestionCount:
          type: integer
          minimum: 0
        relationCount:
          type: integer
          minimum: 0
        attachmentCount:
          type: integer
          minimum: 0
        attachments:
          type: array
          description: |
            Attachment metadata for the requirement-detail response (spec §7.3).
            Omitted or empty on list items, which expose `attachmentCount` only.
            `storagePath` is never returned.
          items:
            $ref: '#/components/schemas/RequirementAttachment'
        createdBy:
          type: integer
          format: int64
        updatedBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RequirementEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Requirement'
    RequirementList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CreateRequirementRequest:
      type: object
      required: [title]
      additionalProperties: false
      description: Adds a `draft` requirement with `source=user`; the version status never changes.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        acceptanceCriteria:
          type: string
          maxLength: 10000
        priority:
          allOf:
            - $ref: '#/components/schemas/RequirementPriority'
          description: Defaults to `should` when omitted.
    UpdateRequirementRequest:
      type: object
      required: [revision]
      additionalProperties: false
      description: |
        Edits a `draft` requirement. `revision` must match the stored revision;
        a `clarified` requirement returns 409 `requirement_state_conflict`.
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        acceptanceCriteria:
          type: string
          maxLength: 10000
        priority:
          $ref: '#/components/schemas/RequirementPriority'
    RelationType:
      type: string
      description: |
        Four relation kinds. `depends_on` is directed; the other three are
        undirected for duplicate detection even though storage keeps a from/to
        pair.
      enum: [depends_on, conflicts_with, overlaps, shares_scope]
    RequirementRelation:
      type: object
      description: Relation DTO (spec §7.4); both endpoint IDs are P3 decimal strings.
      required:
        - id
        - versionId
        - fromRequirementId
        - toRequirementId
        - relationType
        - description
        - source
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        fromRequirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
        toRequirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
        relationType:
          $ref: '#/components/schemas/RelationType'
        description:
          type: string
        source:
          $ref: '#/components/schemas/VersionSource'
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RequirementRelationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RequirementRelation'
    RequirementRelationList:
      type: object
      description: All relations of a version (no pagination; at most 500).
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RequirementRelation'
    CreateRelationRequest:
      type: object
      required: [fromRequirementId, toRequirementId, relationType]
      additionalProperties: false
      properties:
        fromRequirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
        toRequirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
        relationType:
          $ref: '#/components/schemas/RelationType'
        description:
          type: string
    UpdateRelationRequest:
      type: object
      additionalProperties: false
      description: Partial update; relations have no revision field. At least one field is expected.
      properties:
        relationType:
          $ref: '#/components/schemas/RelationType'
        description:
          type: string
    AttachmentKind:
      type: string
      enum: [text, image]
    RequirementAttachment:
      type: object
      description: Attachment metadata (spec §6.7/§7.3); `storagePath` is never exposed.
      required: [id, kind, filename, mimeType, sizeBytes, sha256, createdAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        kind:
          $ref: '#/components/schemas/AttachmentKind'
        filename:
          type: string
          description: Basename with Unicode preserved, control characters and path separators removed, at most 120 runes.
        mimeType:
          type: string
          enum:
            - text/plain
            - text/markdown
            - application/json
            - application/yaml
            - text/yaml
            - image/png
            - image/jpeg
