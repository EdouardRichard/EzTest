    MessageDelta:
      type: object
      description: |
        `conversation.message.delta` 事件 payload（v0.2.4-D；Go 权威 `versionapp.MessageDelta`，
        backend/internal/version/application/conversation_stream.go，json tag 即 wire）。
        DB 按 seq 存完整快照，事件只传增量，长回复的事件体不随长度增长。两模式互斥（oneOf）：
        - append（text/thinking 纯增长）：`increment` 恒非空；`offset` 为追加前累计文本的
          UTF-16 code unit 数（= JS `String.length`，重放帧按 offset 去重），0 时省略。
        - replace（其余 part 类型、同 seq 类型变化、任何非纯增长改写/元数据更新）：
          `part` 为完整 `MessagePart` 快照，整段替换该 seq；`offset`/`increment` 缺席。
        终态由完整 `conversation.message` 帧的 `stream_state` 承载，不在每条 delta 上。
        前端累积规则：cur==offset 追加；cur>=offset+len 为重放跳过；其余（gap/部分重叠）跳过
        不拼接，等下一全帧治愈。
      required: [message_id, conversation_id, seq, part_type]
      properties:
        message_id:
          type: string
          pattern: '^[0-9]+$'
        conversation_id:
          type: string
          pattern: '^[0-9]+$'
        seq:
          type: integer
          minimum: 1
          description: 1-based conversation_message_part seq
        part_type:
          type: string
          enum: [text, thinking, tool_call, job_card, attachment, requirement_card, case_card, error]
          description: 流式 part 类型（与 MessagePartView.part_type 同枚举，派生自 version 域 StreamingMessagePartTypes()）
        offset:
          type: integer
          minimum: 0
          description: 仅 append 模式；追加前累计文本的 UTF-16 code unit 数（= JS String.length），0 时省略
        increment:
          type: string
          minLength: 1
          description: 仅 append 模式；新增文本后缀，恒非空
        part:
          allOf:
            - $ref: '#/components/schemas/MessagePart'
          description: 仅 replace 模式；完整 MessagePart 快照，整段替换该 seq
      oneOf:
        - required: [increment]
          not:
            required: [part]
        - required: [part]
          not:
            anyOf:
              - required: [increment]
              - required: [offset]
    TranscriptMessagePart:
      type: object
      description: agent 转录 part（Go 权威 agent/domain/runtime.go MessagePart；工具行可为 content_ref 类型）
      required: [type]
      properties:
        type:
          type: string
        text:
          type: string
          description: 可选（Go omitempty）
    TranscriptToolCall:
      type: object
      description: 转录中的模型工具调用（Go 权威 agent/domain/runtime.go ToolCall；arguments 为 JSON 字符串）
      required: [id, name, arguments]
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: string
    TranscriptMessage:
      type: object
      description: |
        agent_message 转录行的唯一 wire 投影（v0.2.4-D；Go 权威 `agentapp.TranscriptMessage`，
        backend/internal/agent/application/transcript_stream.go）。admin-only 快照端点与
        `agent.transcript.delta` 的 snapshot 模式共用本行类型。ID 为十进制字符串；
        parts/tool_calls 恒为数组、usage 恒为对象（可为空）。`stream_state` 为
        complete/interrupted 时行已冻结，不再有后续帧。
      required: [id, role, parts, tool_calls, usage, stream_state, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        run_id:
          type: string
          pattern: '^[0-9]+$'
          description: 可选（无 run 时省略，Go omitempty）
        conversation_id:
          type: string
          pattern: '^[0-9]+$'
          description: 可选（非 Host run 省略，Go omitempty）
        role:
          type: string
          enum: [system, user, assistant, tool]
        parts:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptMessagePart'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptToolCall'
        tool_call_id:
          type: string
          description: 可选，仅 tool 行（Go omitempty）
        usage:
          type: object
          additionalProperties:
            type: integer
        stream_state:
          type: string
          enum: [streaming, complete, interrupted]
          description: 与 conversation_message.stream_state 同源（version 域 MessageStreamStates()，agent 域编译期派生别名）
        created_at:
          type: string
          format: date-time
    TranscriptDelta:
      type: object
      description: |
        `agent.transcript.delta` 事件 payload（v0.2.4-D；Go 权威 `agentapp.TranscriptDelta`，
        backend/internal/agent/application/transcript_stream.go）。`run:{id}` 频道，仅 admin。
        两模式互斥（oneOf）：
        - append（回复文本纯增长）：`seq`（1-based parts 下标，当前文本 part 恒为 1）+
          `part_type` + `increment`（恒非空）+ `offset`（UTF-16 code unit 数，0 时省略）。
        - snapshot（占位行/批式行/工具调用与 usage/非纯增长改写/每次封口）：`message` 为完整
          `TranscriptMessage` 行，整行替换；seq/part_type/offset/increment 缺席。
        `stream_state` 恒在；终态即行冻结。前端规则与 MessageDelta 同形（offset 校验去重，
        gap 丢弃等整快照治愈）。
      required: [run_id, message_id, stream_state]
      properties:
        run_id:
          type: string
          pattern: '^[0-9]+$'
        message_id:
          type: string
          pattern: '^[0-9]+$'
        stream_state:
          type: string
          enum: [streaming, complete, interrupted]
        seq:
          type: integer
          minimum: 1
          description: 仅 append 模式；1-based parts 下标
        part_type:
          type: string
          description: 仅 append 模式；当前恒为 text
        offset:
          type: integer
          minimum: 0
          description: 仅 append 模式；追加前累计文本的 UTF-16 code unit 数，0 时省略
        increment:
          type: string
          minLength: 1
          description: 仅 append 模式；新增文本后缀，恒非空
        message:
          allOf:
            - $ref: '#/components/schemas/TranscriptMessage'
          description: 仅 snapshot 模式；完整转录行，整行替换
      oneOf:
        - required: [seq, part_type, increment]
          not:
            required: [message]
        - required: [message]
          not:
            anyOf:
              - required: [seq]
              - required: [part_type]
              - required: [offset]
              - required: [increment]
    AgentActivityView:
      type: object
      description: |
        agent_activity 事实行（v0.2.4-D；Go wire 权威 `agentActivityDTO`，
        backend/internal/agent/interfaces/httpapi/agent_center_dto.go；域权威
        agent/domain/activity.go）。`(run_id, seq)` 幂等：tool_call 每次调用一行
        （start/end 同 seq 两次 UPSERT，结局折叠不擦除）；compaction 每次触发/尝试一行。
        事实先写 DB，成功后才派生事件；事件丢失不影响台账。`ended_at`/`error` 在事实仍在飞
        或未失败时省略（不伪造结局）。payload 为粗粒度事实对象：tool_call 含
        tool/tool_call_id/duration_ms；compaction 与 context.compacted 事件同源
        （trigger/before_tokens/after_tokens/retain_tokens/summary_version/covered_message_id/
        cached_tokens/duration_ms，失败另带 error）；被停止的压缩尝试不携带
        before_tokens/after_tokens（从未测量）；duration_ms 为实测墙钟（no-op 可为 0）。
      required: [id, run_id, seq, type, title, started_at, payload, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        run_id:
          type: string
          pattern: '^[0-9]+$'
        seq:
          type: integer
          minimum: 1
          description: per-run 单调序号；(run_id, seq) 为幂等键
        type:
          type: string
          enum: [tool_call, compaction]
          description: 派生自 agent/domain/activity.go ActivityTypes()
        title:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: 可选；仍在飞时省略（Go omitempty）
        payload:
          type: object
          additionalProperties: true
        error:
          type: string
          description: 可选；失败原因，未失败时省略（Go omitempty）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
