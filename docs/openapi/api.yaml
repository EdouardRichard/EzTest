        - $ref: '#/components/schemas/GCRunView'
        - type: object
          required: [tombstones]
          properties:
            tombstones:
              type: array
              items:
                $ref: '#/components/schemas/GCTombstoneView'
    GCRunCreateRequest:
      type: object
