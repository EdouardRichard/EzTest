                            type: integer
                          proposed:
                            type: integer
                          approved:
                            type: integer
                          rejected:
                            type: integer
                          out_of_scope:
                            type: integer
                          uncovered:
                            type: array
                            maxItems: 200
                            items:
                              type: string
                      apis:
                        type: object
                        required: [observed, proposed, approved, rejected, out_of_scope, uncovered]
                        additionalProperties: false
                        properties:
                          observed:
                            type: integer
                          proposed:
                            type: integer
                          approved:
                            type: integer
                          rejected:
                            type: integer
