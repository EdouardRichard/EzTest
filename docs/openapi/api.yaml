        selected: {type: array, items: {type: string}}
        text: {type: string}
    QuestionView:
      type: object
      required: [id, version_id, conversation_id, message_id, kind, status, batch_id, questions, expires_at, answers, answered_by, answered_at, skipped, decision, reason, created_at]
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        version_id: {type: string, pattern: '^[0-9]+$'}
        conversation_id: {type: string, pattern: '^[0-9]+$', nullable: true}
        message_id: {type: string, pattern: '^[0-9]+$', nullable: true}
        kind: {type: string}
        status: {type: string, enum: [pending, answered, expired, cancelled]}
        batch_id: {type: string}
        questions: {type: array, minItems: 0, maxItems: 5, items: {$ref: '#/components/schemas/QuestionItemView'}}
        expires_at: {type: string, format: date-time}
        answers: {type: array, items: {$ref: '#/components/schemas/QuestionAnswerView'}}
        answered_by: {type: string, pattern: '^[0-9]+$', nullable: true}
        answered_at: {type: string, format: date-time, nullable: true}
        skipped: {type: boolean}
        decision: {type: string, enum: [approved, rejected, '']}
        reason: {type: string, maxLength: 2000}
        created_at: {type: string, format: date-time}
    CreateQuestionRequest:
      type: object
      required: [questions]
      properties:
        batch_id: {type: string, maxLength: 128}
        expires_at: {type: string, format: date-time}
        questions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string, maxLength: 64}
              text: {type: string, minLength: 1, maxLength: 2000}
              options:
                type: array
                items:
                  type: object
                  required: [id, label]
                  properties:
                    id: {type: string, maxLength: 64}
                    label: {type: string, maxLength: 500}
              multiple: {type: boolean}
              allow_free_text: {type: boolean}
              required: {type: boolean}
              source_refs: {type: array, items: {type: string}}
    CreateHumanRequestRequest:
      type: object
      required: [kind, reason]
      properties:
        kind:
          type: string
          enum: [approval, blocked_recovery, conflict]
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        conversation_id:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        message_id:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
    AnswerQuestionRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [question_id]
            properties:
              question_id: {type: string}
              selected: {type: array, items: {type: string}}
              text: {type: string, maxLength: 4000}
    StageBlockRequest:
      type: object
      required: [reason, action, next]
      properties:
        kind: {type: string, maxLength: 64}
        reason: {type: string, minLength: 1, maxLength: 2000}
        action: {type: string, minLength: 1, maxLength: 2000}
        next: {type: string, minLength: 1, maxLength: 2000}
