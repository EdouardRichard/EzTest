      required:
        - id
        - accountId
        - systemId
        - environmentId
        - accessId
        - state
        - acquisition
        - storageStateKind
        - cookieCount
        - originCount
        - storageStateHash
        - expiresAt
        - lastValidatedAt
        - lastUsedAt
        - failureReason
        - invalidatedReason
        - expiring
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        systemId:
          type: integer
          format: int64
        environmentId:
          type: integer
          format: int64
        accessId:
          type: integer
          format: int64
        state:
          type: string
          enum: [pending, acquiring, needs_manual, valid, refreshing, expired, invalid, revoked, failed]
        acquisition:
          type: string
          enum: [auto, manual, imported]
        storageStateKind:
          type: string
          enum: ["", storage_state, token]
        cookieCount:
          type: integer
        originCount:
          type: integer
        storageStateHash:
