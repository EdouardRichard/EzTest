    post:
      tags: [Versions]
      operationId: rejectStage
      summary: 硬门退回澄清/设计（仅用户 token）
      description: |
        需求门退回 `clarifying`、用例门退回 `designing`。退回只移动阶段并写一条 `version.stage_decision`
        审计（reason + actor），不删除任何需求/用例；重新确认门禁后由既有的 design.cases 生成流程按需重建。
