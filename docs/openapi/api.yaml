  /api/versions/{versionId}/reports/{reportId}/artifacts:
    post:
      tags: [Delivery]
      operationId: createReportArtifact
      summary: 生成报告 artifact（html/pdf/markdown）
      description: |
        R-W2-3/API-28（v0.22 W2-7）。按报告当前已发布 revision 生成一个 artifact：
        html/pdf 复用 `OpenHTML`/`OpenPDF` 的版本归属、发布状态与内容账本校验，
        PDF 未就绪返回 409 `pdf_not_ready`（failed 为 409 `pdf_failed`）；
        markdown 使用确定性渲染器（固定 revision `as_of`、按十进制 ID 升序、证据仅引用
        id/sha256/size），同一输入字节稳定。
        产物写入既有 `export_artifact`（owner_kind=`report`、owner_id=report id、
        content_object_id=sha256、status=`ready`）并写入 content ledger；不提供 DELETE
        （仅 GC 删除）。同步发布 `export.started` → `export.completed`/`export.failed`
        （版本频道，payload `{export_id,report_id,version_id,format,status,sha256,error}`）。
      parameters:
        - $ref: '#/components/parameters/VersionID'
        - $ref: '#/components/parameters/ReportID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportArtifactCreateRequest'
      responses:
        '200':
          description: 已生成的 artifact 身份（下载走 GET /api/exports/{exportId}）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, format, sha256, size, status]
                    properties:
                      id:
                        type: string
                        pattern: '^[0-9]+$'
                      format:
                        type: string
                        enum: [html, pdf, markdown]
                      sha256:
                        type: string
                        pattern: '^[0-9a-f]{64}$'
                        description: content_object_id（内容 sha256）
                      size:
                        type: integer
                        format: int64
                        minimum: 0
                      status:
                        type: string
                        enum: [ready, failed]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
