      summary: Cancel a manual takeover (admin only)
      description: The session stays needs_manual. A takeover that is not waiting is 409 takeover_not_waiting.
      operationId: cancelTakeover
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceTakeoverId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The cancelled takeover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeoverEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/resources/code-repos:
    get:
      tags: [code-repos]
      summary: List code repositories
      description: One cursor-paged list ordered by ID ascending.
      operationId: listCodeRepos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Exact status filter.
          schema:
            type: string
            enum: [active, disabled]
      responses:
        '200':
          description: One page of code repositories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepoList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ResourceInvalid'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [code-repos]
      summary: Create a code repository (admin only)
      description: |
        The local checkout is validated read-only before saving: a missing path,
        a non-Git directory or an unknown branch is 422 with details.reason
        path_not_found, path_not_git_repo or branch_not_found.
      operationId: createCodeRepo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCodeRepoRequest'
      responses:
        '201':
          description: The created code repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepoEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ResourceInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/resources/code-repos/{id}:
    get:
      tags: [code-repos]
      summary: Get one code repository
      operationId: getCodeRepo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceCodeRepoId'
      responses:
        '200':
          description: The code repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepoEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ResourceInvalid'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [code-repos]
      summary: Update a code repository (admin only)
      description: Every field is optional; the key is immutable and a changed checkout is revalidated before writing.
      operationId: updateCodeRepo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceCodeRepoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCodeRepoRequest'
      responses:
        '200':
          description: The updated code repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepoEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ResourceInvalid'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [code-repos]
      summary: Delete a code repository (admin only)
      description: P2 registers no dependents, so the delete is unconditional.
      operationId: deleteCodeRepo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceCodeRepoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The code repository was deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ResourceInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/resources/code-repos/{id}/validate:
    post:
      tags: [code-repos]
      summary: Revalidate a code repository (admin only)
      description: Re-runs the read-only Git check and refreshes lastCommit, lastValidatedAt and lastValidationError.
      operationId: validateCodeRepo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceCodeRepoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The revalidated code repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepoEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ResourceInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: Always 200 while the process can serve requests; never touches the database.
      operationId: liveness
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /api/health:
    get:
      tags: [health]
      summary: Readiness probe
      description: |
        Pings the database with a 2 second timeout. `llm_configured` is true
        only when a default LLM configuration exists and its key can be
        decrypted. Database failure returns 503 with `status: unavailable` and
        `db: down`.
      operationId: readiness
      security: []
      responses:
        '200':
          description: The service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          description: The database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /api/openapi.yaml:
    get:
      tags: [health]
      summary: The public OpenAPI document
      description: Serves the hand-maintained YAML document; a missing file is 404.
      operationId: getOpenAPIDocument
      security: []
      responses:
        '200':
          description: The OpenAPI 3.0 document.
          content:
            application/yaml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Opaque session token returned once by `POST /api/auth/login`. Send it as
        `Authorization: Bearer <token>`. The server stores only its SHA-256 hash;
        logout and password resets revoke it.
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Optional client request ID matching `^[A-Za-z0-9_-]{8,128}$`. Invalid
        values are replaced with a UUID; the response always echoes the chosen
        value in `X-Request-ID` and in every error envelope.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,128}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Opts an authenticated write into 24 hour idempotent replay. Same key
        and body replay the stored response with `Idempotent-Replayed: true`;
        same key and a different body is 409 `idempotency_conflict`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,128}$'
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1-100. Defaults to 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque id cursor from the previous page; do not parse it.
      schema:
        type: string
    BeforeSeq:
      name: before_seq
      in: query
      required: false
      description: Return events with a sequence lower than this cursor. Omit (or 0) for the latest events.
      schema:
        type: integer
        format: int64
        minimum: 0
    Channel:
      name: channel
      in: query
      required: true
      description: |
        Channel name, 1-64 characters. P0 uses `system`; each P1 Agent session
        uses `agent:{session_id}`. Channels starting with `agent:` are
        administrator-only (403 `forbidden` for regular users).
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Since:
      name: since
      in: query
      required: false
      description: Replay events after this seq when `Last-Event-ID` is absent. Omit for live-only.
      schema:
        type: integer
        format: int64
        minimum: 0
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: Reconnect cursor. Takes precedence over `?since`.
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      description: User ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    LLMConfigId:
      name: id
      in: path
      required: true
      description: LLM configuration ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    SHA256:
      name: sha256
      in: path
      required: true
      description: Lowercase hex SHA-256 object id.
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    AgentProfileId:
      name: id
      in: path
      required: true
      description: Agent profile ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    AgentProfileFilter:
      name: profile_id
      in: query
      required: false
      description: Optional exact Agent profile filter for the session list.
      schema:
        type: integer
        format: int64
        minimum: 1
    AgentSessionId:
      name: id
      in: path
      required: true
      description: Agent session ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    AgentMessageId:
      name: message_id
      in: path
      required: true
      description: Message ID; it must belong to the session in the path.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceSystemId:
      name: id
      in: path
      required: true
      description: System ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceEnvironmentId:
      name: id
      in: path
      required: true
      description: Environment ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceAppModelId:
      name: id
      in: path
      required: true
      description: App model node ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceAccountId:
      name: id
      in: path
      required: true
      description: Account ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceAccessId:
      name: id
      in: path
      required: true
      description: Access ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceSessionId:
      name: id
      in: path
      required: true
      description: Session ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceTakeoverId:
      name: id
      in: path
      required: true
      description: Manual takeover ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceCodeRepoId:
      name: id
      in: path
      required: true
      description: Code repository ID.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    InvalidArgument:
      description: Invalid input (`invalid_argument` or `idempotency_conflict` for a reused key with a different body).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Missing, malformed, expired or revoked bearer token (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not an administrator (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentChannelForbidden:
      description: |
        Authenticated but not an administrator (`forbidden`). Channels starting
        with `agent:` are administrator-only; the P0 `system` channel remains
        available to every authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The requested resource is absent (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: |
        State conflict such as a duplicate username, a protected administrator
        (`conflict`), an Agent session that already has a running run
        (`details.reason=run_active`) or a disabled Agent profile
        (`details.reason=profile_disabled`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: The upload exceeds 10 MiB (`invalid_argument`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: |
        A semantically invalid field (`invalid_argument`). `details.field`
        names the rejected Agent profile, session or message field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Login lockout or upstream LLM rate limiting (`rate_limited` / `llm_rate_limited`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: Unexpected server failure (`internal` or `storage_corrupted`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadGateway:
      description: Upstream LLM authentication, 5xx or invalid response (`llm_auth_failed`, `llm_upstream_error`, `llm_invalid_response`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: |
        Service temporarily unavailable. Agent requests use `unavailable` with
        `details.reason` set to `llm_not_configured` (no usable default LLM
        configuration), `tools_require_chat_completions` (the default
        configuration uses the `responses` protocol) or `capacity` (all global
        run slots are busy; `retryable: true`). The readiness probe also
        returns 503 when the database is down.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayTimeout:
      description: The upstream LLM call exceeded the configured timeout (`llm_timeout`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResourceInvalid:
      description: |
        A semantically invalid resource request (`invalid_argument`).
        `details.field` names the rejected field and `details.reason` is one of
        `invalid_key`, `invalid_kind`, `invalid_status`, `invalid_base_url`,
        `invalid_login_check`, `invalid_allowed_hosts`, `invalid_json`,
        `body_too_large`, `invalid_limit`, `invalid_cursor`, `invalid_id`,
        `invalid_storage_state`, `storage_state_expired`, `invalid_branch`,
        `invalid_glob`, `path_not_found`, `path_not_git_repo` or
        `branch_not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResourceConflict:
      description: |
        A resource conflict (`conflict`) with `details.reason` one of
        `duplicate_key` (a unique key is already in use), `has_dependencies`
        (the object still has dependents), `session_state_conflict` (the
        session state does not allow the action) or `takeover_not_waiting`
        (the takeover is not waiting).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              type: string
              enum:
                - invalid_argument
                - unauthenticated
                - forbidden
                - not_found
                - conflict
                - idempotency_conflict
                - rate_limited
                - internal
                - unavailable
                - storage_corrupted
                - llm_not_configured
                - llm_auth_failed
                - llm_rate_limited
                - llm_bad_request
                - llm_upstream_error
                - llm_timeout
                - llm_invalid_response
            message:
              type: string
            request_id:
              type: string
              description: Echoes `X-Request-ID`; always present when the request reached the middleware chain.
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
              description: |
                Non-sensitive structured details; `{}` when absent. LLM errors
                may include `upstream_status`. Agent errors may include
                `reason` (`run_active`, `profile_disabled`,
                `llm_not_configured`, `tools_require_chat_completions`,
                `capacity`) or `field` (the rejected request field).
    User:
      type: object
      required: [id, username, role, status]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          pattern: '^[a-zA-Z0-9_.-]{3,64}$'
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CreateUserRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9_.-]{3,64}$'
        password:
          type: string
          minLength: 10
          maxLength: 128
    UpdateUserRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [active, disabled]
    ResetPasswordRequest:
      type: object
      required: [new_password]
      additionalProperties: false
      properties:
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, expires_at, user]
          properties:
            token:
              type: string
              description: Raw opaque bearer token; returned exactly once.
            expires_at:
              type: string
              format: date-time
            user:
              $ref: '#/components/schemas/User'
    ModelInfo:
      type: object
      required: [id]
      properties:
        id:
          type: string
        context_window:
          type: integer
          format: int64
          nullable: true
        max_output_tokens:
          type: integer
          format: int64
          nullable: true
        input_modalities:
          type: array
          items:
            type: string
          description: Missing upstream fields are omitted rather than guessed.
    LLMConfig:
      type: object
      required:
        - id
        - name
        - protocol
        - base_url
        - model
        - has_api_key
        - key_version
        - header_names
        - retry_count
        - retry_interval_ms
        - timeout_ms
        - stream_enabled
        - multimodal_enabled
        - is_default
        - model_catalog
        - catalog_fetched_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        protocol:
          type: string
          enum: [chat_completions, responses]
        base_url:
          type: string
          format: uri
        model:
          type: string
        has_api_key:
          type: boolean
        key_version:
          type: integer
        header_names:
          type: array
          items:
            type: string
          description: Sorted custom header names. Header values are never returned.
        retry_count:
          type: integer
          minimum: 0
          maximum: 5
        retry_interval_ms:
          type: integer
          minimum: 100
          maximum: 30000
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
        stream_enabled:
          type: boolean
        multimodal_enabled:
          type: boolean
        is_default:
          type: boolean
        model_catalog:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
        catalog_fetched_at:
          type: string
          format: date-time
          nullable: true
    LLMConfigEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/LLMConfig'
    LLMConfigList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LLMConfig'
    CreateLLMConfigRequest:
      type: object
      required: [name, protocol, base_url, model]
      properties:
        name:
          type: string
          minLength: 1
        protocol:
          type: string
          enum: [chat_completions, responses]
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
          description: Optional upstream credential; encrypted at rest and never returned.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Optional custom headers; names must not be empty and must not override Authorization or Content-Type.
        retry_count:
          type: integer
          minimum: 0
          maximum: 5
          default: 2
        retry_interval_ms:
          type: integer
          minimum: 100
          maximum: 30000
          default: 500
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
          default: 60000
        stream_enabled:
          type: boolean
          default: true
        multimodal_enabled:
          type: boolean
          default: true
        is_default:
          type: boolean
          default: false
    UpdateLLMConfigRequest:
      type: object
      description: Every field is optional; omitted `api_key` and `headers` keep their stored value.
      properties:
        name:
          type: string
          minLength: 1
        protocol:
          type: string
          enum: [chat_completions, responses]
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        retry_count:
          type: integer
          minimum: 0
          maximum: 5
        retry_interval_ms:
          type: integer
          minimum: 100
          maximum: 30000
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
        stream_enabled:
          type: boolean
        multimodal_enabled:
          type: boolean
        is_default:
          type: boolean
    LLMTestRequest:
      type: object
      properties:
        stream:
          type: boolean
          default: false
          description: Requires `stream_enabled=true`; returns normalized SSE frames.
        prompt:
          type: string
          description: Defaults to a short description prompt when empty.
        image:
          type: boolean
          default: false
          description: Requires `multimodal_enabled=true`; attaches the built-in 1x1 PNG.
    Usage:
      type: object
      description: |
        Token accounting. `reasoning_tokens` is additive in P1: upstream
        providers that do not report it return 0.
      required: [prompt_tokens, completion_tokens, reasoning_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        reasoning_tokens:
          type: integer
          description: Reasoning/thinking tokens reported by the upstream; 0 when absent.
        total_tokens:
          type: integer
    LLMTestResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [text, usage, latency_ms]
          properties:
            text:
              type: string
            usage:
              $ref: '#/components/schemas/Usage'
            latency_ms:
              type: integer
              format: int64
    EventRefs:
      type: object
      required: [evidence, case, requirement, code]
      properties:
        evidence:
          type: array
          items:
            type: string
        case:
          type: array
          items:
            type: string
        requirement:
          type: array
          items:
            type: string
        code:
          type: array
          items:
            type: string
    Event:
      type: object
      required:
        - seq
        - channel
        - type
        - version_id
        - batch_id
        - case_id
        - step_id
        - agent_role
        - session_id
        - ts
        - summary
        - detail
        - refs
      properties:
        seq:
          type: integer
          format: int64
          description: Channel-local monotonic sequence assigned by the store.
        channel:
          type: string
          maxLength: 64
          description: |
            `system` for the P0 platform stream. Each P1 Agent session publishes
            on `agent:{session_id}`; those channels require an administrator.
        type:
          type: string
          maxLength: 100
          description: |
            `system.test` for the P0 test publisher; `agent.activity` for every
            P1 Agent activity (frozen V1 contract, see AgentActivityDetail).
        version_id:
          type: string
          nullable: true
        batch_id:
          type: string
          nullable: true
        case_id:
          type: string
          nullable: true
        step_id:
          type: string
          nullable: true
        agent_role:
          type: string
          nullable: true
          description: Agent profile key for `agent.activity` events; null otherwise.
        session_id:
          type: string
          nullable: true
        ts:
          type: string
          format: date-time
        summary:
          type: string
          maxLength: 500
        detail:
          type: object
          additionalProperties: true
          description: |
            Up to 64 KiB of valid JSON; `{}` when absent. For `agent.activity`
            this is the frozen V1 detail object described by
            AgentActivityDetail.
        refs:
          $ref: '#/components/schemas/EventRefs'
    EventSnapshot:
      type: object
      required: [data]
