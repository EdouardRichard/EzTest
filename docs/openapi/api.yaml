        counts 是 limit 前按 kind 计数（6 个 key 全返回；非 admin 的 admin-only 组为 0）；items 受
        `limit` 截断。排序：human_request（takeover 优先）→ design_pending → issue_confirmation →
        requirement_confirmation → case_confirmation → dead_work_item；组内 `created_at DESC, id DESC`。
        非 admin 不查询 execution 的 human_request/dead 组（服务端过滤，避免泄露）。只读；前端 30s 轮询。
