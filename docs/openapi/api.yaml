            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type: string
        has_more:
          type: boolean
    AgentProfile:
      type: object
      description: |
        One Agent configuration. `model` empty means the default LLM
        configuration's model; `max_turns` 0 means unlimited. `key` and
        `builtin` are read-only.
      required:
        - id
        - key
        - name
        - description
        - builtin
        - enabled
        - system_prompt
        - model
        - allowed_tools
        - max_turns
        - run_seconds
        - hard_timeout_seconds
        - thinking
        - reasoning_effort
        - max_output_tokens
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
          pattern: '^[a-z][a-z0-9_-]*$'
          description: Immutable profile key; the builtin profile uses `runtime-diagnostic`.
        name:
          type: string
        description:
          type: string
        builtin:
          type: boolean
          description: Immutable flag for the seeded profile.
        enabled:
          type: boolean
        system_prompt:
          type: string
          minLength: 1
          maxLength: 32768
        model:
          type: string
          description: Model override; empty uses the default LLM configuration's model.
        allowed_tools:
          type: array
          uniqueItems: true
          items:
            type: string
          description: |
            Tool names this profile may call. On PATCH the list must be a subset
            of the tools currently registered by `GET /api/agents/tools`;
            otherwise the request is 422. That subset check is not re-applied to
            a stored profile, so the seeded `runtime-diagnostic` profile may list
            tools that are currently unregistered (for example `file.list` and
            `file.read` when `EZTEST_AGENT_FILE_ROOT` is empty) and those calls
            are rejected at run time.
        max_turns:
          type: integer
          minimum: 0
          maximum: 100
          description: 0 means unlimited.
        run_seconds:
          type: integer
          minimum: 30
          maximum: 3600
        hard_timeout_seconds:
          type: integer
          minimum: 5
          maximum: 300
        thinking:
          type: string
          enum: [auto, enabled, disabled]
        reasoning_effort:
          type: string
          enum: ["", none, low, high, max]
          description: Must be empty or `none` when `thinking=disabled`.
        max_output_tokens:
          type: integer
          minimum: 1024
          maximum: 131072
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentProfileEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentProfile'
    AgentProfileList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentProfile'
    AgentProfilePatch:
      type: object
      description: |
        Partial update. Omitted fields keep their stored value. `key` and
        `builtin` are not present here, so sending them is rejected as an
        unknown field.
      additionalProperties: false
      properties:
        system_prompt:
          type: string
          minLength: 1
          maxLength: 32768
        model:
          type: string
        allowed_tools:
          type: array
          uniqueItems: true
          items:
            type: string
        max_turns:
          type: integer
          minimum: 0
          maximum: 100
        run_seconds:
          type: integer
          minimum: 30
          maximum: 3600
        hard_timeout_seconds:
          type: integer
          minimum: 5
          maximum: 300
        thinking:
          type: string
          enum: [auto, enabled, disabled]
        reasoning_effort:
          type: string
          enum: ["", none, low, high, max]
        max_output_tokens:
          type: integer
          minimum: 1024
          maximum: 131072
        enabled:
          type: boolean
    AgentTool:
      type: object
      required: [name, description, schema]
      properties:
        name:
          type: string
          example: file.read
        description:
          type: string
        schema:
          type: object
          additionalProperties: true
          description: JSON Schema object for the tool's arguments.
    AgentToolList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentTool'
    AgentRun:
      type: object
      description: |
        One run with accumulated usage. `terminal_reason`, `abort_code`,
        `error_code`, `last_tool_name` and `ended_at` are null while they do not
        apply.
      required:
        - id
        - session_id
        - status
        - terminal_reason
        - turns
        - input_tokens
        - output_tokens
        - reasoning_tokens
        - abort_code
        - error_code
        - last_tool_name
        - last_tool_pending
        - started_at
        - ended_at
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [running, done, failed, aborted, interrupted]
        terminal_reason:
          type: string
          nullable: true
          enum:
            - completed
            - max_turns
            - timeout
            - model_error
            - context_overflow
            - aborted_streaming
            - aborted_tools
            - aborted
            - shutdown
            - run_hard_timeout
            - interrupted
        turns:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        reasoning_tokens:
          type: integer
          format: int64
        abort_code:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        last_tool_name:
          type: string
          nullable: true
        last_tool_pending:
          type: boolean
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
    AgentSession:
      type: object
      required:
        - id
        - profile_id
        - profile_key
        - title
        - created_by
        - running
        - active_run
        - last_run
        - created_at
        - updated_at
        - last_activity_at
      properties:
        id:
          type: integer
          format: int64
        profile_id:
          type: integer
          format: int64
        profile_key:
          type: string
        title:
          type: string
          maxLength: 120
        created_by:
          type: integer
          format: int64
          nullable: true
        running:
          type: boolean
        active_run:
          description: The running run, or null when the session is idle.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AgentRun'
        last_run:
          description: The newest terminal run, or null before the first run finishes.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AgentRun'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
    AgentSessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentSession'
    AgentSessionList:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, has_more, next_cursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AgentSession'
            has_more:
              type: boolean
            next_cursor:
              type: string
              nullable: true
              description: Opaque cursor of the last returned id; null on the last page.
    SendMessageRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
          description: |
            User message. Leading and trailing whitespace is trimmed; an empty
            or whitespace-only value is 422. The message is persisted in full;
            activity events carry at most a 4096-character preview.
    AgentSendMessageResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [run_id, status]
          properties:
            run_id:
              type: integer
              format: int64
            status:
              type: string
              enum: [accepted]
    AgentStopResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [stopping, idle]
              description: '`stopping` when a live run was cancelled; `idle` when none was active.'
    AgentMessageDetail:
      type: object
      description: |
        The complete stored message. Activity events carry only previews; this
        endpoint is the authoritative source for text, reasoning, tool calls,
        tool results and usage.
      required:
        - id
        - session_id
        - run_id
        - role
        - content
        - reasoning
        - tool_calls
        - tool_call_id
        - tool_name
        - usage
        - created_at
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        run_id:
          type: integer
          format: int64
          nullable: true
        role:
          type: string
          enum: [user, assistant, tool]
        content:
          type: array
          description: Always a list. Text parts carry `text`; image parts carry `image_url`.
          items:
            type: object
            required: [type]
            additionalProperties: false
            properties:
              type:
                type: string
                enum: [text, image_url]
              text:
                type: string
              image_url:
                type: string
        reasoning:
          type: string
        tool_calls:
          type: array
          nullable: true
          items:
            type: object
            required: [id, name, arguments]
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
              arguments:
                type: string
                description: Raw JSON arguments as returned by the model.
        tool_call_id:
          type: string
          nullable: true
        tool_name:
          type: string
          nullable: true
        usage:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Usage'
        created_at:
          type: string
          format: date-time
    AgentMessageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentMessageDetail'
    AgentActivityUsage:
      type: object
      description: Accumulated run usage inside a `run_finished` activity.
      required: [prompt, completion, reasoning, total]
      properties:
        prompt:
          type: integer
          format: int64
        completion:
          type: integer
          format: int64
        reasoning:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    AgentActivityDetail:
      type: object
      description: |
        Frozen V1 `detail` object of an `agent.activity` event (design spec
        §9.2). Every object carries `kind` and `run_id`; the remaining fields
        depend on the kind:

        | kind | emitted when | kind-specific fields |
        |---|---|---|
        | `run_started` | a run begins | `profile_key, model, thinking, reasoning_effort, max_output_tokens, max_turns, run_seconds` |
        | `user_message` | the user message is stored | `message_id, text, truncated` |
        | `thinking` | a continuous reasoning segment | `message_id, part, final, text, truncated` |
        | `text` | a continuous answer segment | `message_id, part, final, text, truncated` |
        | `tool_use` | before a tool call | `call_id, tool, args, args_truncated` |
        | `tool_result` | after a tool returns | `call_id, tool, status, duration_ms, result, result_truncated, error_code, message_id` |
        | `usage` | each model turn reports usage | `turn, prompt_tokens, completion_tokens, reasoning_tokens, total_tokens` |
        | `decision` | budget, truncation or denial | `decision, reason` plus optional counts |
        | `run_finished` | terminal run state | `status, terminal_reason, turns, duration_ms, usage`, optional `abort_code, error_code, last_tool_name, last_tool_pending` |

        Activity events are published in run order on `agent:{session_id}` with
        `agent_role` set to the profile key. Thinking/text chunks flush every
        1500 ms or 1024 characters (`final=false`) and close with a
        `final=true` chunk; join chunks by `(message_id, part)` and fetch the
        authoritative text from the message-detail endpoint.
      required: [kind, run_id]
      properties:
        kind:
          type: string
          enum:
            - run_started
            - user_message
            - thinking
            - text
            - tool_use
            - tool_result
            - usage
            - decision
            - run_finished
        run_id:
          type: integer
          format: int64
        profile_key:
          type: string
        model:
          type: string
        thinking:
          type: string
        reasoning_effort:
          type: string
        max_output_tokens:
          type: integer
        max_turns:
          type: integer
        run_seconds:
          type: integer
        message_id:
          type: integer
          format: int64
        text:
          type: string
          description: Preview or chunk, at most 4096 characters (`user_message` also truncates to fit).
        truncated:
          type: boolean
        part:
          type: integer
          minimum: 0
        final:
          type: boolean
        call_id:
          type: string
        tool:
          type: string
        args:
          type: string
          description: Preview of the tool arguments, at most 2048 bytes.
        args_truncated:
          type: boolean
        status:
          type: string
          description: Tool status (`ok`, `error`, `timeout`, `cancelled`, `denied`) or terminal run status for `run_finished`.
        duration_ms:
          type: integer
          format: int64
        result:
          type: string
          description: Preview of the tool result, at most 2048 bytes.
        result_truncated:
          type: boolean
        error_code:
          type: string
        turn:
          type: integer
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        reasoning_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        decision:
          type: string
          enum: [context_truncated, budget_stop, tool_denied]
        reason:
          type: string
        turns:
          type: integer
        usage:
          $ref: '#/components/schemas/AgentActivityUsage'
        abort_code:
          type: string
        terminal_reason:
          type: string
          enum:
            - completed
            - max_turns
            - timeout
            - model_error
            - context_overflow
            - aborted_streaming
            - aborted_tools
            - aborted
            - shutdown
            - run_hard_timeout
            - interrupted
        last_tool_name:
          type: string
        last_tool_pending:
          type: boolean
        dropped:
          type: integer
        elapsed_ms:
          type: integer
          format: int64
      additionalProperties: true
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    HealthEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, version, commit, db, llm_configured]
          properties:
            status:
              type: string
              enum: [ok, unavailable]
            version:
              type: string
            commit:
              type: string
            db:
              type: string
              enum: [ok, down]
            llm_configured:
              type: boolean
    # --- P2 resource context ---------------------------------------------
    System:
      type: object
      description: |
        A target application under test. Every P2 resource belongs to the
        seeded default company. `key` is immutable after creation and matches
        `^[a-z0-9][a-z0-9_-]{1,63}$`.
      required:
        - id
        - key
        - name
        - kind
        - baseUrl
        - defaultSessionTtlSeconds
        - notes
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        name:
          type: string
        kind:
          type: string
          enum: [web, api]
        baseUrl:
          type: string
          format: uri
        defaultSessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          description: Default session lifetime; an Access TTL overrides it.
        notes:
          type: string
        status:
          type: string
          enum: [active, disabled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SystemEnvelope:
      type: object
      required: [data]
