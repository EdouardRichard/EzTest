                $ref: '#/components/schemas/ClarificationDecisionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/decisions/{did}:
    patch:
      tags: [versions]
      summary: Accept or reject a proposed decision
      description: |
        Only a `proposed` decision can transition (to `accepted` or `rejected`
        with an optional rejection `rationale`); accepted/rejected are terminal
        and a second change returns 409 `decision_state_conflict`. Accepting a
        decision linked to an open question answers that question in the same
        transaction.
      operationId: updateDecision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/DecisionPathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDecisionRequest'
      responses:
        '200':
          description: The decided record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationDecisionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/VersionInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/events:
    get:
      tags: [versions]
      summary: Snapshot the newest events of a version channel
      description: |
        Returns the newest persisted events before `before_seq` plus the
        channel's current `snapshot_cursor`. Unlike the P0 snapshot, the P3
        response is flat: `{"data":[...], "snapshot_cursor", "has_more"}`.
        Events are the same V1 envelope used by `/api/stream[/events]`, with
        `channel=version:{id}` and a decimal-string `version_id`.
      operationId: getVersionEventSnapshot
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BeforeSeq'
      responses:
        '200':
          description: The version event snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionEventSnapshot'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/stream:
    get:
      tags: [versions, stream]
      summary: Stream version events as Server-Sent Events
      description: |
        Opens the SSE stream for the fixed `channel=version:{id}`. The version
        must exist (404 `not_found`); a client-supplied `?channel=` is ignored so
        the channel cannot be overridden. `Last-Event-ID` (reset automatically
        by browsers on reconnect) takes precedence over `?since`; omit both for
        live-only. Frames use `id: <seq>`, `event: <type>` and
        `data: <event envelope>`; the server sends a `: ping` comment every 20
        seconds. When the cursor is too old the server emits a synthetic
        `stream.reset` frame (no id) and the client must fetch a fresh
        `/events` snapshot. Duplicate seqs are never delivered.
      operationId: streamVersionEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/VersionPathId'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          description: |
            An endless `text/event-stream`. The `X-Snapshot-Cursor` response
            header announces the version channel's current seq at connect time.
          headers:
            X-Snapshot-Cursor:
              description: The version channel's latest seq when the stream opened.
              schema:
                type: integer
                format: int64
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 42
                event: clarification.question_updated
                data: {"seq":42,"channel":"version:1844674407370955161","type":"clarification.question_updated","version_id":"1844674407370955161","batch_id":null,"case_id":null,"step_id":null,"agent_role":null,"session_id":"1844674407370955162","ts":"2026-10-27T08:00:00Z","summary":"clarification question updated","detail":{"questionId":"1844674407370955163","status":"open"},"refs":{"evidence":[],"case":[],"requirement":[],"code":[]}}

                : ping
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/changes:
    get:
      tags: [code]
      summary: Read a version-scoped change preview
      description: |
        Every authenticated user. Resolves the version's repository and baseline
        commit, computes the live diff to `head` (default: the repository fixed
        branch tip) and returns the shared `ChangeList` inside the normal
        `{"data":...}` envelope. The read never writes a change set: when no
        persisted change set exists for the pair, `changeSetId` is null.
      operationId: getVersionCodeChanges
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - name: head
          in: query
          required: false
          description: Head 40-hex commit; omitted/empty resolves the fixed branch tip.
          schema:
            type: string
      responses:
        '200':
          description: The version change preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/analyses:
    post:
      tags: [code]
      summary: Trigger or reuse a version impact analysis
      description: |
        Every authenticated user. The request body is `{headCommit?, force?}`.
        A new run returns 202 with `reused=false`; an identical completed run
        (same version/base/head/model/prompt and fact-version snapshot, without
        `force`) returns 200 `reused=true` and the existing id. `force=true`
        creates `analysisVersion+1` and never overwrites the old analysis. A
        queued/running analysis for the same version is 409
        `analysis_in_progress`; a full worker queue is 429
        `analysis_queue_full` (retryable). The analysis itself is asynchronous;
        poll `/analyses/{analysisId}` or `/analyses/latest`.
      operationId: startVersionCodeAnalysis
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAnalysisRequest'
            example:
              headCommit: '89abcdef0123456789abcdef0123456789abcdef'
              force: false
      responses:
        '202':
          description: A new analysis run was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAnalysisResultEnvelope'
              example:
                data:
                  id: '1844674407370955162'
                  status: queued
                  analysisVersion: 1
                  reused: false
        '200':
          description: An identical analysis was reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAnalysisResultEnvelope'
              example:
                data:
                  id: '1844674407370955162'
                  status: done
                  analysisVersion: 1
                  reused: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CodeConflict'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '429':
          $ref: '#/components/responses/CodeQueueFull'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/analyses/latest:
    get:
      tags: [code]
      summary: Read the latest impact analysis of a version
      description: |
        Every authenticated user. Returns the newest analysis with its
        candidates, unmapped changes, fact-version snapshot and stats. 404
        `analysis_not_found` before the first analysis.
      operationId: getLatestVersionCodeAnalysis
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
      responses:
        '200':
          description: The latest analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/analyses/{analysisId}:
    get:
      tags: [code]
      summary: Read one impact analysis of a version
      description: |
        Every authenticated user. An analysis of another version is 404
        `analysis_not_found`. The response includes `changeSummary`, stats,
        `factVersions`, candidates, unmapped changes and non-fatal errors.
      operationId: getVersionCodeAnalysis
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - $ref: '#/components/parameters/CodeAnalysisId'
      responses:
        '200':
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisEnvelope'
              example:
                data:
                  id: '1844674407370955162'
                  versionId: '1844674407370955161'
                  repoId: 3
                  baseCommit: '0123456789abcdef0123456789abcdef01234567'
                  headCommit: '89abcdef0123456789abcdef0123456789abcdef'
                  status: done
                  degraded: false
                  analysisVersion: 1
                  model: example-model
                  promptVersion: p4.1
                  changeSetId: '1844674407370955163'
                  changeSummary: Example change summary.
                  stats:
                    changedFiles: 2
                    analyzedFiles: 2
                    cacheHits: 0
                    facts: 4
                    edges: 1
                    contracts: 1
                    evidenceChecks: 6
                    evidenceFailures: 0
                    unmapped: 1
                    invalidFacts: 0
                    duplicateFacts: 0
                    unmatchedContracts: 0
                    truncated: false
                  factVersions:
                    - factKey: 'api:POST /api/example'
                      version: 1
                  candidates:
                    - id: '1844674407370955164'
                      subjectKind: requirement
                      subjectId: '1844674407370955165'
                      reason: changed file src/example.ts
                      confidence: high
                      source: direct
                      evidence:
                        - file: src/example.ts
                      selected: true
                  unmapped:
                    - path: docs/example.md
                      status: M
                      reason: no_fact_or_anchor
                      suggestion: Confirm the impact manually.
                  errors: []
                  createdBy: 1
                  createdAt: '2026-10-28T01:00:00Z'
                  startedAt: '2026-10-28T01:00:01Z'
                  finishedAt: '2026-10-28T01:00:20Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/analyses/{analysisId}/candidates/{candidateId}:
    patch:
      tags: [code]
      summary: Adjust one impact candidate's manual selection
      description: |
        Every authenticated user. Body `{selected: bool}`. Only a completed
        analysis can be adjusted; a queued/running analysis is 409
        `analysis_not_done`. The response is the updated candidate. The change
        is persisted but does not alter the analysis status.
      operationId: patchVersionCodeAnalysisCandidate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - $ref: '#/components/parameters/CodeAnalysisId'
        - $ref: '#/components/parameters/CodeCandidateId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCandidateRequest'
            example:
              selected: true
      responses:
        '200':
          description: The updated candidate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '409':
          $ref: '#/components/responses/CodeConflict'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/anchors:
    get:
      tags: [code]
      summary: List the code anchors of a version
      description: |
        Every authenticated user. Optional `subjectKind`/`subjectId` exact
        filters. The response is the normal `{"data":[...]}` envelope (no
        pagination); anchor ids and subject ids are decimal strings.
      operationId: listVersionCodeAnchors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - name: subjectKind
          in: query
          required: false
          description: Exact subject kind filter.
          schema:
            $ref: '#/components/schemas/AnchorSubjectKind'
        - name: subjectId
          in: query
          required: false
          description: Exact decimal-string subject id filter.
          schema:
            type: string
            pattern: '^[0-9]{1,19}$'
      responses:
        '200':
          description: The anchors of the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [code]
      summary: Create a code anchor
      description: |
        Every authenticated user. P4 accepts `requirement`, `app_model` and
        `version` subjects; `case`/`issue` are 422 `unsupported_subject_kind`.
        The requirement must belong to the version and an app-model subject
        requires the version's system binding. The file must exist at the fixed
        branch tip. A duplicate subject/file/line-range anchor is 409
        `anchor_duplicate`. Returns 201 with the created anchor.
      operationId: createVersionCodeAnchor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnchorRequest'
            example:
              subjectKind: requirement
              subjectId: '1844674407370955165'
              filePath: src/example.ts
              startLine: 10
              endLine: 12
      responses:
        '201':
          description: The created anchor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CodeConflict'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{versionId}/code/anchors/{anchorId}:
    delete:
      tags: [code]
      summary: Delete a code anchor
      description: |
        Every authenticated user. The anchor must belong to the version; an
        unknown/other-version anchor is 404 `anchor_not_found`. Returns 204.
      operationId: deleteVersionCodeAnchor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CodeVersionId'
        - $ref: '#/components/parameters/CodeAnchorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The anchor was deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: Always 200 while the process can serve requests; never touches the database.
      operationId: liveness
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /api/health:
    get:
      tags: [health]
      summary: Readiness probe
      description: |
        Pings the database with a 2 second timeout. `llm_configured` is true
        only when a default LLM configuration exists and its key can be
        decrypted. Database failure returns 503 with `status: unavailable` and
        `db: down`.
      operationId: readiness
      security: []
      responses:
        '200':
          description: The service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          description: The database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /api/openapi.yaml:
    get:
      tags: [health]
      summary: The public OpenAPI document
      description: Serves the hand-maintained YAML document; a missing file is 404.
      operationId: getOpenAPIDocument
      security: []
      responses:
        '200':
          description: The OpenAPI 3.0 document.
          content:
            application/yaml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Opaque session token returned once by `POST /api/auth/login`. Send it as
        `Authorization: Bearer <token>`. The server stores only its SHA-256 hash;
        logout and password resets revoke it.
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Optional client request ID matching `^[A-Za-z0-9_-]{8,128}$`. Invalid
        values are replaced with a UUID; the response always echoes the chosen
        value in `X-Request-ID` and in every error envelope.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,128}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Opts an authenticated write into 24 hour idempotent replay. Same key
        and body replay the stored response with `Idempotent-Replayed: true`;
        same key and a different body is 409 `idempotency_conflict`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,128}$'
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1-100. Defaults to 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque id cursor from the previous page; do not parse it.
      schema:
        type: string
    BeforeSeq:
      name: before_seq
      in: query
      required: false
      description: Return events with a sequence lower than this cursor. Omit (or 0) for the latest events.
      schema:
        type: integer
        format: int64
        minimum: 0
    Channel:
      name: channel
      in: query
      required: true
      description: |
        Channel name, 1-64 characters. P0 uses `system`; each P1 Agent session
        uses `agent:{session_id}`. Channels starting with `agent:` are
        administrator-only (403 `forbidden` for regular users).
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Since:
      name: since
      in: query
      required: false
      description: Replay events after this seq when `Last-Event-ID` is absent. Omit for live-only.
      schema:
        type: integer
        format: int64
        minimum: 0
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: Reconnect cursor. Takes precedence over `?since`.
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      description: User ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    LLMConfigId:
      name: id
      in: path
      required: true
      description: LLM configuration ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    SHA256:
      name: sha256
      in: path
      required: true
      description: Lowercase hex SHA-256 object id.
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    AgentProfileId:
      name: id
      in: path
      required: true
      description: Agent profile ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    AgentProfileFilter:
      name: profile_id
      in: query
      required: false
      description: Optional exact Agent profile filter for the session list.
      schema:
        type: integer
        format: int64
        minimum: 1
    AgentSessionId:
      name: id
      in: path
      required: true
      description: Agent session ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    AgentMessageId:
      name: message_id
      in: path
      required: true
      description: Message ID; it must belong to the session in the path.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceSystemId:
      name: id
      in: path
      required: true
      description: System ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceEnvironmentId:
      name: id
      in: path
      required: true
      description: Environment ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceAppModelId:
      name: id
      in: path
      required: true
      description: App model node ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceAccountId:
      name: id
      in: path
      required: true
      description: Account ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceAccessId:
      name: id
      in: path
      required: true
      description: Access ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceSessionId:
      name: id
      in: path
      required: true
      description: Session ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceTakeoverId:
      name: id
      in: path
      required: true
      description: Manual takeover ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceCodeRepoId:
      name: id
      in: path
      required: true
      description: Code repository ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    VersionPathId:
      name: id
      in: path
      required: true
      description: |
        Version ID: a 64-bit snowflake serialized as a decimal string. Never
        parse it into a JavaScript number.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    RequirementPathId:
      name: rid
      in: path
      required: true
      description: Requirement ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    RelationPathId:
      name: relId
      in: path
      required: true
      description: Requirement relation ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    AttachmentPathId:
      name: aid
      in: path
      required: true
      description: Attachment ID (snowflake decimal string) belonging to the requirement.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    ClarificationSessionPathId:
      name: sid
      in: path
      required: true
      description: Clarification session ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    QuestionPathId:
      name: qid
      in: path
      required: true
      description: Clarification question ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    DecisionPathId:
      name: did
      in: path
      required: true
      description: Decision ID (snowflake decimal string) belonging to the version.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    VersionStatusFilter:
      name: status
      in: query
      required: false
      description: Optional exact version status filter.
      schema:
        $ref: '#/components/schemas/VersionStatus'
    RequirementStatusFilter:
      name: status
      in: query
      required: false
      description: Optional exact requirement status filter.
      schema:
        $ref: '#/components/schemas/RequirementStatus'
    QuestionStatusFilter:
      name: status
      in: query
      required: false
      description: Optional exact question status filter.
      schema:
        $ref: '#/components/schemas/ClarificationQuestionStatus'
    DecisionStatusFilter:
      name: status
      in: query
      required: false
      description: Optional exact decision status filter.
      schema:
        $ref: '#/components/schemas/ClarificationDecisionStatus'
    QuestionRequirementFilter:
      name: requirementId
      in: query
      required: false
      description: Optional requirement ID filter (P3 snowflake decimal string).
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    BeforeId:
      name: before_id
      in: query
      required: false
      description: |
        Return clarification messages with an ID lower than this P1 message ID
        (an integer). Pass the integer value encoded by the previous page's
        `ClarificationMessagePage.next_cursor` decimal string.
      schema:
        type: integer
        format: int64
        minimum: 1
    CodeRepoId:
      name: repoId
      in: path
      required: true
      description: P2 code repository id (a number, unlike codeintel-owned ids).
      schema:
        type: integer
        format: int64
        minimum: 1
    CodeVersionId:
      name: versionId
      in: path
      required: true
      description: P3 version id serialized as a decimal string.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    CodeIndexRunId:
      name: runId
      in: path
      required: true
      description: Codeintel index-run id serialized as a decimal string.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    CodeAnalysisId:
      name: analysisId
      in: path
      required: true
      description: Codeintel analysis id serialized as a decimal string.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    CodeCandidateId:
      name: candidateId
      in: path
      required: true
      description: Codeintel impact-candidate id serialized as a decimal string.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    CodeAnchorId:
      name: anchorId
      in: path
      required: true
      description: Codeintel anchor id serialized as a decimal string.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
    CodeCommitSha:
      name: sha
      in: path
      required: true
      description: Lowercase 40-hex commit SHA-1.
      schema:
        type: string
        pattern: '^[a-f0-9]{40}$'
  responses:
    InvalidArgument:
      description: Invalid input (`invalid_argument` or `idempotency_conflict` for a reused key with a different body).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Missing, malformed, expired or revoked bearer token (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not an administrator (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentChannelForbidden:
      description: |
        Authenticated but not an administrator (`forbidden`). Channels starting
        with `agent:` are administrator-only; the P0 `system` channel remains
        available to every authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The requested resource is absent (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: |
        State conflict such as a duplicate username, a protected administrator
        (`conflict`), an Agent session that already has a running run
        (`details.reason=run_active`) or a disabled Agent profile
        (`details.reason=profile_disabled`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: The upload exceeds 10 MiB (`invalid_argument`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: |
        A semantically invalid field (`invalid_argument`). `details.field`
        names the rejected Agent profile, session or message field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Login lockout or upstream LLM rate limiting (`rate_limited` / `llm_rate_limited`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: Unexpected server failure (`internal` or `storage_corrupted`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadGateway:
      description: Upstream LLM authentication, 5xx or invalid response (`llm_auth_failed`, `llm_upstream_error`, `llm_invalid_response`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: |
        Service temporarily unavailable. Agent requests use `unavailable` with
        `details.reason` set to `llm_not_configured` (no usable default LLM
        configuration), `tools_require_chat_completions` (the default
        configuration uses the `responses` protocol) or `capacity` (all global
        run slots are busy; `retryable: true`). The readiness probe also
        returns 503 when the database is down.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayTimeout:
      description: The upstream LLM call exceeded the configured timeout (`llm_timeout`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResourceInvalid:
      description: |
        A semantically invalid resource request (`invalid_argument`).
        `details.field` names the rejected field and `details.reason` is one of
        `invalid_key`, `invalid_kind`, `invalid_status`, `invalid_base_url`,
        `invalid_login_check`, `invalid_allowed_hosts`, `invalid_json`,
        `body_too_large`, `invalid_limit`, `invalid_cursor`, `invalid_id`,
        `invalid_storage_state`, `storage_state_expired`, `invalid_branch`,
        `invalid_glob`, `path_not_found`, `path_not_git_repo` or
        `branch_not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResourceConflict:
      description: |
        A resource conflict (`conflict`) with `details.reason` one of
        `duplicate_key` (a unique key is already in use), `has_dependencies`
        (the object still has dependents), `session_state_conflict` (the
        session state does not allow the action) or `takeover_not_waiting`
        (the takeover is not waiting).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    VersionConflict:
      description: |
        A P3 state or optimistic-lock conflict (`conflict`). `details.reason` is
        one of `version_state_conflict` (the version status does not allow the
        action), `requirement_state_conflict` (the requirement is not editable),
        `open_questions_remaining` (confirming a requirement with open
        questions), `unclarified_requirements` (entering design without
        `acknowledgeUnclarified`; details add `unclarifiedRequirementIds` and
        `openQuestionCount`), `duplicate_relation`, `duplicate_attachment`
        (same requirement and sha256), `revision_conflict`,
        `clarification_session_active`, `clarification_session_not_active`,
        `clarification_session_required` (analyze/recon without an active
        session), `clarification_question_state_conflict`,
        `decision_state_conflict` or `agent_busy` (a run is already active on
        the version channel). `details.field` is set when a request field is at
        fault and `details.message` is always human-readable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    VersionInvalid:
      description: |
        A semantically invalid P3 request (`invalid_argument`, HTTP 422).
        `details.reason` is one of `requirements_required` (start clarification
        without requirements), `relation_requirement_mismatch` (relation
        endpoints from different versions), `attachment_too_large`,
        `attachment_limit_exceeded`, `unsupported_attachment_type`,
        `invalid_attachment_content`, `system_not_found`, `system_disabled`,
        `environment_not_found`, `environment_system_mismatch`,
        `code_repository_not_found`, `code_repository_disabled`,
        `branch_not_found`, `path_not_found`, `path_not_git_repo` or
        `resource_unavailable` (a bound P2 resource was deleted). Field-level
        validation may instead use reasons such as `invalid_name`, `invalid_title`,
        `invalid_priority`, `invalid_status`, `invalid_message`, `invalid_answer`,
        `invalid_relation_type`, `invalid_commit` or `invalid_context_summary`
        (the latter carries `field=summary` and is emitted by the
        `context.summary_update` tool for a summary over 20 KiB), always with
        `details.field` and `details.message`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    VersionUnavailable:
      description: |
        An AI-dependent endpoint could not start (`unavailable`, HTTP 503)
        because the Agent/LLM runtime is not configured or unavailable.
        `details.reason` is `ai_unavailable` and `retryable` is true; manual
        version, requirement, question, decision, relation and confirmation
        endpoints keep working.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CodeInvalid:
      description: |
        A semantically invalid P4 code request (`invalid_argument`, HTTP 422).
        `details.reason` is one of `code_repository_not_bound`,
        `code_repository_not_found`, `code_repository_disabled`,
        `baseline_commit_missing`, `invalid_head`, `commit_not_found`,
        `path_not_found`, `path_not_file`, `path_escape`, `not_changed`,
        `unsupported_content`, `unsupported_subject_kind`,
        `subject_not_in_version`, `app_model_not_found`, `invalid_id`, plus the
        transport-level `invalid_request`, `invalid_limit`, `invalid_cursor`,
        `invalid_line`, `invalid_line_range`, `invalid_json` and
        `body_too_large` (HTTP 400/422).
        `details.field` names the rejected field. Messages never echo code
        content or repository-internal paths.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CodeConflict:
      description: |
        A P4 state conflict (`conflict`, HTTP 409). `details.reason` is one of
        `index_in_progress` (the repository already has a queued/running index),
        `analysis_in_progress` (the version already has a queued/running
        analysis), `analysis_not_done` (adjusting a candidate before the
        analysis completed) or `anchor_duplicate` (same subject/file/line range).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CodeNotFound:
      description: |
        A P4 object is absent (`not_found`, HTTP 404). `details.reason` is one of
        `index_run_not_found`, `analysis_not_found`, `candidate_not_found` or
        `anchor_not_found`. A missing P3 version or P2 repository on a
        version-scoped route stays a plain `not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CodeQueueFull:
      description: |
        The bounded analysis worker queue is full (`rate_limited`, HTTP 429).
        `details.reason=analysis_queue_full` and `retryable` is true.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CodeGitUnavailable:
      description: |
        The Git repository is temporarily unreadable or a Git command timed out
        (`unavailable`, HTTP 503). `details.reason=git_unavailable` and
        `retryable` is true; no Git output, internal path or code content is
        echoed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              type: string
              enum:
                - invalid_argument
                - unauthenticated
                - forbidden
                - not_found
                - conflict
                - idempotency_conflict
                - rate_limited
                - internal
                - unavailable
                - storage_corrupted
                - llm_not_configured
                - llm_auth_failed
                - llm_rate_limited
                - llm_bad_request
                - llm_upstream_error
                - llm_timeout
                - llm_invalid_response
            message:
              type: string
            request_id:
              type: string
              description: Echoes `X-Request-ID`; always present when the request reached the middleware chain.
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
              description: |
                Non-sensitive structured details; `{}` when absent. LLM errors
                may include `upstream_status`. Agent errors may include
                `reason` (`run_active`, `profile_disabled`,
                `llm_not_configured`, `tools_require_chat_completions`,
                `capacity`) or `field` (the rejected request field). P3 version
                errors carry `reason` from the tables documented by
                VersionConflict, VersionInvalid and VersionUnavailable, plus
                `field`/`message` when applicable. P4 code errors carry `reason`
                from CodeErrorReason, plus `field`/`message` when applicable.
    User:
      type: object
      required: [id, username, role, status]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          pattern: '^[a-zA-Z0-9_.-]{3,64}$'
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CreateUserRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9_.-]{3,64}$'
        password:
          type: string
          minLength: 10
          maxLength: 128
    UpdateUserRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [active, disabled]
    ResetPasswordRequest:
      type: object
      required: [new_password]
      additionalProperties: false
      properties:
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, expires_at, user]
          properties:
            token:
              type: string
              description: Raw opaque bearer token; returned exactly once.
            expires_at:
              type: string
              format: date-time
            user:
              $ref: '#/components/schemas/User'
    ModelInfo:
      type: object
      required: [id]
      properties:
        id:
          type: string
        context_window:
          type: integer
          format: int64
          nullable: true
        max_output_tokens:
          type: integer
          format: int64
          nullable: true
        input_modalities:
          type: array
          items:
            type: string
          description: Missing upstream fields are omitted rather than guessed.
    LLMConfig:
      type: object
      required:
        - id
        - name
        - protocol
        - base_url
        - model
        - has_api_key
        - key_version
        - header_names
        - retry_count
        - retry_interval_ms
        - timeout_ms
        - stream_enabled
        - multimodal_enabled
        - is_default
        - model_catalog
        - catalog_fetched_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        protocol:
          type: string
          enum: [chat_completions, responses]
        base_url:
          type: string
          format: uri
        model:
          type: string
        has_api_key:
          type: boolean
        key_version:
          type: integer
        header_names:
          type: array
          items:
            type: string
          description: Sorted custom header names. Header values are never returned.
        retry_count:
          type: integer
          minimum: 0
          maximum: 5
        retry_interval_ms:
          type: integer
          minimum: 100
          maximum: 30000
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
        stream_enabled:
          type: boolean
        multimodal_enabled:
          type: boolean
        is_default:
          type: boolean
        model_catalog:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
        catalog_fetched_at:
          type: string
          format: date-time
          nullable: true
    LLMConfigEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/LLMConfig'
    LLMConfigList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LLMConfig'
    CreateLLMConfigRequest:
      type: object
      required: [name, protocol, base_url, model]
      properties:
        name:
          type: string
          minLength: 1
        protocol:
          type: string
          enum: [chat_completions, responses]
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
          description: Optional upstream credential; encrypted at rest and never returned.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Optional custom headers; names must not be empty and must not override Authorization or Content-Type.
        retry_count:
          type: integer
          minimum: 0
          maximum: 5
          default: 2
        retry_interval_ms:
          type: integer
          minimum: 100
          maximum: 30000
          default: 500
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
          default: 60000
        stream_enabled:
          type: boolean
          default: true
        multimodal_enabled:
          type: boolean
          default: true
        is_default:
          type: boolean
          default: false
    UpdateLLMConfigRequest:
      type: object
      description: Every field is optional; omitted `api_key` and `headers` keep their stored value.
      properties:
        name:
          type: string
          minLength: 1
        protocol:
          type: string
          enum: [chat_completions, responses]
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        retry_count:
          type: integer
          minimum: 0
          maximum: 5
        retry_interval_ms:
          type: integer
          minimum: 100
          maximum: 30000
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
        stream_enabled:
          type: boolean
        multimodal_enabled:
          type: boolean
        is_default:
          type: boolean
    LLMTestRequest:
      type: object
      properties:
        stream:
          type: boolean
          default: false
          description: Requires `stream_enabled=true`; returns normalized SSE frames.
        prompt:
          type: string
          description: Defaults to a short description prompt when empty.
        image:
          type: boolean
          default: false
          description: Requires `multimodal_enabled=true`; attaches the built-in 1x1 PNG.
    Usage:
      type: object
      description: |
        Token accounting. `reasoning_tokens` is additive in P1: upstream
        providers that do not report it return 0.
      required: [prompt_tokens, completion_tokens, reasoning_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        reasoning_tokens:
          type: integer
          description: Reasoning/thinking tokens reported by the upstream; 0 when absent.
        total_tokens:
          type: integer
    LLMTestResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [text, usage, latency_ms]
          properties:
            text:
              type: string
            usage:
              $ref: '#/components/schemas/Usage'
            latency_ms:
              type: integer
              format: int64
    EventRefs:
      type: object
      required: [evidence, case, requirement, code]
      properties:
        evidence:
          type: array
          items:
            type: string
        case:
          type: array
          items:
            type: string
        requirement:
          type: array
          items:
            type: string
        code:
          type: array
          items:
            type: string
    Event:
      type: object
      required:
        - seq
        - channel
        - type
        - version_id
        - batch_id
        - case_id
        - step_id
        - agent_role
        - session_id
        - ts
        - summary
        - detail
        - refs
      properties:
        seq:
          type: integer
          format: int64
          description: Channel-local monotonic sequence assigned by the store.
        channel:
          type: string
          maxLength: 64
          description: |
            `system` for the P0 platform stream. Each P1 Agent session publishes
            on `agent:{session_id}`; those channels require an administrator.
            P3 version events publish on `version:{id}` and are readable by any
            authenticated user through the version endpoints.
        type:
          type: string
          maxLength: 100
          description: |
            `system.test` for the P0 test publisher; `agent.activity` for every
            P1 Agent activity (frozen V1 contract, see AgentActivityDetail); on
            `version:{id}` channels the P3 catalog documented by VersionEventType
            (including `clarification.context_updated`) and `agent.activity`.
        version_id:
          type: string
          nullable: true
          description: |
            Decimal-string version ID for P3 events and `agent.activity` on a
            version channel; null otherwise.
        batch_id:
          type: string
          nullable: true
        case_id:
          type: string
          nullable: true
        step_id:
          type: string
          nullable: true
        agent_role:
          type: string
          nullable: true
          description: Agent profile key for `agent.activity` events; null otherwise.
        session_id:
          type: string
          nullable: true
          description: Decimal-string session ID for events that reference a P1 Agent session.
        ts:
          type: string
          format: date-time
        summary:
          type: string
          maxLength: 500
        detail:
          type: object
          additionalProperties: true
          description: |
            Up to 64 KiB of valid JSON; `{}` when absent. For `agent.activity`
            this is the frozen V1 detail object described by
            AgentActivityDetail.
        refs:
          $ref: '#/components/schemas/EventRefs'
    EventSnapshot:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, snapshot_cursor, has_more]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Event'
            snapshot_cursor:
              type: integer
              format: int64
              description: The channel's current seq; use it as the SSE `since`/`Last-Event-ID` base.
            has_more:
              type: boolean
    PublishTestEventsRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        summary:
          type: string
          maxLength: 500
        detail:
          type: object
          additionalProperties: true
          description: Optional JSON object up to 64 KiB; defaults to `{}`.
    PublishTestEventsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [seqs]
          properties:
            seqs:
              type: array
              items:
                type: integer
                format: int64
    Object:
      type: object
      required: [sha256, size, content_type]
      properties:
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        size:
          type: integer
          format: int64
        content_type:
          type: string
    ObjectEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Object'
    AuditEntry:
      type: object
      required:
        - id
        - actor_user_id
        - action
        - target_type
        - target_id
        - request_id
        - ip
        - user_agent
        - metadata
        - created_at
      properties:
        id:
          type: integer
          format: int64
        actor_user_id:
          type: integer
          format: int64
          nullable: true
        action:
          type: string
          example: auth.login_succeeded
        target_type:
          type: string
        target_id:
          type: string
        request_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type: string
        has_more:
          type: boolean
    AgentProfile:
      type: object
      description: |
        One Agent configuration. `model` empty means the default LLM
        configuration's model; `max_turns` 0 means unlimited. `key` and
        `builtin` are read-only.
      required:
        - id
        - key
        - name
        - description
        - builtin
        - enabled
        - system_prompt
        - model
        - allowed_tools
        - max_turns
        - run_seconds
        - hard_timeout_seconds
        - thinking
        - reasoning_effort
        - max_output_tokens
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
          pattern: '^[a-z][a-z0-9_-]*$'
          description: Immutable profile key; the builtin profile uses `runtime-diagnostic`.
        name:
          type: string
        description:
          type: string
        builtin:
          type: boolean
          description: Immutable flag for the seeded profile.
        enabled:
          type: boolean
        system_prompt:
          type: string
          minLength: 1
          maxLength: 32768
        model:
          type: string
          description: Model override; empty uses the default LLM configuration's model.
        allowed_tools:
          type: array
          uniqueItems: true
          items:
            type: string
          description: |
            Tool names this profile may call. On PATCH the list must be a subset
            of the tools currently registered by `GET /api/agents/tools`;
            otherwise the request is 422. That subset check is not re-applied to
            a stored profile, so the seeded `runtime-diagnostic` profile may list
            tools that are currently unregistered (for example `file.list` and
            `file.read` when `EZTEST_AGENT_FILE_ROOT` is empty) and those calls
            are rejected at run time.
        max_turns:
          type: integer
          minimum: 0
          maximum: 100
          description: 0 means unlimited.
        run_seconds:
          type: integer
          minimum: 30
          maximum: 3600
        hard_timeout_seconds:
          type: integer
          minimum: 5
          maximum: 300
        thinking:
          type: string
          enum: [auto, enabled, disabled]
        reasoning_effort:
          type: string
          enum: ["", none, low, high, max]
          description: Must be empty or `none` when `thinking=disabled`.
        max_output_tokens:
          type: integer
          minimum: 1024
          maximum: 131072
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentProfileEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentProfile'
    AgentProfileList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentProfile'
    AgentProfilePatch:
      type: object
      description: |
        Partial update. Omitted fields keep their stored value. `key` and
        `builtin` are not present here, so sending them is rejected as an
        unknown field.
      additionalProperties: false
      properties:
        system_prompt:
          type: string
          minLength: 1
          maxLength: 32768
        model:
          type: string
        allowed_tools:
          type: array
          uniqueItems: true
          items:
            type: string
        max_turns:
          type: integer
          minimum: 0
          maximum: 100
        run_seconds:
          type: integer
          minimum: 30
          maximum: 3600
        hard_timeout_seconds:
          type: integer
          minimum: 5
          maximum: 300
        thinking:
          type: string
          enum: [auto, enabled, disabled]
        reasoning_effort:
          type: string
          enum: ["", none, low, high, max]
        max_output_tokens:
          type: integer
          minimum: 1024
          maximum: 131072
        enabled:
          type: boolean
    AgentTool:
      type: object
      required: [name, description, schema]
      properties:
        name:
          type: string
          example: file.read
        description:
          type: string
        schema:
          type: object
          additionalProperties: true
          description: JSON Schema object for the tool's arguments.
    AgentToolList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentTool'
    AgentRun:
      type: object
      description: |
        One run with accumulated usage. `terminal_reason`, `abort_code`,
        `error_code`, `last_tool_name` and `ended_at` are null while they do not
        apply.
      required:
        - id
        - session_id
        - status
        - terminal_reason
        - turns
        - input_tokens
        - output_tokens
        - reasoning_tokens
        - abort_code
        - error_code
        - last_tool_name
        - last_tool_pending
        - started_at
        - ended_at
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [running, done, failed, aborted, interrupted]
        terminal_reason:
          type: string
          nullable: true
          enum:
            - completed
            - max_turns
            - timeout
            - model_error
            - context_overflow
            - aborted_streaming
            - aborted_tools
            - aborted
            - shutdown
            - run_hard_timeout
            - interrupted
        turns:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        reasoning_tokens:
          type: integer
          format: int64
        abort_code:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        last_tool_name:
          type: string
          nullable: true
        last_tool_pending:
          type: boolean
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
    AgentSession:
      type: object
      required:
        - id
        - profile_id
        - profile_key
        - title
        - created_by
        - running
        - active_run
        - last_run
        - created_at
        - updated_at
        - last_activity_at
      properties:
        id:
          type: integer
          format: int64
        profile_id:
          type: integer
          format: int64
        profile_key:
          type: string
        title:
          type: string
          maxLength: 120
        created_by:
          type: integer
          format: int64
          nullable: true
        running:
          type: boolean
        active_run:
          description: The running run, or null when the session is idle.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AgentRun'
        last_run:
          description: The newest terminal run, or null before the first run finishes.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AgentRun'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
    AgentSessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentSession'
    AgentSessionList:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, has_more, next_cursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AgentSession'
            has_more:
              type: boolean
            next_cursor:
              type: string
              nullable: true
              description: Opaque cursor of the last returned id; null on the last page.
    SendMessageRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
          description: |
            User message. Leading and trailing whitespace is trimmed; an empty
            or whitespace-only value is 422. The message is persisted in full;
            activity events carry at most a 4096-character preview.
    AgentSendMessageResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [run_id, status]
          properties:
            run_id:
              type: integer
              format: int64
            status:
              type: string
              enum: [accepted]
    AgentStopResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [stopping, idle]
              description: '`stopping` when a live run was cancelled; `idle` when none was active.'
    AgentMessageDetail:
      type: object
      description: |
        The complete stored message. Activity events carry only previews; this
        endpoint is the authoritative source for text, reasoning, tool calls,
        tool results and usage.
      required:
        - id
        - session_id
        - run_id
        - role
        - content
        - reasoning
        - tool_calls
        - tool_call_id
        - tool_name
        - usage
        - created_at
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        run_id:
          type: integer
          format: int64
          nullable: true
        role:
          type: string
          enum: [user, assistant, tool]
        content:
          type: array
          description: Always a list. Text parts carry `text`; image parts carry `image_url`.
          items:
            type: object
            required: [type]
            additionalProperties: false
            properties:
              type:
                type: string
                enum: [text, image_url]
              text:
                type: string
              image_url:
                type: string
        reasoning:
          type: string
        tool_calls:
          type: array
          nullable: true
          items:
            type: object
            required: [id, name, arguments]
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
              arguments:
                type: string
                description: Raw JSON arguments as returned by the model.
        tool_call_id:
          type: string
          nullable: true
        tool_name:
          type: string
          nullable: true
        usage:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Usage'
        created_at:
          type: string
          format: date-time
    AgentMessageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentMessageDetail'
    AgentActivityUsage:
      type: object
      description: Accumulated run usage inside a `run_finished` activity.
      required: [prompt, completion, reasoning, total]
      properties:
        prompt:
          type: integer
          format: int64
        completion:
          type: integer
          format: int64
        reasoning:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    AgentActivityDetail:
      type: object
      description: |
        Frozen V1 `detail` object of an `agent.activity` event (design spec
        §9.2). Every object carries `kind` and `run_id`; the remaining fields
        depend on the kind:

        | kind | emitted when | kind-specific fields |
        |---|---|---|
        | `run_started` | a run begins | `profile_key, model, thinking, reasoning_effort, max_output_tokens, max_turns, run_seconds` |
        | `user_message` | the user message is stored | `message_id, text, truncated` |
        | `thinking` | a continuous reasoning segment | `message_id, part, final, text, truncated` |
        | `text` | a continuous answer segment | `message_id, part, final, text, truncated` |
        | `tool_use` | before a tool call | `call_id, tool, args, args_truncated` |
        | `tool_result` | after a tool returns | `call_id, tool, status, duration_ms, result, result_truncated, error_code, message_id` |
        | `usage` | each model turn reports usage | `turn, prompt_tokens, completion_tokens, reasoning_tokens, total_tokens` |
        | `decision` | budget, truncation or denial | `decision, reason` plus optional counts |
        | `run_finished` | terminal run state | `status, terminal_reason, turns, duration_ms, usage`, optional `abort_code, error_code, last_tool_name, last_tool_pending` |

        Activity events are published in run order on `agent:{session_id}` with
        `agent_role` set to the profile key. Thinking/text chunks flush every
        1500 ms or 1024 characters (`final=false`) and close with a
        `final=true` chunk; join chunks by `(message_id, part)` and fetch the
        authoritative text from the message-detail endpoint.
      required: [kind, run_id]
      properties:
        kind:
          type: string
          enum:
            - run_started
            - user_message
            - thinking
            - text
            - tool_use
            - tool_result
            - usage
            - decision
            - run_finished
        run_id:
          type: integer
          format: int64
        profile_key:
          type: string
        model:
          type: string
        thinking:
          type: string
        reasoning_effort:
          type: string
        max_output_tokens:
          type: integer
        max_turns:
          type: integer
        run_seconds:
          type: integer
        message_id:
          type: integer
          format: int64
        text:
          type: string
          description: Preview or chunk, at most 4096 characters (`user_message` also truncates to fit).
        truncated:
          type: boolean
        part:
          type: integer
          minimum: 0
        final:
          type: boolean
        call_id:
          type: string
        tool:
          type: string
        args:
          type: string
          description: Preview of the tool arguments, at most 2048 bytes.
        args_truncated:
          type: boolean
        status:
          type: string
          description: Tool status (`ok`, `error`, `timeout`, `cancelled`, `denied`) or terminal run status for `run_finished`.
        duration_ms:
          type: integer
          format: int64
        result:
          type: string
          description: Preview of the tool result, at most 2048 bytes.
        result_truncated:
          type: boolean
        error_code:
          type: string
        turn:
          type: integer
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        reasoning_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        decision:
          type: string
          enum: [context_truncated, budget_stop, tool_denied]
        reason:
          type: string
        turns:
          type: integer
        usage:
          $ref: '#/components/schemas/AgentActivityUsage'
        abort_code:
          type: string
        terminal_reason:
          type: string
          enum:
            - completed
            - max_turns
            - timeout
            - model_error
            - context_overflow
            - aborted_streaming
            - aborted_tools
            - aborted
            - shutdown
            - run_hard_timeout
            - interrupted
        last_tool_name:
          type: string
        last_tool_pending:
          type: boolean
        dropped:
          type: integer
        elapsed_ms:
          type: integer
          format: int64
      additionalProperties: true
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    HealthEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, version, commit, db, llm_configured]
          properties:
