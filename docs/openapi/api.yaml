      不再产生系统自动确认修订、不再绕过 Confirm。仅服务 pre-E 历史系统自动确认修订
      （rollbackableCaseVersion 仍要求原修订为 system auto-confirmed discovery_delta）；
      **退役计划 0.3**（历史对象消亡后无 rollback 对象）。`CaseRevisionRollbackView.status`
