      type: object
      description: 0.2.1 版本计划项（spec §6.1 task_plan 落库）
      required: [id, version_id, phase, title, status, order, depends_on, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        version_id:
          type: string
          pattern: '^[0-9]+$'
        phase:
          type: string
        title:
          type: string
        status:
          type: string
        order:
          type: integer
          minimum: 0
          description: 计划项排序值（DB 列 `sort_order`；spec/JSON 逻辑字段为 `order`）
        revision:
          type: integer
          minimum: 1
          description: v0.22 乐观锁版本；PATCH 必须回传读取到的值
        depends_on:
          type: array
          items:
            type: string
            pattern: '^[0-9]+$'
        work_item_id:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        decision:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FactView:
      type: object
      description: |
        0.2.1 版本事实（spec §6.1 findings 落库；append-only，冲突并存）。探索链路已实现的事实 kind：
        `login_session`（payload 只含 `storage_state_ref`/login URL/route/role/credential-free recipe）、
        `page`（`page_key/url/route_template/hash_route/title/query_keys/depth/parent_page_key/children/
        elements[]`，key=`page:env:<env>:<page_key>`）、`api`（`api_key/method/path_template/state/
        declared、used 来源与文件/params/auth hint`，key=`api:env:<env>:<METHOD path>`）。事实不得含
        凭据、storageState 字节、网络报文或源码正文。
      required: [id, version_id, kind, key, payload, source, source_ref, evidence_refs, content_hash, superseded_by, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        version_id:
          type: string
          pattern: '^[0-9]+$'
        kind:
          type: string
        key:
          type: string
        payload:
          type: object
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: 置信度；`null` 表示未知（DB 列可空，未知时不伪造数值，0 也不是“未知”的替身）
        source:
          type: string
        source_ref:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
            pattern: '^[0-9]+$'
        content_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        superseded_by:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
          description: 非空表示已被替代；当前有效事实为 null
        created_at:
          type: string
          format: date-time
    MessagePartView:
      type: object
      description: 0.2.1 消息 part 历史行（流式追加；seq 去重、call_id 配对）；DB 列 `part_type`，对应 `MessagePart.type`
      required: [seq, part_type, payload, created_at]
      properties:
        seq:
          type: integer
          minimum: 1
          description: 消息内从 1 递增（DB CHECK `seq > 0`）；按此升序返回
        part_type:
          type: string
          enum: [text, thinking, tool_call, job_card, attachment, requirement_card, case_card, error]
          description: |
            DB 列 `part_type`（version 上下文 `conversation_message_part`）；与 `MessagePart.type` 同义，
            实现不得另起字段名。`image`/`rollback_proposal` 是消息快照 part，不在本表枚举内。
        payload:
          type: object
          description: 形状与 `MessagePart` 对应分支一致（工具 call_id、作业 job_id 等）
        created_at:
          type: string
          format: date-time
    JobView:
      type: object
      description: |
        0.2.1 作业控制投影（cancel/retry 响应；job_id 等于 work_item.id）。GET 作业状态的完整字段
        （current/total/goal/result/error）属 0.3 预留，0.2.1 响应只保证下列 required 字段；
        `state=cancelled` 是用户取消的投影（存储行为 failed + marker），`attempts` 是取消前的真实尝试数。
      required: [job_id, version_id, kind, state, attempts, max_attempts, updated_at]
      properties:
        job_id:
          type: string
          pattern: '^[0-9]+$'
          description: work_item.id
        version_id:
          type: string
          pattern: '^[0-9]+$'
        kind:
          type: string
          enum: [design.cases, review.cases, execute.batch, analyze.failure, report.version, knowledge.propose]
        state:
          type: string
          enum: [open, claimed, running, waiting_human, done, failed, cancelled]
          description: 工作项状态；与事件 payload 的 `status` 同义（DB 列为 `work_item.status`，`WorkItemView`/`JobView` 对外字段名为 `state`）
        attempts:
          type: integer
          minimum: 0
          description: 已用尝试次数；用户 retry 成功后重置为 0（新预算）；cancel 响应为取消前的真实值
        max_attempts:
          type: integer
          minimum: 1
          description: 尝试预算上限；retry 不改变该值
        current:
          type: integer
          minimum: 0
          description: 0.3 预留；0.2.1 的 cancel/retry 响应不返回
        total:
          type: integer
          minimum: 0
          description: 0.3 预留；`0` 表示未知（不得伪造进度百分比）
        goal:
          type: string
          maxLength: 500
          description: 0.3 预留；0.2.1 的 cancel/retry 响应不返回
        created_by:
          type: string
          enum: [state_machine, planner, assistant, trigger]
        result:
          type: object
        error:
          type: object
          nullable: true
          required: [code]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
              default: false
            action:
              type: string
              maxLength: 500
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublicModelView:
      type: object
      description: 0.2.1 公开模型目录项；不含 api_key/base_url/headers
      required: [id, config_id, model, display_name, context_window, capabilities, deprecated]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        config_id:
          type: string
          pattern: '^[0-9]+$'
        config_name:
          type: string
          maxLength: 200
        model:
          type: string
          maxLength: 200
        display_name:
          type: string
          maxLength: 200
        context_window:
          type: integer
          minimum: 0
        capabilities:
          type: object
          required: [supports_tools, supports_vision, supports_reasoning, context_window, supports_prompt_cache]
          properties:
            supports_tools:
              type: boolean
            supports_vision:
              type: boolean
            supports_reasoning:
              type: boolean
            context_window:
              type: integer
              minimum: 0
            supports_prompt_cache:
              type: boolean
        default:
          type: boolean
          description: 是否为所属 LLM 配置的 `default_model_id`
        deprecated:
          type: boolean

    # -------------------------------------------------------------------------
    # v0.22 W0 schemas (Task 37)
    # -------------------------------------------------------------------------
    VersionStage:
      type: string
      enum: [created, clarifying, requirement_review, designing, case_review, executing, reporting, completed, blocked, paused]
    PlanItemPatchRequest:
      type: object
      description: API-4 部分写入；省略字段不变，revision 必填。
      required: [revision]
      properties:
        title: {type: string, maxLength: 500}
        status: {type: string, maxLength: 32}
        decision: {type: string, maxLength: 2000}
        order: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 1}
    PlanItemWrite:
      type: object
      required: [id, version_id, phase, title, status, decision, order, revision, depends_on, work_item_id]
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        version_id: {type: string, pattern: '^[0-9]+$'}
        phase: {type: string}
        title: {type: string}
        status: {type: string}
        decision: {type: string}
        order: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 1}
        depends_on:
          type: array
          items: {type: string, pattern: '^[0-9]+$'}
        work_item_id: {type: string, pattern: '^[0-9]+$', nullable: true}

    HandoffRequirement:
      type: object
      description: v0.2.4-B（T17/T8）：需求 V1 自然语言契约；description 拆为 user_story+rules，AC 为结构化数组。
      required: [id, current_version_id, revision, title, user_story, rules, acceptance_criteria, priority, sut_description, scope_out, account_roles_hint, status, source_quote]
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        current_version_id: {type: string, pattern: '^[0-9]+$'}
        revision: {type: integer, minimum: 1}
        title: {type: string}
        user_story:
          type: object
          required: [as_a, i_want, so_that]
          properties:
            as_a: {type: string}
            i_want: {type: string}
            so_that: {type: string}
        rules: {type: string}
        acceptance_criteria:
          type: array
          items:
            type: object
            required: [id, given, when, then]
            properties:
              id: {type: string, pattern: '^AC-[1-9][0-9]*$'}
              given: {type: string}
              when: {type: string}
              then: {type: string}
        priority: {type: string}
        sut_description: {type: string}
        scope_out: {type: string}
        account_roles_hint: {type: array, items: {type: string}}
        status: {type: string}
        source_quote: {type: string}
        confidence: {type: number, format: double, description: 省略当 nil（omitempty）}
        confirmed_at: {type: string, format: date-time, description: 省略当 nil（omitempty）}
    HandoffQA:
      type: object
      required: [question_id, question, options, source_refs, requirement_refs, status, answer_selected, answer_text]
      properties:
        question_id: {type: string, pattern: '^[0-9]+$'}
        message_id: {type: string, pattern: '^[0-9]+$'}
        conversation_id: {type: string, pattern: '^[0-9]+$'}
        question_key: {type: string}
        question: {type: string}
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: {type: string}
              label: {type: string}
        source_refs: {type: array, items: {type: string}}
        requirement_id: {type: string, pattern: '^[0-9]+$'}
        requirement_refs: {type: array, items: {type: string, pattern: '^[0-9]+$'}}
        status: {type: string}
        answer_selected: {type: array, items: {type: string}}
        answer_text: {type: string}
        asked_at: {type: string, format: date-time}
        answered_at: {type: string, format: date-time, nullable: true}
    HandoffDecision:
      type: object
      required: [fact_id, kind, key, summary, source]
      properties:
        fact_id: {type: string, pattern: '^[0-9]+$'}
        kind: {type: string}
        key: {type: string}
        summary: {type: string}
        confidence: {type: number, format: double, nullable: true}
        source: {type: string}
        source_ref: {type: string}
        created_at: {type: string, format: date-time}
    HandoffOpen:
      type: object
      required: [kind, summary, status, source]
      properties:
        kind: {type: string}
        summary: {type: string}
        status: {type: string}
        source: {type: string}
        reference_id: {type: string, pattern: '^[0-9]+$'}
        question_key: {type: string}
        created_at: {type: string, format: date-time, nullable: true}
    HandoffPlanItem:
      type: object
      required: [id, phase, title, status, decision]
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        phase: {type: string}
        title: {type: string}
        status: {type: string}
        decision: {type: string}
    HandoffPlan:
      type: object
      required: [stage]
      properties:
        stage: {type: string}
        current:
          allOf:
            - $ref: '#/components/schemas/HandoffPlanItem'
          nullable: true
        next:
          allOf:
            - $ref: '#/components/schemas/HandoffPlanItem'
          nullable: true
    HandoffResources:
      type: object
      description: v0.2.4-B（T17）：资产嵌套于 suts[i]（不再平铺）；新增 environment 与 truncated 标志。
      required: [environment, suts, accounts, repositories, truncated]
      properties:
        environment:
          type: object
          required: [id, name, status]
          properties:
            id: {type: string, pattern: '^[0-9]+$'}
            name: {type: string}
            status: {type: string}
        suts:
          type: array
          items:
            type: object
            required: [sut_id, name, base_url, pages, apis, databases]
            properties:
              sut_id: {type: string, pattern: '^[0-9]+$'}
              name: {type: string}
              base_url: {type: string}
              pages:
                type: array
                items:
                  type: object
                  required: [id, name, url]
                  properties:
                    id: {type: string, pattern: '^[0-9]+$'}
                    name: {type: string}
                    url: {type: string}
                    route_template: {type: string, description: 省略当空（omitempty）}
              apis:
                type: array
                items:
                  type: object
                  required: [id, name, method, path]
                  properties:
                    id: {type: string, pattern: '^[0-9]+$'}
                    name: {type: string}
                    method: {type: string}
                    path: {type: string}
              databases:
                type: array
                items:
                  type: object
                  required: [id, name, kind, read_only]
                  properties:
                    id: {type: string, pattern: '^[0-9]+$'}
                    name: {type: string}
                    kind: {type: string}
                    read_only: {type: boolean}
        accounts:
          type: array
          items:
            type: object
            required: [id, username, roles]
            properties:
              id: {type: string, pattern: '^[0-9]+$'}
              username: {type: string}
              roles: {type: array, items: {type: string}}
              role: {type: string, description: 省略当空（omitempty）}
        repositories:
          type: array
          items:
            type: object
            required: [id, name, source]
            properties:
              id: {type: string, pattern: '^[0-9]+$'}
              name: {type: string}
              role: {type: string, description: 省略当空（omitempty）}
              branch: {type: string, description: 省略当空（omitempty）}
              source: {type: string}
        truncated: {type: boolean, description: 资源装配是否因预算被截断（T17）}
    HandoffView:
      type: object
      description: B §8.1 六块交接文档；数组始终存在。
      required: [version_id, revision, generated_at, requirements, qa, decisions, open, plan, resources]
      properties:
        version_id: {type: string, pattern: '^[0-9]+$'}
