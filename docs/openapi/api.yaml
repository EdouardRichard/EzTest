      summary: 版本探索链路（只读单对象 + 预算截断；P6 筛选/counts/meta 增量）
      description: |
        请求级聚合 version/design/execution/delivery/resource 的 application 端口，不写表、不直读他域表。
        支持 SUT/页面/波次/状态/结果过滤、`focus_node` 深链保真、`event_from`/`event_to` 历史回看（近似）；
        空版本返回空 nodes/edges + counts 0（不 404）；超预算 `truncated=true` 并给出 `truncation.reason`。
        P6 v2：新增 `q`/`abnormal_only`/`issue_status`/`issue_severity`/`requirement_limit` 过滤
        （过滤作用于节点并同步裁剪/保留诱导边，`focus_node` 及其祖先永不丢；每 case_version 只返回最新
        case_run）。响应增量：`counts.by_case_run_status`/`by_issue_severity`/`by_issue_status`/`coverage`、
        `nodes[].meta` 类型化可选字段（保留 additionalProperties 兼容）、`degraded_layers`、
        `truncated_layers`、`replay.event_limit`/`replay.truncated`。Provider 失败层降级、健康层返回；
        全层失败 503 `provider_unavailable`；客户端保留旧图并以 degraded_layers 提示，不显示空态。
        `chain.max_*` 与 `chain.replay_event_limit` 每请求/热缓存读取，
        PATCH settings 后下一次请求生效。查询预算 ≤10 SQL；API P95 ≤800ms（200 节点）。
      parameters:
