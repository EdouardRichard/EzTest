    KnowledgeItemView:
      type: object
      description: |
        P7 知识主记录视图；0.2.1 追加 `bindings`/`last_verified_at`（成功钩子更新）。
        `source_stale` 为读取期标记，不是状态；不含任何凭据字段。
      required: [id, scope, title, content, tags, status, last_verified_at, bindings, revision, source_stale, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        scope:
          type: string
          enum: [global, system]
        system_key:
          type: string
          maxLength: 64
          nullable: true
          description: scope=system 时为 SUT family；global 为 null
        title:
          type: string
          maxLength: 200
        content:
          type: string
          maxLength: 20000
        tags:
          type: array
          maxItems: 20
          items:
            type: string
        status:
          type: string
          enum: [draft, approved, suspect, stale, rejected, revoked]
          description: 0.2.1 注入只用 approved；失败标 suspect，页面/路由/账号变更标 stale
        last_verified_at:
          type: string
          format: date-time
          nullable: true
          description: 0.2.1 最近一次验证成功时间（成功钩子更新）
        bindings:
          type: object
          description: 0.2.1 结构化绑定（system/environment/page/api/account_role）；不含凭据
          properties:
            system_id:
              type: string
              pattern: '^[0-9]+$'
              nullable: true
            environment_id:
              type: string
              pattern: '^[0-9]+$'
              nullable: true
            page_key:
              type: string
              maxLength: 500
              nullable: true
            api_key:
              type: string
              maxLength: 500
              nullable: true
            account_role:
              type: string
              maxLength: 64
              nullable: true
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        source_version_id:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        promoted_from_version_id:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        revision:
          type: integer
          minimum: 1
        review_reason:
          type: string
          maxLength: 2000
          nullable: true
        reviewed_by:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        source_stale:
          type: boolean
          description: 来源版本不存在时为 true；只读、不落库
        created_by:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KnowledgeRevisionView:
      type: object
      required: [id, knowledge_id, revision, title, content, tags, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        knowledge_id:
          type: string
          pattern: '^[0-9]+$'
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 200
        content:
          type: string
          maxLength: 20000
        tags:
          type: array
          maxItems: 20
          items:
            type: string
        changed_by:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        created_at:
          type: string
          format: date-time
    KnowledgeUsageStatsView:
      type: object
      description: |
        知识条目的 knowledge_usage 读取期聚合（v0.2.4-H 最小读面）：注入次数为
        append-only 用例行 COUNT 派生，最近使用为 MAX(created_at)；从未注入的
        条目为 {injection_count: 0, last_used_at: null}。只读投影，不落库。
