        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [versions]
      summary: Send a clarification message
      description: |
        Sends a 1-5000 character text message through the active session's P1
        Agent run and returns 202 with the started run. Requires an active
        session (`clarification_session_not_active`) and an idle version channel
        (`agent_busy`). An unavailable AI runtime returns 503 `ai_unavailable`
        with `retryable: true`; the user keeps the draft in the UI.
