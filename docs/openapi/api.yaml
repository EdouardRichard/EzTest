      properties:
        case_ids:
          type: array
          default: []
          items:
            type: string
            pattern: '^[0-9]+$'
        batch_id:
          type: string
          maxLength: 128
          nullable: true
        comment:
          type: string
          maxLength: 2000
    StageRejectRequest:
