      `conflict` 只记录决策，不改 fact。阶段 gate 拒绝（如 blocker 未清除）返回 409
      `stage_gate_failed`/`invalid_stage_transition`，请求保持 pending 以便重试。
    - `GET /api/versions/{id}/questions?status=` 的待办扩展到 approval/blocked_recovery/conflict
