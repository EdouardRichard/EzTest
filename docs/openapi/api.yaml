        - $ref: '#/components/parameters/ResourceAccessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportSessionRequest'
            example:
              environmentId: 12
              kind: storage_state
              storageState:
                cookies: []
                origins: []
              note: manual import
      responses:
        '201':
          description: The created session with its latest snapshot.
          content:
