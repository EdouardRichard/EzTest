      description: |
        Creates a session from a Playwright storage-state document or a token
        header map and runs the environment login_check. The response session is
        valid or needs_manual and includes latestSnapshot. storageState and the
        token headers are write-only; they never appear in a response.
      operationId: importSession
      security:
        - bearerAuth: []
