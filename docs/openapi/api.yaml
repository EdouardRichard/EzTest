  /api/versions/{versionId}/waive-close:
    post:
      tags: [Versions]
      operationId: waiveCloseVersion
      summary: 管理员豁免关闭版本（v0.2.4-G，仅 admin）
      description: |
        两级 waiver 的版本级（GD-06/P23，SC-G11，Q7=A 仅 admin）。经**唯一 Close 终态写入口**
        （CloseWaived，非新增 status 写者）写 `closure_kind=waived` + `unverified=true`，
        override 闭环谓词的 RequirementsClosed 与报告 current（check 8），**仍须 6 项执行结算检查**
        （Running/NoBlockingWorkItems/NoActiveIntents/NoOpenHumanRequests/NoActiveWaves/NoInflightCaseRuns）
        与 HasExecutionData。关闭后**同步重生成并发布含 unverified 的版本报告**（破 completed 被
        reconciler report ensure 排除的死链，R-G8）；响应携带该报告 revision。
        非 admin → 403；reason 必填 1..500；版本非 running → 409 `state_conflict`；
        无执行数据 → 409 `state_conflict`（details.reason=`no_execution_data`）；
        执行未结算 → 409 `state_conflict`（details.reason=`close_predicate_failed` + failed 计数）。
        对已 waived-closed 版本重复调用 = **幂等仅重试报告腿**（关闭不可变，治愈失败的闭后重生成）。
        非静默：写 waiver 事实（reason+operator）+ `version.waived` 事件 + 审计；终态关闭仍发
        `version.closed`（带 closure_kind/unverified）。reopen 清 waiver（见 reopenVersion）。
      parameters:
        - $ref: '#/components/parameters/VersionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaiveCloseRequest'
      responses:
        '200':
          description: 豁免关闭后的版本与同步发布的 unverified 报告 revision
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WaiveCloseView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/versions/{versionId}/requirements/{requirementId}/waive:
    post:
      tags: [Requirements]
      operationId: waiveRequirement
      summary: 管理员豁免需求闭环（v0.2.4-G，仅 admin）
      description: |
        两级 waiver 的需求级（GD-06/P23，SC-G11，Q7=A 仅 admin）。标记 clarified 需求 `waived=true`，
        由确定性闭环 reconciler 以 override 闭环完整性谓词关闭它（执行结算检查仍门控实际关闭）。
        **URL 契约（诚实披露，T6 Minor #7）**：`versionId` 仅做非空 ID 校验，**不参与归属判定**——
        waiver 作用于 `requirementId` 指定的需求（沿 sibling reopen 端点约定）；version 路径段与
        需求实际所属版本不一致时仍按 requirementId 豁免（不 404）。
        非 admin → 403；reason 必填 1..2000；仅 clarified 需求可豁免，否则 409 `state_conflict`；
        已 waived（clarified 或 closed）= 幂等 no-op。非静默：写 waiver 事实 + `requirement.waived`
        事件 + 审计（每次真实迁移必发，waived_at 判别重复动作）。清除只经 reopen 路径
        （需求 reopen / 版本 reopen 的 waiver 撤销 R-G8a），不经本端点。
      parameters:
        - $ref: '#/components/parameters/VersionID'
        - $ref: '#/components/parameters/RequirementID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaiveRequirementRequest'
      responses:
        '200':
          description: 需求豁免确认
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WaiveRequirementView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

