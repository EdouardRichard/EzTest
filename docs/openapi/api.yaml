          description: The started Agent run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationRunResultEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '503':
          $ref: '#/components/responses/VersionUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/versions/{id}/clarification/questions:
    get:
      tags: [versions]
