  /api/quality/trends:
    get:
      tags: [Quality]
      operationId: listQualityTrends
      summary: 评测指标趋势（admin，按 created_at 升序）
      description: |
        返回一个版本 + 一个指标的历史评测点（`created_at` 升序、同时间按 run id 升序）。
        `version_id`/`metric` 必填；`from`/`to` 为 RFC3339 可选边界。`baseline`/`regressed`
        来自指标 detail：基线回归仅是告警（warn-only），不影响阶段验收。
        W2-14 R-W2-6：至少两个点由同一版本多次 snapshot 触发产生。
      parameters:
        - name: version_id
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]+$'
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum:
              - design_coverage
              - execution_pass_rate
              - case_coverage
              - impact_recall
              - impact_precision
              - classification_accuracy
              - issue_false_positive_rate
              - supplement_hit_rate
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 该版本/指标的趋势点（升序）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrendPointView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
