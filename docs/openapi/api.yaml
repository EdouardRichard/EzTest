        files:
          type: integer
          minimum: 0
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        truncated:
          type: boolean
    ChangedFile:
      type: object
      required: [path, oldPath, status, additions, deletions, binary, headBlobHash]
      properties:
        path:
          type: string
          maxLength: 4096
        oldPath:
          type: string
          maxLength: 4096
          nullable: true
        status:
          type: string
          description: File-level Git status (A/M/D/R/C/T).
          enum: [A, M, D, R, C, T]
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        binary:
          type: boolean
        headBlobHash:
          type: string
          description: Head-side blob identity (`git-sha1:<40hex>` or `sha256:<64hex>`).
    ChangeList:
      type: object
      description: |
        The shared change-list projection of `/api/code/repos/{repoId}/diff` and
        `/api/versions/{versionId}/code/changes`. It is carried inside the normal
        `{"data":...}` envelope; its own `nextCursor`/`hasMore` paginate the file
        array. `changeSetId` is null for a read-only preview.
      required:
        - changeSetId
        - baseCommit
        - headCommit
        - stats
        - files
        - nextCursor
        - hasMore
      properties:
        changeSetId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        baseCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        headCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        stats:
          $ref: '#/components/schemas/ChangeSetStats'
        files:
          type: array
          maxItems: 2000
          description: One page for `/diff` (limit 1-100); the whole stored change set (up to 2000) for the version preview.
          items:
            $ref: '#/components/schemas/ChangedFile'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
    ChangeListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ChangeList'
    TreeEntry:
      type: object
      required: [path, type, size, gitObjectId, mode, unsupported]
      properties:
        path:
          type: string
          maxLength: 4096
        type:
          type: string
          enum: [blob, tree]
        size:
          type: integer
          format: int64
          minimum: 0
        gitObjectId:
          type: string
          pattern: '^[a-f0-9]{40}$'
        mode:
          type: string
          description: Git tree mode (for example `100644` or `040000`).
        unsupported:
          type: boolean
          description: True for symlink/submodule entries that P4 does not follow.
    TreePage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TreeEntry'
        next_cursor:
          type: string
          description: Opaque path cursor; empty when `has_more` is false.
        has_more:
          type: boolean
    FileWindow:
      type: object
      required: [commit, path, startLine, endLine, totalLines, truncated, content]
      properties:
        commit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        path:
          type: string
          maxLength: 4096
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
        totalLines:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        content:
          type: string
          description: The bounded line window only; never an unbounded file dump.
    FileWindowEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FileWindow'
    FileDiff:
      type: object
      required: [baseCommit, headCommit, path, status, binary, truncated, patch]
      properties:
        baseCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        headCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        path:
          type: string
          maxLength: 4096
        status:
          type: string
          enum: [A, M, D, R, C, T]
        binary:
          type: boolean
        truncated:
          type: boolean
        patch:
          type: string
          description: Unified diff, empty for binary/deleted/oversized files.
    FileDiffEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FileDiff'
    AnalysisError:
      type: object
      description: One non-fatal run error; never code content or internal paths.
      required: [code, message]
      properties:
        code:
          type: string
        path:
          type: string
          maxLength: 4096
        message:
          type: string
    Evidence:
      type: object
      description: |
        One code evidence range. AI/T1 evidence carries `startLine`/`endLine`
        and the server-computed `excerptHash`; anchor-sourced evidence carries
        only `file`.
      required: [file]
      properties:
        file:
          type: string
          maxLength: 4096
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
        excerptHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
    CodeEntity:
      type: object
      description: |
        One persisted code fact/entity at a commit. `id`/`analysisId` are decimal
        strings; `repoId` is a number. `evidence` is always an array.
      required:
        - id
        - repoId
        - commit
        - kind
        - path
        - name
        - startLine
        - endLine
        - signature
        - blobHash
        - source
        - confidence
        - evidence
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        repoId:
          type: integer
          format: int64
          minimum: 1
        commit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        kind:
          type: string
          description: Entity kind (for example `api`, `route`, `page`, `component`).
        path:
          type: string
          maxLength: 4096
        name:
          type: string
        startLine:
          type: integer
          minimum: 1
          nullable: true
        endLine:
          type: integer
          minimum: 1
          nullable: true
        signature:
          type: string
        blobHash:
          type: string
        source:
          type: string
          enum: [git, ai]
        confidence:
          type: string
          description: Confidence bucket (high/medium/low); T0 facts may use an empty value.
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        factKey:
          type: string
          nullable: true
        factVersion:
          type: integer
          minimum: 1
          nullable: true
        analysisId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FactsPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CodeEntity'
        next_cursor:
          type: string
          description: Opaque cursor; empty when `has_more` is false.
        has_more:
          type: boolean
    Commit:
      type: object
      required: [sha, message, author, committedAt]
      properties:
        sha:
          type: string
          pattern: '^[a-f0-9]{40}$'
        message:
          type: string
        author:
          type: string
        committedAt:
          type: string
          format: date-time
    CommitEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Commit'
    AnalysisStats:
      type: object
      required:
        - changedFiles
        - analyzedFiles
        - cacheHits
        - facts
        - edges
        - contracts
        - evidenceChecks
        - evidenceFailures
        - unmapped
        - invalidFacts
        - duplicateFacts
        - unmatchedContracts
        - truncated
        - skipped
      properties:
        changedFiles:
          type: integer
          minimum: 0
        analyzedFiles:
          type: integer
          minimum: 0
        cacheHits:
          type: integer
          minimum: 0
        facts:
          type: integer
          minimum: 0
        edges:
          type: integer
          minimum: 0
        contracts:
          type: integer
          minimum: 0
        evidenceChecks:
          type: integer
          minimum: 0
        evidenceFailures:
          type: integer
          minimum: 0
        unmapped:
          type: integer
          minimum: 0
        invalidFacts:
          type: integer
          minimum: 0
        duplicateFacts:
          type: integer
          minimum: 0
        unmatchedContracts:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        skipped:
          type: integer
          minimum: 0
          description: Changed files skipped by a limit (always emitted).
    FactVersionRef:
      type: object
      required: [factKey, version]
      properties:
        factKey:
          type: string
          maxLength: 512
        version:
          type: integer
          minimum: 1
    Candidate:
      type: object
      description: |
        One impact candidate. `id`/`subjectId` are decimal strings; `subjectKind`
        is `requirement` or `app_model`. The `evidence` items are always an array
        and are normalized/deduplicated by the server.
      required:
        - id
        - subjectKind
        - subjectId
        - reason
        - confidence
        - source
        - evidence
        - selected
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        subjectKind:
          type: string
          enum: [requirement, app_model]
        subjectId:
          type: string
          pattern: '^[0-9]{1,19}$'
        reason:
          type: string
          maxLength: 2000
        confidence:
          type: string
          enum: [high, medium, low]
        source:
          type: string
          enum: [direct, contract, relation, ai]
        evidence:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Evidence'
        selected:
          type: boolean
        selectionUpdatedBy:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        selectionUpdatedAt:
          type: string
          format: date-time
          nullable: true
    UnmappedChange:
      type: object
      description: A changed file that produced no requirement/app-model candidate.
      required: [path, status, reason, suggestion]
      properties:
        path:
          type: string
          maxLength: 4096
        status:
          type: string
          enum: [A, M, D, R, C, T]
        reason:
          type: string
          enum:
            - deleted_file
            - unsupported_content
            - no_fact_or_anchor
            - ai_unavailable
            - unmatched_contract
        suggestion:
          type: string
    Analysis:
      type: object
      description: |
        `AnalysisDTO` of spec §7.3. `id`/`versionId`/`changeSetId`/candidate ids
        and subject ids are decimal strings; `repoId`/`createdBy` are numbers.
        `unmapped` is present on latest/detail reads. R8: `stats` is always an
        object (zero counters before completion) and the four aggregate arrays
        are always `[]` rather than null.
      required:
        - id
        - versionId
        - repoId
        - baseCommit
        - headCommit
        - status
        - degraded
        - analysisVersion
        - model
        - promptVersion
        - changeSetId
        - changeSummary
        - stats
        - factVersions
        - candidates
        - unmapped
        - errors
        - createdBy
        - createdAt
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        repoId:
          type: integer
          format: int64
          minimum: 1
        baseCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        headCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
        status:
          type: string
          enum: [queued, running, done, failed]
        degraded:
          type: boolean
        analysisVersion:
          type: integer
          minimum: 1
        model:
          type: string
        promptVersion:
          type: string
          maxLength: 32
        changeSetId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        changeSummary:
          type: string
          maxLength: 2000
          description: The change-set summary projected from the run stats/document.
        stats:
          $ref: '#/components/schemas/AnalysisStats'
        factVersions:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FactVersionRef'
        candidates:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Candidate'
        unmapped:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/UnmappedChange'
        errors:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AnalysisError'
        createdBy:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
    AnalysisEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Analysis'
    StartAnalysisRequest:
      type: object
      additionalProperties: false
      properties:
        headCommit:
          type: string
          description: Omit/empty to resolve the repository fixed branch tip; otherwise a 40-hex descendant of the baseline.
        force:
          type: boolean
          default: false
          description: Skip reuse and create `analysisVersion+1`.
    StartAnalysisResult:
      type: object
      required: [id, status, analysisVersion, reused]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        status:
          type: string
          enum: [queued, running, done, failed]
        analysisVersion:
          type: integer
          minimum: 1
        reused:
          type: boolean
    StartAnalysisResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StartAnalysisResult'
    UpdateCandidateRequest:
      type: object
      additionalProperties: false
      required: [selected]
      properties:
        selected:
          type: boolean
    CandidateEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Candidate'
    AnchorSubjectKind:
      type: string
      description: P4 anchor subject kinds; `case`/`issue` are reserved for later phases.
      enum: [version, requirement, app_model]
    Anchor:
      type: object
      description: |
        A code anchor. `id`/`versionId`/`subjectId` are decimal strings;
        `createdBy` is a number. `startLine`/`endLine`/`commitSha` are always
        present and null when the anchor has no line range or commit pin.
      required:
        - id
        - versionId
        - subjectKind
        - subjectId
        - filePath
        - startLine
        - endLine
        - commitSha
        - confidence
        - createdByKind
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        subjectKind:
          $ref: '#/components/schemas/AnchorSubjectKind'
        subjectId:
          type: string
          pattern: '^[0-9]{1,19}$'
        filePath:
          type: string
          maxLength: 4096
        startLine:
          type: integer
          minimum: 1
          nullable: true
        endLine:
          type: integer
          minimum: 1
          nullable: true
        commitSha:
          type: string
          pattern: '^[a-f0-9]{40}$'
          nullable: true
        confidence:
          type: string
          description: Anchor confidence bucket (high/medium/low).
        createdByKind:
          type: string
          description: P4 anchors are user-created (`user`); AI anchors are reserved.
        createdBy:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
    AnchorList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Anchor'
    AnchorEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Anchor'
    CreateAnchorRequest:
      type: object
      additionalProperties: false
      required: [subjectKind, subjectId, filePath]
      properties:
        subjectKind:
          $ref: '#/components/schemas/AnchorSubjectKind'
        subjectId:
          type: string
          pattern: '^[0-9]{1,19}$'
        filePath:
          type: string
          maxLength: 4096
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
    CreateSystemRequest:
      type: object
      required: [key, name, kind, baseUrl]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        name:
          type: string
        kind:
          type: string
          enum: [web, api]
        baseUrl:
          type: string
          format: uri
        defaultSessionTtlSeconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 3600
          description: 0 or omitted selects the 3600 second default.
        notes:
          type: string
    UpdateSystemRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their stored value. The key is immutable.
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [web, api]
        baseUrl:
          type: string
          format: uri
        notes:
          type: string
        defaultSessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
        status:
          type: string
          enum: [active, disabled]
    CreateEnvironmentRequest:
      type: object
      required: [key, name, baseUrl, kind]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        name:
          type: string
        baseUrl:
          type: string
          format: uri
        kind:
          type: string
          enum: [dev, staging, prod, other]
        isProd:
          type: boolean
          default: false
        allowedHosts:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 253
        loginCheck:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LoginCheck'
        allowAutoLogin:
          type: boolean
          default: false
        requireApproval:
          type: boolean
          default: false
    UpdateEnvironmentRequest:
      type: object
      additionalProperties: false
      description: |
        Partial update; omitted fields keep their stored value. An explicit
        "loginCheck": null clears the stored document.
      properties:
        name:
          type: string
        baseUrl:
          type: string
          format: uri
        kind:
          type: string
          enum: [dev, staging, prod, other]
        isProd:
          type: boolean
        allowedHosts:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 253
        loginCheck:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LoginCheck'
        allowAutoLogin:
          type: boolean
        requireApproval:
          type: boolean
    CreateAppModelRequest:
      type: object
      required: [key, kind, name]
      additionalProperties: false
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [page, route, api, component]
        name:
          type: string
        path:
          type: string
        method:
          type: string
        parentKey:
          type: string
          description: Empty or omitted makes the node a root.
        meta:
          type: object
          additionalProperties: true
    UpdateAppModelRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their stored value. Key and kind are immutable.
      properties:
        name:
          type: string
        path:
          type: string
        method:
          type: string
        parentKey:
          type: string
        meta:
          type: object
          additionalProperties: true
    AppModelImportNode:
      type: object
      required: [key, kind, name]
      additionalProperties: false
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [page, route, api, component]
        name:
          type: string
        path:
          type: string
        method:
          type: string
        parentKey:
          type: string
        meta:
          type: object
          additionalProperties: true
    ImportAppModelsRequest:
      type: object
      required: [nodes]
      additionalProperties: false
      properties:
        nodes:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/AppModelImportNode'
    CreateAccountRequest:
      type: object
      required: [key, label, kind]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        label:
          type: string
        username:
          type: string
        kind:
          type: string
          enum: [human, service]
        notes:
          type: string
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their stored value. The key is immutable.
      properties:
        label:
          type: string
        username:
          type: string
        kind:
          type: string
          enum: [human, service]
        notes:
          type: string
        status:
          type: string
          enum: [active, disabled]
    CreateAccessRequest:
      type: object
      required: [systemId, authType, concurrencyLimit]
      additionalProperties: false
      properties:
        systemId:
          type: integer
          format: int64
          minimum: 1
        authType:
          type: string
          enum: [password, sso, token, apikey, basic, manual]
        credential:
          type: string
          writeOnly: true
          description: Write-only; never returned.
        usernameOverride:
          type: string
        loginUrl:
          type: string
        enabled:
          type: boolean
          default: true
        concurrencyLimit:
          type: integer
          minimum: 1
          maximum: 100
        sessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          nullable: true
        permissionNote:
          type: string
    UpdateAccessRequest:
      type: object
      additionalProperties: false
      description: |
        Partial update. credential follows the write-only rule: omitted keeps
        the stored value, "" clears it and a non-empty value replaces it. An
        explicit "sessionTtlSeconds": null clears the TTL override. systemId is
        accepted for form compatibility and ignored.
      properties:
        authType:
          type: string
          enum: [password, sso, token, apikey, basic, manual]
        credential:
          type: string
          writeOnly: true
        usernameOverride:
          type: string
        loginUrl:
          type: string
        permissionNote:
          type: string
        enabled:
          type: boolean
        concurrencyLimit:
          type: integer
          minimum: 1
          maximum: 100
        systemId:
          type: integer
          format: int64
        sessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          nullable: true
    ImportSessionRequest:
      type: object
      required: [environmentId]
      additionalProperties: false
      properties:
        environmentId:
          type: integer
          format: int64
          minimum: 1
          description: Must belong to the access's system.
        kind:
          type: string
          enum: [storage_state, token]
          description: Omitted infers token when headers are present, storage_state otherwise.
        storageState:
          type: object
          additionalProperties: true
          writeOnly: true
          description: Playwright storageState document (cookies and origins). Write-only; never returned.
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Token headers such as Authorization. Write-only; never returned.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Explicit expiry; omitted computes min(now+TTL, earliest cookie expiry).
        note:
          type: string
    ConfirmSessionRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    RequestTakeoverRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [mfa, captcha, approval, login_unknown, other]
        instructions:
          type: object
          additionalProperties: true
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 31536000
          default: 1800
    CompleteTakeoverRequest:
      type: object
      additionalProperties: false
      description: The same login-state shape as the import request.
      properties:
        kind:
          type: string
          enum: [storage_state, token]
        storageState:
          type: object
          additionalProperties: true
          writeOnly: true
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
    CreateCodeRepoRequest:
      type: object
      required: [key, name, localPath]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        name:
          type: string
        localPath:
          type: string
        fixedBranch:
          type: string
          maxLength: 255
          default: main
        includeGlobs:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 256
        excludeGlobs:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 256
    UpdateCodeRepoRequest:
      type: object
      additionalProperties: false
      description: Partial update; omitted fields keep their stored value. The key is immutable.
      properties:
        name:
          type: string
        localPath:
          type: string
        fixedBranch:
          type: string
          maxLength: 255
        includeGlobs:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 256
        excludeGlobs:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 256
        status:
          type: string
          enum: [active, disabled]
    VersionStatus:
      type: string
      description: |
        Version lifecycle status (spec §6.1). P3 only reaches
        `draft → clarifying → designing` through its actions; later values are
        reserved for later phases and are accepted as filters for forward
        compatibility.
      enum:
        - draft
        - clarifying
        - designing
        - reviewing
        - executing
        - continuing
        - completed
        - archived
    VersionResourceRef:
      type: object
      description: One resolved P2 resource binding; `available` is false after the resource was deleted.
      required: [id, name, available]
      properties:
        id:
          type: integer
          format: int64
          description: P2 resource ID; stays a number unlike P3-owned IDs.
        name:
          type: string
        available:
          type: boolean
    VersionBindings:
      type: object
      description: The resolved bindings of a version; unbound entries are null.
      required: [system, environment, codeRepository]
      properties:
        system:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/VersionResourceRef'
        environment:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/VersionResourceRef'
        codeRepository:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/VersionResourceRef'
    Version:
      type: object
      description: |
        `VersionDTO` (spec §7.2). `id` is a 64-bit snowflake serialized as a
        decimal string; P2 resource IDs and user IDs stay numbers.
      required:
        - id
        - name
        - label
        - description
        - status
        - systemId
        - environmentId
        - codeRepositoryId
        - codeBranch
        - codeBaselineCommit
        - bindings
        - requirementCount
        - clarifiedCount
        - openQuestionCount
        - revision
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          example: '1844674407370955161'
          description: Snowflake ID as a decimal string; never convert it to a number.
        name:
          type: string
          minLength: 1
          maxLength: 200
        label:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 20000
        status:
          $ref: '#/components/schemas/VersionStatus'
        systemId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        environmentId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        codeRepositoryId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        codeBranch:
          type: string
          maxLength: 200
          nullable: true
        codeBaselineCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
          nullable: true
          description: Snapshot of the bound commit; only a rebind changes it.
        bindings:
          $ref: '#/components/schemas/VersionBindings'
        requirementCount:
          type: integer
          minimum: 0
        clarifiedCount:
          type: integer
          minimum: 0
        openQuestionCount:
          type: integer
          minimum: 0
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Optimistic-lock token; every PATCH/binding write must send it.
        createdBy:
          type: integer
          format: int64
          description: User ID; stays a number.
        updatedBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VersionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Version'
    VersionList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Version'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CreateVersionRequest:
      type: object
      required: [name]
      additionalProperties: false
      description: Creates a `draft` version; bindings are optional. P2 resource IDs are numbers.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        label:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 20000
        systemId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        environmentId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Must belong to `systemId`.
        codeRepositoryId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        codeBranch:
          type: string
          maxLength: 200
          nullable: true
        codeBaselineCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
          nullable: true
    UpdateVersionRequest:
      type: object
      required: [revision]
      additionalProperties: false
      description: |
        Partial metadata update; omitted fields keep their value. `status` is not
        writable and `revision` must match the stored revision.
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        label:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 20000
    PutVersionBindingsRequest:
      type: object
      required: [revision]
      additionalProperties: false
      description: |
        Replaces the whole binding set. An omitted or `null` field clears that
        binding; `environmentId` must belong to `systemId`. Only `draft` and
        `clarifying` versions allow the write.
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        systemId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        environmentId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        codeRepositoryId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        codeBranch:
          type: string
          maxLength: 200
          nullable: true
        codeBaselineCommit:
          type: string
          pattern: '^[a-f0-9]{40}$'
          nullable: true
    EnterDesignRequest:
      type: object
      additionalProperties: false
      properties:
        acknowledgeUnclarified:
          type: boolean
          default: false
          description: Required to proceed when unclarified requirements or open questions exist.
    EnterDesignResult:
      type: object
      required: [version, warnings]
      properties:
        version:
          $ref: '#/components/schemas/Version'
        warnings:
          type: array
          items:
            type: string
          description: |
            Human-readable warnings about unclarified work; always a JSON array
            of strings (never a nested object) and empty when none remain.
    EnterDesignEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/EnterDesignResult'
    RequirementStatus:
      type: string
      description: |
        Requirement lifecycle status (spec §6.2). P3 only reaches
        `draft → clarified`; later values are reserved and accepted as filters.
      enum: [draft, clarified, designed, verified, obsolete]
    RequirementPriority:
      type: string
      enum: [must, should, could]
    VersionSource:
      type: string
      description: Whether the record was authored by a human through the API or by the Agent.
      enum: [user, ai]
    Requirement:
      type: object
      description: |
        `RequirementDTO` (spec §7.3). Every P3-owned ID is a decimal string;
        user IDs stay numbers. `GET /api/versions/{id}/requirements/{rid}`
        additionally includes the requirement's `attachments` metadata; list
        items expose only `attachmentCount`.
      required:
        - id
        - versionId
        - title
        - description
        - acceptanceCriteria
        - priority
        - status
        - source
        - lastUpdateSource
        - revision
        - confirmedAt
        - confirmedBy
        - openQuestionCount
        - relationCount
        - attachmentCount
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        acceptanceCriteria:
          type: string
          maxLength: 10000
        priority:
          $ref: '#/components/schemas/RequirementPriority'
        status:
          $ref: '#/components/schemas/RequirementStatus'
        source:
          $ref: '#/components/schemas/VersionSource'
        lastUpdateSource:
          $ref: '#/components/schemas/VersionSource'
        revision:
          type: integer
          format: int64
          minimum: 1
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        confirmedBy:
          type: integer
          format: int64
          nullable: true
          description: User ID; stays a number.
        openQuestionCount:
          type: integer
          minimum: 0
        relationCount:
          type: integer
          minimum: 0
        attachmentCount:
          type: integer
          minimum: 0
        attachments:
          type: array
          description: |
            Attachment metadata for the requirement-detail response (spec §7.3).
            Omitted or empty on list items, which expose `attachmentCount` only.
            `storagePath` is never returned.
          items:
            $ref: '#/components/schemas/RequirementAttachment'
        createdBy:
          type: integer
          format: int64
        updatedBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RequirementEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Requirement'
    RequirementList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CreateRequirementRequest:
      type: object
      required: [title]
      additionalProperties: false
      description: Adds a `draft` requirement with `source=user`; the version status never changes.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        acceptanceCriteria:
          type: string
          maxLength: 10000
        priority:
          allOf:
            - $ref: '#/components/schemas/RequirementPriority'
          description: Defaults to `should` when omitted.
    UpdateRequirementRequest:
      type: object
      required: [revision]
      additionalProperties: false
      description: |
        Edits a `draft` requirement. `revision` must match the stored revision;
        a `clarified` requirement returns 409 `requirement_state_conflict`.
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        acceptanceCriteria:
          type: string
          maxLength: 10000
        priority:
          $ref: '#/components/schemas/RequirementPriority'
    RelationType:
      type: string
      description: |
        Four relation kinds. `depends_on` is directed; the other three are
        undirected for duplicate detection even though storage keeps a from/to
        pair.
      enum: [depends_on, conflicts_with, overlaps, shares_scope]
    RequirementRelation:
      type: object
      description: Relation DTO (spec §7.4); both endpoint IDs are P3 decimal strings.
      required:
        - id
        - versionId
        - fromRequirementId
        - toRequirementId
        - relationType
        - description
        - source
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        fromRequirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
        toRequirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
        relationType:
          $ref: '#/components/schemas/RelationType'
        description:
          type: string
        source:
          $ref: '#/components/schemas/VersionSource'
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RequirementRelationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RequirementRelation'
    RequirementRelationList:
      type: object
      description: All relations of a version (no pagination; at most 500).
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RequirementRelation'
    CreateRelationRequest:
      type: object
      required: [fromRequirementId, toRequirementId, relationType]
      additionalProperties: false
      properties:
        fromRequirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
        toRequirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
        relationType:
          $ref: '#/components/schemas/RelationType'
        description:
          type: string
    UpdateRelationRequest:
      type: object
      additionalProperties: false
      description: Partial update; relations have no revision field. At least one field is expected.
      properties:
        relationType:
          $ref: '#/components/schemas/RelationType'
        description:
          type: string
    AttachmentKind:
      type: string
      enum: [text, image]
    RequirementAttachment:
      type: object
      description: Attachment metadata (spec §6.7/§7.3); `storagePath` is never exposed.
      required: [id, kind, filename, mimeType, sizeBytes, sha256, createdAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        kind:
          $ref: '#/components/schemas/AttachmentKind'
        filename:
          type: string
          description: Basename with Unicode preserved, control characters and path separators removed, at most 120 runes.
        mimeType:
          type: string
          enum:
            - text/plain
            - text/markdown
            - application/json
            - application/yaml
            - text/yaml
            - image/png
            - image/jpeg
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        createdAt:
          type: string
          format: date-time
    RequirementAttachmentEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RequirementAttachment'
    RequirementAttachmentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RequirementAttachment'
    ClarificationSessionStatus:
      type: string
      enum: [active, completed, cancelled]
    ClarificationSession:
      type: object
      description: |
        One version-level clarification session. `id` is a P3 snowflake string;
        `agentSessionId` is the P1 Agent session and stays a number.
      required:
        - id
        - status
        - agentSessionId
        - startedAt
        - endedAt
        - contextSummary
        - summaryUpdatedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        status:
          $ref: '#/components/schemas/ClarificationSessionStatus'
        agentSessionId:
          type: integer
          format: int64
          nullable: true
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        contextSummary:
          type: string
          maxLength: 20480
          description: Agent-maintained context summary (at most 20 KiB).
        summaryUpdatedAt:
          type: string
          format: date-time
          nullable: true
    ClarificationSessionStarted:
      type: object
      description: |
        The 201 response of `POST /api/versions/{id}/clarification/sessions`
        (spec §7.5): only the fields known when the session starts, before any
        completion or context summary exists.
      required: [id, status, agentSessionId, startedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: P3 clarification session ID.
        status:
          $ref: '#/components/schemas/ClarificationSessionStatus'
        agentSessionId:
          type: integer
          format: int64
          description: The P1 Agent session created for this clarification session.
        startedAt:
          type: string
          format: date-time
    ClarificationSessionStartedEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClarificationSessionStarted'
    ClarificationSessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClarificationSession'
    ClarificationQuestionCounts:
      type: object
      required: [open, answered, dismissed]
      properties:
        open:
          type: integer
          minimum: 0
        answered:
          type: integer
          minimum: 0
        dismissed:
          type: integer
          minimum: 0
    ClarificationDecisionCounts:
      type: object
      required: [proposed, accepted, rejected]
      properties:
        proposed:
          type: integer
          minimum: 0
        accepted:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
    ClarificationOverview:
      type: object
      description: The active session is omitted (or null) before the first session is started.
      required: [questions, decisions]
      properties:
        session:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClarificationSession'
        questions:
          $ref: '#/components/schemas/ClarificationQuestionCounts'
        decisions:
          $ref: '#/components/schemas/ClarificationDecisionCounts'
    ClarificationOverviewEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClarificationOverview'
    ClarificationMessageRole:
      type: string
      description: P1 message role exposed by the projection; system messages are filtered out.
      enum: [user, assistant, tool]
    ClarificationMessagePart:
      type: object
      required: [type]
      properties:
        type:
          type: string
        text:
          type: string
    ClarificationToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: string
    ClarificationMessage:
      type: object
      description: One persisted P1 `agent_messages` row projected into the clarification history.
      required: [id, role, parts, createdAt]
      properties:
        id:
          type: integer
          format: int64
          description: P1 message ID; stays a number and is also the `before_id` cursor.
        role:
          $ref: '#/components/schemas/ClarificationMessageRole'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationMessagePart'
        reasoning:
          type: string
          nullable: true
        toolCalls:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ClarificationToolCall'
        toolName:
          type: string
          nullable: true
        runId:
          type: integer
          format: int64
          nullable: true
          description: P1 run ID; stays a number.
        createdAt:
          type: string
          format: date-time
    ClarificationMessagePage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationMessage'
        next_cursor:
          type: string
          description: |
            Decimal-string encoding of the oldest P1 message ID on this page
            (the same value space as `ClarificationMessage.id`). Convert it to
            an integer and pass that integer as the `before_id` query parameter
            to fetch older messages. Empty when there is no earlier page.
        has_more:
          type: boolean
    SendClarificationMessageRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 5000
    SendClarificationMessageResult:
      type: object
      required: [sessionId, agentSessionId, runId, status]
      properties:
        sessionId:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: P3 clarification session ID.
        agentSessionId:
          type: integer
          format: int64
        runId:
          type: integer
          format: int64
        status:
          type: string
          enum: [running]
    SendClarificationMessageResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SendClarificationMessageResult'
    ClarificationRunResult:
      type: object
      description: A one-shot analyze/recon run (202).
      required: [agentSessionId, runId]
      properties:
        agentSessionId:
          type: integer
          format: int64
        runId:
          type: integer
          format: int64
    ClarificationRunResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClarificationRunResult'
    ClarificationQuestionStatus:
      type: string
      enum: [open, answered, dismissed]
    ClarificationSource:
      type: string
      enum: [user, ai]
    ClarificationAnsweredVia:
      type: string
      enum: [ui, agent]
    ClarificationQuestion:
      type: object
      description: Question DTO (spec §7.6); every P3-owned ID is a decimal string.
      required:
        - id
        - versionId
        - requirementId
        - sessionId
        - question
        - status
        - answer
        - source
        - answeredVia
        - answeredBy
        - answeredAt
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        requirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: Null for a version-level question.
        sessionId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        question:
          type: string
          minLength: 1
          maxLength: 2000
        status:
          $ref: '#/components/schemas/ClarificationQuestionStatus'
        answer:
          type: string
          maxLength: 5000
        source:
          $ref: '#/components/schemas/ClarificationSource'
        answeredVia:
          $ref: '#/components/schemas/ClarificationAnsweredVia'
        answeredBy:
          type: integer
          format: int64
          nullable: true
        answeredAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClarificationQuestionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClarificationQuestion'
    ClarificationQuestionPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationQuestion'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CreateClarificationQuestionRequest:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        requirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: Omit for a version-level question.
    UpdateClarificationQuestionRequest:
      type: object
      additionalProperties: false
      description: |
        Answer/dismiss/reopen or correct the text. Only allowed transitions are
        `open → answered`, `open → dismissed` and `answered|dismissed → open`;
        any other state change is 409 `clarification_question_state_conflict`.
      properties:
        status:
          $ref: '#/components/schemas/ClarificationQuestionStatus'
        question:
          type: string
          minLength: 1
          maxLength: 2000
        answer:
          type: string
          maxLength: 5000
          description: Required when `status` is `answered`; cleared when reopening.
    ClarificationDecisionStatus:
      type: string
      enum: [proposed, accepted, rejected]
    ClarificationDecision:
      type: object
      description: Decision DTO (spec §7.6); every P3-owned ID is a decimal string.
      required:
        - id
        - versionId
        - requirementId
        - questionId
        - topic
        - decision
        - rationale
        - status
        - source
        - proposedBy
        - decidedBy
        - decidedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
        versionId:
          type: string
          pattern: '^[0-9]{1,19}$'
        requirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        questionId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        topic:
          type: string
          minLength: 1
          maxLength: 300
        decision:
          type: string
          minLength: 1
          maxLength: 5000
        rationale:
          type: string
          maxLength: 5000
        status:
          $ref: '#/components/schemas/ClarificationDecisionStatus'
        source:
          $ref: '#/components/schemas/ClarificationSource'
        proposedBy:
          type: integer
          format: int64
        decidedBy:
          type: integer
          format: int64
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClarificationDecisionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClarificationDecision'
    ClarificationDecisionPage:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationDecision'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CreateDecisionRequest:
      type: object
      required: [topic, decision]
      additionalProperties: false
      description: A human decision is stored as `accepted` with `source=user`.
      properties:
        topic:
          type: string
          minLength: 1
          maxLength: 300
        decision:
          type: string
          minLength: 1
          maxLength: 5000
        rationale:
          type: string
          maxLength: 5000
        requirementId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
        questionId:
          type: string
          pattern: '^[0-9]{1,19}$'
          nullable: true
          description: When this decision is accepted, the linked open question is answered in the same transaction.
    UpdateDecisionRequest:
      type: object
      required: [status]
      additionalProperties: false
      description: Only `proposed` decisions can transition; accepted/rejected are terminal.
      properties:
        status:
          type: string
          enum: [accepted, rejected]
        rationale:
          type: string
          maxLength: 5000
          description: Optional rejection rationale (reuses the rationale field).
    VersionEventType:
      type: string
      description: |
        The complete `channel=version:{id}` event catalog (spec §6.11 plus the
        P3 `clarification.context_updated` addition). Types from the earlier
        phases keep their V1 semantics; `agent.activity` keeps its frozen V1
        nine-kind detail contract. `clarification.context_updated` is emitted by
        the `context.summary_update` tool and carries
        `detail.versionId` (decimal string), `detail.tool` and `detail.actorId`.
        P4 adds `code.changed` (published when a change set is ready;
        `detail.analysisId`, `detail.baseCommit`, `detail.headCommit` and
        `detail.stats`) and `code.impact_computed` (published when an analysis
        finishes or degrades; `detail.analysisId`, `detail.analysisVersion`,
        `detail.status`, `detail.degraded` and `detail.counts`). Both put changed
        or evidence paths (up to 20, deduplicated) in `refs.code` and never carry
        facts, diffs or code content.
      enum:
        - version.created
        - version.updated
        - version.status_changed
        - requirement.added
        - requirement.updated
        - requirement.clarified
        - requirement.reopened
        - requirement.deleted
        - requirement.relation_added
        - requirement.relation_updated
        - requirement.relation_removed
        - clarification.session_started
        - clarification.session_completed
        - clarification.question_updated
        - clarification.context_updated
        - decision.proposed
        - decision.decided
        - attachment.added
        - attachment.removed
        - agent.activity
        - code.changed
        - code.impact_computed
    VersionEvent:
      type: object
      description: |
        One persisted event on `channel=version:{id}`. It uses the same V1
        envelope as Event; `version_id` is always the decimal string version ID
        and `refs` reference P3-owned IDs as strings.
      required:
        - seq
        - channel
        - type
        - version_id
        - batch_id
        - case_id
        - step_id
        - agent_role
        - session_id
        - ts
        - summary
        - detail
        - refs
      properties:
        seq:
          type: integer
          format: int64
          description: Channel-local monotonic sequence.
        channel:
          type: string
          maxLength: 64
          description: Always `version:{id}` for this channel.
        type:
          $ref: '#/components/schemas/VersionEventType'
        version_id:
          type: string
          pattern: '^[0-9]{1,19}$'
        batch_id:
          type: string
          nullable: true
        case_id:
          type: string
          nullable: true
        step_id:
          type: string
          nullable: true
        agent_role:
          type: string
          nullable: true
          description: Agent profile key for `agent.activity`; null for domain events.
        session_id:
          type: string
          nullable: true
          description: Decimal-string P1 Agent session ID when the event references one.
        ts:
          type: string
          format: date-time
        summary:
          type: string
          maxLength: 500
        detail:
          type: object
          additionalProperties: true
          description: |
            Up to 64 KiB of valid JSON. P3 domain events include `actorId` and
            `source`, and the referenced P3 ID (`requirementId`, `questionId`,
            `decisionId`, `attachmentId`, ...) as decimal strings.
        refs:
          $ref: '#/components/schemas/EventRefs'
    VersionEventSnapshot:
      type: object
      description: |
        The flat P3 events snapshot (`{"data":[...], "snapshot_cursor",
        "has_more"}`), unlike the nested P0 EventSnapshot.
      required: [data, snapshot_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VersionEvent'
        snapshot_cursor:
          type: integer
          format: int64
          minimum: 0
          description: The version channel's current seq; use it as the SSE `since`/`Last-Event-ID` base.
        has_more:
          type: boolean
