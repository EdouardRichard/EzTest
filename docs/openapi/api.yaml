        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [versions]
      summary: Create a version
      description: |
        Creates a `draft` version, optionally bound to P2 resources in the same
        request. Resource existence, environment/system consistency and the Git
        baseline are validated here; the response is 201. No clarification
        session is created.
      operationId: createVersion
      security:
        - bearerAuth: []
