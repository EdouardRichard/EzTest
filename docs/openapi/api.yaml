        has_more:
          type: boolean
    TakeoverAction:
      type: object
      description: The takeover plus the session it belongs to after the action.
      required: [takeover, session]
      properties:
        takeover:
          $ref: '#/components/schemas/Takeover'
        session:
          $ref: '#/components/schemas/Session'
    TakeoverActionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TakeoverAction'
    Session:
      type: object
      description: |
        One imported login state. The stored storage_state document is never
        returned: the schema exposes only `storageStateHash` and the shape
        counts (`cookieCount`, `originCount`). `latestSnapshot`, `activeLease`
        and `latestTakeover` are detail-only relations omitted from list
        responses. `expiring` is derived and never stored.
      required:
        - id
        - accountId
        - systemId
        - environmentId
        - accessId
        - state
        - acquisition
        - storageStateKind
        - cookieCount
        - originCount
        - storageStateHash
        - expiresAt
        - lastValidatedAt
        - lastUsedAt
        - failureReason
        - invalidatedReason
        - expiring
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        systemId:
          type: integer
          format: int64
        environmentId:
          type: integer
          format: int64
        accessId:
          type: integer
          format: int64
        state:
          type: string
          enum: [pending, acquiring, needs_manual, valid, refreshing, expired, invalid, revoked, failed]
        acquisition:
          type: string
          enum: [auto, manual, imported]
        storageStateKind:
          type: string
          enum: ["", storage_state, token]
        cookieCount:
          type: integer
        originCount:
          type: integer
        storageStateHash:
          type: string
          description: SHA-256 of the canonical stored document; the document itself is never returned.
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastValidatedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        failureReason:
          type: string
        invalidatedReason:
          type: string
        expiring:
          type: boolean
          description: True when a valid session is close to expiry.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        latestSnapshot:
          $ref: '#/components/schemas/Snapshot'
        activeLease:
          $ref: '#/components/schemas/Lease'
        latestTakeover:
          $ref: '#/components/schemas/Takeover'
    SessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Session'
    SessionList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    SnapshotList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CodeRepo:
      type: object
      description: |
        A local Git checkout used by later phases for indexing. P2 only
        validates and stores it; `lastIndexedAt` stays null until a later phase
        indexes the checkout. `key` is immutable.
      required:
        - id
        - key
        - name
        - localPath
        - fixedBranch
        - includeGlobs
        - excludeGlobs
        - status
        - lastCommit
        - lastValidatedAt
        - lastValidationError
        - lastIndexedAt
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        name:
          type: string
        localPath:
          type: string
        fixedBranch:
          type: string
          maxLength: 255
        includeGlobs:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 256
        excludeGlobs:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 256
        status:
          type: string
          enum: [active, disabled]
        lastCommit:
          type: string
        lastValidatedAt:
          type: string
          format: date-time
          nullable: true
        lastValidationError:
          type: string
        lastIndexedAt:
          type: string
          format: date-time
          nullable: true
    CodeRepoEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CodeRepo'
    CodeRepoList:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CodeRepo'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when `has_more` is false.
        has_more:
          type: boolean
    CreateSystemRequest:
