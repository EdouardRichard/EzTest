  /api/resources/auth-flows:
    get:
      tags: [resources]
      summary: List login recipes (admin only)
      description: |
        Administrator-only, like every auth-flow route (spec §5.11). One cursor
        page of login recipes ordered by ID ascending, optionally narrowed to
        one `system_id`. A definition is returned exactly as stored (URL and
        selectors only); a recipe never contains a credential or a
        storage-state document.
      operationId: listAuthFlows
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AuthFlowSystemFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of login recipes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFlowList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/AuthFlowInvalid'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [resources]
      summary: Create a login recipe (admin only)
      description: |
        Administrator-only. Stores one `kind=form` login recipe for an existing
        system and answers 201. The name must be unique within the system (409
        `duplicate_key`). The definition is validated before writing (422
        `auth_flow_invalid`): an absolute http(s) `login_url`, non-empty
        username/password/submit selectors, exactly one of
        `success.url_contains` / `success.selector`, and a `timeout_ms` between
        5000 and 60000. A recipe never stores the credential (`accountId` +
        access credential stay on the P2 access).
      operationId: createAuthFlow
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthFlowRequest'
      responses:
        '201':
          description: The created login recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFlowEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/AuthFlowInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/resources/auth-flows/{id}:
    get:
      tags: [resources]
      summary: Read one login recipe (admin only)
      operationId: getAuthFlow
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AuthFlowId'
      responses:
        '200':
          description: The login recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFlowEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/AuthFlowInvalid'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [resources]
      summary: Update a login recipe (admin only)
      description: |
        Every field is optional; omitted fields are unchanged. The ID and the
        owning system are immutable. A renamed recipe keeps the per-system name
        unique (409 `duplicate_key`) and a changed definition is revalidated
        (422 `auth_flow_invalid`), exactly like create.
      operationId: updateAuthFlow
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AuthFlowId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthFlowRequest'
      responses:
        '200':
          description: The updated login recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFlowEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/AuthFlowInvalid'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [resources]
      summary: Delete a login recipe (admin only)
      description: |
        Removes the recipe; accesses bound to it fall back to `login_flow_id:
        null` through the database foreign key and stop auto-logging in.
      operationId: deleteAuthFlow
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AuthFlowId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The login recipe was deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/AuthFlowInvalid'
        '500':
          $ref: '#/components/responses/Internal'
  /api/code/repos:
    get:
      tags: [code]
      summary: List code repositories with their latest index-run projection
      description: |
        Every authenticated user. One row per P2 code repository (id ascending)
        with the latest T0 index run inline (null before the first index). No
        pagination: the P2 repository catalogue is unbounded in name only and
        this projection is one application call per repository.
      operationId: listCodeIntelRepos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: The repository summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoSummaryList'
              example:
                data:
                  - id: 3
                    key: example-repo
                    name: Example repository
                    status: active
                    fixedBranch: main
                    lastCommit: '0123456789abcdef0123456789abcdef01234567'
                    lastIndexedAt: '2026-10-28T01:02:03Z'
                    index:
                      runId: '1844674407370955161'
                      repoId: 3
                      commit: '0123456789abcdef0123456789abcdef01234567'
                      source: t0
                      status: done
                      stats:
                        files: 1200
                        truncated: false
                      errors: []
                      startedAt: '2026-10-28T01:00:00Z'
                      finishedAt: '2026-10-28T01:02:03Z'
                      createdBy: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
  /api/code/repos/{repoId}/index:
    post:
      tags: [code]
      summary: Trigger a T0 index run of a repository (admin only)
      description: |
        Administrator only. Resolves the repository's fixed-branch tip and
        enqueues one T0 index run (202). A repository that already has a
        queued/running index returns 409 `index_in_progress`. A path that
        exists but is not a Git work tree is 422 `path_not_git_repo`; a
        missing/unreadable path or a Git command that times out is 503
        `git_unavailable` (retryable). A full worker queue is 429
        `analysis_queue_full` (retryable).
      operationId: startCodeRepoIndex
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CodeRepoId'
      responses:
        '202':
          description: The accepted index run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexRunAcceptedEnvelope'
              example:
                data:
                  runId: '1844674407370955161'
                  status: queued
                  commit: '0123456789abcdef0123456789abcdef01234567'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CodeConflict'
        '422':
          $ref: '#/components/responses/CodeInvalid'
        '429':
          $ref: '#/components/responses/CodeQueueFull'
        '503':
          $ref: '#/components/responses/CodeGitUnavailable'
        '500':
          $ref: '#/components/responses/Internal'
