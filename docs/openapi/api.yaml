      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 20000
        tags:
          type: array
          maxItems: 20
          items:
            type: string
        scope:
          type: string
          enum: [global, system]
        system_key:
          type: string
          maxLength: 64
          nullable: true
    KnowledgeReviewRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    KnowledgeListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeItemView'
    KnowledgeRevisionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeRevisionView'
    GCRunView:
      type: object
      required: [id, mode, status, actor_kind, started_at, scanned_objects, scanned_refs, deleted_objects, deleted_refs, deleted_bytes, report]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
