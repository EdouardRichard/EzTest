        kind:
          type: string
          enum: [web, api]
        baseUrl:
          type: string
          format: uri
        notes:
          type: string
        defaultSessionTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
        status:
          type: string
          enum: [active, disabled]
    CreateEnvironmentRequest:
      type: object
