      description: |
        门禁满足时推进；版本页不提供手动推进 UI（FE-5/R-B4-6），仅供 API/自动化使用（x-api-only）。
        v0.2.4-E：designing→case_review 边消费共享审查门（designapp.ReviewGateService，与裁判
        converge 同一实例同一谓词，手动推进不可绕过）——覆盖并集不足 409 `ac_coverage_gap`
        （details.missing_acs 点名缺失 AC id）、draft 审查未完成 409 `judgment_pending`、
        多缺口聚合 409（details.blockers[]）；fail 耗尽/裁判不可用不阻塞该边（R-E4r，升级
        人工在 case_review 决断）。审查门未接线 503 失败封闭。
