    CreateVersionRequest:
      type: object
      description: |
        v0.2.4-B：版本直绑一个环境，SUT/页面/API/数据库/账号/代码仓由环境与 SUT 派生；
        旧版 `bindings[]` 载荷不再接受（严格解码，400）。创建即 `initial`。
      required: [title, environment_id]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        goal:
          type: string
        environment_id:
          type: string
          pattern: '^[0-9]+$'
    UpdateVersionRequest:
      type: object
      description: 至少提供 title 或 auto_design_new_requirements 之一，否则 400。
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        auto_design_new_requirements:
          type: boolean
    ConversationSummary:
      type: object
      description: 对话列表项（P1 只产生 clarification）
      required: [id, title, kind, status, message_count, last_message_at, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        title:
          type: string
        kind:
          type: string
          enum: [clarification, design]
          description: P1 API 只创建/返回 clarification
        status:
          type: string
          enum: [active, closed]
        message_count:
          type: integer
          minimum: 0
        last_message_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一条消息时间；无消息为 null
        model_override:
          type: string
          maxLength: 128
          nullable: true
          description: 0.2.1 会话级模型覆盖（`llm_model.model`）；null 表示未覆盖
        effective_model:
          type: string
          maxLength: 128
          nullable: true
          description: 0.2.1 当前生效模型（覆盖优先，否则 LLM 配置 `default_model_id`）
        created_at:
          type: string
          format: date-time
    Conversation:
      description: 对话详情（不含消息；消息走 /messages）
      allOf:
        - $ref: '#/components/schemas/ConversationSummary'
        - type: object
          required: [summary, updated_at]
          properties:
            summary:
              type: string
              nullable: true
              description: 最新 conversation_summary.summary；未生成时为 null
            updated_at:
              type: string
              format: date-time
    ConversationMessage:
      type: object
      description: |
        UI 线程消息（P1 只写 user/assistant）；LLM transcript 不通过本 API 暴露
        （admin 转录见 `/api/agent-center/runs/{id}/transcript`，v0.2.4-D）。
        v0.2.4-D 流式：SSE `conversation.message` 全帧恒带 `stream_state`；占位全帧
        `parts:[]`（streaming），终态全帧携带完整 parts（complete/interrupted）。
        REST 消息快照 DTO **亦返回 `stream_state`**（v0.2.4-D T14 修复波 M-1，additive）：
        刷新/第二 tab 载入的未完成头据此可读为生成中，并据 parts 恢复增量渲染。
      required: [id, conversation_id, role, parts, refs, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        conversation_id:
          type: string
          pattern: '^[0-9]+$'
        role:
          type: string
          enum: [user, assistant]
        kind:
          type: string
          description: DB-3 消息 kind（text/question/answer/...）；空串等同 text
          default: text
        parts:
          type: array
          description: v0.2.4-D 起允许空数组（流式占位头）；批式/终态消息至少一个 part
          items:
            $ref: '#/components/schemas/MessagePart'
        stream_state:
          type: string
          enum: [streaming, complete, interrupted]
          description: |
            增量回复生命周期（v0.2.4-D；枚举派生自 version/domain/conversation.go
            MessageStreamStates()）。SSE 全帧恒带：占位 streaming、终态 complete/interrupted，
            批式消息归一 complete。**REST 消息快照 DTO 亦恒带该字段**（T14 修复波 M-1，additive；
            schema 中保持 optional 以兼容旧客户端读取）。
        refs:
          type: array
          description: '结构化引用；元素形如 {"kind": "requirement", "id": "3001"}'
          items:
            type: object
            required: [kind, id]
            properties:
              kind:
                type: string
              id:
                type: string
                pattern: '^[0-9]+$'
        actual_model:
          type: string
          maxLength: 128
          nullable: true
          description: 0.2.1 assistant 消息实际生成的模型；user 消息为 null
        created_at:
          type: string
          format: date-time
    MessagePart:
      description: |
        消息 part 判别联合，以 `type` 区分：
        `text` / `attachment` / `requirement_card` / `rollback_proposal`；
        0.2.1 追加 `thinking` / `tool_call` / `job_card` / `case_card` / `error` / `image`。
        `image`（用户消息的 vision 图片）与 `rollback_proposal` 只存在于消息快照，不是
        `conversation_message_part` 流式行；`job_card` 另可携带可选 `cancelable`，
        终态 `failed` 的卡片另带可选 `code`（typed failure code，≤64）与 `reason`
        （用户可读失败原因，≤2000；其他状态省略）。
        `job_card.kind` 写入接受 6 个冻结 0.2.1 job kind，或对话 work type
        `chat.turn`/`requirement.curate`（legacy `work_item.type` 投影，
        不新增 `work_item.kind` 值，也不扩宽 `GET .../work-items?kind=` 的 6 值枚举）。
        `design.round` 保留在本枚举中作为**历史只读值**：自 v0.2.4-H（R-H6r）起已从写入集移除
        （无生产者，V-0004 已删旧设计管线）；历史会话卡片仍经本枚举成员 + 前端 KIND_LABEL 渲染，
        删除本成员须守 6.6 通知期（0.3 到期裁定删除或转正）。新设计管线 work type 为
        `design.judge`/`design.rework`（后台作业，不进对话 job_card）。
        v0.2.4-D：`conversation.message.delta` 的 replace 模式 `part` 即本联合的完整快照；
        append 模式只针对 text/thinking 的纯增长（见 `MessageDelta`）。
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type:
              type: string
              enum: [text]
            text:
              type: string
              minLength: 1
              maxLength: 20000
        - type: object
          required: [type, sha256, name, mime, size]
          properties:
            type:
              type: string
              enum: [attachment]
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: P0 `POST /api/content` 返回的内容 SHA-256
            name:
              type: string
            mime:
              type: string
            size:
              type: integer
              minimum: 0
              maximum: 10485760
        - type: object
          required: [type, requirement_id, title, status, revision]
          properties:
            type:
              type: string
              enum: [requirement_card]
            requirement_id:
              type: string
              pattern: '^[0-9]+$'
            title:
              type: string
            status:
              type: string
              enum: [draft, clarified, closed, obsolete]
            revision:
              type: integer
              minimum: 1
        - type: object
          required: [type, requirement_id, reason]
          properties:
            type:
              type: string
              enum: [rollback_proposal]
            requirement_id:
              type: string
              pattern: '^[0-9]+$'
            reason:
              type: string
        - type: object
          required: [type, text, duration_ms]
          properties:
            type:
              type: string
              enum: [thinking]
            text:
              type: string
              maxLength: 20000
            duration_ms:
              type: integer
              minimum: 0
        - type: object
          required: [type, call_id, name, status]
          properties:
            type:
              type: string
              enum: [tool_call]
            call_id:
              type: string
              maxLength: 128
            name:
              type: string
              maxLength: 200
            status:
              type: string
              enum: [running, done, failed]
            arguments:
              type: object
            result:
              type: object
              nullable: true
            duration_ms:
              type: integer
              minimum: 0
            error:
              type: string
              maxLength: 2000
        - type: object
          required: [type, job_id, kind, status]
          properties:
            type:
              type: string
              enum: [job_card]
            job_id:
              type: string
              pattern: '^[0-9]+$'
            kind:
              type: string
              enum: [design.cases, review.cases, execute.batch, analyze.failure, report.version, knowledge.propose, chat.turn, requirement.curate, design.round]
            status:
              type: string
              enum: [open, claimed, running, waiting_human, done, failed, cancelled]
            current:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
            cancelable:
              type: boolean
              description: 0.2.1 生产字段；仅 open/claimed/running/waiting_human 可为 true，终态必须 false（UDS 可据此推导取消按钮，但实际可取消状态以 job control API 为准）
            code:
              type: string
              maxLength: 64
              description: 仅终态 failed 卡片携带的 typed failure code（如 llm_capability_mismatch）；其他状态省略
            reason:
              type: string
              maxLength: 2000
              description: 仅终态 failed 卡片携带的用户可读失败原因（已脱敏并截断）；其他状态省略
        - type: object
          required: [type, case_id, title, status]
          properties:
            type:
              type: string
              enum: [case_card]
            case_id:
              type: string
              pattern: '^[0-9]+$'
            case_version_id:
              type: string
              pattern: '^[0-9]+$'
              nullable: true
            title:
              type: string
            status:
              type: string
              enum: [draft, confirmed, stale, superseded]
        - type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              enum: [error]
            code:
              type: string
              maxLength: 64
              description: 自由有界字符串（非枚举）；v0.2.4-D 新增取值 stream_interrupted（首 delta 后中断/取消/封口 salvage）与 stream_parts_truncated（产出 part 超限显式信号）
            message:
              type: string
              maxLength: 2000
            retryable:
              type: boolean
              default: false
            action:
              type: string
              maxLength: 500
            field:
              type: string
              description: 可选；被拒参数的 JSON 路径（v0.22 E-1 字段级纠正数据，Go omitempty）
            allowed:
              type: array
              items:
                type: string
              description: 可选；合法取值列表（Go omitempty）
            hint:
              type: string
              description: 可选；下一步动作提示（Go omitempty）
        - type: object
          required: [type, mime, data_ref, width, height]
          properties:
            type:
              type: string
              enum: [image]
            mime:
              type: string
              enum: [image/png, image/jpeg, image/jpg, image/webp]
              description: 支持 png/jpeg/webp；`image/jpg` 是 `image/jpeg` 的别名（`IsSupportedImageMIME` 接受）
            data_ref:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: 内容账本内容对象的 64 位小写 hex SHA-256（vision LLM 的输入引用）
            width:
              type: integer
              minimum: 1
              maximum: 16384
            height:
              type: integer
              minimum: 1
              maximum: 16384
    CreateConversationRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [clarification, design]
          description: P2 支持 clarification/design；design 会创建 conversation + 设计轮次
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: 省略时默认 `需求澄清 YYYY-MM-DD HH:mm` 或 `用例设计 YYYY-MM-DD HH:mm`
        model_override:
          type: string
          maxLength: 128
          nullable: true
          description: 0.2.1 建会话时指定模型覆盖（`llm_model.model`）；null/省略使用 LLM 配置 `default_model_id`
    PostMessageRequest:
      type: object
      required: [parts]
      properties:
        client_message_id:
          type: string
          maxLength: 64
          description: 幂等键；同一对话内唯一
        parts:
          type: array
          minItems: 1
          description: 至少一个非空 part；用户消息接受 `text`/`attachment`/`image`/`case_card`（R95：`case_card` 引用既有 case，普通用户可发送），`attachment`+`image` 合计最多 10 个
          items:
            $ref: '#/components/schemas/MessagePart'
    AttachmentView:
      type: object
      description: 附件运行态（解析文本作为内容引用保存，不复制进需求版本）
      required: [id, name, mime, size, extraction_status, extraction_error, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
        mime:
          type: string
        size:
          type: integer
          minimum: 0
          maximum: 10485760
        extraction_status:
          type: string
          enum: [pending, processing, done, failed, skipped]
        extraction_error:
          type: object
          nullable: true
          required: [code]
          description: 解析失败时返回稳定错误码；不泄露路径/服务器信息
          properties:
            code:
              type: string
              enum: [unsupported_attachment_format, extraction_failed]
            message:
              type: string
        kind:
          type: string
          enum: [document, image]
          description: 0.2.1 附件种类（DB CHECK `document|image`）；PDF/text 等按 MIME/扩展名归为 `document` 子类型，不新增枚举值
        parse_status:
          type: string
          enum: [pending, processing, done, failed, skipped]
          description: 0.2.1 用户可见解析状态（既有 extraction_status 保留为内部状态）
        parse_error:
          type: string
          nullable: true
          description: 0.2.1 解析错误码/原因（DB 列 `TEXT NULL`）；状态为 failed 时给出可执行原因，不含路径/服务器信息，成功时为 null
        page_refs:
          type: array
          description: 0.2.1 PDF 分页/段落引用
          items:
            type: object
        created_at:
          type: string
          format: date-time
    RequirementCounts:
      type: object
      description: 版本下需求按状态计数（P1 增量）
      required: [total, draft, clarified, closed, obsolete]
      properties:
        total:
          type: integer
          minimum: 0
        draft:
          type: integer
          minimum: 0
        clarified:
          type: integer
          minimum: 0
        closed:
          type: integer
          minimum: 0
        obsolete:
          type: integer
          minimum: 0
    RequirementSummary:
      type: object
      description: 需求列表项（当前 revision 摘要）
      required: [id, current_version_id, revision, title, status, priority, updated_at, confirmed_at, closed_at, closure, waived]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        current_version_id:
          type: string
          pattern: '^[0-9]+$'
          description: 当前 requirement_version ID
        revision:
          type: integer
          minimum: 1
        title:
          type: string
        status:
          type: string
          enum: [draft, clarified, closed, obsolete]
        priority:
          type: string
          enum: [P0, P1, P2, P3]
        updated_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: 当前 revision 的确认时间；未确认为 null
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: 需求关闭时间（P4 增量；非 closed 时为 null）
        closure:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClosureSummary'
          description: 最新 requirement_closure 摘要（P4 增量；始终返回，无关闭记录时为 null）
        waived:
          type: boolean
          description: |
            需求级 admin waiver 标记（v0.2.4-G SC-G11/GD-06）。true=该需求闭环完整性被 admin 豁免
            （override 闭环谓词，仍须执行结算）；由 `POST .../requirements/{requirementId}/waive` 置位。
            清除只经 reopen 路径（需求 reopen / 版本 reopen 的 waiver 撤销 R-G8a），不经 waive 端点。
    RequirementVersionView:
      type: object
      description: 不可变需求版本快照（v0.2.4-B/T8 自然语言契约；目标资源 ID 已移除）
      required: [id, requirement_id, revision, title, user_story, rules, acceptance_criteria, priority, constraints, sut_description, scope_out, account_roles_hint, content_hash, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        requirement_id:
          type: string
          pattern: '^[0-9]+$'
        revision:
          type: integer
          minimum: 1
        title:
          type: string
        user_story:
          type: object
          required: [as_a, i_want, so_that]
          properties:
            as_a: {type: string}
            i_want: {type: string}
            so_that: {type: string}
        rules:
          type: string
        acceptance_criteria:
          type: array
          description: 结构化 AC；id 由服务端分配（AC-<n>）， revision 内唯一
          items:
            type: object
            required: [id, given, when, then]
            properties:
              id: {type: string, pattern: '^AC-[1-9][0-9]*$'}
              given: {type: string}
              when: {type: string}
              then: {type: string}
        priority:
          type: string
          enum: [P0, P1, P2, P3]
        constraints:
          type: object
          additionalProperties: true
          description: 业务规则等；空为 {}
        sut_description:
          type: string
          description: 被测系统的自然语言描述（取代目标资源 ID）
        scope_out:
          type: string
          description: 明确排除范围（纳入 ContentHash）
        account_roles_hint:
          type: array
          items:
            type: string
          description: 账号角色提示（NormalizeAccountRolesHint 去重并保留首次出现顺序，不排序；仅 ComputeContentHash 内部排序后哈希）
        content_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 规范化 JSON 的 SHA-256 hex（九字段）
        created_at:
          type: string
          format: date-time
    RequirementConfirmationView:
      type: object
      description: 需求版本确认记录
      required: [id, requirement_version_id, scope, batch_id, actor_id, confirmed_at, affected_requirement_ids]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        requirement_version_id:
          type: string
          pattern: '^[0-9]+$'
        scope:
          type: string
          enum: [requirement, batch]
        batch_id:
          type: string
          nullable: true
        actor_id:
          type: string
          pattern: '^[0-9]+$'
        confirmed_at:
          type: string
          format: date-time
        affected_requirement_ids:
          type: array
          items:
            type: string
            pattern: '^[0-9]+$'
    RequirementRelationView:
      type: object
      description: 需求关系（同版本、非自环、唯一）
      required: [id, from_requirement_id, to_requirement_id, kind, description, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        from_requirement_id:
          type: string
          pattern: '^[0-9]+$'
        to_requirement_id:
          type: string
          pattern: '^[0-9]+$'
        kind:
          type: string
          enum: [depends_on, conflicts_with, overlaps, shares_scope]
        description:
          type: string
        created_at:
          type: string
          format: date-time
    RequirementDetail:
      description: 需求详情（摘要字段 + 当前/历史版本 + 确认/关系/附件）
      allOf:
        - $ref: '#/components/schemas/RequirementSummary'
        - type: object
          required: [current_version, history, confirmations, relations, attachments]
          properties:
            current_version:
              $ref: '#/components/schemas/RequirementVersionView'
            history:
              type: array
              description: 历史版本（revision 倒序，不含当前版本）
              items:
                $ref: '#/components/schemas/RequirementVersionView'
            confirmations:
              type: array
              items:
                $ref: '#/components/schemas/RequirementConfirmationView'
            relations:
              type: array
              items:
                $ref: '#/components/schemas/RequirementRelationView'
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/AttachmentView'
    CreateRequirementRequest:
      type: object
      description: v0.2.4-B/T8 自然语言契约；AC 的 id 由服务端分配（客户端送 id 被忽略）；priority 缺省 P2。
      required: [title, user_story, acceptance_criteria, sut_description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        user_story:
          type: object
          required: [as_a, i_want, so_that]
          properties:
            as_a: {type: string, minLength: 1, maxLength: 500}
            i_want: {type: string, minLength: 1, maxLength: 500}
            so_that: {type: string, minLength: 1, maxLength: 500}
        rules:
          type: string
          maxLength: 20000
        acceptance_criteria:
          type: array
          description: 计数门（1..200）作用于规范化后的数组——NormalizeAcceptanceCriteria 先丢弃 given/when/then 三段全空的条目，再计数
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [given, when, then]
            properties:
              given: {type: string, minLength: 1, maxLength: 2000}
              when: {type: string, minLength: 1, maxLength: 2000}
              then: {type: string, minLength: 1, maxLength: 2000}
        priority:
          type: string
          enum: [P0, P1, P2, P3]
          default: P2
        constraints:
          type: object
          additionalProperties: true
          description: 业务规则等；null/缺省为 {}
        sut_description:
          type: string
          minLength: 1
          maxLength: 2000
        scope_out:
          type: string
          maxLength: 2000
        account_roles_hint:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
    UpdateRequirementRequest:
      type: object
      description: |
        全量替换（非局部 patch），required 与创建一致；编辑已澄清需求会重开为 draft。
        严格解码（R-H5，v0.2.4-H）：只接受下列已发布字段，未知字段返回 **400** 字段错误而不再静默忽略。
        典型被拒载荷：body 级 `description`/`targets`（已随自然语言契约删除）、`acceptance_criteria[]`
        内客户端自带的 `id`（id 由服务端分配）。
      required: [title, user_story, acceptance_criteria, sut_description]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        user_story:
          type: object
          required: [as_a, i_want, so_that]
          additionalProperties: false
          properties:
            as_a: {type: string, minLength: 1, maxLength: 500}
            i_want: {type: string, minLength: 1, maxLength: 500}
            so_that: {type: string, minLength: 1, maxLength: 500}
        rules:
          type: string
          maxLength: 20000
        acceptance_criteria:
          type: array
          description: 计数门（1..200）作用于规范化后的数组——NormalizeAcceptanceCriteria 先丢弃 given/when/then 三段全空的条目，再计数
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [given, when, then]
            additionalProperties: false
            properties:
              given: {type: string, minLength: 1, maxLength: 2000}
              when: {type: string, minLength: 1, maxLength: 2000}
              then: {type: string, minLength: 1, maxLength: 2000}
        priority:
          type: string
          enum: [P0, P1, P2, P3]
          default: P2
        constraints:
          type: object
          additionalProperties: true
        sut_description:
          type: string
          minLength: 1
          maxLength: 2000
        scope_out:
          type: string
          maxLength: 2000
        account_roles_hint:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
        reason:
          type: string
          maxLength: 2000
          description: 变更原因（审计/事件）
    ConfirmRequirementResult:
      type: object
      required: [confirmed, requirement]
      properties:
        confirmed:
          type: boolean
          description: true=本次新确认；false=此前已确认，幂等返回
