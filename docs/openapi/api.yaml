    post:
      tags: [Jobs]
      operationId: retryJob
      summary: 重试失败作业（登录用户；canonical 路由）
      description: |
        仅可重试 `failed` 且 `attempts < max_attempts`、且不是用户取消的作业；否则 409 `state_conflict`。
        重排复用同一 `work_item`：status 回到 `open`、清 lease/last_error、available_at=now，
        **attempts 重置为 0（新的尝试预算）**，`max_attempts`、inputs/budget、模型绑定保持不变；
        不自动切模型（D24）。成功动作写 `job.requeued` 审计并发布 `job.requeued{status:"open"}`。
        重排不幂等：再次 retry 一个已 open 的作业返回 409。legacy（P0–P8）`kind=''` 的旧 work_item
        同样按 not_found 处理，不进入 0.2.1 作业控制。
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 重排后的作业
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/JobView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Internal'

