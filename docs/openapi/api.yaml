    ## v0.2.4-B 领域反转（2026-11-15，破坏性升版 0.2.1 → 0.2.4）
    本子项目把资源层级反转为 **环境 → SUT → 资产**，版本直绑环境，删除旧 SUT 绑定链，
    并按宪法六.2/六.3 同步重建本契约（破坏性，无兼容层）。要点：
    - **资源**：`Environment` 升为顶层（拥有 `suts[]`，去掉 `sut_id/base_url/is_default`）；
      `SUT` 拥有 `environment_id/base_url/source/status` 与 `pages/apis/databases`（去掉 `environments[]`）；
      `Page/SutApi/TargetDatabase` 去掉 `environment_id`；`TestAccount` 改全局池，`sut_id` 为可选亲和（omitempty）；
      `Catalog` 返回 `{environments,repositories,accounts}`。路由反转：SUT 建于 `/environments/{id}/suts`，
      页面/API 挂 `/suts/{id}/...`，账号全局 `/accounts`；新增 `GET /suts/{id}/registrations`（admin）。
    - **版本**：`Version` 以 `environment_id` + 单个 `binding` 取代 `bindings[]`（stage/blocker 由 `/stage` 投影）；
      `BindingOverview` 去 `sut/scope_exclude`、增 `environment_id`；绑定更新 body 仅 `{environment_id?,account_ids?}`；
      删除死 schema `BindingInput/AccountInput/ScopeExclude`。
    - **需求/设计**：自然语言契约（`user_story/rules/结构化 AC/sut_description/scope_out/account_roles_hint`；
      设计 `covered_acs/preconditions/target_description`）；移除全部目标资源 ID；db 断言键 `database_id→sut_id`。
    - **执行/交付/链路/codeintel**：旧 SUT 绑定键重键为 `sut*`（`WaveCounts.by_sut`、证据/问题/链路过滤参数 `sut_id`、
      report-ref kind `sut`）；`run_wave.scope_snapshot` 形状为 `{version_id,frozen_at,suts:[{sut_id,environment_id,...}]}`。
    - **handoff**：`resources` 由平铺改 `suts[i]` 嵌套 + `truncated`；`requirements` 升 V1 结构。
    破坏性移除与通知期见共享发布说明 `docs/v0.2.4/20-v0.2.4-release-notes.md`（宪法六.6）。
    当前发布身份为 `info.version: 0.2.4` / `x-frozen: 0.2.4`。

    ## v0.2.4-C 执行器 v2 与能力域（2026-11-17）
    本子项目把执行器重构为通用工作站（协议 v2-only），agent 执行工具面按能力域重组，
    并完成 GD-21/GD-22/GD-01 三组删除与 P6/P7/P8 解限。REST 契约增量与行为变更：
    - **证据 kind 枚举 8 → 11**：录制层新增 `command/file/trace`（`EvidenceKindFilter` 与
      `EvidenceView.kind` 均派生自单一注册表 `execution/domain/evidence.go EvidenceKinds()`）。
      `snapshot` 接上生产者（playwright-cli ARIA 输出）；`console/network` 由被动 CDP 录制产出。
    - **`evidence.skipped` 事件**（版本频道）：每条被丢弃的证据发一条
      `{case_run_id, kind, reason, ...}`；reason ∈ `evidence_cap_reached/artifact_cursor_gap/
      undeclared_artifact_kind/recording_failed/artifact_content_omitted/evidence_settlement_failed`。
      丢弃计数写入事实列 `case_run.evidence_dropped`，服务端据此把 passed/failed 降级 inconclusive
      （宪法四.5；`verdict_reason=evidence_dropped`）。工具结果以 `evidence_skipped`（int 计数）+
      `evidence_skipped_reason` 显式回传，绝不静默丢弃。
    - **重放 runner v1**（EV-006）：新增 `POST /api/versions/{id}/case-runs/{caseRunId}/replay`
      （`ReplayResultView`）；同指纹 + workspace 快照重放命令日志，断言服务端校验（P2 不变）。
      **重放≠复测**：不产生 issue 候选、不改源 run 终态。typed 409 `replay_*`（见 operation）。
    - **`case_run.replayed` 事件**（版本频道）：`{case_run_id, wave_id, source_case_run_id,
      input_fingerprint, verdict, source_verdict, consistent, command_total, command_matched}`。
    - **技能体系 v1**：`/api/skills` CRUD + 版本历史（T18）；新增 `GET /api/skill-usage?run_id=`
      （`SkillUsageView`，append-only found/miss 账本读取面，T19）。技能运行态可编辑、不硬编码。
    - **新设置键与默认值**（settings catalog）：`execution.evidence_max_per_case_run`（默认 0=不限）、
      `execution.max_case_turns`（默认 0=不限，覆盖 case_executor 种子）；既有键
      `execution.case_timeout_seconds` 默认 900 → 0（opt-in）。P6：turns 超限走结算收尾→exhausted
      （inconclusive/blocked，**不计 failed**）；删硬杀默认；thinking-only 空转闸（默认 2 轮）。
    - **P8 解限**（行为放宽）：`http.request` 去 SUT host 门 + 64KB 截断改 spill；`db.query` 去只读
      → 通用 SQL 读写（`statement_timeout` 1..900000ms 可配）；`account.credentials` 去"禁入证据"。
    - **wire 改名**：agent 工具面旧 SUT 绑定键 → `sut_id` 六表面锁步（schema/解码/结果键/错误字段/
      提示渲染/取值来源）。REST 侧 B 已重键，C 补齐 agent 工具面。
    - **执行器投影**：`ExecutorStatusView.capacity/active_contexts` 语义随 v2 会话（maxSessions/sessions），
      字段名沿用；auth-check 探测路由改 `GET /v1/sessions`（v1 context 路由族已删）。
    - **能力清单**：按能力域生成、与注册表同源（`docs/contracts/capability-list.md`，三清单
      Enabled/Constrained/Forbidden）；`GET /api/agents/tools` 目录派生自同一注册表。
    破坏性删除（v1 协议/13 browser.* 工具/explore 管线/visual.compare/GD-01 遗留）与通知期见
