        systemId:
          type: integer
          format: int64
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        name:
          type: string
        baseUrl:
          type: string
          format: uri
        kind:
          type: string
          enum: [dev, staging, prod, other]
        isProd:
          type: boolean
        allowedHosts:
          type: array
          maxItems: 50
          items:
