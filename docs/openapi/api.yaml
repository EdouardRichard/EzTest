  /api/versions/{id}/gaps:
    get:
      tags: [Version]
      operationId: listVersionGaps
      summary: 当前 gap 事实（API-40）
      description: |
        R-EX-5 / API-40。只读返回该版本 `version_fact kind='gap'` 的当前行
        （不含已 supersede 的历史），复用 facts 查询。使用与兄弟 facts 路由一致的
        `httpx.List` 信封（`data` 数组 + `next_cursor` + `has_more`）：无 gap 时
        `data: []`，不是 404；版本不存在仍是 404。100 行上限被截断时
        `has_more: true`，`next_cursor` 为最后一条 `fact_id`。`fact_id` 为十进制字符串。
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 当前 gap 事实
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, has_more]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [fact_id, key, payload, confidence, created_at]
                      properties:
                        fact_id:
                          type: string
                          pattern: '^[0-9]+$'
                        key:
                          type: string
                        payload:
                          type: object
                          additionalProperties: true
                        confidence:
                          type: number
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                  next_cursor:
                    type: string
                    description: 下一页游标；`has_more=false` 时为空
                  has_more:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
