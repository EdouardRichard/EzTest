        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次注入时间（MAX(created_at)）；从未注入为 null
    KnowledgeItemDetailView:
      description: 知识详情（KnowledgeItemView + append-only revisions + usage 聚合）
      allOf:
        - $ref: '#/components/schemas/KnowledgeItemView'
        - type: object
          required: [revisions, usage]
          properties:
            revisions:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeRevisionView'
            usage:
              $ref: '#/components/schemas/KnowledgeUsageStatsView'
    KnowledgeItemCreateRequest:
      type: object
