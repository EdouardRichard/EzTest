# pnpm 11 does not run dependency build scripts unless they are approved. The
# executor needs @homebridge/node-pty-prebuilt-multiarch to run its
# install/postinstall scripts to place its prebuilt native bindings, so it is
# approved explicitly here. scripts/build-release.ps1 copies this file into the
# packaging stage so the release build gets the same approval (CI runs without a
# per-user pnpm config, and pnpm treats unapproved builds as an error there).
allowBuilds:
  '@homebridge/node-pty-prebuilt-multiarch': true
