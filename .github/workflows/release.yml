name: Release packages

# Manual-only: builds the two self-contained EzTest packages (Windows x64 +
# Linux x64), uploads each as its own artifact, and publishes both as assets
# on the GitHub Release page.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version stamped into the packages
        required: true
        default: "0.2.1"
        type: string
      skip_smoke:
        description: Skip the package smoke test (the hosted Windows runner has no WSL/Linux PG)
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows + Linux packages
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies (next build)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build release packages
        shell: pwsh
        run: |
          $params = @{ Version = "${{ inputs.version }}" }
          if ("${{ inputs.skip_smoke }}" -eq "true") { $params.SkipSmoke = $true }
          ./scripts/build-release.ps1 @params

      - name: Show artifacts
        shell: pwsh
        run: |
          Get-ChildItem .tmp/release | Select-Object Name, Length
          Get-Content .tmp/release/SHA256SUMS.txt

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: eztest-${{ inputs.version }}-windows-x64
          path: .tmp/release/eztest-${{ inputs.version }}-windows-x64.zip
          if-no-files-found: error

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: eztest-${{ inputs.version }}-linux-x64
          path: .tmp/release/eztest-${{ inputs.version }}-linux-x64.tar.gz
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: eztest-${{ inputs.version }}-checksums
          path: .tmp/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: EzTest ${{ inputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            .tmp/release/eztest-${{ inputs.version }}-windows-x64.zip
            .tmp/release/eztest-${{ inputs.version }}-linux-x64.tar.gz
            .tmp/release/SHA256SUMS.txt
